分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch14__": {"html": "<h1>测验：第 14 章：概率图模型<\/h1><div class='quiz-item' data-qid='q39' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 汇连 A→B←C 中观测 B 后 A 与 C 的关系？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q39' value='0'> 仍独立<\/label><label class='quiz-opt'><input type='radio' name='q39' value='1'> 完全无关<\/label><label class='quiz-opt'><input type='radio' name='q39' value='2'> 变得相关<\/label><label class='quiz-opt'><input type='radio' name='q39' value='3'> 无法判断<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q40' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 无向图模型的联合分布按什么分解？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q40' value='0'> 按节点<\/label><label class='quiz-opt'><input type='radio' name='q40' value='1'> 按团<\/label><label class='quiz-opt'><input type='radio' name='q40' value='2'> 按边<\/label><label class='quiz-opt'><input type='radio' name='q40' value='3'> 按路径<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q41' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 变量消去法的复杂度取决于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q41' value='0'> 节点数<\/label><label class='quiz-opt'><input type='radio' name='q41' value='1'> 边数<\/label><label class='quiz-opt'><input type='radio' name='q41' value='2'> 树宽<\/label><label class='quiz-opt'><input type='radio' name='q41' value='3'> 样本数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch15__": {"html": "<h1>测验：第 15 章：规则学习<\/h1><div class='quiz-item' data-qid='q42' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 规则学习与决策树的关键差别？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q42' value='0'> 规则学习不能分类<\/label><label class='quiz-opt'><input type='radio' name='q42' value='1'> 规则集可重叠且可不完备<\/label><label class='quiz-opt'><input type='radio' name='q42' value='2'> 决策树不可解释<\/label><label class='quiz-opt'><input type='radio' name='q42' value='3'> 规则学习不需要数据<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q43' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 序贯覆盖产出一条规则后做什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q43' value='0'> 删掉被覆盖的正例<\/label><label class='quiz-opt'><input type='radio' name='q43' value='1'> 删掉所有负例<\/label><label class='quiz-opt'><input type='radio' name='q43' value='2'> 重新采样<\/label><label class='quiz-opt'><input type='radio' name='q43' value='3'> 增加特征<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q44' data-type='single'><p class='quiz-q'><b>Q3.<\/b> ILP 需要背景知识的原因？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q44' value='0'> 提高准确率<\/label><label class='quiz-opt'><input type='radio' name='q44' value='1'> 加速计算<\/label><label class='quiz-opt'><input type='radio' name='q44' value='2'> 约束无限的一阶规则空间<\/label><label class='quiz-opt'><input type='radio' name='q44' value='3'> 避免过拟合<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch16__": {"html": "<h1>测验：第 16 章：强化学习<\/h1><div class='quiz-item' data-qid='q45' data-type='single'><p class='quiz-q'><b>Q1.<\/b> Q-learning 与 Sarsa 的核心差别？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q45' value='0'> 学习率不同<\/label><label class='quiz-opt'><input type='radio' name='q45' value='1'> 是否使用下一状态的最大动作价值<\/label><label class='quiz-opt'><input type='radio' name='q45' value='2'> 是否需要环境模型<\/label><label class='quiz-opt'><input type='radio' name='q45' value='3'> 是否用神经网络<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q46' data-type='single'><p class='quiz-q'><b>Q2.<\/b> ε-贪心中 ε 控制什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q46' value='0'> 学习率<\/label><label class='quiz-opt'><input type='radio' name='q46' value='1'> 折扣因子<\/label><label class='quiz-opt'><input type='radio' name='q46' value='2'> 探索比例<\/label><label class='quiz-opt'><input type='radio' name='q46' value='3'> 奖励尺度<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q47' data-type='single'><p class='quiz-q'><b>Q3.<\/b> TD 误差是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q47' value='0'> 目标估计减当前估计<\/label><label class='quiz-opt'><input type='radio' name='q47' value='1'> 奖励减学习率<\/label><label class='quiz-opt'><input type='radio' name='q47' value='2'> 价值减奖励<\/label><label class='quiz-opt'><input type='radio' name='q47' value='3'> 动作价值减状态价值<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='假设空间'>假设空间 — 所有可能的从特征到标记的映射组成的集合。 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='版本空间'>版本空间 — 假设空间中与训练集完全一致的那部分假设。 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='归纳偏好'>归纳偏好 — 算法在多个同样符合数据的假设中做选择时依据的先验倾向。 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='没有免费午餐定理'>没有免费午餐定理 — 在所有可能问题上平均，任何算法的期望性能相同。 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='留出法'>留出法 — 把数据集按比例切成训练集与测试集。 <span class=glossary-ref>（第 2 章：模型评估与选择）<\/span><\/li><li data-term='交叉验证'>交叉验证 — 把数据分 k 份轮流做测试集，取平均性能。 <span class=glossary-ref>（第 2 章：模型评估与选择）<\/span><\/li><li data-term='自助法'>自助法 — 有放回采样构造训练集，未被抽到的样本作测试。 <span class=glossary-ref>（第 2 章：模型评估与选择）<\/span><\/li><li data-term='查准率'>查准率 — 预测为正的样本中真正为正的比例。 <span class=glossary-ref>（第 2 章：模型评估与选择）<\/span><\/li><li data-term='查全率'>查全率 — 真实正例中被找出来的比例。 <span class=glossary-ref>（第 2 章：模型评估与选择）<\/span><\/li><li data-term='auc'>AUC — ROC 曲线下面积，等于正例得分高于负例的概率。 <span class=glossary-ref>（第 2 章：模型评估与选择）<\/span><\/li><li data-term='最小二乘'>最小二乘 — 以平方误差为损失、可用闭式解求解的线性回归方法。 <span class=glossary-ref>（第 3 章：线性模型）<\/span><\/li><li data-term='对数几率回归'>对数几率回归 — 用 sigmoid 把线性分数映射为概率的二分类模型。 <span class=glossary-ref>（第 3 章：线性模型）<\/span><\/li><li data-term='ovo'>OvO — 每两个类训练一个分类器的多分类策略。 <span class=glossary-ref>（第 3 章：线性模型）<\/span><\/li><li data-term='ovr'>OvR — 每个类训练一个“是否为本类”分类器的多分类策略。 <span class=glossary-ref>（第 3 章：线性模型）<\/span><\/li><li data-term='类别不平衡'>类别不平衡 — 不同类别样本数量差异悬殊，导致模型偏向多数类。 <span class=glossary-ref>（第 3 章：线性模型）<\/span><\/li><li data-term='信息熵'>信息熵 — 衡量样本集合类别混杂程度的量，越小越纯。 <span class=glossary-ref>（第 4 章：决策树）<\/span><\/li><li data-term='信息增益'>信息增益 — 用某特征分裂后熵的下降量。 <span class=glossary-ref>（第 4 章：决策树）<\/span><\/li><li data-term='增益率'>增益率 — 信息增益除以特征固有值，用于惩罚多值特征。 <span class=glossary-ref>（第 4 章：决策树）<\/span><\/li><li data-term='基尼指数'>基尼指数 — 随机抽两个样本类别不一致的概率。 <span class=glossary-ref>（第 4 章：决策树）<\/span><\/li><li data-term='剪枝'>剪枝 — 去掉决策树中泛化收益为负的分支，分预剪枝与后剪枝。 <span class=glossary-ref>（第 4 章：决策树）<\/span><\/li><li data-term='误差项'>误差项 — 损失对本层线性输出的偏导，反向传播中逐层回传的量。 <span class=glossary-ref>（第 5 章：神经网络）<\/span><\/li><li data-term='万能近似定理'>万能近似定理 — 足够宽的单隐层网络可任意精度逼近连续函数。 <span class=glossary-ref>（第 5 章：神经网络）<\/span><\/li><li data-term='梯度消失'>梯度消失 — 多层连乘小导数导致浅层梯度趋近于 0。 <span class=glossary-ref>（第 5 章：神经网络）<\/span><\/li><li data-term='局部极小'>局部极小 — 参数空间中比邻域都低但非全局最低的点。 <span class=glossary-ref>（第 5 章：神经网络）<\/span><\/li><li data-term='支持向量'>支持向量 — 决定分类边界的少数样本，对偶解中 α 非零。 <span class=glossary-ref>（第 6 章：支持向量机）<\/span><\/li><li data-term='间隔'>间隔 — 分界面到最近样本的距离，SVM 要最大化它。 <span class=glossary-ref>（第 6 章：支持向量机）<\/span><\/li><li data-term='核函数'>核函数 — 直接给出高维映射后内积的函数，避免显式映射。 <span class=glossary-ref>（第 6 章：支持向量机）<\/span><\/li><li data-term='软间隔'>软间隔 — 允许部分样本违规的 SVM 形式，用松弛变量与惩罚系数 C 控制。 <span class=glossary-ref>（第 6 章：支持向量机）<\/span><\/li><li data-term='贝叶斯最优分类器'>贝叶斯最优分类器 — 已知真实分布时按后验最大决策、错误率最小的分类器。 <span class=glossary-ref>（第 7 章：贝叶斯分类器）<\/span><\/li><li data-term='朴素贝叶斯'>朴素贝叶斯 — 假设特征在给定类别下条件独立的贝叶斯分类器。 <span class=glossary-ref>（第 7 章：贝叶斯分类器）<\/span><\/li><li data-term='拉普拉斯修正'>拉普拉斯修正 — 分子加一、分母加取值数，避免零概率的平滑手段。 <span class=glossary-ref>（第 7 章：贝叶斯分类器）<\/span><\/li><li data-term='em 算法'>EM 算法 — 交替估计隐变量与参数、使似然单调不减的迭代算法。 <span class=glossary-ref>（第 7 章：贝叶斯分类器）<\/span><\/li><li data-term='boosting'>Boosting — 串行训练多个基学习器、每轮聚焦前轮错误样本的集成方法。 <span class=glossary-ref>（第 8 章：集成学习）<\/span><\/li><li data-term='bagging'>Bagging — 自助采样并行训练多个基学习器再投票的集成方法。 <span class=glossary-ref>（第 8 章：集成学习）<\/span><\/li><li data-term='adaboost'>AdaBoost — 通过样本权重与学习器权重迭代调整的 Boosting 代表算法。 <span class=glossary-ref>（第 8 章：集成学习）<\/span><\/li><li data-term='随机森林'>随机森林 — 以决策树为基学习器、引入样本与特征双重随机的 Bagging 集成。 <span class=glossary-ref>（第 8 章：集成学习）<\/span><\/li><li data-term='stacking'>Stacking — 用初级学习器输出训练次级学习器的集成策略。 <span class=glossary-ref>（第 8 章：集成学习）<\/span><\/li><li data-term='聚类'>聚类 — 无标签情况下按相似度把样本分组的任务。 <span class=glossary-ref>（第 9 章：聚类）<\/span><\/li><li data-term='k-means'>k-means — 以平方距离和为目标、交替分配与更新中心的聚类算法。 <span class=glossary-ref>（第 9 章：聚类）<\/span><\/li><li data-term='dbscan'>DBSCAN — 基于密度连通性的聚类算法，能识别噪声与任意形状簇。 <span class=glossary-ref>（第 9 章：聚类）<\/span><\/li><li data-term='轮廓系数'>轮廓系数 — 衡量簇内紧密度与簇间分离度的指标。 <span class=glossary-ref>（第 9 章：聚类）<\/span><\/li><li data-term='维度灾难'>维度灾难 — 维度升高导致样本稀疏、距离度量失效的现象。 <span class=glossary-ref>（第 10 章：降维与度量学习）<\/span><\/li><li data-term='pca'>PCA — 以最大化投影方差为目标的主成分分析降维方法。 <span class=glossary-ref>（第 10 章：降维与度量学习）<\/span><\/li><li data-term='累计贡献率'>累计贡献率 — 保留的主成分特征值之和占全部特征值和的比例。 <span class=glossary-ref>（第 10 章：降维与度量学习）<\/span><\/li><li data-term='流形学习'>流形学习 — 假设数据位于低维流形并保持其局部或全局结构的降维方法。 <span class=glossary-ref>（第 10 章：降维与度量学习）<\/span><\/li><li data-term='特征选择'>特征选择 — 从原始特征中挑出对任务有用的子集。 <span class=glossary-ref>（第 11 章：特征选择与稀疏学习）<\/span><\/li><li data-term='relief'>Relief — 用同类与异类最近邻的距离差给特征打分的过滤式方法。 <span class=glossary-ref>（第 11 章：特征选择与稀疏学习）<\/span><\/li><li data-term='l1 正则'>L1 正则 — 权重绝对值之和作惩罚项，倾向于产生稀疏解。 <span class=glossary-ref>（第 11 章：特征选择与稀疏学习）<\/span><\/li><li data-term='稀疏表示'>稀疏表示 — 用少量非零系数表示样本，兼顾压缩与可解释性。 <span class=glossary-ref>（第 11 章：特征选择与稀疏学习）<\/span><\/li><li data-term='pac'>PAC — 在高概率下输出误差不超过给定界的假设的学习框架。 <span class=glossary-ref>（第 12 章：计算学习理论）<\/span><\/li><li data-term='vc 维'>VC 维 — 假设空间能打散的最大样本集大小。 <span class=glossary-ref>（第 12 章：计算学习理论）<\/span><\/li><li data-term='泛化误差上界'>泛化误差上界 — 用训练误差与模型复杂度、样本量给出的泛化性能界。 <span class=glossary-ref>（第 12 章：计算学习理论）<\/span><\/li><li data-term='算法稳定性'>算法稳定性 — 训练集微扰导致输出模型损失变化有限的性質。 <span class=glossary-ref>（第 12 章：计算学习理论）<\/span><\/li><li data-term='半监督学习'>半监督学习 — 同时利用少量有标与大量无标数据训练模型。 <span class=glossary-ref>（第 13 章：半监督学习）<\/span><\/li><li data-term='聚类假设'>聚类假设 — 决策边界应穿过数据低密度区域。 <span class=glossary-ref>（第 13 章：半监督学习）<\/span><\/li><li data-term='流形假设'>流形假设 — 相邻样本位于同一低维流形，标记应相似。 <span class=glossary-ref>（第 13 章：半监督学习）<\/span><\/li><li data-term='直推学习'>直推学习 — 只对给定的一批未标注样本做预测，不追求泛化。 <span class=glossary-ref>（第 13 章：半监督学习）<\/span><\/li><li data-term='贝叶斯网'>贝叶斯网 — 用有向无环图表示变量间条件依赖的概率模型。 <span class=glossary-ref>（第 14 章：概率图模型）<\/span><\/li><li data-term='马尔可夫随机场'>马尔可夫随机场 — 用无向图与团势函数表示联合分布的概率模型。 <span class=glossary-ref>（第 14 章：概率图模型）<\/span><\/li><li data-term='d-分离'>d-分离 — 判断贝叶斯网中两变量在给定证据下是否条件独立的图准则。 <span class=glossary-ref>（第 14 章：概率图模型）<\/span><\/li><li data-term='配分函数'>配分函数 — 使无向图模型势函数乘积归一化为概率分布的常数。 <span class=glossary-ref>（第 14 章：概率图模型）<\/span><\/li><li data-term='lda'>LDA — 以文档-主题-词三层生成结构建模文本主题的概率模型。 <span class=glossary-ref>（第 14 章：概率图模型）<\/span><\/li><li data-term='序贯覆盖'>序贯覆盖 — 一条条生成规则、每轮删掉已覆盖正例的规则学习策略。 <span class=glossary-ref>（第 15 章：规则学习）<\/span><\/li><li data-term='精度'>精度 — 规则覆盖的样本中正例所占比例。 <span class=glossary-ref>（第 15 章：规则学习）<\/span><\/li><li data-term='覆盖度'>覆盖度 — 规则覆盖的正例数量。 <span class=glossary-ref>（第 15 章：规则学习）<\/span><\/li><li data-term='归纳逻辑程序设计'>归纳逻辑程序设计 — 用一阶逻辑表示规则并引入背景知识的规则学习框架。 <span class=glossary-ref>（第 15 章：规则学习）<\/span><\/li><li data-term='强化学习'>强化学习 — 智能体通过与环境交互、以最大化长期累积奖励为目标的学习范式。 <span class=glossary-ref>（第 16 章：强化学习）<\/span><\/li><li data-term='ε-贪心'>ε-贪心 — 以 ε 概率随机探索、否则选当前最优动作的策略。 <span class=glossary-ref>（第 16 章：强化学习）<\/span><\/li><li data-term='马尔可夫决策过程'>马尔可夫决策过程 — 由状态、动作、转移概率、奖励构成的强化学习标准模型。 <span class=glossary-ref>（第 16 章：强化学习）<\/span><\/li><li data-term='贝尔曼方程'>贝尔曼方程 — 把状态价值表示为即时奖励与后继状态价值折扣和的关系式。 <span class=glossary-ref>（第 16 章：强化学习）<\/span><\/li><li data-term='td 误差'>TD 误差 — 一步目标估计与当前价值估计之差。 <span class=glossary-ref>（第 16 章：强化学习）<\/span><\/li><li data-term='q-learning'>Q-learning — 用下一状态最大动作价值更新的离轨策略时序差分算法。 <span class=glossary-ref>（第 16 章：强化学习）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：偏差—方差—容量三角<\/h2>\n<p>任何模型选择问题都能拆成三问：模型容量够不够（欠拟合？）、方差大不大（过拟合？）、数据量与容量匹配不匹配。周志华全书反复用这个三角解释为什么某个技巧有效。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n数据少、特征多 → 先降维或加 L1，再用简单模型。\n<\/li><li>\n训练好测试差 → 先查数据划分是否泄露，再加正则/集成。\n<\/li><li>\n类别不平衡 → 先看业务代价，再决定调阈值、采样还是换评价指标。\n<\/li><li>\n线性不可分 → 先试核 SVM 或树集成，不要直接上深度网络。\n<\/li><li>\n没有标签 → 先聚类看结构，再考虑半监督。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>用测试集调参<\/strong>：评估结果虚高，是实验设计层面的错误。\n<\/li><li>\n<strong>不做显著性检验就宣称更优<\/strong>：单次划分的波动常大于模型差异。\n<\/li><li>\n<strong>只看准确率<\/strong>：不平衡数据上准确率会被多数类主导。\n<\/li><li>\n<strong>盲目堆特征<\/strong>：冗余特征增加方差，噪声特征直接伤害泛化。\n<\/ul>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>最小二乘<\/td><td>w=(XᵀX)^{-1}Xᵀy<\/td><\/tr><tr><td>对数几率回归损失<\/td><td>L=Σ[-y log ŷ-(1-y)log(1-ŷ)]<\/td><\/tr><tr><td>信息熵<\/td><td>Ent=-Σp_k log2 p_k<\/td><\/tr><tr><td>信息增益<\/td><td>Gain=Ent(D)-Σ(<\/td><td>D_v<\/td><td>/<\/td><td>D<\/td><td>)Ent(D_v)<\/td><\/tr><tr><td>F1<\/td><td>2PR/(P+R)<\/td><\/tr><tr><td>SVM 原问题<\/td><td>min ½<\/td><td><\/td><td>w<\/td><td><\/td><td>² s.t. y_i(wᵀx_i+b)≥1<\/td><\/tr><tr><td>AdaBoost 学习器权重<\/td><td>α=½ln((1-ε)/ε)<\/td><\/tr><tr><td>PCA<\/td><td>中心化 → 协方差 → 特征分解 → 取大特征值方向<\/td><\/tr><tr><td>Q-learning<\/td><td>Q(s,a)←Q(s,a)+α[r+γmax Q(s&#x27;,a&#x27;)-Q(s,a)]<\/td><\/tr><\/tbody><\/table>\n<h2>算法选择速查<\/h2>\n<table><thead><tr><th>任务<\/th><th>首选<\/th><th>备选<\/th><\/tr><\/thead><tbody><tr><td>中小规模分类<\/td><td>随机森林 / XGBoost<\/td><td>逻辑回归、SVM<\/td><\/tr><tr><td>高维稀疏文本<\/td><td>朴素贝叶斯、线性 SVM<\/td><td>L1 逻辑回归<\/td><\/tr><tr><td>需要可解释<\/td><td>决策树、规则学习<\/td><td>线性模型<\/td><\/tr><tr><td>无标签分组<\/td><td>k-means、DBSCAN<\/td><td>层次聚类<\/td><\/tr><tr><td>降维可视化<\/td><td>PCA、t-SNE<\/td><td>Isomap、LLE<\/td><\/tr><tr><td>序列决策<\/td><td>Q-learning、策略梯度<\/td><td>见强化学习专书<\/td><\/tr><\/tbody><\/table>\n<h2>排错顺序<\/h2>\n<p>训练误差高 → 模型容量不足（加特征、换模型）；训练低测试高 → 过拟合（正则、集成、加数据）；两者都高 → 数据问题（标签噪声、特征缺失）。<\/p>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452296622422786/AI-点化学习系统/02-机器学习", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：绪论", "href": "#/chapter/ch01"}, {"label": "第 2 章：模型评估与选择", "href": "#/chapter/ch02"}, {"label": "第 3 章：线性模型", "href": "#/chapter/ch03"}, {"label": "第 4 章：决策树", "href": "#/chapter/ch04"}, {"label": "第 5 章：神经网络", "href": "#/chapter/ch05"}, {"label": "第 6 章：支持向量机", "href": "#/chapter/ch06"}, {"label": "第 7 章：贝叶斯分类器", "href": "#/chapter/ch07"}, {"label": "第 8 章：集成学习", "href": "#/chapter/ch08"}, {"label": "第 9 章：聚类", "href": "#/chapter/ch09"}, {"label": "第 10 章：降维与度量学习", "href": "#/chapter/ch10"}, {"label": "第 11 章：特征选择与稀疏学习", "href": "#/chapter/ch11"}, {"label": "第 12 章：计算学习理论", "href": "#/chapter/ch12"}, {"label": "第 13 章：半监督学习", "href": "#/chapter/ch13"}, {"label": "第 14 章：概率图模型", "href": "#/chapter/ch14"}, {"label": "第 15 章：规则学习", "href": "#/chapter/ch15"}, {"label": "第 16 章：强化学习", "href": "#/chapter/ch16"}]}, {"label": "概念", "children": [{"label": "偏差与方差", "href": "#/concept/c01"}, {"label": "核技巧", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：绪论", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：模型评估与选择", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：线性模型", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：决策树", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：神经网络", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：支持向量机", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章：贝叶斯分类器", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章：集成学习", "href": "#/quiz/ch08"}, {"label": "测验：第 9 章：聚类", "href": "#/quiz/ch09"}, {"label": "测验：第 10 章：降维与度量学习", "href": "#/quiz/ch10"}, {"label": "测验：第 11 章：特征选择与稀疏学习", "href": "#/quiz/ch11"}, {"label": "测验：第 12 章：计算学习理论", "href": "#/quiz/ch12"}, {"label": "测验：第 13 章：半监督学习", "href": "#/quiz/ch13"}, {"label": "测验：第 14 章：概率图模型", "href": "#/quiz/ch14"}, {"label": "测验：第 15 章：规则学习", "href": "#/quiz/ch15"}, {"label": "测验：第 16 章：强化学习", "href": "#/quiz/ch16"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：绪论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：区分监督学习与无监督学习；用“假设空间”的语言描述一个学习问题；解释“版本空间”是什么、为什么它的大小取决于样本；说出“没有免费午餐”定理到底否定了什么。<\/p>\n<h2>一句话核心<\/h2>\n<p>学习就是在巨大的假设空间里，用有限的样本筛掉不合假设，剩下的那些就是数据支持的候选模型。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从数据到模型的三段（难度：基础）<\/h3>\n<p>训练集 D 是一堆样本，每个样本有特征和标记。我们要找一个从特征到标记的映射 f。所有可能的 f 组成的集合叫<strong>假设空间<\/strong>。<\/p>\n<p><strong>实例（西瓜书原例）<\/strong>：判断“好瓜”，特征取（色泽, 根蒂, 敲声），每个特征有三种取值。假设空间的大小是 4×4×4+1=65——每个特征有 3 种取值加一个“无所谓”，最后再加一个“根本没有好瓜”这种极端假设。这里那个 +1 不是凑数，是“任何输入都输出坏瓜”也算一个假设。<\/p>\n<h3>概念 2：版本空间（难度：进阶）<\/h3>\n<p>拿训练集去筛假设空间：凡是预测与训练样本不符的假设全部删掉，剩下的叫<strong>版本空间<\/strong>。<\/p>\n<p><strong>为什么要这个概念<\/strong>：它说明“学到一个模型”从来不是唯一答案。样本少，版本空间大，模型不确定性高；样本多，版本空间收缩，才慢慢逼出唯一解。这解释了为什么数据量是机器学习的第一约束。<\/p>\n<p><strong>类比<\/strong>：警察破案。假设空间是所有可能的嫌疑人特征组合，每条口供（样本）排除一批人。口供越多，剩下的嫌疑人越少——但永远不会只剩一个人，除非证据完全充分。<\/p>\n<p><strong>类比失效的地方<\/strong>：现实中嫌疑人不会“被排除后又被重新纳入”，而机器学习里如果来了新样本与旧模型冲突，之前被排除的假设可能重新变得合理（这就是增量学习要处理的问题）。<\/p>\n<h3>概念 3：归纳偏好与没有免费午餐（难度：进阶）<\/h3>\n<p>面对版本空间里多个同样符合数据的假设，算法必须挑一个，挑的标准叫<strong>归纳偏好<\/strong>。比如“越简单越好”的奥卡姆剃刀。<\/p>\n<p><strong>没有免费午餐定理（NFL）<\/strong>：在所有可能的问题上平均，任何算法的期望性能都一样。它的真正含义不是“算法都差不多”，而是<strong>脱离具体问题谈算法优劣没有意义<\/strong>——一个算法在某类问题上强，必然在另一类上弱。所以工程上重要的是判断“我的数据有什么结构”，然后选匹配那个结构的算法。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  H[&quot;假设空间 65 个&quot;] --&gt; F[&quot;用训练集筛除不符假设&quot;]\n  F --&gt; V[&quot;版本空间 剩下若干&quot;]\n  V --&gt; P[&quot;归纳偏好挑一个&quot;]\n  P --&gt; M[&quot;最终模型&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从上到下是一个不断收缩的过程。注意最后一步不是数据决定的，是算法的偏好决定的，这一步没有唯一正确答案。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为数据越多版本空间就一定越小——实际上如果新样本本身有噪声，可能反而与所有剩余假设冲突，逼得你放宽假设空间。\n<\/li><li>\n别以为 NFL 定理说明“随便选个算法就行”——实际上它只是在全体问题上取平均，真实问题有结构，选对结构就有效。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n西瓜例子中假设空间大小为 65，这个 4 是怎么来的？（答案：B；解析：每个特征 3 种取值加一个通配符“无所谓”，共 4 种。）\n<ul>\n<li>\nA. 特征数加一　B. 每特征取值数加一通配符　C. 样本数加一　D. 类别数加一\n<\/li><li>\n版本空间的存在说明？（答案：C；解析：有限样本无法唯一确定模型，多个假设可能同样符合数据。）\n<\/li><li>\nA. 学习一定失败　B. 数据有噪声　C. 模型存在不确定性　D. 算法有 bug\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n假设空间 = 所有候选模型；版本空间 = 与数据一致的子集。\n<\/li><li>\n归纳偏好是在数据之外额外加的先验。\n<\/li><li>\nNFL：脱离问题结构谈算法优劣不成立。\n<\/ul>", "ch02": "<h1>第 2 章：模型评估与选择<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 1 章、概率与统计基础\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说清留出法、交叉验证、自助法三种划分的适用场景；从混淆矩阵算出查准率、查全率与 F1；解释 ROC 曲线与 AUC 的含义；说明为什么“A 算法比 B 好 1%”这句话需要做显著性检验才算数。<\/p>\n<h2>一句话核心<\/h2>\n<p>评估不是“算个准确率”，而是设计一套能区分“真本事”和“运气”的流程。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三种划分（难度：基础）<\/h3>\n<ul><li>\n<strong>留出法<\/strong>：把数据按 7:3 或 8:2 切成训练/测试。缺点是切一次结果波动大，所以要多次随机切分取平均。\n<\/li><li>\n<strong>k 折交叉验证<\/strong>：把数据分成 k 份，每次拿一份当测试、其余训练，做 k 次取平均。k 常取 5 或 10。数据少时用<strong>留一法<\/strong>（k=样本数），最准但计算量最大。\n<\/li><li>\n<strong>自助法<\/strong>：有放回采样 m 次得到训练集，约 36.8% 的样本从未被抽到，拿来做测试集。适合数据集很小的情况，但会改变数据分布。\n<\/ul>\n<p><strong>36.8% 怎么来的<\/strong>：每个样本一次都没被抽到的概率是 (1-1/m)^m，m 趋于无穷时极限是 1/e≈0.368。这个数是算出来的，不是经验值。<\/p>\n<h3>概念 2：查准率、查全率与 F1（难度：进阶）<\/h3>\n<p>以“预测为正”为例，混淆矩阵有四个格子：真正例 TP、假正例 FP、真负例 TN、假负例 FN。<\/p>\n<ul><li>\n<strong>查准率 P = TP/(TP+FP)<\/strong>：你说它是正例的里面，有多少真的是。\n<\/li><li>\n<strong>查全率 R = TP/(TP+FN)<\/strong>：真正的正例里，你找出来多少。\n<\/li><li>\n<strong>F1 = 2PR/(P+R)<\/strong>：两者的调和平均。\n<\/ul>\n<p><strong>为什么用调和平均而不用算术平均<\/strong>：调和平均对小的那个更敏感。P=1、R=0.01 时算术平均是 0.505 看着还行，F1≈0.02，一眼看出这个模型废了。<\/p>\n<p><strong>实例<\/strong>：100 个样本，80 正 20 负。模型预测 60 个正，其中 50 个对。则 TP=50、FP=10、FN=30。P=50/60=0.833，R=50/80=0.625，F1=2×0.833×0.625/(1.458)=0.714。<\/p>\n<h3>概念 3：ROC 与 AUC（难度：进阶）<\/h3>\n<p>按预测分数从高到低排序，逐个把阈值往下挪，每挪一次算一对（假正例率 FPR，真正例率 TPR），连起来就是 ROC 曲线。<strong>AUC 是曲线下面积<\/strong>，等于“随机取一个正例和一个负例，模型给正例打分更高的概率”。<\/p>\n<p><strong>为什么 AUC 比准确率稳<\/strong>：它不依赖某个特定阈值，衡量的是排序能力。样本不平衡时准确率会被多数类带偏，AUC 不会。<\/p>\n<h3>概念 4：比较检验（难度：高难）<\/h3>\n<p>“A 比 B 高 1%”可能只是随机划分的波动。常用做法：在多个数据集上做配对 t 检验，或用 McNemar 检验比较两个模型在同一测试集上的分类差异是否显著。<strong>不检验就宣称“我的模型更好”，在学术上是不成立的。<\/strong><\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  D[&quot;全量数据&quot;] --&gt; S[&quot;划分&quot;]\n  S --&gt; T[&quot;训练集&quot;]\n  S --&gt; V[&quot;验证集 调超参&quot;]\n  S --&gt; Te[&quot;测试集 只用一次&quot;]\n  T --&gt; M[&quot;训练模型&quot;]\n  V --&gt; M\n  M --&gt; Te\n  Te --&gt; R[&quot;泛化性能估计&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：验证集参与模型选择，测试集只参与最终报告。把两者混用会让估计偏乐观。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为交叉验证的 k 越大越好——实际上 k 大计算量按比例上升，而且每折训练集变小会引入悲观偏差，5 或 10 是平衡点。\n<\/li><li>\n别以为 AUC 高就一定好用——实际上 A 的 AUC 更高但阈值选不好，实际业务指标可能更差，AUC 只反映排序质量。\n<\/li><li>\n别以为自助法能解决小样本的一切问题——实际上它改变了数据分布，估计出的方差偏小。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n自助法训练集约占原数据多少比例？（答案：C；解析：(1-1/m)^m 趋于 1/e，未被抽到的是 36.8%，所以训练集约 63.2%。）\n<ul>\n<li>\nA. 36.8%　B. 50%　C. 63.2%　D. 80%\n<\/li><li>\nP=0.9、R=0.1 时 F1 约为？（答案：A；解析：2×0.9×0.1/1.0=0.18。）\n<\/li><li>\nA. 0.18　B. 0.5　C. 0.9　D. 0.1\n<\/li><li>\n用测试集反复挑模型，会导致？（答案：B；解析：测试信息泄露，泛化估计偏乐观。）\n<\/li><li>\nA. 训练变慢　B. 性能估计偏乐观　C. 过拟合减轻　D. 方差变小\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n划分三法：留出、k 折、自助；小数据用留一或自助。\n<\/li><li>\nP 看“报的正例多准”，R 看“真例找全没”，F1 用调和平均惩罚短板。\n<\/li><li>\nAUC = 正例打分高于负例的概率。\n<\/li><li>\n任何“更好”的结论都要过显著性检验。\n<\/ul>", "ch03": "<h1>第 3 章：线性模型<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 2 章、矩阵求导\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：推出最小二乘的闭式解；写出对数几率回归的损失并解释为什么用交叉熵而不是平方误差；说明 OvO、OvR 两种多分类策略的代价差异；解释类别不平衡时为什么改阈值比改数据更灵活。<\/p>\n<h2>一句话核心<\/h2>\n<p>线性模型先用一个线性函数给出分数，再用一个单调映射把分数变成概率或类别；它的全部威力来自“线性函数 + 合适的损失”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：最小二乘（难度：进阶）<\/h3>\n<p>模型 <code>f(x)=wᵀx+b<\/code>，要让预测逼近真实值 y。取平方误差 <code>E = Σ(y_i - wᵀx_i)²<\/code>，对 w 求导置零，得到闭式解 <code>w = (XᵀX)^{-1}Xᵀy<\/code>。<\/p>\n<p><strong>每一步怎么来的<\/strong>：把误差写成向量形式 <code>(y-Xw)ᵀ(y-Xw)<\/code>，展开得 <code>yᵀy - 2wᵀXᵀy + wᵀXᵀXw<\/code>。对 w 求导（矩阵求导规则：<code>∂(wᵀa)/∂w = a<\/code>，<code>∂(wᵀAw)/∂w = 2Aw<\/code> 当 A 对称）得 <code>-2Xᵀy + 2XᵀXw = 0<\/code>，解出 w。<\/p>\n<p><strong>什么时候不能用闭式解<\/strong>：XᵀX 不可逆（特征共线或样本数少于特征数）时。这时加一个 λI 变成岭回归，既保证可逆又抑制过大权重。<\/p>\n<p><strong>实例<\/strong>：三个样本 <code>x=1,2,3<\/code>，<code>y=2,4,6<\/code>。X 是 [[1,1],[1,2],[1,3]]（第一列全 1 当偏置），解出来 w=(0,2)，即 <code>f(x)=2x<\/code>，完全拟合。<\/p>\n<h3>概念 2：对数几率回归（难度：进阶）<\/h3>\n<p>把线性分数 <code>z=wᵀx+b<\/code> 送进 sigmoid 得 <code>y=1/(1+e^{-z})<\/code>，解释为“是正类的概率”。损失用交叉熵（书上叫“对数似然”）： <code>L = Σ[-y_i log ŷ_i - (1-y_i) log(1-ŷ_i)]<\/code>。<\/p>\n<p><strong>为什么不直接用平方误差<\/strong>：sigmoid 配平方误差时，梯度里会带一个 <code>ŷ(1-ŷ)<\/code> 因子，预测接近 0 或 1 时这个因子趋近 0，梯度消失，学得极慢。配交叉熵时梯度化简为 <code>(ŷ-y)x<\/code>，干净且不会饱和。<\/p>\n<p><strong>为什么叫“回归”却用来分类<\/strong>：因为它建模的是“正类的对数几率” <code>log(p/(1-p)) = wᵀx+b<\/code>，中间那一步是回归，最后一步取阈值才是分类。<\/p>\n<h3>概念 3：多分类与类别不平衡（难度：进阶）<\/h3>\n<ul><li>\n<strong>OvO<\/strong>：每两个类训一个分类器，k 类需要 k(k-1)/2 个。训练快（每次只用两类数据），但预测时要投票，存储多。\n<\/li><li>\n<strong>OvR<\/strong>：每类训一个“是不是我”的分类器，k 类只要 k 个。训练慢（每次用全部数据），预测只需取最高分。\n<\/ul>\n<p><strong>类别不平衡<\/strong>：正例远少于负例时，模型倾向全预测为负。三种手段：过采样（复制正例，SMOTE 插值生成新的）、欠采样（丢负例）、<strong>阈值移动<\/strong>（不按 0.5 判，按 <code>p/(1-p) &gt; 负正比例<\/code> 判）。第三种不改变训练数据分布，最省事也最可控。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  X[&quot;特征 x&quot;] --&gt; L[&quot;线性分数 z=wᵀx+b&quot;]\n  L --&gt; S[&quot;sigmoid&quot;]\n  S --&gt; P[&quot;概率 0 到 1&quot;]\n  P --&gt; T[&quot;阈值判定 类别&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：线性模型把“打分”和“判定”分成两段。改阈值不动模型参数，这是它能灵活应对不平衡的原因。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为最小二乘的闭式解一定存在唯一——实际上 XᵀX 奇异时有无穷多解或没有解，必须加正则。\n<\/li><li>\n别以为 OvO 训练 k(k-1)/2 个模型一定更慢——实际上每个模型只看两类数据，单个训练很快，总时间未必更差。\n<\/li><li>\n别以为不平衡只能靠采样解决——实际上改判定阈值往往更简单且不引入过采样带来的过拟合风险。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n样本 3 个、特征 100 个，用最小二乘会发生什么？（答案：C；解析：XᵀX 是 100×100 但秩最多 3，不可逆。）\n<ul>\n<li>\nA. 结果更准　B. 自动降维　C. XᵀX 不可逆，需加正则　D. 无法计算损失\n<\/li><li>\n对数几率回归用交叉熵而不用平方误差的主因？（答案：B；解析：交叉熵配 sigmoid 的梯度是 ŷ-y，不会因饱和而消失。）\n<\/li><li>\nA. 交叉熵更容易实现　B. 避免梯度饱和　C. 平方误差不可导　D. 交叉熵计算更快\n<\/li><li>\n类别不平衡时最不改变数据分布的做法是？（答案：D；解析：阈值移动只改判定规则。）\n<\/li><li>\nA. 过采样　B. 欠采样　C. SMOTE　D. 调整判定阈值\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n最小二乘闭式解 w=(XᵀX)^{-1}Xᵀy，奇异就加 λI。\n<\/li><li>\n对数几率回归 = 线性分数 + sigmoid + 交叉熵。\n<\/li><li>\nOvO 快在单模型、OvR 快在模型数；不平衡优先考虑调阈值。\n<\/ul>", "ch04": "<h1>第 4 章：决策树<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 3 章、信息论基础概念\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：手算一个二分类数据集的信息熵与信息增益；说清信息增益、增益率、基尼指数三者的取舍；解释预剪枝与后剪枝的差别及各自风险；说明连续值离散化和缺失值处理的做法。<\/p>\n<h2>一句话核心<\/h2>\n<p>决策树每次挑一个“最能一次把混杂样本分开”的特征做分裂，判据就是分裂前后不确定性下降多少。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：信息熵与信息增益（难度：进阶）<\/h3>\n<p>熵衡量一堆样本的“混杂程度”：<code>Ent(D) = -Σ p_k log2 p_k<\/code>。全是同一类时熵为 0；两类各占一半时熵为 1（二分类最大值）。<\/p>\n<p><strong>信息增益<\/strong>：用某个特征 a 分裂后，各子集的熵按样本比例加权平均，再用父节点熵减去它：<code>Gain(D,a) = Ent(D) - Σ(|D_v|/|D|) Ent(D_v)<\/code>。<\/p>\n<p><strong>实例<\/strong>：10 个样本，6 好 4 坏。Ent = -0.6log2(0.6)-0.4log2(0.4) = 0.971。 按“纹理”分：清晰 5 个（4 好 1 坏），模糊 3 个（1 好 2 坏），稍糊 2 个（1 好 1 坏）。 Ent(清晰)= -0.8log0.8-0.2log0.2=0.722；Ent(模糊)=0.918；Ent(稍糊)=1.0。 加权 = (5/10)×0.722 + (3/10)×0.918 + (2/10)×1.0 = 0.361+0.275+0.2 = 0.836。 Gain = 0.971-0.836 = 0.135。<\/p>\n<h3>概念 2：三种判据的取舍（难度：进阶）<\/h3>\n<ul><li>\n<strong>信息增益<\/strong>偏向取值多的特征。极端例子：用“编号”分裂，每个子集只有一个样本，熵全为 0，增益最大，但毫无泛化能力。\n<\/li><li>\n<strong>增益率<\/strong>：<code>Gain_ratio = Gain / IV(a)<\/code>，其中 IV 是特征自身的固有值，取值越多 IV 越大，起到惩罚作用。但增益率又偏向取值少的特征，所以书上用“先筛信息增益高于平均的，再从中选增益率最高”的启发式。\n<\/li><li>\n<strong>基尼指数<\/strong>：<code>Gini(D) = 1 - Σ p_k²<\/code>，含义是“随机抽两个样本，类别不一致的概率”。它不取对数，计算更快，CART 树用它。\n<\/ul>\n<h3>概念 3：剪枝（难度：高难）<\/h3>\n<ul><li>\n<strong>预剪枝<\/strong>：分裂前先估计泛化性能，不提升就不分。风险是把当前看起来没用的分裂（但后续可能有用）提前砍掉，容易欠拟合。\n<\/li><li>\n<strong>后剪枝<\/strong>：先长成完整树，再自底向上把子树替换成叶节点，若验证集性能提升就保留替换。效果通常更好，但要先训练完整棵树，代价更大。\n<\/ul>\n<p><strong>实例<\/strong>：某节点分裂后训练准确率 100%（因为每个叶只有一两个样本），验证准确率却从 70% 掉到 65%。这说明分裂在记忆噪声，应该剪掉。<\/p>\n<h3>概念 4：连续值与缺失值（难度：进阶）<\/h3>\n<p><strong>连续值<\/strong>：把该特征排序，取相邻值中点做候选划分点，算每个划分点的信息增益，取最优。同一特征可以被反复用不同阈值分裂。<\/p>\n<p><strong>缺失值<\/strong>：给每个样本加权重。分裂时只用在“该特征有值”的样本上算增益，再乘以“有值样本占比”作为惩罚；划分子集时，缺失样本按各子集的样本比例同时进入所有子集，权重按比例拆分。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  R[&quot;根节点 熵 0.971&quot;] --&gt; A[&quot;纹理&quot;]\n  A --&gt; A1[&quot;清晰 熵 0.722&quot;]\n  A --&gt; A2[&quot;模糊 熵 0.918&quot;]\n  A --&gt; A3[&quot;稍糊 熵 1.0&quot;]\n  A1 --&gt; B[&quot;触感 继续分裂&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：每个节点的熵写在下面。分裂的目标是让子节点的熵尽量低，Parent 熵减去加权子熵就是这次分裂的收益。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为信息增益最大的特征一定该选——实际上取值多的特征会被系统性偏爱，这是它的已知缺陷。\n<\/li><li>\n别以为剪枝会让模型变差——实际上剪枝几乎总是提升泛化，只是可能略降训练准确率。\n<\/li><li>\n别以为决策树不需要特征归一化就万事大吉——实际上它对特征尺度不敏感是真的，但类别特征编码方式仍会明显影响分裂结果。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n二分类问题中熵的最大值是多少？（答案：B；解析：两类各 0.5 时 -0.5log0.5×2=1。）\n<ul>\n<li>\nA. 0.5　B. 1　C. 2　D. log2(n)\n<\/li><li>\n用“编号”作为特征分裂会导致？（答案：A；解析：每个子集只有一个样本熵为 0，信息增益最大但完全没有泛化能力。）\n<\/li><li>\nA. 信息增益最大但泛化极差　B. 增益为负　C. 无法分裂　D. 自动剪枝\n<\/li><li>\n后剪枝相对预剪枝的优势是？（答案：C；解析：先长全再回退，避免了过早砍掉有用的分裂，通常泛化更好。）\n<\/li><li>\nA. 计算量更小　B. 训练更快　C. 不易欠拟合　D. 不需要验证集\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n熵 = 混杂度；信息增益 = 分裂后混杂度降了多少。\n<\/li><li>\n信息增益偏多值特征，增益率偏少值特征，基尼更快。\n<\/li><li>\n预剪枝易欠拟合，后剪枝效果好但更贵。\n<\/ul>", "ch05": "<h1>第 5 章：神经网络<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 3、4 章、链式法则\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出一个多层前馈网络的完整前向与反向公式；解释为什么 sigmoid 会导致梯度消失、ReLU 为什么缓解；说清“局部极小”和“全局最小”的区别与常用跳出策略。<\/p>\n<h2>一句话核心<\/h2>\n<p>神经网络是一族参数化的非线性函数，训练就是用梯度下降在参数空间里找让损失小的那一点。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：网络结构与记号（难度：基础）<\/h3>\n<p>输入层不算层数。一个“单隐层网络”就是输入→隐层→输出三段。第 l 层的输出 <code>a^(l) = f(W^(l) a^(l-1) + b^(l))<\/code>，f 是激活函数。<\/p>\n<p><strong>万能近似<\/strong>：只要有足够多的隐层神经元，单隐层网络能以任意精度逼近任意连续函数。注意这句话只保证“存在”，不保证“梯度下降能找到”，也不说明需要多少神经元。<\/p>\n<h3>概念 2：反向传播公式（难度：高难）<\/h3>\n<p>定义误差项 <code>δ^(l) = ∂L/∂z^(l)<\/code>。输出层：<code>δ^(L) = ∇_a L ⊙ f&#x27;(z^(L))<\/code>。隐藏层递归：<code>δ^(l) = (W^(l+1))ᵀ δ^(l+1) ⊙ f&#x27;(z^(l))<\/code>。参数梯度：<code>∂L/∂W^(l) = δ^(l) (a^(l-1))ᵀ<\/code>，<code>∂L/∂b^(l) = δ^(l)<\/code>。<\/p>\n<p><strong>每一行的意思<\/strong>：先把误差从输出层往回“传”（乘以转置的权重矩阵），再乘上本层激活的导数（因为激活也是运算的一环）。这两步合起来就是链式法则。<\/p>\n<h3>概念 3：梯度消失与激活选择（难度：高难）<\/h3>\n<p>sigmoid 导数最大 0.25，多层连乘后浅层梯度趋近 0。ReLU 正区导数 1，梯度能原样传回，但负区恒 0 会导致神经元死亡。<\/p>\n<p><strong>初始化配合<\/strong>：ReLU 用 He（标准差 √(2/n)），sigmoid 用 Xavier（1/√n）。初始化太小信号逐层衰减，太大逐层饱和。<\/p>\n<h3>概念 4：局部极小与全局最小（难度：进阶）<\/h3>\n<p>损失曲面通常非凸，梯度下降只能保证到局部极小或鞍点。常用对策：<\/p>\n<ul><li>\n<strong>多组初始化<\/strong>取验证最好的；\n<\/li><li>\n<strong>模拟退火<\/strong>：以一定概率接受变差的解，前期概率大后期小；\n<\/li><li>\n<strong>随机梯度下降<\/strong>：mini-batch 带来的噪声本身有助于跳出尖的局部极小；\n<\/li><li>\n<strong>动量<\/strong>：借惯性冲过浅坑。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  X[&quot;输入层&quot;] --&gt; H1[&quot;隐层 1 f=ReLU&quot;]\n  H1 --&gt; H2[&quot;隐层 2 f=ReLU&quot;]\n  H2 --&gt; O[&quot;输出层 softmax&quot;]\n  O --&gt; L[&quot;交叉熵损失&quot;]\n  L -.-&gt;|&quot;δ 逐层回传&quot;| H2\n  H2 -.-&gt; H1\n  H1 -.-&gt; X<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：实线是前向，虚线是误差项 δ 的回传方向。注意回传乘的是权重矩阵的转置，这是形状能对上的关键。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为万能近似定理说明单隐层就够用——实际上它只说存在性，深层网络能用指数少的参数表达同样函数。\n<\/li><li>\n别以为梯度下降一定找到最优——实际上非凸问题里它只保证局部性质。\n<\/li><li>\n别以为 ReLU 一定比 sigmoid 好——实际上小网络、需要概率输出时 sigmoid 仍有位置。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n输出层误差项 δ 怎么算？（答案：B；解析：损失对输出的梯度与该层激活导数逐元素相乘。）\n<ul>\n<li>\nA. 直接等于损失　B. 损失对输出的梯度 ⊙ 激活导数　C. 权重矩阵乘输出　D. 恒为 1\n<\/li><li>\n隐层误差项回传时要乘什么？（答案：C；解析：乘下一层权重矩阵的转置，再乘本层激活导数。）\n<\/li><li>\nA. 本层权重　B. 学习率　C. 下一层权重的转置 ⊙ 本层激活导数　D. 输入特征\n<\/li><li>\nReLU 的“神经元死亡”指？（答案：A；解析：输入长期为负时梯度恒 0，参数不再更新。）\n<\/li><li>\nA. 梯度恒 0 参数不再更新　B. 输出恒为 1　C. 权重被清零　D. 计算溢出\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n前向是矩阵乘法套激活，反向是 δ 回传乘转置权重。\n<\/li><li>\nsigmoid 导数 ≤0.25，深了必消失；ReLU 缓解但会死。\n<\/li><li>\n非凸曲面只有局部保证，要靠多初始化、动量、噪声。\n<\/ul>", "ch06": "<h1>第 6 章：支持向量机<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 3 章、拉格朗日乘子与二次规划\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出硬间隔 SVM 的原问题并说明为什么标签取 ±1；推出对偶形式并解释支持向量的含义；说清核函数的作用与核技巧为什么不用真的映射到高维；写出软间隔的松弛变量与惩罚系数 C 的作用。<\/p>\n<h2>一句话核心<\/h2>\n<p>SVM 找一个“离两边都尽量远”的分界面；它只由少数几个最难分的样本（支持向量）决定，其余样本删掉也不影响结果。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：间隔与标签取 ±1（难度：进阶）<\/h3>\n<p>分界面 <code>wᵀx+b=0<\/code>，点到面的距离是 <code>|wᵀx+b|/||w||<\/code>。要求所有样本满足 <code>y_i(wᵀx_i+b) ≥ 1<\/code>——这里把标签取 +1/-1 是关键：若取 0/1，(1-y) 与 (0-y) 会让约束不对称，公式得写两套。<\/p>\n<p>间隔宽度是 <code>2/||w||<\/code>，所以“最大化间隔”等价于“最小化 ||w||²/2”，写成 <code>min ½||w||² s.t. y_i(wᵀx_i+b)≥1<\/code>。<\/p>\n<p><strong>为什么间隔要归一化<\/strong>：同一条直线有无穷组 (w,b)（同时放大 k 倍还是同一条线）。固定 <code>y_i(wᵀx_i+b)=1<\/code> 就把尺度钉死，间隔才有确定值。<\/p>\n<h3>概念 2：对偶与支持向量（难度：高难）<\/h3>\n<p>引入拉格朗日乘子 α_i≥0，得到对偶问题：<code>max Σα_i - ½ΣΣ α_iα_jy_iy_j(x_iᵀx_j)<\/code>，约束 <code>Σα_iy_i=0, α_i≥0<\/code>。<\/p>\n<p><strong>KKT 条件给出关键结论<\/strong>：<code>α_i &gt; 0<\/code> 的样本必须落在间隔边界上，这些就是<strong>支持向量<\/strong>；<code>α_i=0<\/code> 的样本对 w 没有贡献。所以 w 只由支持向量决定。<\/p>\n<p><strong>实例（三点的经典例子）<\/strong>：正例 (1,1)、(-1,-1)，负例 (0,0) 时无解；换成 (2,2)、(2,0) 正例，(0,0)、(0,2) 负例时，可以算出支持向量是 (2,2)、(2,0)、(0,0)、(0,2) 中的三个，w=(2,2)，b=-2，间隔边界是 x1+x2=1 与 x1+x2=3。<\/p>\n<h3>概念 3：核函数与核技巧（难度：高难）<\/h3>\n<p>线性不可分时，把 x 映射到高维 φ(x)，在高维里线性可分。但直接算 φ 可能维度爆炸。<strong>核技巧<\/strong>：如果对偶里只需要内积 <code>φ(x_i)ᵀφ(x_j)<\/code>，那就直接定义一个核函数 <code>k(x_i,x_j)<\/code> 等于这个内积，完全不用显式构造 φ。<\/p>\n<p><strong>常用核<\/strong>：线性核 <code>x_iᵀx_j<\/code>；多项式核 <code>(x_iᵀx_j)^d<\/code>；高斯核 <code>exp(-||x_i-x_j||²/2σ²)<\/code>，对应无穷维映射。高斯核的 σ 越小，模型越复杂、越容易过拟合。<\/p>\n<h3>概念 4：软间隔（难度：进阶）<\/h3>\n<p>现实数据有噪声，硬间隔会为了一个异常点把边界挤歪。引入松弛变量 ξ_i≥0，约束放宽为 <code>y_i(wᵀx_i+b) ≥ 1-ξ_i<\/code>，目标改成 <code>min ½||w||² + CΣξ_i<\/code>。<\/p>\n<p><strong>C 的作用<\/strong>：C 大 → 惩罚违规重 → 尽量不分错、间隔窄、易过拟合；C 小 → 容忍违规 → 间隔宽、更稳。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;两类样本&quot;] --&gt; B[&quot;硬间隔 要求全部正确&quot;]\n  B --&gt;|&quot;有噪声或重叠&quot;| C[&quot;软间隔 加松弛变量&quot;]\n  C --&gt; D[&quot;仍线性不可分&quot;]\n  D --&gt; E[&quot;核函数映射到高维&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这是一条“逐步放宽”的路线。每往右一步，模型能力增强，过拟合风险也增加。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 SVM 一定要把所有样本都用上——实际上只有支持向量起作用，删掉其余样本模型不变。\n<\/li><li>\n别以为核函数就是“先映射再算内积”——实际上核技巧根本不做映射，只在原空间算一个函数值。\n<\/li><li>\n别以为 C 越大越好——实际上 C 太大会死守每个噪声点，泛化变差。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nSVM 标签取 +1/-1 而非 0/1 的原因是？（答案：B；解析：使约束 y_i(wᵀx_i+b)≥1 对称统一，0/1 会导致两类约束形式不同。）\n<ul>\n<li>\nA. 计算更快　B. 约束形式统一对称　C. 便于核函数　D. 防止除零\n<\/li><li>\nα_i&gt;0 对应的样本是？（答案：A；解析：KKT 互补松弛条件，只有间隔边界上的样本 α 非零。）\n<\/li><li>\nA. 支持向量　B. 噪声点　C. 所有样本　D. 离边界最远的点\n<\/li><li>\n高斯核的 σ 变小会导致？（答案：C；解析：核更尖锐，模型更复杂，容易过拟合。）\n<\/li><li>\nA. 模型更简单　B. 变成线性核　C. 更易过拟合　D. 间隔变宽\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n目标是最大化间隔，等价于最小化 ½||w||²。\n<\/li><li>\nw 只由支持向量决定，其余样本可删。\n<\/li><li>\n核技巧：只算内积，不构造高维映射。\n<\/li><li>\nC 控惩罚，σ 控核宽度，两个都是过拟合的旋钮。\n<\/ul>", "ch07": "<h1>第 7 章：贝叶斯分类器<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 2 章、条件概率与贝叶斯公式\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出贝叶斯最优分类器的决策规则；推导朴素贝叶斯的条件独立性假设并手算一个分类例子；解释拉普拉斯修正为什么必要；说清 EM 算法在做什么、为什么需要它。<\/p>\n<h2>一句话核心<\/h2>\n<p>贝叶斯分类器用“先验 + 似然”算后验概率，取后验最大的类；朴素贝叶斯为了能算，硬假设特征之间条件独立。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：贝叶斯决策（难度：基础）<\/h3>\n<p><code>P(c|x) = P(c)P(x|c)/P(x)<\/code>。P(x) 对所有类相同，可以忽略，所以判据是 <code>argmax_c P(c)P(x|c)<\/code>。这就是<strong>贝叶斯最优分类器<\/strong>，它在“已知真实分布”时错误率最小。<\/p>\n<p><strong>最小风险 vs 最小错误率<\/strong>：如果判错的代价不同（把病人误判为健康比反过来严重得多），就要把代价乘进决策里，<code>argmax_c Σ_j λ_ij P(c_j|x)<\/code>。<\/p>\n<h3>概念 2：朴素贝叶斯（难度：进阶）<\/h3>\n<p><code>P(x|c)<\/code> 是联合分布，特征多时组合爆炸，根本估不出来。<strong>条件独立性假设<\/strong>：在给定类别下，各特征相互独立，于是 <code>P(x|c)=Π P(x_i|c)<\/code>。<\/p>\n<p><strong>实例（西瓜）<\/strong>：判“好瓜”，特征（色泽=青绿, 敲声=清脆, 纹理=清晰）。 P(好)=0.6，P(坏)=0.4。 好瓜里：青绿 3/6，清脆 4/6，清晰 5/6 → 似然 = 0.6×0.5×0.667×0.833 = 0.167。 坏瓜里：青绿 1/4，清脆 1/4，清晰 1/4 → 似然 = 0.4×0.25×0.25×0.25 = 0.00625。 0.167 &gt; 0.00625，判好瓜。<\/p>\n<p><strong>拉普拉斯修正<\/strong>：某特征值在某类中没出现过，概率为 0，连乘把整个后验打成 0。修正做法是分子加 1、分母加该特征取值数：<code>P(x_i|c) = (count+1)/(N_c + N_i)<\/code>。这等于给每个取值一个先验计数，避免“没见过就绝对不可能”。<\/p>\n<h3>概念 3：半朴素贝叶斯与 EM（难度：高难）<\/h3>\n<p><strong>半朴素<\/strong>：放宽独立性，允许特征之间有“独依赖”（每个特征最多依赖另一个特征），如 SPODE、TAN。既保留可算性，又减少假设过强的偏差。<\/p>\n<p><strong>EM 算法<\/strong>：数据有缺失或含隐变量时，无法直接算后验。EM 的做法是：E 步用当前参数估计隐变量的期望（补全数据），M 步用补全后的数据重新估参数，反复迭代。<strong>它保证似然单调不减，但只收敛到局部最优<\/strong>，初值影响结果。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  PR[&quot;先验 P(c)&quot;] --&gt; B[&quot;贝叶斯公式&quot;]\n  LK[&quot;似然 P(x|c)&quot;] --&gt; B\n  B --&gt; PO[&quot;后验 P(c|x)&quot;]\n  PO --&gt; D[&quot;取最大 决策&quot;]\n  PO -.-&gt;|&quot;EM 迭代&quot;| LK<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：上半部分是分类流程，虚线是参数未知时的循环：先猜参数算后验，再用后验更新参数。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为朴素贝叶斯的“朴素”是缺点就一定要避免——实际上特征独立性假设虽强，但在文本分类等任务上表现相当好，因为它只需要估少量参数。\n<\/li><li>\n别以为拉普拉斯修正只是“加个 1 方便”——实际上它等价于引入一个均匀先验，是贝叶斯平滑，有理论依据。\n<\/li><li>\n别以为 EM 一定收敛到全局最优——实际上它对初值敏感，多跑几次取最优是常规操作。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n某特征值在某类中从未出现，不修正会发生什么？（答案：C；解析：概率为 0，连乘后整个后验为 0，该类别被彻底排除。）\n<ul>\n<li>\nA. 概率为 1　B. 自动忽略该特征　C. 后验被乘成 0　D. 报错\n<\/li><li>\nEM 算法的保证是？（答案：B；解析：似然单调不减，但只到局部最优。）\n<\/li><li>\nA. 一定到全局最优　B. 似然单调不减　C. 一步收敛　D. 无需初值\n<\/li><li>\n贝叶斯最优分类器在已知真实分布时？（答案：A；解析：它最小化错误率，是该条件下的理论最优。）\n<\/li><li>\nA. 错误率最小　B. 训练最快　C. 一定不过拟合　D. 需要核函数\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n后验正比于先验 × 似然，P(x) 可忽略。\n<\/li><li>\n朴素 = 条件独立假设，把联合概率拆成连乘。\n<\/li><li>\n拉普拉斯修正防零概率，本质是加先验。\n<\/li><li>\nEM：E 步补隐变量，M 步更新参数，似然单调不减。\n<\/ul>", "ch08": "<h1>第 8 章：集成学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 4、6、7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说清 Boosting 与 Bagging 的根本差别；手推 AdaBoost 的样本权重更新公式并算一轮；解释随机森林的两处随机性各解决什么问题；说明 Stacking 为什么容易过拟合。<\/p>\n<h2>一句话核心<\/h2>\n<p>集成靠“好而不同”：每个基学习器要有一定准确率，且彼此的错不能重叠，这样投票才能把各自的错抵消掉。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：Boosting 与 Bagging 的分工（难度：进阶）<\/h3>\n<ul><li>\n<strong>Boosting<\/strong>：串行，每个新学习器专门去纠正前面学错的部分，最后加权组合。代表 AdaBoost、GBDT。它主要降<strong>偏差<\/strong>。\n<\/li><li>\n<strong>Bagging<\/strong>：并行，用自助采样训练多个独立学习器再投票。它主要降<strong>方差<\/strong>。\n<\/ul>\n<p><strong>为什么是这个分工<\/strong>：Boosting 每轮都改样本分布让后面的模型关注难例，整体拟合能力不断增强；Bagging 每个模型看的是略有不同的数据，平均后噪声被抵消。<\/p>\n<h3>概念 2：AdaBoost 的权重更新（难度：高难）<\/h3>\n<p>第 t 轮：在当前权重分布 D_t 上训练基学习器 h_t，算它的加权错误率 <code>ε_t = P_{D_t}(h_t 判错)<\/code>。基学习器权重 <code>α_t = ½ ln((1-ε_t)/ε_t)<\/code>。样本权重更新：判错的乘 <code>exp(α_t)<\/code>，判对的乘 <code>exp(-α_t)<\/code>，再归一化。<\/p>\n<p><strong>读公式<\/strong>：ε_t 小于 0.5 时 α_t 为正，错样本权重被放大、对样本权重被缩小。所以下一轮模型被迫去啃上一轮错的样本。ε_t=0.5 时 α_t=0，该学习器等于没投票权。<\/p>\n<p><strong>实例<\/strong>：ε=0.2 时 α=½ln(0.8/0.2)=½ln4≈0.693。错样本权重乘 e^0.693≈2，对样本乘 0.5。一轮之后错样本占比翻四倍。<\/p>\n<p><strong>为什么要求 ε&lt;0.5<\/strong>：若基学习器比随机猜还差，α 为负，加权投票等于把它反着用——理论上可行，实践中直接用“补集”更省事。<\/p>\n<h3>概念 3：随机森林的两处随机（难度：进阶）<\/h3>\n<ol><li>\n<strong>样本随机<\/strong>：每棵树用自助采样的一份数据；\n<\/li><li>\n<strong>特征随机<\/strong>：每次分裂只在随机抽出的 k 个特征里选最优（k 常取 log2(d)）。\n<\/ol>\n<p>第二处随机性是关键：如果所有树都盯着同一个最强的特征分裂，树会长得很像，平均之后降方差的效果有限。限制特征选择逼每棵树看不同的证据，多样性才上来。<\/p>\n<h3>概念 4：Stacking（难度：高难）<\/h3>\n<p>用初级学习器的输出作为次级学习器的输入。<strong>必须用交叉验证生成初级输出<\/strong>，不能用训练集上的拟合值——否则初级模型在训练集上几乎完美，次级模型学到的是“谁过拟合得厉害”，而不是“谁泛化好”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  D[&quot;训练数据&quot;] --&gt; B1[&quot;Boosting 串行&quot;]\n  D --&gt; B2[&quot;Bagging 并行&quot;]\n  B1 --&gt; W[&quot;按错误率加权组合&quot;]\n  B2 --&gt; V[&quot;投票或平均&quot;]\n  W --&gt; O[&quot;强学习器&quot;]\n  V --&gt; O<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是串行改分布，右边是并行采样后平均。两条路的误差分解不同，选哪条取决于你的模型是高偏差还是高方差。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Bagging 的树越多越好——实际上收益会饱和，而且树之间相关性高时收益很小。\n<\/li><li>\n别以为 AdaBoost 不会过拟合——实际上它的鲁棒性比一般 boosting 好，但噪声大、标签错误多的数据上仍会过拟合。\n<\/li><li>\n别以为随机森林不用调参——实际上树的深度、特征子集大小 k、树的数量都影响效果。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nBagging 主要降低的是？（答案：B；解析：多个模型独立训练再平均，抵消方差。）\n<ul>\n<li>\nA. 偏差　B. 方差　C. 计算量　D. 特征数\n<\/li><li>\nAdaBoost 中 ε=0.5 时 α 等于？（答案：A；解析：½ln(0.5/0.5)=0，该学习器无投票权。）\n<\/li><li>\nA. 0　B. 1　C. 0.5　D. 无穷大\n<\/li><li>\n随机森林限制每次分裂只看 k 个特征，目的是？（答案：C；解析：逼各棵树看不同证据，提高多样性。）\n<\/li><li>\nA. 加速训练　B. 减少内存　C. 增加树间多样性　D. 防止过拟合到某一特征\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nBoosting 降偏差、串行改分布；Bagging 降方差、并行采样。\n<\/li><li>\nAdaBoost：α=½ln((1-ε)/ε)，错样本权重放大。\n<\/li><li>\n随机森林的两处随机：样本 + 特征子集。\n<\/li><li>\nStacking 要用交叉验证生成初级输出，否则必过拟合。\n<\/ul>", "ch09": "<h1>第 9 章：聚类<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 2 章、距离度量\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出 k-means 的更新公式并手算一轮；解释它为什么对初值敏感、为什么只能收敛到局部最优；说清 DBSCAN 的“核心对象、密度可达”是什么意思；用轮廓系数评价聚类结果。<\/p>\n<h2>一句话核心<\/h2>\n<p>聚类没有标签，评价标准只能来自数据本身的“紧不紧、分不分得开”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：k-means（难度：进阶）<\/h3>\n<p>目标：<code>min ΣΣ ||x - μ_i||²<\/code>（每个点到它所属中心的平方距离和）。 迭代两步：<strong>分配<\/strong>——每个点归到最近的中心；<strong>更新<\/strong>——每个中心改成所属点的均值。两步都会让目标下降，所以必然收敛，但只保证局部最优。<\/p>\n<p><strong>实例<\/strong>：三个点 0、2、10，初始中心取 0 和 10。点 0→中心 0，点 2→中心 0（距离 2 &lt; 8），点 10→中心 10。更新：中心变 (0+2)/2=1 和 10。下一轮：点 0→1，点 2→1，点 10→10，不再变化，收敛。若初始中心取 0 和 2，则点 10 归 2，中心变 1 和 10，结果不同——这就是初值敏感。<\/p>\n<p><strong>k-means++<\/strong>：第一个中心随机选，后续每个中心按“到已有中心距离平方”为概率选远的点，显著减少糟糕初值。<\/p>\n<h3>概念 2：学习向量量化 LVQ（难度：进阶）<\/h3>\n<p>有少量标签时用。每个原型向量带一个类别标记，样本来了找最近的原型：同类则把原型往样本方向拉，异类则推远。它是“用少量监督信息指导聚类”的典型。<\/p>\n<h3>概念 3：密度聚类 DBSCAN（难度：高难）<\/h3>\n<p>给定半径 ε 和最小点数 MinPts。<strong>核心对象<\/strong>：ε 邻域内样本数 ≥ MinPts 的点。从核心对象出发，把密度可达的点连成簇。不落在任何簇的点标为噪声。<\/p>\n<p><strong>优点<\/strong>：不用指定簇数，能发现任意形状的簇，能识别噪声。<strong>缺点<\/strong>：两个参数对结果影响大，高维数据上距离度量失效。<\/p>\n<h3>概念 4：层次聚类与评价（难度：进阶）<\/h3>\n<p><strong>AGNES<\/strong>：每个点先自成一簇，每次合并距离最近的两簇，直到达到目标簇数。距离有最小、最大、平均三种定义，分别偏向链状、球状、均衡形状。<\/p>\n<p><strong>轮廓系数<\/strong>：对每个样本，<code>a<\/code> 是到本簇其他点的平均距离，<code>b<\/code> 是到最近其他簇的平均距离，<code>s=(b-a)/max(a,b)<\/code>。s 接近 1 说明分得好，接近 0 说明在边界，负值说明可能分错簇。全样本平均就是整体聚类质量。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  I[&quot;初始 k 个中心&quot;] --&gt; A[&quot;分配每个点到最近中心&quot;]\n  A --&gt; U[&quot;中心更新为簇均值&quot;]\n  U --&gt; C{&quot;中心不再移动&quot;}\n  C --&gt;|否| A\n  C --&gt;|是| O[&quot;输出簇划分&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这是一个必然终止的循环，因为每次迭代目标函数都严格下降且有限。但它停在哪个局部最优，取决于初值。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 k-means 收敛就说明结果对——实际上它只到局部最优，多跑几次取目标最小的。\n<\/li><li>\n别以为聚类一定要指定 k——实际上 DBSCAN 和层次聚类都不需要。\n<\/li><li>\n别以为轮廓系数越大就一定越好——实际上凸形簇上它偏袒球状划分，非凸数据上会误判。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nk-means 每轮两步一定会让目标函数？（答案：A；解析：分配和更新各自都不增加平方距离和，故单调下降。）\n<ul>\n<li>\nA. 下降或不变　B. 上升　C. 震荡　D. 随机\n<\/li><li>\nDBSCAN 中“核心对象”指？（答案：C；解析：ε 邻域内样本数不少于 MinPts 的点。）\n<\/li><li>\nA. 离原点最近的点　B. 密度最大的簇中心　C. ε 邻域样本数≥MinPts 的点　D. 任何非噪声点\n<\/li><li>\n轮廓系数为负说明？（答案：B；解析：b&lt;a，样本离别的簇比本簇更近，划分可能有问题。）\n<\/li><li>\nA. 聚类很好　B. 样本可能分错簇　C. 簇数太多　D. 数据无结构\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nk-means：分配—更新循环，局部最优，初值敏感。\n<\/li><li>\nDBSCAN 靠密度连通，能找任意形状、能识别噪声。\n<\/li><li>\n轮廓系数衡量“簇内紧、簇间远”。\n<\/ul>", "ch10": "<h1>第 10 章：降维与度量学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 9 章、线性代数（特征值分解）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说清 kNN 的“懒惰学习”特点与维度灾难的关系；推出 PCA 的优化目标并解释为什么取协方差矩阵最大的特征向量；区分 PCA 与 MDS 的出发点；说明流形学习的核心假设。<\/p>\n<h2>一句话核心<\/h2>\n<p>降维的实质是找一个低维坐标系，让数据在丢掉一些方向后仍然尽量保持原本的结构。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：kNN 与维度灾难（难度：基础）<\/h3>\n<p>kNN 不训练，来一个样本就找最近的 k 个邻居投票。它属于<strong>懒惰学习<\/strong>（lazy learning）。<\/p>\n<p><strong>维度灾难<\/strong>：维度升高时，空间体积指数增长，样本变得极稀疏，任何两点之间的距离都差不多，“最近邻”失去区分度。这是 kNN 在高维上失效的根本原因，也是降维的动机之一。<\/p>\n<h3>概念 2：PCA（难度：高难）<\/h3>\n<p>目标：把数据投影到低维，使投影后样本尽量分散（方差最大）。<\/p>\n<p><strong>推导三步<\/strong>：<\/p>\n<ol><li>\n中心化：<code>X ← X - mean<\/code>，让每个特征均值为 0。\n<\/li><li>\n协方差矩阵 <code>C = XᵀX/(m-1)<\/code>，它描述各特征之间的线性相关。\n<\/li><li>\n对 C 做特征值分解，取最大的 d&#x27; 个特征值对应的特征向量组成投影矩阵 W，<code>Z = XW<\/code>。\n<\/ol>\n<p><strong>为什么取最大特征值<\/strong>：投影后的方差等于 <code>wᵀCw<\/code>，在 ||w||=1 约束下最大化它，拉格朗日法直接给出 <code>Cw=λw<\/code>——所以最优方向就是 C 的特征向量，方差就是特征值。前 d&#x27; 个特征值之和占总和的比例就是<strong>累计贡献率<\/strong>。<\/p>\n<p><strong>实例<\/strong>：二维数据完全落在直线 y=x 上，协方差矩阵的特征值是 2 和 0，取第一个特征向量 (1,1)/√2，一维投影不损失任何信息，因为第二维方差为 0。<\/p>\n<h3>概念 3：MDS 与流形学习（难度：高难）<\/h3>\n<p><strong>MDS<\/strong> 不关心方差，要求降维后样本间的<strong>距离<\/strong>尽量保持。它和 PCA 在欧氏距离下等价，但 MDS 可以接任意距离（比如测地距离）。<\/p>\n<p><strong>流形学习<\/strong>假设高维数据其实躺在一个低维曲面上（比如卷起来的纸）。Isomap 用近邻图上的最短路径近似测地距离再做 MDS；LLE 用局部线性重构关系来保持邻域结构。<\/p>\n<p><strong>为什么需要流形<\/strong>：瑞士卷这类数据，欧氏距离会把“隔着纸”的两点当成近邻，PCA 完全失效；沿曲面走的距离才是真距离。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  X[&quot;高维数据&quot;] --&gt; C[&quot;中心化&quot;]\n  C --&gt; V[&quot;协方差矩阵&quot;]\n  V --&gt; E[&quot;特征值分解&quot;]\n  E --&gt; W[&quot;取前 d 个特征向量&quot;]\n  W --&gt; Z[&quot;低维表示&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：核心在第 5 步——选择几个特征向量就是选择保留多少信息。特征值小的方向被丢掉，那里通常对应噪声。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为降维一定损失信息——实际上如果数据真在低维子空间上，丢掉的特征值本来就接近 0。\n<\/li><li>\n别以为 PCA 能解决所有降维问题——实际上它只捕捉线性结构，非线性流形要换方法。\n<\/li><li>\n别以为 kNN 不需要训练所以简单——实际上预测时要扫全库算距离，大数据上非常慢，通常配 KD 树或近似最近邻。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nPCA 投影后方差最大的方向对应？（答案：B；解析：Cw=λw，最大特征值对应的特征向量。）\n<ul>\n<li>\nA. 均值方向　B. 最大特征值的特征向量　C. 最小特征值的特征向量　D. 任意正交方向\n<\/li><li>\nkNN 在高维失效的主要原因是？（答案：C；解析：维度灾难导致距离失去区分度。）\n<\/li><li>\nA. 计算太慢　B. 内存不够　C. 样本稀疏、距离趋同　D. 参数太多\n<\/li><li>\n流形学习的核心假设是？（答案：A；解析：高维数据实际分布在一个低维流形上。）\n<\/li><li>\nA. 数据位于低维流形　B. 数据线性可分　C. 数据服从高斯　D. 数据无噪声\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n降维 = 换坐标系 + 丢方向。\n<\/li><li>\nPCA：中心化 → 协方差 → 特征分解 → 取大特征值方向。\n<\/li><li>\n累计贡献率 = 前 d 个特征值之和 / 全部特征值之和。\n<\/li><li>\n流形学习要保的是“沿曲面的距离”，不是直线距离。\n<\/ul>", "ch11": "<h1>第 11 章：特征选择与稀疏学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 3、10 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：区分过滤式、包裹式、嵌入式三种特征选择思路；用 Relief 的公式手算一个特征的权重更新；说明 L1 正则为什么能产生稀疏解而 L2 不能；解释“稀疏”为什么带来可解释性和计算优势。<\/p>\n<h2>一句话核心<\/h2>\n<p>特征选择不是“找最重要的特征”，而是“找出让模型在不掉分的前提下最省事的那个子集”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三种范式（难度：进阶）<\/h3>\n<ul><li>\n<strong>过滤式<\/strong>：先按统计指标筛特征，再训练模型。与后续学习器无关，快但可能筛掉组合起来有用的特征。\n<\/li><li>\n<strong>包裹式<\/strong>：把学习器当黑箱，用它的性能当评价标准搜特征子集。准但慢，容易过拟合到特定学习器。\n<\/li><li>\n<strong>嵌入式<\/strong>：特征选择与训练一体，训练完权重为 0 的特征自动被剔除。典型是 L1 正则。\n<\/ul>\n<h3>概念 2：Relief（难度：进阶）<\/h3>\n<p>对每个样本，找同类最近邻<strong>猜中近邻<\/strong>和异类最近邻<strong>猜错近邻<\/strong>，比较两者距离。特征 j 的权重更新： <code>δ_j = -diff(x_i^j, x_nearhit^j)² + diff(x_i^j, x_nearmiss^j)²<\/code>，对所有样本累加。<\/p>\n<p><strong>怎么读<\/strong>：如果该特征上“同类邻居更近”，第一项小、第二项大，δ 为正，权重增加；反之减少。它衡量的是“这个特征能不能区分近邻的类别”。<\/p>\n<p><strong>实例<\/strong>：某特征在样本与其同类近邻上差 0.1，与异类近邻上差 0.5，则该样本贡献 -0.01+0.25=0.24，是强正贡献。<\/p>\n<h3>概念 3：L1 稀疏性（难度：高难）<\/h3>\n<p>L1 正则 <code>min L(w) + λ||w||_1<\/code>。几何解释：L1 的等值线是菱形（二维），顶点落在坐标轴上；平方误差的等值线是椭圆。椭圆扩张时最先碰到菱形的顶点，那里某个坐标为 0，于是解稀疏。L2 的等值线是圆，碰到的点一般两个坐标都非零。<\/p>\n<p><strong>为什么稀疏有用<\/strong>：高维数据里大量特征冗余，稀疏解等于自动做了特征选择，模型更轻、更可解释、推理更快。代价是 L1 在 0 点不可导，要用近端梯度（soft-thresholding）求解。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  F[&quot;过滤式 先筛后训&quot;] --&gt; M[&quot;模型&quot;]\n  W[&quot;包裹式 用模型性能搜子集&quot;] --&gt; M\n  E[&quot;嵌入式 训练中自动置零&quot;] --&gt; M<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三条路对“评价标准”的定义不同：过滤式用统计量，包裹式用模型分数，嵌入式用损失函数本身。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为特征越多模型越准——实际上冗余特征会增加方差和计算，噪声特征会直接伤害泛化。\n<\/li><li>\n别以为 L1 一定优于 L2——实际上特征高度相关时 L1 会随意挑一个保留，结果不稳定；L2 会把权重平摊，更稳但不稀疏。\n<\/li><li>\n别以为包裹式选出的特征一定最好——实际上它过拟合到特定学习器的风险很高。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nL1 正则产生稀疏解的根本原因是？（答案：B；解析：L1 等值线是菱形，顶点在坐标轴上，最优点容易落在顶点。）\n<ul>\n<li>\nA. 梯度更大　B. 等值线有尖角落在坐标轴　C. 计算更快　D. 需要归一化\n<\/li><li>\nRelief 中某特征让同类邻居更近，其权重会？（答案：A；解析：-近同类差²+近异类差²，前者小后者大，δ 为正。）\n<\/li><li>\nA. 增加　B. 减少　C. 不变　D. 归零\n<\/li><li>\n包裹式特征选择的主要风险是？（答案：C；解析：用特定学习器性能做准则，容易过拟合到该学习器。）\n<\/li><li>\nA. 计算太慢　B. 无法处理高维　C. 过拟合到特定学习器　D. 必须离散特征\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n过滤式看统计量、包裹式看模型分、嵌入式边训边选。\n<\/li><li>\nRelief 用“同类近邻 vs 异类近邻”的距离差给特征打分。\n<\/li><li>\nL1 的菱形尖角带来稀疏，L2 的圆形不会。\n<\/ul>", "ch12": "<h1>第 12 章：计算学习理论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 2 章、概率不等式\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说清 PAC 学习的三要素与“可能近似正确”到底保证了什么；解释 VC 维的含义并举例说明二维线性分类器的 VC 维是 3；写出泛化误差上界的大致形式并说明它和样本量、VC 维的关系。<\/p>\n<h2>一句话核心<\/h2>\n<p>计算学习理论回答一个问题：需要多少样本，才能保证学出来的模型在没见过的数据上也差不多好。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：PAC 学习（难度：进阶）<\/h3>\n<p>PAC（Probably Approximately Correct）说：对任意目标概念、任意分布，只要有足够多的样本，学习算法能以高概率（置信度 1-δ）输出一个误差不超过 ε 的假设。<\/p>\n<p><strong>三要素<\/strong>：ε（允许的误差）、δ（允许失败的概率）、样本复杂度 m(ε,δ)。<strong>注意它没说“一定正确”<\/strong>，只说“大概率差不多对”，这是所有实用保证的原型。<\/p>\n<h3>概念 2：VC 维（难度：高难）<\/h3>\n<p>假设空间 H 的 VC 维，是“能被 H 打散（shatter）的最大样本集大小”。<strong>打散<\/strong>指：这组样本的所有 2^m 种标记组合，都能被 H 中某个假设实现。<\/p>\n<p><strong>二维线性分类器<\/strong>：3 个不共线的点可以被打散（8 种标记全实现）；4 个点不行（对角同色就画不出）。所以 VC 维是 3。<\/p>\n<p><strong>为什么 VC 维重要<\/strong>：它衡量假设空间的表达能力，且与具体分布无关。VC 维高，模型能拟合复杂模式，但泛化上界更松。<\/p>\n<h3>概念 3：泛化误差上界（难度：高难）<\/h3>\n<p>对有限假设空间，以至少 1-δ 的概率有：<code>E(h) ≤ Ê(h) + √(ln|H| + ln(1/δ))/(2m)<\/code>，其中 Ê 是训练误差，m 是样本数，|H| 是假设数。<\/p>\n<p><strong>怎么读<\/strong>：训练误差 + 一个“复杂度惩罚项”。样本越多惩罚越小，假设空间越大惩罚越大。这就是“模型容量与数据量要匹配”的数学来源。<\/p>\n<p>用 VC 维替 ln|H| 得到与分布无关的界，形式类似但常数不同。这些界通常很松（常数大），所以实际中更多用来做定性判断而非精确预测。<\/p>\n<h3>概念 4：稳定性（难度：进阶）<\/h3>\n<p>算法稳定性：训练集换掉一个样本，输出模型的损失变化不超过 β。<strong>稳定算法的泛化误差可用 β 给出界<\/strong>，这是比 VC 维更精细的路径，因为它利用算法本身而非假设空间的容量。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  M[&quot;样本量 m&quot;] --&gt; B[&quot;泛化上界&quot;]\n  V[&quot;模型复杂度 VC 维&quot;] --&gt; B\n  B --&gt; G[&quot;训练误差 + 惩罚项&quot;]\n  G --&gt; R[&quot;实际泛化表现&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：样本量与复杂度是两根杠杆。数据少就选简单模型，数据多才敢上复杂模型。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 VC 维越高越差——实际上它只说明需要更多样本，如果有足够数据，高 VC 模型可以更好。\n<\/li><li>\n别以为这些界能直接预测准确率——实际上它们通常极松，作用是把“为什么需要更多数据/更简单模型”讲清楚。\n<\/li><li>\n别以为 PAC 保证了算法的实际表现——实际上它只给概率意义上的界，不保证每次运行都对。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n二维线性分类器的 VC 维是？（答案：B；解析：3 个不共线点可打散，4 个点不行。）\n<ul>\n<li>\nA. 2　B. 3　C. 4　D. 无穷\n<\/li><li>\n泛化上界中的惩罚项随样本量 m 如何变化？（答案：A；解析：项中含 1/√m，m 增大则惩罚减小。）\n<\/li><li>\nA. 随 m 增大而减小　B. 随 m 增大而增大　C. 与 m 无关　D. 先增后减\n<\/li><li>\nPAC 的“可能近似正确”指？（答案：C；解析：以高概率输出误差不超过 ε 的假设，不是保证绝对正确。）\n<\/li><li>\nA. 一定正确　B. 误差为零　C. 大概率误差小　D. 对所有分布都完美\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nPAC = 高概率 + 小误差，代价是样本量。\n<\/li><li>\nVC 维 = 能被打散的最大样本数；二维线性是 3。\n<\/li><li>\n泛化上界 = 训练误差 + 复杂度/√样本量。\n<\/ul>", "ch13": "<h1>第 13 章：半监督学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 7、9、12 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说清半监督学习能奏效的两个假设；区分纯半监督学习与直推学习；解释生成式方法、半监督 SVM、图半监督三条路线的差别；说明协同训练为什么要求“视图充分且独立”。<\/p>\n<h2>一句话核心<\/h2>\n<p>半监督学习靠“未标注数据的分布本身携带信息”这一点：聚类结构、流形结构、或两个视角的一致性。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：两个基本假设（难度：进阶）<\/h3>\n<ul><li>\n<strong>聚类假设<\/strong>：决策边界应该穿过数据稀疏的区域，而不是密集区。\n<\/li><li>\n<strong>流形假设<\/strong>：相邻样本的标记应该相似，因为它们落在同一块低维流形上。\n<\/ul>\n<p>这两个假设本质上是同一条：数据分布本身有结构，结构能约束分类边界。<\/p>\n<p><strong>纯半监督 vs 直推<\/strong>：纯半监督用未标注数据帮助训练，目标是预测<strong>未来<\/strong>的新样本；直推学习（transductive）就是要把<strong>这批<\/strong>未标注样本标出来，不关心新样本。<\/p>\n<h3>概念 2：三条技术路线（难度：高难）<\/h3>\n<ol><li>\n<strong>生成式方法<\/strong>：假设所有数据（含未标注）来自同一个生成模型，用 EM 把未标注样本的隐含类别当隐变量估出来。它依赖生成模型假设正确，假设错了会拉低性能。\n<\/li><li>\n<strong>半监督 SVM（S3VM）<\/strong>：要求分类边界不仅分开有标样本，还要穿过低密度区。优化时给未标注样本也分配松弛变量，是非凸问题，常用凸放松或梯度下降近似。\n<\/li><li>\n<strong>图半监督<\/strong>：把样本建成图，边权是相似度，标签像“热量”一样沿边扩散。解是一个稀疏线性方程组，未标注样本的标签由邻居加权决定。\n<\/ol>\n<p><strong>实例（图方法）<\/strong>：三个点 A(有标+1)、B(无标)、C(有标-1)，相似度 A-B=0.9、B-C=0.1。B 的标签 = (0.9×1 + 0.1×(-1))/(0.9+0.1) = 0.8，判 +1。直观上 B 更像 A。<\/p>\n<h3>概念 3：协同训练（难度：高难）<\/h3>\n<p>要求数据有两个<strong>充分且独立<\/strong>的视图（比如网页的正文和超链接）。两个视图各训一个分类器，各自把最有把握的未标注样本加上伪标签给对方，互相教。<\/p>\n<p><strong>为什么要求视图独立<\/strong>：如果两个视图高度相关，一个分类器的错误会被另一个复制，互相教等于一起错。独立性保证错误不重叠。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  L[&quot;少量有标数据&quot;] --&gt; T[&quot;训练初始模型&quot;]\n  U[&quot;大量无标数据&quot;] --&gt; P[&quot;预测伪标签&quot;]\n  T --&gt; P\n  P --&gt; R[&quot;加入训练集再训练&quot;]\n  R --&gt; T<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这是一个自训练循环。风险在于伪标签一旦错，会被反复强化，所以要选高置信样本、控制比例。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为无标数据一定有用——实际上如果无标数据分布与有标数据差异大，反而会伤害模型。\n<\/li><li>\n别以为半监督一定优于监督——实际上有标数据足够多时，半监督的收益很小甚至为负。\n<\/li><li>\n别以为协同训练随便两个视图就行——实际上视图不独立时，互相教就是互相传错。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n半监督学习能奏效的根本依据是？（答案：B；解析：聚类或流形假设，即数据分布本身含结构信息。）\n<ul>\n<li>\nA. 无标数据更多　B. 数据分布本身含结构　C. 模型更强　D. 计算更快\n<\/li><li>\n协同训练要求两个视图？（答案：C；解析：充分且独立，保证错误不重叠。）\n<\/li><li>\nA. 完全相同　B. 完全不相关　C. 充分且独立　D. 都是文本\n<\/li><li>\n直推学习与纯半监督的差别是？（答案：A；解析：直推只要标出当前这批无标样本，不追求泛化到新样本。）\n<\/li><li>\nA. 不追求对新样本泛化　B. 不需要有标数据　C. 必须用深度学习　D. 一定有图结构\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n两个假设：聚类（边界走稀疏区）、流形（近邻标签相似）。\n<\/li><li>\n三条路线：生成式、S3VM、图扩散。\n<\/li><li>\n协同训练的前提是视图独立，否则互相传错。\n<\/ul>", "ch14": "<h1>第 14 章：概率图模型<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 7 章、条件独立与图论基础\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：区分贝叶斯网（有向）与马尔可夫随机场（无向）的因子分解形式；用 d-分离判断两个变量是否条件独立；说清精确推断与近似推断的取舍；解释 LDA 主题模型在生成什么。<\/p>\n<h2>一句话核心<\/h2>\n<p>概率图模型用一张图把联合分布拆成若干局部因子的乘积，让“高维联合分布”变成可计算的东西。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：贝叶斯网（难度：高难）<\/h3>\n<p>有向无环图，每个节点是一个变量，每个节点带一个条件概率表 <code>P(X_i | parents(X_i))<\/code>。联合分布按拓扑序分解：<code>P(X_1,...,X_n) = Π P(X_i | parents(X_i))<\/code>。<\/p>\n<p><strong>三种基本结构<\/strong>：<\/p>\n<ul><li>\n顺连 A→B→C：给定 B 时 A 与 C 独立。\n<\/li><li>\n分连 A←B→C：给定 B 时独立；<strong>不给 B 时反而相关<\/strong>。\n<\/li><li>\n汇连 A→B←C：不给 B 时 A 与 C 独立；<strong>给了 B 反而相关<\/strong>（解释消除）。\n<\/ul>\n<p><strong>汇连的直觉<\/strong>：一个人发烧（B），可能是感冒（A）或疟疾（C）。不知道他发烧时，两件事无关；一旦知道发烧了，感冒可能性上升会让疟疾可能性下降——这就是“解释消除”，也是贝叶斯网最容易反直觉的地方。<\/p>\n<h3>概念 2：马尔可夫随机场（难度：高难）<\/h3>\n<p>无向图，联合分布按<strong>团<\/strong>分解：<code>P(X) = (1/Z) Π_团 ψ_团(X_团)<\/code>，Z 是配分函数，保证归一化。它不表达因果方向，只表达“谁和谁直接相关”。<\/p>\n<p><strong>Hammersley-Clifford 定理<\/strong>：一个分布能被无向图分解，当且仅当它满足该图上的马尔可夫性。这条定理是无向图模型的理论基础。<\/p>\n<h3>概念 3：推断（难度：高难）<\/h3>\n<ul><li>\n<strong>精确推断<\/strong>：变量消去法（按顺序积分掉变量，复杂度随树宽指数增长）、信念传播（树上精确，有环图上近似）。\n<\/li><li>\n<strong>近似推断<\/strong>：MCMC（采样，Gibbs 采样轮流按条件分布更新一个变量）、变分推断（用一个简单分布逼近后验，把推断转成优化）。\n<\/ul>\n<p><strong>取舍<\/strong>：精确推断在树宽小的图上可行，实际模型树宽往往很大，所以大规模应用基本走近似。<\/p>\n<h3>概念 4：LDA 主题模型（难度：高难）<\/h3>\n<p>生成过程：每篇文档先抽一个主题分布 θ~Dir(α)；每个词先从 θ 抽一个主题 z，再从该主题的词分布 φ_z~Dir(β) 抽一个词。<strong>推断用 Gibbs 采样<\/strong>，最终得到每篇文档的主题比例和每个主题的词分布。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;A 感冒&quot;] --&gt; B[&quot;B 发烧&quot;]\n  C[&quot;C 疟疾&quot;] --&gt; B\n  B -.-&gt;|&quot;观测到 B 后 A 与 C 相关&quot;| A\n  B -.-&gt; C<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：实线是生成关系，虚线表示“条件在 B 上”之后出现的新相关。这是汇连结构的标志。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为有向图和无向图只是画法不同——实际上它们表达不同的独立性语义，有向图能表达因果方向，无向图不能。\n<\/li><li>\n别以为给了更多证据就一定更确定——实际上汇连结构里，观测子节点可能让原本独立的父节点变得相关。\n<\/li><li>\n别以为 MCMC 一定收敛到正确答案——实际上它需要足够长的链和合理的 burn-in，诊断不充分会得到错的结果。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n汇连结构 A→B←C 中，观测到 B 后 A 与 C？（答案：C；解析：解释消除，原本独立变为相关。）\n<ul>\n<li>\nA. 仍独立　B. 完全无关　C. 变得相关　D. 无法判断\n<\/li><li>\n无向图模型的联合分布按什么分解？（答案：B；解析：按团分解，配分函数归一化。）\n<\/li><li>\nA. 按节点　B. 按团　C. 按边　D. 按路径\n<\/li><li>\n变量消去法的复杂度主要取决于？（答案：C；解析：随图的树宽指数增长。）\n<\/li><li>\nA. 节点数　B. 边数　C. 树宽　D. 样本数\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n贝叶斯网按父节点条件概率分解，MRF 按团势函数分解。\n<\/li><li>\n汇连：观测子节点会让父节点相关。\n<\/li><li>\n精确推断看树宽，大了就走 MCMC 或变分。\n<\/ul>", "ch15": "<h1>第 15 章：规则学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 4 章、逻辑基础\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说明规则学习与决策树的异同；用序贯覆盖的思路描述如何一条条长出规则；解释规则剪枝的两种做法；说清归纳逻辑程序设计（ILP）为什么需要背景知识。<\/p>\n<h2>一句话核心<\/h2>\n<p>规则学习直接产出“如果……那么……”的命题，天生可读、可修改、可解释，代价是搜索空间大。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：规则与覆盖率（难度：基础）<\/h3>\n<p>一条规则形如 <code>好瓜 ← 色泽=青绿 ∧ 敲声=沉闷<\/code>。它覆盖的样本是“所有满足左边条件的样本”，其中正例比例叫<strong>精度<\/strong>，覆盖的正例数量叫<strong>覆盖度<\/strong>。<\/p>\n<p><strong>与决策树的差别<\/strong>：决策树是“一条路径一条规则”，规则之间互斥且完备；规则集里的规则可以重叠、可以不完备（有些样本没有规则覆盖）。所以规则集更灵活，也更容易处理缺省情况。<\/p>\n<h3>概念 2：序贯覆盖（难度：进阶）<\/h3>\n<p>从空规则开始，每次加一个最能提升精度的条件（贪心），直到规则只覆盖正例或精度达标；然后把这条规则覆盖的正例删掉，在剩余样本上重复。<strong>这是“分治”策略：一条规则解决一部分，剩下的继续。<\/strong><\/p>\n<p><strong>实例<\/strong>：训练集 10 正 10 负。第一轮找到条件“纹理=清晰”，覆盖 6 正 1 负，精度 0.857；再加“触感=硬”，覆盖 3 正 0 负，精度 1.0，规则成立。删掉这 3 个正例，继续下一轮。<\/p>\n<h3>概念 3：剪枝（难度：进阶）<\/h3>\n<ul><li>\n<strong>预剪枝<\/strong>：加条件时同时看验证集，精度不升就停。\n<\/li><li>\n<strong>后剪枝<\/strong>：先长成很长的规则，再逐个删条件，若验证集精度提升就保留删除。\n<\/ul>\n<p>规则后剪枝比树后剪枝更简单，因为删一个条件就是删一个合取项。<\/p>\n<h3>概念 4：归纳逻辑程序设计（难度：高难）<\/h3>\n<p>命题规则表达能力有限（不能表达“存在某个瓜比它甜”）。<strong>ILP<\/strong> 用一阶逻辑表示规则，允许引入背景知识（比如“更甜”这个谓词的定义）。<\/p>\n<p><strong>为什么需要背景知识<\/strong>：一阶规则的空间是无限的，没有背景知识约束，搜索无从下手。ILP 的典型做法是最小一般化：从最具体的规则出发，每次做一次“提升”，逐步泛化。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  D[&quot;剩余训练样本&quot;] --&gt; G[&quot;贪心加条件 提升精度&quot;]\n  G --&gt; C{&quot;精度达标&quot;}\n  C --&gt;|否| G\n  C --&gt;|是| R[&quot;产出一条规则&quot;]\n  R --&gt; S[&quot;删掉被覆盖的正例&quot;]\n  S --&gt; D<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这是一个“吃完一批再吃下一批”的循环。每轮只关心还没被解释的样本，这是它和决策树最大的不同。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为规则越多越好——实际上规则太多会过拟合，且规则之间可能冲突，需要投票或优先级。\n<\/li><li>\n别以为规则学习只能处理离散特征——实际上连续特征可以先离散化再用。\n<\/li><li>\n别以为 ILP 只是“规则的复杂版”——实际上它引入背景知识后能表达递归概念，这是命题规则做不到的。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n规则学习与决策树的主要差别是？（答案：B；解析：决策树路径互斥完备，规则集可重叠、可不完备。）\n<ul>\n<li>\nA. 规则学习不能分类　B. 规则集可重叠不完备　C. 决策树不可解释　D. 规则学习不需要数据\n<\/li><li>\n序贯覆盖每产出一条规则后会做什么？（答案：A；解析：删掉被该规则覆盖的正例，在剩余样本上继续。）\n<\/li><li>\nA. 删掉被覆盖的正例　B. 删掉所有负例　C. 重新采样　D. 增加特征\n<\/li><li>\nILP 需要背景知识的原因是？（答案：C；解析：一阶规则空间无限，无背景知识无法有效搜索。）\n<\/li><li>\nA. 提高准确率　B. 加速计算　C. 约束搜索空间　D. 避免过拟合\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n规则 = 条件合取 → 结论，用精度与覆盖度评价。\n<\/li><li>\n序贯覆盖：长一条、删覆盖、再长下一条。\n<\/li><li>\nILP 用一阶逻辑 + 背景知识，表达力强但搜索难。\n<\/ul>", "ch16": "<h1>第 16 章：强化学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1、3、7 章；对接 Sutton 专书\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说清强化学习与监督学习的任务差异；写出 K 臂赌博机的 ε-贪心策略并解释探索与利用的权衡；写出 MDP 的四元组与贝尔曼方程；说明 Q-learning 与 Sarsa 的差别。<\/p>\n<h2>一句话核心<\/h2>\n<p>强化学习没有标准答案，只有延迟的奖励；它必须在“试错”中同时学会“什么状态好”和“什么动作对”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：任务设定（难度：基础）<\/h3>\n<p>智能体在环境里执行动作，环境给出新状态和奖励。目标是最大化<strong>长期累积奖励<\/strong>，不是眼前这一步的奖励。<\/p>\n<p><strong>与监督学习的三个不同<\/strong>：没有即时标签（奖励可能延迟几十步）、数据由自己的策略产生（非独立同分布）、探索会影响后续见到的数据。<\/p>\n<h3>概念 2：K 臂赌博机（难度：进阶）<\/h3>\n<p>K 个摇臂，每个有未知的期望收益。<strong>ε-贪心<\/strong>：以 ε 概率随机探索，以 1-ε 概率选当前估计最好的。<strong>乐观初始值<\/strong>：把所有估计初值设高，逼算法先把每个臂都试一遍。<strong>UCB<\/strong>：按“均值 + 不确定性奖励”选，<code>a = argmax Q(a) + c√(ln t / N(a))<\/code>，被试得少的臂获得额外加分。<\/p>\n<p><strong>实例<\/strong>：两个臂，真实收益 0.8 和 0.5。ε=0.1 时，90% 的步都选当前最优，10% 用于探索。前期探索多、后期收敛到 0.8 那个臂，但永远保留 10% 的“学费”。<\/p>\n<h3>概念 3：MDP 与贝尔曼方程（难度：高难）<\/h3>\n<p>MDP 四元组 <code>(S, A, P, R)<\/code>：状态、动作、转移概率、奖励。策略 π 给出每个状态下选动作的概率。<\/p>\n<p><strong>状态价值<\/strong>：<code>v_π(s) = Σ_a π(a|s) Σ_{s&#x27;} P(s&#x27;|s,a)[R + γ v_π(s&#x27;)]<\/code>。 <strong>动作价值<\/strong>：<code>q_π(s,a) = Σ_{s&#x27;} P(s&#x27;|s,a)[R + γ Σ_{a&#x27;} π(a&#x27;|s&#x27;) q_π(s&#x27;,a&#x27;)]<\/code>。<\/p>\n<p><strong>γ 的作用<\/strong>：折扣因子，越接近 1 越看重长远，越接近 0 越短视。它同时保证无穷和收敛。<\/p>\n<h3>概念 4：TD 与 Q-learning（难度：高难）<\/h3>\n<p><strong>TD(0) 更新<\/strong>：<code>V(s) ← V(s) + α[r + γV(s&#x27;) - V(s)]<\/code>。方括号里是“实际看到的 + 对未来的估计”减去“原来的估计”，叫 TD 误差。它不需要等一幕结束，边走边学。<\/p>\n<p><strong>Q-learning<\/strong>（离轨策略）：<code>Q(s,a) ← Q(s,a) + α[r + γ max_{a&#x27;} Q(s&#x27;,a&#x27;) - Q(s,a)]<\/code>。用下一状态的最大动作价值，不管实际下一步选了什么。<\/p>\n<p><strong>Sarsa<\/strong>（同轨策略）：把 <code>max Q(s&#x27;,a&#x27;)<\/code> 换成实际选的 <code>Q(s&#x27;,a&#x27;)<\/code>。它学的是“当前这个策略的价值”，Q-learning 学的是“最优策略的价值”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  S[&quot;状态 s&quot;] --&gt; A[&quot;动作 a&quot;]\n  A --&gt; E[&quot;环境&quot;]\n  E --&gt; R[&quot;奖励 r 与新状态 s&#x27;&quot;]\n  R --&gt; U[&quot;更新 Q 表&quot;]\n  U --&gt; S<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这个循环每转一圈更新一次估计。注意它没有“正确答案”，只有环境给的奖励信号。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为奖励越大越好就一定对——实际上延迟奖励可能要求牺牲眼前收益。\n<\/li><li>\n别以为 Q-learning 一定比 Sarsa 好——实际上在危险环境下 Sarsa 更保守安全，因为它评估的是实际执行的策略。\n<\/li><li>\n别以为 γ 只是数学技巧——它决定了智能体的“视野长度”，直接影响行为。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nQ-learning 与 Sarsa 的核心差别是？（答案：B；解析：Q-learning 用 max 下一动作价值，离轨；Sarsa 用实际选的动作价值，同轨。）\n<ul>\n<li>\nA. 学习率不同　B. 是否用 max 下一动作价值　C. 是否需要环境模型　D. 是否用神经网络\n<\/li><li>\nε-贪心中 ε 的作用是？（答案：C；解析：以 ε 概率随机探索，避免卡在次优动作。）\n<\/li><li>\nA. 控制学习率　B. 控制折扣　C. 控制探索比例　D. 控制奖励尺度\n<\/li><li>\nTD 误差的定义是？（答案：A；解析：r+γV(s&#x27;) 与 V(s) 之差。）\n<\/li><li>\nA. 目标估计减去当前估计　B. 奖励减学习率　C. 价值减奖励　D. 动作价值减状态价值\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nRL 的核心难点：奖励延迟、数据自产、必须探索。\n<\/li><li>\n贝尔曼方程：当前价值 = 即时奖励 + 折扣后的下一状态价值。\n<\/li><li>\nQ-learning 离轨用 max，Sarsa 同轨用实际动作。\n<\/li><li>\n完整展开见《强化学习》专书第 3、6、13 章。\n<\/ul>", "c01": "<h1>偏差与方差<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2、8 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>偏差是模型系统性偏离真实规律的程度，方差是模型对训练集扰动敏感的程度；泛化误差约等于偏差平方加方差加噪声。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“模型为什么不好”分成两类可分别处理的原因：欠拟合是高偏差，过拟合是高方差。集成方法的分工也由它决定。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  B[&quot;高偏差 欠拟合&quot;] --&gt; E[&quot;泛化误差&quot;]\n  V[&quot;高方差 过拟合&quot;] --&gt; E\n  N[&quot;噪声 不可消除&quot;] --&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>偏差高表现为训练误差本身就大；方差高表现为训练误差小、验证误差大。降偏差靠增加模型容量、加特征、减少正则；降方差靠加数据、加正则、用 Bagging 平均。<\/p>\n<p>一个具体的感受方式：用不同随机划分训练同一个模型，如果每次结果差异很大，方差就高；如果每次都稳定地差，偏差就高。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为偏差和方差能独立优化到最小<\/strong>——实际上存在权衡，容量增加通常降偏差升方差。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>泛化误差分解<\/td><td>解释过拟合与欠拟合<\/td><\/tr><tr><td>第 8 章<\/td><td>Boosting/Bagging<\/td><td>前者降偏差，后者降方差<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：泛化误差、模型容量\n<\/li><li>\n后续：集成学习、正则化\n<\/ul>", "c02": "<h1>核技巧<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>如果算法只需要样本间的内积，就把内积换成一个核函数 k(x_i,x_j)，等价于在某个高维空间里做内积，而不必真的做映射。<\/p>\n<h2>为什么重要<\/h2>\n<p>它让线性算法获得非线性能力，代价只是换一个函数。SVM、核 PCA、核岭回归都靠它。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  X[&quot;原空间样本&quot;] --&gt; K[&quot;核函数 k&quot;]\n  K --&gt; H[&quot;等价于高维内积&quot;]\n  H --&gt; L[&quot;线性算法在高维运行&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>合法性由 Mercer 定理保证：核矩阵半正定即可。常用三个：线性核、多项式核、高斯核。高斯核对应无穷维映射，σ 越小模型越复杂。<\/p>\n<p>核技巧的代价是计算：训练时需要算 m×m 的核矩阵，m 大时内存吃不消，通常用低秩近似或随机特征。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为核技巧等于先升维再算<\/strong>——实际上完全不构造高维向量，只算函数值。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 6 章<\/td><td>SVM 对偶<\/td><td>对偶只含内积，故可用核<\/td><\/tr><tr><td>第 10 章<\/td><td>核化 PCA<\/td><td>同思路推广到降维<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：内积、对偶问题\n<\/li><li>\n后续：高斯核、核矩阵近似\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：问题设定与假设空间<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：绪论<\/a><br>检查点：能用自己的话解释版本空间与 NFL<\/li><li class='path-step' id='path-02'><strong>步骤 02：评估与选择<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：模型评估与选择<\/a><br>检查点：给定混淆矩阵算出 P、R、F1，并说明为何要显著性检验<\/li><li class='path-step' id='path-03'><strong>步骤 03：线性模型<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：线性模型<\/a><br>检查点：推出最小二乘闭式解并解释为何用交叉熵<\/li><li class='path-step' id='path-04'><strong>步骤 04：决策树<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：决策树<\/a><br>检查点：手算一次信息增益与一轮剪枝判断<\/li><li class='path-step' id='path-05'><strong>步骤 05：神经网络<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：神经网络<\/a><br>检查点：写出 δ 的回传公式并解释梯度消失<\/li><li class='path-step' id='path-06'><strong>步骤 06：支持向量机<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：支持向量机<\/a><br>检查点：推出对偶并说明支持向量为何只占少数<\/li><li class='path-step' id='path-07'><strong>步骤 07：贝叶斯分类器<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：贝叶斯分类器<\/a><br>检查点：手算一次朴素贝叶斯分类并说明平滑的作用<\/li><li class='path-step' id='path-08'><strong>步骤 08：集成学习<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：集成学习<\/a><br>检查点：算一轮 AdaBoost 的 α 与权重更新<\/li><li class='path-step' id='path-09'><strong>步骤 09：聚类<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：聚类<\/a><br>检查点：手算一轮 k-means 并用轮廓系数评价<\/li><li class='path-step' id='path-10'><strong>步骤 10：降维与度量学习<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章：降维与度量学习<\/a><br>检查点：推出 PCA 的最优方向并说明累计贡献率<\/li><li class='path-step' id='path-11'><strong>步骤 11：特征选择与稀疏学习<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章：特征选择与稀疏学习<\/a><br>检查点：解释 L1 为何稀疏并算一次 Relief 更新<\/li><li class='path-step' id='path-12'><strong>步骤 12：计算学习理论<\/strong><br>阅读：<a href=\"#/chapter/ch12\">第 12 章：计算学习理论<\/a><br>检查点：说明 VC 维与泛化上界的关系<\/li><li class='path-step' id='path-13'><strong>步骤 13：半监督学习<\/strong><br>阅读：<a href=\"#/chapter/ch13\">第 13 章：半监督学习<\/a><br>检查点：说明两个假设与三条路线<\/li><li class='path-step' id='path-14'><strong>步骤 14：概率图模型<\/strong><br>阅读：<a href=\"#/chapter/ch14\">第 14 章：概率图模型<\/a><br>检查点：用 d-分离判断独立性，说明汇连的反直觉<\/li><li class='path-step' id='path-15'><strong>步骤 15：规则学习<\/strong><br>阅读：<a href=\"#/chapter/ch15\">第 15 章：规则学习<\/a><br>检查点：描述序贯覆盖流程并说明 ILP 的作用<\/li><li class='path-step' id='path-16'><strong>步骤 16：强化学习（对接专书）<\/strong><br>阅读：<a href=\"#/chapter/ch16\">第 16 章：强化学习<\/a><br>检查点：写出 Q-learning 更新式并对比 Sarsa<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__quiz_ch01__": "<h1>测验：第 1 章：绪论<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 西瓜例子里假设空间 65 的来历？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 特征数加一<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 每特征取值数加一通配符<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 样本数加一<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 类别数加一<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 版本空间的存在说明什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 学习一定失败<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 数据有噪声<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 模型存在不确定性<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 算法有 bug<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：模型评估与选择<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 自助法训练集约占原数据多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 36.8%<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 50%<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 63.2%<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 80%<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> P=0.9、R=0.1 时 F1 约是多少？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 0.18<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 0.5<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 0.9<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 0.1<\/label><\/div><div class='quiz-actions'><button class='quiz-ch
