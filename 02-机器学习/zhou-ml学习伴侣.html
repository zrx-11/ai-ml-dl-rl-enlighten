div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q41' value='0'> 节点数<\/label><label class='quiz-opt'><input type='radio' name='q41' value='1'> 边数<\/label><label class='quiz-opt'><input type='radio' name='q41' value='2'> 树宽<\/label><label class='quiz-opt'><input type='radio' name='q41' value='3'> 样本数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch15__": "<h1>测验：第 15 章：规则学习<\/h1><div class='quiz-item' data-qid='q42' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 规则学习与决策树的关键差别？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q42' value='0'> 规则学习不能分类<\/label><label class='quiz-opt'><input type='radio' name='q42' value='1'> 规则集可重叠且可不完备<\/label><label class='quiz-opt'><input type='radio' name='q42' value='2'> 决策树不可解释<\/label><label class='quiz-opt'><input type='radio' name='q42' value='3'> 规则学习不需要数据<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q43' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 序贯覆盖产出一条规则后做什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q43' value='0'> 删掉被覆盖的正例<\/label><label class='quiz-opt'><input type='radio' name='q43' value='1'> 删掉所有负例<\/label><label class='quiz-opt'><input type='radio' name='q43' value='2'> 重新采样<\/label><label class='quiz-opt'><input type='radio' name='q43' value='3'> 增加特征<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q44' data-type='single'><p class='quiz-q'><b>Q3.<\/b> ILP 需要背景知识的原因？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q44' value='0'> 提高准确率<\/label><label class='quiz-opt'><input type='radio' name='q44' value='1'> 加速计算<\/label><label class='quiz-opt'><input type='radio' name='q44' value='2'> 约束无限的一阶规则空间<\/label><label class='quiz-opt'><input type='radio' name='q44' value='3'> 避免过拟合<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch16__": "<h1>测验：第 16 章：强化学习<\/h1><div class='quiz-item' data-qid='q45' data-type='single'><p class='quiz-q'><b>Q1.<\/b> Q-learning 与 Sarsa 的核心差别？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q45' value='0'> 学习率不同<\/label><label class='quiz-opt'><input type='radio' name='q45' value='1'> 是否使用下一状态的最大动作价值<\/label><label class='quiz-opt'><input type='radio' name='q45' value='2'> 是否需要环境模型<\/label><label class='quiz-opt'><input type='radio' name='q45' value='3'> 是否用神经网络<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q46' data-type='single'><p class='quiz-q'><b>Q2.<\/b> ε-贪心中 ε 控制什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q46' value='0'> 学习率<\/label><label class='quiz-opt'><input type='radio' name='q46' value='1'> 折扣因子<\/label><label class='quiz-opt'><input type='radio' name='q46' value='2'> 探索比例<\/label><label class='quiz-opt'><input type='radio' name='q46' value='3'> 奖励尺度<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q47' data-type='single'><p class='quiz-q'><b>Q3.<\/b> TD 误差是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q47' value='0'> 目标估计减当前估计<\/label><label class='quiz-opt'><input type='radio' name='q47' value='1'> 奖励减学习率<\/label><label class='quiz-opt'><input type='radio' name='q47' value='2'> 价值减奖励<\/label><label class='quiz-opt'><input type='radio' name='q47' value='3'> 动作价值减状态价值<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='假设空间'>假设空间 — 所有可能的从特征到标记的映射组成的集合。 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='版本空间'>版本空间 — 假设空间中与训练集完全一致的那部分假设。 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='归纳偏好'>归纳偏好 — 算法在多个同样符合数据的假设中做选择时依据的先验倾向。 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='没有免费午餐定理'>没有免费午餐定理 — 在所有可能问题上平均，任何算法的期望性能相同。 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='留出法'>留出法 — 把数据集按比例切成训练集与测试集。 <span class=glossary-ref>（第 2 章：模型评估与选择）<\/span><\/li><li data-term='交叉验证'>交叉验证 — 把数据分 k 份轮流做测试集，取平均性能。 <span class=glossary-ref>（第 2 章：模型评估与选择）<\/span><\/li><li data-term='自助法'>自助法 — 有放回采样构造训练集，未被抽到的样本作测试。 <span class=glossary-ref>（第 2 章：模型评估与选择）<\/span><\/li><li data-term='查准率'>查准率 — 预测为正的样本中真正为正的比例。 <span class=glossary-ref>（第 2 章：模型评估与选择）<\/span><\/li><li data-term='查全率'>查全率 — 真实正例中被找出来的比例。 <span class=glossary-ref>（第 2 章：模型评估与选择）<\/span><\/li><li data-term='auc'>AUC — ROC 曲线下面积，等于正例得分高于负例的概率。 <span class=glossary-ref>（第 2 章：模型评估与选择）<\/span><\/li><li data-term='最小二乘'>最小二乘 — 以平方误差为损失、可用闭式解求解的线性回归方法。 <span class=glossary-ref>（第 3 章：线性模型）<\/span><\/li><li data-term='对数几率回归'>对数几率回归 — 用 sigmoid 把线性分数映射为概率的二分类模型。 <span class=glossary-ref>（第 3 章：线性模型）<\/span><\/li><li data-term='ovo'>OvO — 每两个类训练一个分类器的多分类策略。 <span class=glossary-ref>（第 3 章：线性模型）<\/span><\/li><li data-term='ovr'>OvR — 每个类训练一个“是否为本类”分类器的多分类策略。 <span class=glossary-ref>（第 3 章：线性模型）<\/span><\/li><li data-term='类别不平衡'>类别不平衡 — 不同类别样本数量差异悬殊，导致模型偏向多数类。 <span class=glossary-ref>（第 3 章：线性模型）<\/span><\/li><li data-term='信息熵'>信息熵 — 衡量样本集合类别混杂程度的量，越小越纯。 <span class=glossary-ref>（第 4 章：决策树）<\/span><\/li><li data-term='信息增益'>信息增益 — 用某特征分裂后熵的下降量。 <span class=glossary-ref>（第 4 章：决策树）<\/span><\/li><li data-term='增益率'>增益率 — 信息增益除以特征固有值，用于惩罚多值特征。 <span class=glossary-ref>（第 4 章：决策树）<\/span><\/li><li data-term='基尼指数'>基尼指数 — 随机抽两个样本类别不一致的概率。 <span class=glossary-ref>（第 4 章：决策树）<\/span><\/li><li data-term='剪枝'>剪枝 — 去掉决策树中泛化收益为负的分支，分预剪枝与后剪枝。 <span class=glossary-ref>（第 4 章：决策树）<\/span><\/li><li data-term='误差项'>误差项 — 损失对本层线性输出的偏导，反向传播中逐层回传的量。 <span class=glossary-ref>（第 5 章：神经网络）<\/span><\/li><li data-term='万能近似定理'>万能近似定理 — 足够宽的单隐层网络可任意精度逼近连续函数。 <span class=glossary-ref>（第 5 章：神经网络）<\/span><\/li><li data-term='梯度消失'>梯度消失 — 多层连乘小导数导致浅层梯度趋近于 0。 <span class=glossary-ref>（第 5 章：神经网络）<\/span><\/li><li data-term='局部极小'>局部极小 — 参数空间中比邻域都低但非全局最低的点。 <span class=glossary-ref>（第 5 章：神经网络）<\/span><\/li><li data-term='支持向量'>支持向量 — 决定分类边界的少数样本，对偶解中 α 非零。 <span class=glossary-ref>（第 6 章：支持向量机）<\/span><\/li><li data-term='间隔'>间隔 — 分界面到最近样本的距离，SVM 要最大化它。 <span class=glossary-ref>（第 6 章：支持向量机）<\/span><\/li><li data-term='核函数'>核函数 — 直接给出高维映射后内积的函数，避免显式映射。 <span class=glossary-ref>（第 6 章：支持向量机）<\/span><\/li><li data-term='软间隔'>软间隔 — 允许部分样本违规的 SVM 形式，用松弛变量与惩罚系数 C 控制。 <span class=glossary-ref>（第 6 章：支持向量机）<\/span><\/li><li data-term='贝叶斯最优分类器'>贝叶斯最优分类器 — 已知真实分布时按后验最大决策、错误率最小的分类器。 <span class=glossary-ref>（第 7 章：贝叶斯分类器）<\/span><\/li><li data-term='朴素贝叶斯'>朴素贝叶斯 — 假设特征在给定类别下条件独立的贝叶斯分类器。 <span class=glossary-ref>（第 7 章：贝叶斯分类器）<\/span><\/li><li data-term='拉普拉斯修正'>拉普拉斯修正 — 分子加一、分母加取值数，避免零概率的平滑手段。 <span class=glossary-ref>（第 7 章：贝叶斯分类器）<\/span><\/li><li data-term='em 算法'>EM 算法 — 交替估计隐变量与参数、使似然单调不减的迭代算法。 <span class=glossary-ref>（第 7 章：贝叶斯分类器）<\/span><\/li><li data-term='boosting'>Boosting — 串行训练多个基学习器、每轮聚焦前轮错误样本的集成方法。 <span class=glossary-ref>（第 8 章：集成学习）<\/span><\/li><li data-term='bagging'>Bagging — 自助采样并行训练多个基学习器再投票的集成方法。 <span class=glossary-ref>（第 8 章：集成学习）<\/span><\/li><li data-term='adaboost'>AdaBoost — 通过样本权重与学习器权重迭代调整的 Boosting 代表算法。 <span class=glossary-ref>（第 8 章：集成学习）<\/span><\/li><li data-term='随机森林'>随机森林 — 以决策树为基学习器、引入样本与特征双重随机的 Bagging 集成。 <span class=glossary-ref>（第 8 章：集成学习）<\/span><\/li><li data-term='stacking'>Stacking — 用初级学习器输出训练次级学习器的集成策略。 <span class=glossary-ref>（第 8 章：集成学习）<\/span><\/li><li data-term='聚类'>聚类 — 无标签情况下按相似度把样本分组的任务。 <span class=glossary-ref>（第 9 章：聚类）<\/span><\/li><li data-term='k-means'>k-means — 以平方距离和为目标、交替分配与更新中心的聚类算法。 <span class=glossary-ref>（第 9 章：聚类）<\/span><\/li><li data-term='dbscan'>DBSCAN — 基于密度连通性的聚类算法，能识别噪声与任意形状簇。 <span class=glossary-ref>（第 9 章：聚类）<\/span><\/li><li data-term='轮廓系数'>轮廓系数 — 衡量簇内紧密度与簇间分离度的指标。 <span class=glossary-ref>（第 9 章：聚类）<\/span><\/li><li data-term='维度灾难'>维度灾难 — 维度升高导致样本稀疏、距离度量失效的现象。 <span class=glossary-ref>（第 10 章：降维与度量学习）<\/span><\/li><li data-term='pca'>PCA — 以最大化投影方差为目标的主成分分析降维方法。 <span class=glossary-ref>（第 10 章：降维与度量学习）<\/span><\/li><li data-term='累计贡献率'>累计贡献率 — 保留的主成分特征值之和占全部特征值和的比例。 <span class=glossary-ref>（第 10 章：降维与度量学习）<\/span><\/li><li data-term='流形学习'>流形学习 — 假设数据位于低维流形并保持其局部或全局结构的降维方法。 <span class=glossary-ref>（第 10 章：降维与度量学习）<\/span><\/li><li data-term='特征选择'>特征选择 — 从原始特征中挑出对任务有用的子集。 <span class=glossary-ref>（第 11 章：特征选择与稀疏学习）<\/span><\/li><li data-term='relief'>Relief — 用同类与异类最近邻的距离差给特征打分的过滤式方法。 <span class=glossary-ref>（第 11 章：特征选择与稀疏学习）<\/span><\/li><li data-term='l1 正则'>L1 正则 — 权重绝对值之和作惩罚项，倾向于产生稀疏解。 <span class=glossary-ref>（第 11 章：特征选择与稀疏学习）<\/span><\/li><li data-term='稀疏表示'>稀疏表示 — 用少量非零系数表示样本，兼顾压缩与可解释性。 <span class=glossary-ref>（第 11 章：特征选择与稀疏学习）<\/span><\/li><li data-term='pac'>PAC — 在高概率下输出误差不超过给定界的假设的学习框架。 <span class=glossary-ref>（第 12 章：计算学习理论）<\/span><\/li><li data-term='vc 维'>VC 维 — 假设空间能打散的最大样本集大小。 <span class=glossary-ref>（第 12 章：计算学习理论）<\/span><\/li><li data-term='泛化误差上界'>泛化误差上界 — 用训练误差与模型复杂度、样本量给出的泛化性能界。 <span class=glossary-ref>（第 12 章：计算学习理论）<\/span><\/li><li data-term='算法稳定性'>算法稳定性 — 训练集微扰导致输出模型损失变化有限的性質。 <span class=glossary-ref>（第 12 章：计算学习理论）<\/span><\/li><li data-term='半监督学习'>半监督学习 — 同时利用少量有标与大量无标数据训练模型。 <span class=glossary-ref>（第 13 章：半监督学习）<\/span><\/li><li data-term='聚类假设'>聚类假设 — 决策边界应穿过数据低密度区域。 <span class=glossary-ref>（第 13 章：半监督学习）<\/span><\/li><li data-term='流形假设'>流形假设 — 相邻样本位于同一低维流形，标记应相似。 <span class=glossary-ref>（第 13 章：半监督学习）<\/span><\/li><li data-term='直推学习'>直推学习 — 只对给定的一批未标注样本做预测，不追求泛化。 <span class=glossary-ref>（第 13 章：半监督学习）<\/span><\/li><li data-term='贝叶斯网'>贝叶斯网 — 用有向无环图表示变量间条件依赖的概率模型。 <span class=glossary-ref>（第 14 章：概率图模型）<\/span><\/li><li data-term='马尔可夫随机场'>马尔可夫随机场 — 用无向图与团势函数表示联合分布的概率模型。 <span class=glossary-ref>（第 14 章：概率图模型）<\/span><\/li><li data-term='d-分离'>d-分离 — 判断贝叶斯网中两变量在给定证据下是否条件独立的图准则。 <span class=glossary-ref>（第 14 章：概率图模型）<\/span><\/li><li data-term='配分函数'>配分函数 — 使无向图模型势函数乘积归一化为概率分布的常数。 <span class=glossary-ref>（第 14 章：概率图模型）<\/span><\/li><li data-term='lda'>LDA — 以文档-主题-词三层生成结构建模文本主题的概率模型。 <span class=glossary-ref>（第 14 章：概率图模型）<\/span><\/li><li data-term='序贯覆盖'>序贯覆盖 — 一条条生成规则、每轮删掉已覆盖正例的规则学习策略。 <span class=glossary-ref>（第 15 章：规则学习）<\/span><\/li><li data-term='精度'>精度 — 规则覆盖的样本中正例所占比例。 <span class=glossary-ref>（第 15 章：规则学习）<\/span><\/li><li data-term='覆盖度'>覆盖度 — 规则覆盖的正例数量。 <span class=glossary-ref>（第 15 章：规则学习）<\/span><\/li><li data-term='归纳逻辑程序设计'>归纳逻辑程序设计 — 用一阶逻辑表示规则并引入背景知识的规则学习框架。 <span class=glossary-ref>（第 15 章：规则学习）<\/span><\/li><li data-term='强化学习'>强化学习 — 智能体通过与环境交互、以最大化长期累积奖励为目标的学习范式。 <span class=glossary-ref>（第 16 章：强化学习）<\/span><\/li><li data-term='ε-贪心'>ε-贪心 — 以 ε 概率随机探索、否则选当前最优动作的策略。 <span class=glossary-ref>（第 16 章：强化学习）<\/span><\/li><li data-term='马尔可夫决策过程'>马尔可夫决策过程 — 由状态、动作、转移概率、奖励构成的强化学习标准模型。 <span class=glossary-ref>（第 16 章：强化学习）<\/span><\/li><li data-term='贝尔曼方程'>贝尔曼方程 — 把状态价值表示为即时奖励与后继状态价值折扣和的关系式。 <span class=glossary-ref>（第 16 章：强化学习）<\/span><\/li><li data-term='td 误差'>TD 误差 — 一步目标估计与当前价值估计之差。 <span class=glossary-ref>（第 16 章：强化学习）<\/span><\/li><li data-term='q-learning'>Q-learning — 用下一状态最大动作价值更新的离轨策略时序差分算法。 <span class=glossary-ref>（第 16 章：强化学习）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：偏差—方差—容量三角<\/h2>\n<p>任何模型选择问题都能拆成三问：模型容量够不够（欠拟合？）、方差大不大（过拟合？）、数据量与容量匹配不匹配。周志华全书反复用这个三角解释为什么某个技巧有效。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n数据少、特征多 → 先降维或加 L1，再用简单模型。\n<\/li><li>\n训练好测试差 → 先查数据划分是否泄露，再加正则/集成。\n<\/li><li>\n类别不平衡 → 先看业务代价，再决定调阈值、采样还是换评价指标。\n<\/li><li>\n线性不可分 → 先试核 SVM 或树集成，不要直接上深度网络。\n<\/li><li>\n没有标签 → 先聚类看结构，再考虑半监督。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>用测试集调参<\/strong>：评估结果虚高，是实验设计层面的错误。\n<\/li><li>\n<strong>不做显著性检验就宣称更优<\/strong>：单次划分的波动常大于模型差异。\n<\/li><li>\n<strong>只看准确率<\/strong>：不平衡数据上准确率会被多数类主导。\n<\/li><li>\n<strong>盲目堆特征<\/strong>：冗余特征增加方差，噪声特征直接伤害泛化。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>最小二乘<\/td><td>w=(XᵀX)^{-1}Xᵀy<\/td><\/tr><tr><td>对数几率回归损失<\/td><td>L=Σ[-y log ŷ-(1-y)log(1-ŷ)]<\/td><\/tr><tr><td>信息熵<\/td><td>Ent=-Σp_k log2 p_k<\/td><\/tr><tr><td>信息增益<\/td><td>Gain=Ent(D)-Σ(<\/td><td>D_v<\/td><td>/<\/td><td>D<\/td><td>)Ent(D_v)<\/td><\/tr><tr><td>F1<\/td><td>2PR/(P+R)<\/td><\/tr><tr><td>SVM 原问题<\/td><td>min ½<\/td><td><\/td><td>w<\/td><td><\/td><td>² s.t. y_i(wᵀx_i+b)≥1<\/td><\/tr><tr><td>AdaBoost 学习器权重<\/td><td>α=½ln((1-ε)/ε)<\/td><\/tr><tr><td>PCA<\/td><td>中心化 → 协方差 → 特征分解 → 取大特征值方向<\/td><\/tr><tr><td>Q-learning<\/td><td>Q(s,a)←Q(s,a)+α[r+γmax Q(s&#x27;,a&#x27;)-Q(s,a)]<\/td><\/tr><\/tbody><\/table>\n<h2>算法选择速查<\/h2>\n<table><thead><tr><th>任务<\/th><th>首选<\/th><th>备选<\/th><\/tr><\/thead><tbody><tr><td>中小规模分类<\/td><td>随机森林 / XGBoost<\/td><td>逻辑回归、SVM<\/td><\/tr><tr><td>高维稀疏文本<\/td><td>朴素贝叶斯、线性 SVM<\/td><td>L1 逻辑回归<\/td><\/tr><tr><td>需要可解释<\/td><td>决策树、规则学习<\/td><td>线性模型<\/td><\/tr><tr><td>无标签分组<\/td><td>k-means、DBSCAN<\/td><td>层次聚类<\/td><\/tr><tr><td>降维可视化<\/td><td>PCA、t-SNE<\/td><td>Isomap、LLE<\/td><\/tr><tr><td>序列决策<\/td><td>Q-learning、策略梯度<\/td><td>见强化学习专书<\/td><\/tr><\/tbody><\/table>\n<h2>排错顺序<\/h2>\n<p>训练误差高 → 模型容量不足（加特征、换模型）；训练低测试高 → 过拟合（正则、集成、加数据）；两者都高 → 数据问题（标签噪声、特征缺失）。<\/p>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
