ass='path-list'><li class='path-step' id='path-01'><strong>步骤 01：地图与坐标<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：绪论<\/a>、<a href=\"#/chapter/ch02\">第 2 章：智能体<\/a><br>检查点：用 PEAS 描述一个你熟悉的 AI 产品<\/li><li class='path-step' id='path-02'><strong>步骤 02：确定环境下的求解<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：通过搜索进行问题求解<\/a>、<a href=\"#/chapter/ch04\">第 4 章：复杂环境中的搜索<\/a>、<a href=\"#/chapter/ch05\">第 5 章：对抗搜索和博弈<\/a>、<a href=\"#/chapter/ch06\">第 6 章：约束满足问题<\/a><br>检查点：手跑一次 A*，手算一次 α-β 剪枝<\/li><li class='path-step' id='path-03'><strong>步骤 03：符号知识与规划<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：逻辑智能体<\/a>、<a href=\"#/chapter/ch08\">第 8 章：一阶逻辑<\/a>、<a href=\"#/chapter/ch09\">第 9 章：一阶逻辑中的推断<\/a>、<a href=\"#/chapter/ch10\">第 10 章：知识表示<\/a>、<a href=\"#/chapter/ch11\">第 11 章：自动规划<\/a><br>检查点：用归结证明一个简单蕴含<\/li><li class='path-step' id='path-04'><strong>步骤 04：不确定性<\/strong><br>阅读：<a href=\"#/chapter/ch12\">第 12 章：不确定性的量化<\/a>、<a href=\"#/chapter/ch13\">第 13 章：概率推理<\/a>、<a href=\"#/chapter/ch14\">第 14 章：时间上的概率推理<\/a>、<a href=\"#/chapter/ch15\">第 15 章：概率编程<\/a><br>检查点：手算一次贝叶斯后验与一次滤波更新<\/li><li class='path-step' id='path-05'><strong>步骤 05：决策<\/strong><br>阅读：<a href=\"#/chapter/ch16\">第 16 章：做简单决策<\/a>、<a href=\"#/chapter/ch17\">第 17 章：做复杂决策<\/a>、<a href=\"#/chapter/ch18\">第 18 章：多智能体决策<\/a><br>检查点：算一次信息价值，解释 POMDP 为何用信念<\/li><li class='path-step' id='path-06'><strong>步骤 06：从数据学习<\/strong><br>阅读：<a href=\"#/chapter/ch19\">第 19 章：样例学习<\/a>、<a href=\"#/chapter/ch20\">第 20 章：概率模型学习<\/a><br>检查点：手算一次信息增益与一次 EM 迭代<\/li><li class='path-step' id='path-07'><strong>步骤 07：深度学习<\/strong><br>阅读：<a href=\"#/chapter/ch21\">第 21 章：深度学习<\/a><br>检查点：手推两层网络的反向传播<\/li><li class='path-step' id='path-08'><strong>步骤 08：强化学习<\/strong><br>阅读：<a href=\"#/chapter/ch22\">第 22 章：强化学习<\/a><br>检查点：写出贝尔曼方程并说明三要素风险<\/li><li class='path-step' id='path-09'><strong>步骤 09：语言与视觉<\/strong><br>阅读：<a href=\"#/chapter/ch23\">第 23 章：自然语言处理<\/a>、<a href=\"#/chapter/ch24\">第 24 章：自然语言处理中的深度学习<\/a>、<a href=\"#/chapter/ch25\">第 25 章：计算机视觉<\/a><br>检查点：说明自注意力为何优于 RNN<\/li><li class='path-step' id='path-10'><strong>步骤 10：行动与反思<\/strong><br>阅读：<a href=\"#/chapter/ch26\">第 26 章：机器人学<\/a>、<a href=\"#/chapter/ch27\">第 27 章：人工智能的哲学、伦理和安全性<\/a>、<a href=\"#/chapter/ch28\">第 28 章：人工智能的未来<\/a><br>检查点：说出对齐问题的技术版本<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__quiz_ch01__": "<h1>测验：第 1 章：绪论<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 现代 AI 主流定义属于哪一格？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 像人思考<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 像人行动<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 理性思考<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 理性行动<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 两次 AI 寒冬的共同成因？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 算力过剩<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 承诺超出能力<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 数据不足<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 缺乏理论<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：智能体<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> PEAS 中的 E 指什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 执行器<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 环境<\/label><label class='quiz-opt'><input type='radio' name='q03' va  data-type='single'><p class='quiz-q'><b>Q2.<\/b> 算法偏见的首要来源？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q55' value='0'> 训练数据中的历史偏见<\/label><label class='quiz-opt'><input type='radio' name='q55' value='1'> 学习率太大<\/label><label class='quiz-opt'><input type='radio' name='q55' value='2'> 模型太大<\/label><label class='quiz-opt'><input type='radio' name='q55' value='3'> 显存不足<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch28__": "<h1>测验：第 28 章：人工智能的未来<\/h1><div class='quiz-item' data-qid='q56' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 判断 AI 宣称可信的标准不包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q56' value='0'> 训练测试分布是否一致<\/label><label class='quiz-opt'><input type='radio' name='q56' value='1'> 基线是否公平<\/label><label class='quiz-opt'><input type='radio' name='q56' value='2'> 参数量是否最大<\/label><label class='quiz-opt'><input type='radio' name='q56' value='3'> 失败案例是否公开<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='理性智能体'>理性智能体 — 在给定感知与目标下选择能最大化期望性能的动作的智能体。 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='性能度量'>性能度量 — 评价智能体行为好坏的外部标准。 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='感知序列'>感知序列 — 智能体从开始到当前收到的全部感知输入。 <span class=glossary-ref>（第 1 章：绪论）<\/span><\/li><li data-term='peas'>PEAS — 描述任务的四要素：性能度量、环境、执行器、传感器。 <span class=glossary-ref>（第 2 章：智能体）<\/span><\/li><li data-term='基于模型的反射智能体'>基于模型的反射智能体 — 维护内部状态以应对部分可观测环境的智能体。 <span class=glossary-ref>（第 2 章：智能体）<\/span><\/li><li data-term='效用函数'>效用函数 — 在多个目标冲突时衡量整体偏好程度的函数。 <span class=glossary-ref>（第 2 章：智能体）<\/span><\/li><li data-term='状态空间'>状态空间 — 由所有可达状态与转移构成的问题表示。 <span class=glossary-ref>（第 3 章：通过搜索进行问题求解）<\/span><\/li><li data-term='启发函数'>启发函数 — 估计从某节点到目标剩余代价的函数。 <span class=glossary-ref>（第 3 章：通过搜索进行问题求解）<\/span><\/li><li data-term='可采纳'>可采纳 — 启发函数从不高估真实剩余代价的性质。 <span class=glossary-ref>（第 3 章：通过搜索进行问题求解）<\/span><\/li><li data-term='a* 搜索'>A* 搜索 — 以 g+h 为优先级的最优启发式搜索算法。 <span class=glossary-ref>（第 3 章：通过搜索进行问题求解）<\/span><\/li><li data-term='局部搜索'>局部搜索 — 只保留当前状态、在邻居中改进的搜索方法。 <span class=glossary-ref>（第 4 章：复杂环境中的搜索）<\/span><\/li><li data-term='模拟退火'>模拟退火 — 按温度控制的概率接受劣解的随机搜索算法。 <span class=glossary-ref>（第 4 章：复杂环境中的搜索）<\/span><\/li><li data-term='在线搜索'>在线搜索 — 在执行过程中边行动边学习的搜索方式。 <span class=glossary-ref>（第 4 章：复杂环境中的搜索）<\/span><\/li><li data-term='极小化极大'>极小化极大 — 假设对手最优时选择最坏情况最优动作的搜索算法。 <span class=glossary-ref>（第 5 章：对抗搜索和博弈）<\/span><\/li><li data-term='α-β 剪枝'>α-β 剪枝 — 利用已确定边界剪掉不影响结果分支的优化。 <span class=glossary-ref>（第 5 章：对抗搜索和博弈）<\/span><\/li><li data-term='蒙特卡洛树搜索'>蒙特卡洛树搜索 — 用大量模拟与 UCB 选择构建博弈树的搜索方法。 <span class=glossary-ref>（第 5 章：对抗搜索和博弈）<\/span><\/li><li data-term='约束满足问题'>约束满足问题 — 由变量、值域与约束构成、求满足全部约束赋值的问题。 <span class=glossary-ref>（第 6 章：约束满足问题）<\/span><\/li><li data-term='弧相容'>弧相容 — 任何变量的取值都能在邻居中找到相容支持的性质。 <span class=glossary-ref>（第 6 章：约束满足问题）<\/span><\/li><li data-term='回溯搜索'>回溯搜索 — 逐步赋值、冲突则回退的搜索方法。 <span class=glossary-ref>（第 6 章：约束满足问题）<\/span><\/li><li data-term='蕴含'>蕴含 — 一个公式在所有满足前提的世界中都为真的关系。 <span class=glossary-ref>（第 7 章：逻辑智能体）<\/span><\/li><li data-term='归结'>归结 — 消去互补文字、从两个子句推出新子句的推理规则。 <span class=glossary-ref>（第 7 章：逻辑智能体）<\/span><\/li><li data-term='可靠性'>可靠性 — 推理规则只推出真结论的性质。 <span class=glossary-ref>（第 7 章：逻辑智能体）<\/span><\/li><li data-term='完备性'>完备性 — 能推出所有被蕴含结论的性质。 <span class=glossary-ref>（第 7 章：逻辑智能体）<\/span><\/li><li data-term='一阶逻辑'>一阶逻辑 — 引入对象、谓词与量词、能表达关系的逻辑系统。 <span class=glossary-ref>（第 8 章：一阶逻辑）<\/span><\/li><li data-term='量词'>量词 — 表示“所有”或“存在”的符号 ∀ 与 ∃。 <span class=glossary-ref>（第 8 章：一阶逻辑）<\/span><\/li><li data-term='合一'>合一 — 寻找替换使两个表达式相同的算法。 <span class=glossary-ref>（第 8 章：一阶逻辑）<\/span><\/li><li data-term='前向链接'>前向链接 — 从已知事实出发推出新事实的数据驱动推理。 <span class=glossary-ref>（第 9 章：一阶逻辑中的推断）<\/span><\/li><li data-term='反向链接'>反向链接 — 从目标出发寻找规则前提的目标驱动推理。 <span class=glossary-ref>（第 9 章：一阶逻辑中的推断）<\/span><\/li><li data-term='horn 子句'>Horn 子句 — 最多含一个正文字的子句，推理效率高。 <span class=glossary-ref>（第 9 章：一阶逻辑中的推断）<\/span><\/li><li data-term='本体论'>本体论 — 关于世界由哪些类别构成及其关系的约定体系。 <span class=glossary-ref>（第 10 章：知识表示）<\/span><\/li><li data-term='默认推理'>默认推理 — 无相反证据时接受默认结论、可被新信息撤回的推理。 <span class=glossary-ref>（第 10 章：知识表示）<\/span><\/li><li data-term='描述逻辑'>描述逻辑 — 表达力受限但推理可判定的逻辑片段。 <span class=glossary-ref>（第 10 章：知识表示）<\/span><\/li><li data-term='strips'>STRIPS — 用前提与添加/删除列表表示动作的规划语言。 <span class=glossary-ref>（第 11 章：自动规划）<\/span><\/li><li data-term='松弛问题'>松弛问题 — 去掉部分约束使问题变易、用于生成启发式的问题。 <span class=glossary-ref>（第 11 章：自动规划）<\/span><\/li><li data-term='分层规划'>分层规划 — 在抽象层与具体层分别规划再细化的方法。 <span class=glossary-ref>（第 11 章：自动规划）<\/span><\/li><li data-term='条件概率'>条件概率 — 在给定事件发生时另一事件的概率。 <span class=glossary-ref>（第 12 章：不确定性的量化）<\/span><\/li><li data-term='贝叶斯公式'>贝叶斯公式 — 用似然与先验计算后验的公式。 <span class=glossary-ref>（第 12 章：不确定性的量化）<\/span><\/li><li data-term='条件独立'>条件独立 — 给定某变量后两变量联合概率等于边缘概率乘积。 <span class=glossary-ref>（第 12 章：不确定性的量化）<\/span><\/li><li data-term='贝叶斯网'>贝叶斯网 — 用有向无环图与条件概率表表示联合分布的概率模型。 <span class=glossary-ref>（第 13 章：概率推理）<\/span><\/li><li data-term='变量消去'>变量消去 — 按顺序对变量求和、复用中间因子的精确推理算法。 <span class=glossary-ref>（第 13 章：概率推理）<\/span><\/li><li data-term='似然加权'>似然加权 — 按证据固定、按先验采样并用权重修正的近似推理方法。 <span class=glossary-ref>（第 13 章：概率推理）<\/span><\/li><li data-term='滤波'>滤波 — 根据至今证据估计当前状态后验的推理任务。 <span class=glossary-ref>（第 14 章：时间上的概率推理）<\/span><\/li><li data-term='卡尔曼滤波'>卡尔曼滤波 — 在线性高斯假设下递归更新均值与协方差的滤波算法。 <span class=glossary-ref>（第 14 章：时间上的概率推理）<\/span><\/li><li data-term='粒子滤波'>粒子滤波 — 用加权样本近似后验的非参数滤波方法。 <span class=glossary-ref>（第 14 章：时间上的概率推理）<\/span><\/li><li data-term='概率编程'>概率编程 — 用程序写生成过程、由后端自动推断的概率建模方式。 <span class=glossary-ref>（第 15 章：概率编程）<\/span><\/li><li data-term='变分推断'>变分推断 — 用可优化的简单分布逼近后验的推断方法。 <span class=glossary-ref>（第 15 章：概率编程）<\/span><\/li><li data-term='mcmc'>MCMC — 通过长期采样逼近后验分布的推断方法。 <span class=glossary-ref>（第 15 章：概率编程）<\/span><\/li><li data-term='期望效用'>期望效用 — 在信念分布下某动作带来的效用期望值。 <span class=glossary-ref>（第 16 章：做简单决策）<\/span><\/li><li data-term='效用函数'>效用函数 — 把结果状态映射为偏好程度的函数。 <span class=glossary-ref>（第 16 章：做简单决策）<\/span><\/li><li data-term='信息价值'>信息价值 — 获得某信息后决策改善的期望幅度。 <span class=glossary-ref>（第 16 章：做简单决策）<\/span><\/li><li data-term='pomdp'>POMDP — 部分可观测马尔可夫决策过程，需在信念空间上决策。 <span class=glossary-ref>（第 17 章：做复杂决策）<\/span><\/li><li data-term='信念状态'>信念状态 — 对当前世界状态的概率分布估计。 <span class=glossary-ref>（第 17 章：做复杂决策）<\/span><\/li><li data-term='风险敏感决策'>风险敏感决策 — 考虑收益分布尾部而非仅期望的决策方式。 <span class=glossary-ref>（第 17 章：做复杂决策）<\/span><\/li><li data-term='纳什均衡'>纳什均衡 — 无人能通过单方改变策略获益的策略组合。 <span class=glossary-ref>（第 18 章：多智能体决策）<\/span><\/li><li data-term='零和博弈'>零和博弈 — 一方收益等于另一方损失的博弈。 <span class=glossary-ref>（第 18 章：多智能体决策）<\/span><\/li><li data-term='机制设计'>机制设计 — 设计规则使自利行为产生良好集体结果的方法。 <span class=glossary-ref>（第 18 章：多智能体决策）<\/span><\/li><li data-term='监督学习'>监督学习 — 从带标签的输入输出对学习映射的方法。 <span class=glossary-ref>（第 19 章：样例学习）<\/span><\/li><li data-term='信息增益'>信息增益 — 分裂前后熵的减少量。 <span class=glossary-ref>（第 19 章：样例学习）<\/span><\/li><li data-term='归纳偏置'>归纳偏置 — 学习器为泛化而预设的偏好假设。 <span class=glossary-ref>（第 19 章：样例学习）<\/span><\/li><li data-term='过拟合'>过拟合 — 模型拟合训练数据噪声、泛化变差的现象。 <span class=glossary-ref>（第 19 章：样例学习）<\/span><\/li><li data-term='最大似然估计'>最大似然估计 — 使观测数据出现概率最大的参数估计。 <span class=glossary-ref>（第 20 章：概率模型学习）<\/span><\/li><li data-term='最大后验估计'>最大后验估计 — 在参数先验下使后验最大的参数估计。 <span class=glossary-ref>（第 20 章：概率模型学习）<\/span><\/li><li data-term='em 算法'>EM 算法 — 在含隐变量时交替求后验与更新参数的迭代算法。 <span class=glossary-ref>（第 20 章：概率模型学习）<\/span><\/li><li data-term='反向传播'>反向传播 — 用链式法则从输出向输入逐层计算梯度的算法。 <span class=glossary-ref>（第 21 章：深度学习）<\/span><\/li><li data-term='卷积'>卷积 — 用共享卷积核在空间上滑动提取局部特征的运算。 <span class=glossary-ref>（第 21 章：深度学习）<\/span><\/li><li data-term='注意力机制'>注意力机制 — 按查询与键的相似度对值加权聚合的机制。 <span class=glossary-ref>（第 21 章：深度学习）<\/span><\/li><li data-term='梯度消失'>梯度消失 — 深层网络中梯度逐层衰减导致浅层难以训练的现象。 <span class=glossary-ref>（第 21 章：深度学习）<\/span><\/li><li data-term='马尔可夫决策过程'>马尔可夫决策过程 — 用状态、动作、转移与奖励刻画序贯决策的框架。 <span class=glossary-ref>（第 22 章：强化学习）<\/span><\/li><li data-term='贝尔曼方程'>贝尔曼方程 — 把价值函数写成即时奖励与后继价值折扣和的递归关系。 <span class=glossary-ref>（第 22 章：强化学习）<\/span><\/li><li data-term='探索与利用'>探索与利用 — 尝试未知动作与选择已知最优动作之间的权衡。 <span class=glossary-ref>（第 22 章：强化学习）<\/span><\/li><li data-term='语言模型'>语言模型 — 估计词序列概率分布的模型。 <span class=glossary-ref>（第 23 章：自然语言处理）<\/span><\/li><li data-term='n-gram'>n-gram — 只依赖前 n-1 个词的简化语言模型。 <span class=glossary-ref>（第 23 章：自然语言处理）<\/span><\/li><li data-term='词向量'>词向量 — 把词映射为低维连续向量的表示。 <span class=glossary-ref>（第 23 章：自然语言处理）<\/span><\/li><li data-term='循环神经网络'>循环神经网络 — 用隐状态沿时间传递信息的序列模型。 <span class=glossary-ref>（第 24 章：自然语言处理中的深度学习）<\/span><\/li><li data-term='长短期记忆'>长短期记忆 — 用门控与加性细胞状态缓解长依赖的 RNN 变体。 <span class=glossary-ref>（第 24 章：自然语言处理中的深度学习）<\/span><\/li><li data-term='自注意力'>自注意力 — 序列内部各位置互相关注的注意力形式。 <span class=glossary-ref>（第 24 章：自然语言处理中的深度学习）<\/span><\/li><li data-term='语义分割'>语义分割 — 为每个像素分配类别标签的视觉任务。 <span class=glossary-ref>（第 25 章：计算机视觉）<\/span><\/li><li data-term='数据增广'>数据增广 — 通过对训练样本做变换来扩充数据分布的方法。 <span class=glossary-ref>（第 25 章：计算机视觉）<\/span><\/li><li data-term='平移等变性'>平移等变性 — 输入平移时输出相应平移的性质。 <span class=glossary-ref>（第 25 章：计算机视觉）<\/span><\/li><li data-term='slam'>SLAM — 同时估计机器人位姿与环境地图的问题。 <span class=glossary-ref>（第 26 章：机器人学）<\/span><\/li><li data-term='配置空间'>配置空间 — 由机器人所有自由度构成的抽象空间。 <span class=glossary-ref>（第 26 章：机器人学）<\/span><\/li><li data-term='阻抗控制'>阻抗控制 — 控制末端与环境之间力与位移关系的控制方式。 <span class=glossary-ref>（第 26 章：机器人学）<\/span><\/li><li data-term='强人工智能'>强人工智能 — 拥有真正心智而非仅表现智能行为的人工系统。 <span class=glossary-ref>（第 27 章：人工智能的哲学、伦理和安全性）<\/span><\/li><li data-term='对齐问题'>对齐问题 — 使系统目标与人类真实意图一致的问题。 <span class=glossary-ref>（第 27 章：人工智能的哲学、伦理和安全性）<\/span><\/li><li data-term='算法偏见'>算法偏见 — 模型因数据或设计产生的系统性不公正输出。 <span class=glossary-ref>（第 27 章：人工智能的哲学、伦理和安全性）<\/span><\/li><li data-term='分布外泛化'>分布外泛化 — 在训练分布之外的数据上仍保持性能的能力。 <span class=glossary-ref>（第 28 章：人工智能的未来）<\/span><\/li><li data-term='具身智能'>具身智能 — 通过物理交互获取知识与技能的智能形态。 <span class=glossary-ref>（第 28 章：人工智能的未来）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：问题—表示—算法—边界<\/h2>\n<p>AIMA 每一章都按同一个结构展开：先定义问题（输入输出、约束），再选表示（状态空间、逻辑公式、概率分布、神经网络），再给算法，最后讨论边界（复杂度、假设失效条件）。读任何一章都先找这四块，比记算法细节有用。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n环境确定 + 可观测 → 搜索与规划。\n<\/li><li>\n环境随机 + 完全可观测 → MDP 与概率推理。\n<\/li><li>\n环境部分可观测 → 信念空间（POMDP）或滤波。\n<\/li><li>\n知识完备且要求严格 → 逻辑方法。\n<\/li><li>\n知识不完备、有数据 → 统计学习。\n<\/li><li>\n有延迟奖励、需交互 → 强化学习。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>用逻辑硬表示不确定知识<\/strong>：会导致规则冲突或需要无穷例外。\n<\/li><li>\n<strong>在数据量不足时上大模型<\/strong>：不如先做特征工程与小模型。\n<\/li><li>\n<strong>只看基准分数<\/strong>：分布外表现与失败案例才是关键。\n<\/li><li>\n<strong>承诺超出能力<\/strong>：历史上每一次 AI 寒冬都源于此。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>核心公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>A* 评价<\/td><td>f(n)=g(n)+h(n)<\/td><\/tr><tr><td>Minimax<\/td><td>自己 max，对手 min<\/td><\/tr><tr><td>贝叶斯<\/td><td>P(a<\/td><td>b)=P(b<\/td><td>a)P(a)/P(b)<\/td><\/tr><tr><td>贝叶斯网<\/td><td>P(X)=ΠP(Xi<\/td><td>Parents(Xi))<\/td><\/tr><tr><td>滤波预测<\/td><td>Σ P(X&#x27;<\/td><td>x)P(x<\/td><td>e)<\/td><\/tr><tr><td>期望效用<\/td><td>EU(a)=ΣP(s<\/td><td>e)U(s)<\/td><\/tr><tr><td>信息增益<\/td><td>H(parent)-Σ(n_i/n)H(child_i)<\/td><\/tr><tr><td>贝尔曼<\/td><td>v(s)=Σπ(a<\/td><td>s)Σp[r+γv(s&#x27;)]<\/td><\/tr><tr><td>反向传播<\/td><td>∂L/∂w=∂L/∂y·∂y/∂w<\/td><\/tr><tr><td>注意力<\/td><td>softmax(QKᵀ/√d_k)V<\/td><\/tr><\/tbody><\/table>\n<h2>章节—方法对照<\/h2>\n<table><thead><tr><th>问题类型<\/th><th>章节<\/th><th>方法<\/th><\/tr><\/thead><tbody><tr><td>找路径<\/td><td>3、4<\/td><td>BFS/DFS/A*/局部搜索<\/td><\/tr><tr><td>对抗决策<\/td><td>5<\/td><td>Minimax、MCTS<\/td><\/tr><tr><td>满足约束<\/td><td>6<\/td><td>回溯 + 约束传播<\/td><\/tr><tr><td>形式推理<\/td><td>7—9<\/td><td>归结、前向/反向链接<\/td><\/tr><tr><td>不确定推理<\/td><td>12—15<\/td><td>贝叶斯网、滤波、采样<\/td><\/tr><tr><td>决策<\/td><td>16—18<\/td><td>期望效用、MDP、博弈<\/td><\/tr><tr><td>从数据学<\/td><td>19—21<\/td><td>决策树、EM、神经网络<\/td><\/tr><tr><td>交互学习<\/td><td>22<\/td><td>强化学习<\/td><\/tr><\/tbody><\/table>\n<h2>五本书对照<\/h2>\n<table><thead><tr><th>本书主题<\/th><th>深挖的书<\/th><\/tr><\/thead><tbody><tr><td>第 19—20 章 学习<\/td><td>《机器学习》<\/td><\/tr><tr><td>第 21 章 深度学习<\/td><td>《深度学习入门》《动手学深度学习》<\/td><\/tr><tr><td>第 22 章 强化学习<\/td><td>《强化学习（Sutton）》<\/td><\/tr><tr><td>第 23—25 章 语言与视觉<\/td><td>《动手学深度学习》<\/td><\/tr><\/tbody><\/table>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
