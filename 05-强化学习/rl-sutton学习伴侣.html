3.<\/b> 目标网络稳定训练的原理？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q31' value='0'> 用滞后参数算目标<\/label><label class='quiz-opt'><input type='radio' name='q31' value='1'> 加快学习率<\/label><label class='quiz-opt'><input type='radio' name='q31' value='2'> 增加探索<\/label><label class='quiz-opt'><input type='radio' name='q31' value='3'> 减少状态<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch11__": "<h1>测验：第 11 章：基于函数逼近的离轨策略方法<\/h1><div class='quiz-item' data-qid='q32' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 离轨学习的核心问题？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q32' value='0'> 计算太慢<\/label><label class='quiz-opt'><input type='radio' name='q32' value='1'> 数据分布与目标策略不匹配<\/label><label class='quiz-opt'><input type='radio' name='q32' value='2'> 需要模型<\/label><label class='quiz-opt'><input type='radio' name='q32' value='3'> 无法探索<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q33' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 重要性采样比率方差随长度如何变化？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q33' value='0'> 减小<\/label><label class='quiz-opt'><input type='radio' name='q33' value='1'> 不变<\/label><label class='quiz-opt'><input type='radio' name='q33' value='2'> 迅速增大<\/label><label class='quiz-opt'><input type='radio' name='q33' value='3'> 先增后减<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q34' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 致命三要素是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q34' value='0'> 逼近、自举、离轨<\/label><label class='quiz-opt'><input type='radio' name='q34' value='1'> 探索、奖励、策略<\/label><label class='quiz-opt'><input type='radio' name='q34' value='2'> 学习率、折扣、批大小<\/label><label class='quiz-opt'><input type='radio' name='q34' value='3'> 状态、动作、奖励<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch12__": "<h1>测验：第 12 章：资格迹<\/h1><div class='quiz-item' data-qid='q35' data-type='single'><p class='quiz-q'><b>Q1.<\/b> λ=0 的 λ 回报等价于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q35' value='0'> TD(0)<\/label><label class='quiz-opt'><input type='radio' name='q35' value='1'> MC<\/label><label class='quiz-opt'><input type='radio' name='q35' value='2'> 动态规划<\/label><label class='quiz-opt'><input type='radio' name='q35' value='3'> 树回溯<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q36' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 资格迹的作用？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q36' value='0'> 加速探索<\/label><label class='quiz-opt'><input type='radio' name='q36' value='1'> 记录信用并反向分配<\/label><label class='quiz-opt'><input type='radio' name='q36' value='2'> 减少状态数<\/label><label class='quiz-opt'><input type='radio' name='q36' value='3'> 替代模型<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q37' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 替换迹相对累积迹的优势？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q37' value='0'> 计算更快<\/label><label class='quiz-opt'><input type='radio' name='q37' value='1'> 内存更小<\/label><label class='quiz-opt'><input type='radio' name='q37' value='2'> 避免重复访问过度更新<\/label><label class='quiz-opt'><input type='radio' name='q37' value='3'> 不需要 λ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch13__": "<h1>测验：第 13 章：策略梯度方法<\/h1><div class='quiz-item' data-qid='q38' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 策略梯度定理不需要模型的关键？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q38' value='0'> 用了神经网络<\/label><label class='quiz-opt'><input type='radio' name='q38' value='1'> 状态分布导数项被消去<\/label><label class='quiz-opt'><input type='radio' name='q38' value='2'> 用了采样<\/label><label class='quiz-opt'><input type='radio' name='q38' value='3'> 用了基线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q39' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 减去基线后期望与方差如何变化？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q39' value='0'> 期望不变方差降低<\/label><label class='quiz-opt'><input type='radio' name='q39' value='1'> 期望变大<\/label><label class='quiz-opt'><input type='radio' name='q39' value='2'> 期望变小<\/label><label class='quiz-opt'><input type='radio' name='q39' value='3'> 方差变大<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q40' data-type='single'><p class='quiz-q'><b>Q3.<\/b> Actor-Critic 中 critic 的作用？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q40' value='0'> 选动作<\/label><label class='quiz-opt'><input type='radio' name='q40' value='1'> 探索<\/label><label class='quiz-opt'><input type='radio' name='q40' value='2'> 提供价值与优势估计<\/label><label class='quiz-opt'><input type='radio' name='q40' value='3'> 存储经验<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch14__": "<h1>测验：第 14 章：心理学<\/h1><div class='quiz-item' data-qid='q41' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 强化学习最接近哪类条件反射？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q41' value='0'> 经典条件反射<\/label><label class='quiz-opt'><input type='radio' name='q41' value='1'> 操作性条件反射<\/label><label class='quiz-opt'><input type='radio' name='q41' value='2'> 观察学习<\/label><label class='quiz-opt'><input type='radio' name='q41' value='3'> 顿悟<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch15__": "<h1>测验：第 15 章：神经科学<\/h1><div class='quiz-item' data-qid='q42' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 多巴胺信号最接近哪个量？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q42' value='0'> 累积奖励<\/label><label class='quiz-opt'><input type='radio' name='q42' value='1'> TD 误差<\/label><label class='quiz-opt'><input type='radio' name='q42' value='2'> 学习率<\/label><label class='quiz-opt'><input type='radio' name='q42' value='3'> 折扣因子<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch16__": "<h1>测验：第 16 章：应用及案例分析<\/h1><div class='quiz-item' data-qid='q43' data-type='single'><p class='quiz-q'><b>Q1.<\/b> TD-Gammon 用 TD(λ) 而非 MC 的主因？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q43' value='0'> TD 更准<\/label><label class='quiz-opt'><input type='radio' name='q43' value='1'> 样本效率更高<\/label><label class='quiz-opt'><input type='radio' name='q43' value='2'> MC 不能用于棋类<\/label><label class='quiz-opt'><input type='radio' name='q43' value='3'> TD 不需要探索<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q44' data-type='single'><p class='quiz-q'><b>Q2.<\/b> AlphaGo 价值网络的作用？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q44' value='0'> 生成棋谱<\/label><label class='quiz-opt'><input type='radio' name='q44' value='1'> 缩小搜索宽度<\/label><label class='quiz-opt'><input type='radio' name='q44' value='2'> 评估局面减少搜索深度<\/label><label class='quiz-opt'><input type='radio' name='q44' value='3'> 存储经验<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch17__": "<h1>测验：第 17 章：前沿技术<\/h1><div class='quiz-item' data-qid='q45' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 经验回放的主要作用？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q45' value='0'> 增加探索<\/label><label class='quiz-opt'><input type='radio' name='q45' value='1'> 打破样本时间相关性<\/label><label class='quiz-opt'><input type='radio' name='q45' value='2'> 减少内存<\/label><label class='quiz-opt'><input type='radio' name='q45' value='3'> 替代目标网络<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q46' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 稀疏奖励下最直接的困难？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q46' value='0'> 计算太慢<\/label><label class='quiz-opt'><input type='radio' name='q46' value='1'> 内存不够<\/label><label class='quiz-opt'><input type='radio' name='q46' value='2'> 探索效率极低<\/label><label class='quiz-opt'><input type='radio' name='q46' value='3'> 无法并行<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='策略'>策略 — 在每个状态下选择动作的规则或概率分布。 <span class=glossary-ref>（第 1 章：导论）<\/span><\/li><li data-term='价值函数'>价值函数 — 从某状态或状态动作对出发的长期累积奖励期望。 <span class=glossary-ref>（第 1 章：导论）<\/span><\/li><li data-term='自举'>自举 — 用当前的估计值去更新另一个估计值，而不等真实回报。 <span class=glossary-ref>（第 1 章：导论）<\/span><\/li><li data-term='强化学习'>强化学习 — 在延迟奖励与自产数据下学习决策的范式。 <span class=glossary-ref>（第 1 章：导论）<\/span><\/li><li data-term='动作价值'>动作价值 — 选择某个动作的期望即时奖励。 <span class=glossary-ref>（第 2 章：多臂赌博机）<\/span><\/li><li data-term='ε-贪心'>ε-贪心 — 以 ε 概率随机探索、否则贪心选择的策略。 <span class=glossary-ref>（第 2 章：多臂赌博机）<\/span><\/li><li data-term='ucb'>UCB — 按价值加不确定性奖励选择动作的探索算法。 <span class=glossary-ref>（第 2 章：多臂赌博机）<\/span><\/li><li data-term='乐观初始值'>乐观初始值 — 把价值初值设得偏高以驱动早期探索的技巧。 <span class=glossary-ref>（第 2 章：多臂赌博机）<\/span><\/li><li data-term='关联搜索'>关联搜索 — 带状态、不同状态下最优动作不同的赌博机式任务。 <span class=glossary-ref>（第 2 章：多臂赌博机）<\/span><\/li><li data-term='马尔可夫决策过程'>马尔可夫决策过程 — 由状态、动作、转移概率、奖励构成的决策问题形式化。 <span class=glossary-ref>（第 3 章：有限马尔可夫决策过程）<\/span><\/li><li data-term='回报'>回报 — 从某时刻起折扣累积的奖励总和。 <span class=glossary-ref>（第 3 章：有限马尔可夫决策过程）<\/span><\/li><li data-term='折扣因子'>折扣因子 — 控制未来奖励权重的系数 γ。 <span class=glossary-ref>（第 3 章：有限马尔可夫决策过程）<\/span><\/li><li data-term='贝尔曼方程'>贝尔曼方程 — 把价值函数写成即时奖励与后继价值折扣和的关系式。 <span class=glossary-ref>（第 3 章：有限马尔可夫决策过程）<\/span><\/li><li data-term='最优价值函数'>最优价值函数 — 在所有策略中能达到的最大状态价值。 <span class=glossary-ref>（第 3 章：有限马尔可夫决策过程）<\/span><\/li><li data-term='策略评估'>策略评估 — 在给定策略下迭代计算其状态价值函数。 <span class=glossary-ref>（第 4 章：动态规划）<\/span><\/li><li data-term='策略迭代'>策略迭代 — 交替做策略评估与策略改进直到策略稳定。 <span class=glossary-ref>（第 4 章：动态规划）<\/span><\/li><li data-term='价值迭代'>价值迭代 — 把评估压缩为一步、直接迭代最优价值函数的算法。 <span class=glossary-ref>（第 4 章：动态规划）<\/span><\/li><li data-term='广义策略迭代'>广义策略迭代 — 评估与改进任意粒度交替的通用框架。 <span class=glossary-ref>（第 4 章：动态规划）<\/span><\/li><li data-term='蒙特卡洛方法'>蒙特卡洛方法 — 用完整一幕的实际回报估计价值的无模型方法。 <span class=glossary-ref>（第 5 章：蒙特卡洛方法）<\/span><\/li><li data-term='首次访问'>首次访问 — 每幕只在该状态首次出现时更新一次估计。 <span class=glossary-ref>（第 5 章：蒙特卡洛方法）<\/span><\/li><li data-term='重要性采样'>重要性采样 — 用比率修正不同分布下样本权重的方法。 <span class=glossary-ref>（第 5 章：蒙特卡洛方法）<\/span><\/li><li data-term='离轨策略'>离轨策略 — 评估或改进的策略与产生数据的策略不同。 <span class=glossary-ref>（第 5 章：蒙特卡洛方法）<\/span><\/li><li data-term='时序差分'>时序差分 — 用一步奖励加下一状态估计更新价值的自举方法。 <span class=glossary-ref>（第 6 章：时序差分学习）<\/span><\/li><li data-term='td 误差'>TD 误差 — 一步目标估计与当前估计之差。 <span class=glossary-ref>（第 6 章：时序差分学习）<\/span><\/li><li data-term='sarsa'>Sarsa — 用实际下一动作价值更新的同轨 TD 控制算法。 <span class=glossary-ref>（第 6 章：时序差分学习）<\/span><\/li><li data-term='q-learning'>Q-learning — 用下一状态最大动作价值更新的离轨 TD 控制算法。 <span class=glossary-ref>（第 6 章：时序差分学习）<\/span><\/li><li data-term='最大化偏差'>最大化偏差 — max 运算系统性高估带噪声价值的现象。 <span class=glossary-ref>（第 6 章：时序差分学习）<\/span><\/li><li data-term='n 步回报'>n 步回报 — 前 n 步用真实奖励、末端用估计收尾的回报。 <span class=glossary-ref>（第 7 章：n 步自举法）<\/span><\/li><li data-term='树回溯'>树回溯 — 对分支按策略概率展开加权、避免重要性采样的 n 步方法。 <span class=glossary-ref>（第 7 章：n 步自举法）<\/span><\/li><li data-term='模型'>模型 — 对环境转移与奖励分布的估计或采样器。 <span class=glossary-ref>（第 8 章：基于表格型方法的规划和学习）<\/span><\/li><li data-term='规划'>规划 — 用模型生成的模拟经验更新价值函数。 <span class=glossary-ref>（第 8 章：基于表格型方法的规划和学习）<\/span><\/li><li data-term='dyna'>Dyna — 结合直接强化学习、模型学习与规划的统一架构。 <span class=glossary-ref>（第 8 章：基于表格型方法的规划和学习）<\/span><\/li><li data-term='优先级扫描'>优先级扫描 — 按 TD 误差大小优先更新状态的规划方法。 <span class=glossary-ref>（第 8 章：基于表格型方法的规划和学习）<\/span><\/li><li data-term='函数逼近'>函数逼近 — 用参数化函数近似价值函数以避免枚举所有状态。 <span class=glossary-ref>（第 9 章：基于函数逼近的同轨策略预测）<\/span><\/li><li data-term='半梯度'>半梯度 — 把自举目标当作常数、只对当前估计求导的更新方式。 <span class=glossary-ref>（第 9 章：基于函数逼近的同轨策略预测）<\/span><\/li><li data-term='状态聚合'>状态聚合 — 把多个状态合并为一个单元共用同一价值。 <span class=glossary-ref>（第 9 章：基于函数逼近的同轨策略预测）<\/span><\/li><li data-term='粗编码'>粗编码 — 用多个重叠感受野表示状态以平滑泛化的编码方式。 <span class=glossary-ref>（第 9 章：基于函数逼近的同轨策略预测）<\/span><\/li><li data-term='半梯度 sarsa'>半梯度 Sarsa — 用函数逼近 q 并以半梯度方式更新的同轨控制算法。 <span class=glossary-ref>（第 10 章：基于函数逼近的同轨策略控制）<\/span><\/li><li data-term='平均收益'>平均收益 — 持续式任务中单位时间的期望奖励。 <span class=glossary-ref>（第 10 章：基于函数逼近的同轨策略控制）<\/span><\/li><li data-term='差分价值'>差分价值 — 相对平均收益定义的偏差累积价值。 <span class=glossary-ref>（第 10 章：基于函数逼近的同轨策略控制）<\/span><\/li><li data-term='目标网络'>目标网络 — 用滞后参数计算自举目标以稳定训练的机制。 <span class=glossary-ref>（第 10 章：基于函数逼近的同轨策略控制）<\/span><\/li><li data-term='离轨策略'>离轨策略 — 用与目标策略不同的行为策略采集数据。 <span class=glossary-ref>（第 11 章：基于函数逼近的离轨策略方法）<\/span><\/li><li data-term='重要性采样比率'>重要性采样比率 — 目标策略与行为策略动作概率的连乘比。 <span class=glossary-ref>（第 11 章：基于函数逼近的离轨策略方法）<\/span><\/li><li data-term='致命三要素'>致命三要素 — 函数逼近、自举、离轨同时存在导致发散风险的组合。 <span class=glossary-ref>（第 11 章：基于函数逼近的离轨策略方法）<\/span><\/li><li data-term='gtd'>GTD — 带梯度修正项、对离轨学习有收敛保证的算法族。 <span class=glossary-ref>（第 11 章：基于函数逼近的离轨策略方法）<\/span><\/li><li data-term='λ 回报'>λ 回报 — 所有权 n 步回报按 λ 几何加权的平均。 <span class=glossary-ref>（第 12 章：资格迹）<\/span><\/li><li data-term='资格迹'>资格迹 — 记录最近访问状态、用于回溯分配信用的短期记忆。 <span class=glossary-ref>（第 12 章：资格迹）<\/span><\/li><li data-term='替换迹'>替换迹 — 每次访问把迹置为该值而非累加的迹形式。 <span class=glossary-ref>（第 12 章：资格迹）<\/span><\/li><li data-term='td(λ)'>TD(λ) — 用资格迹统一 TD 与 MC 的时序差分算法族。 <span class=glossary-ref>（第 12 章：资格迹）<\/span><\/li><li data-term='策略梯度'>策略梯度 — 直接对策略参数求梯度以最大化期望回报的方法。 <span class=glossary-ref>（第 13 章：策略梯度方法）<\/span><\/li><li data-term='reinforce'>REINFORCE — 用整幕回报作为权重的蒙特卡洛策略梯度算法。 <span class=glossary-ref>（第 13 章：策略梯度方法）<\/span><\/li><li data-term='基线'>基线 — 与动作无关、用于降低策略梯度方差的状态函数。 <span class=glossary-ref>（第 13 章：策略梯度方法）<\/span><\/li><li data-term='actor-critic'>Actor-Critic — 策略网络与价值网络联合训练的结构。 <span class=glossary-ref>（第 13 章：策略梯度方法）<\/span><\/li><li data-term='操作性条件反射'>操作性条件反射 — 行为与其后果之间形成联结的学习过程。 <span class=glossary-ref>（第 14 章：心理学）<\/span><\/li><li data-term='次级强化物'>次级强化物 — 本身无强化作用、但因预测奖励而获得强化能力的刺激。 <span class=glossary-ref>（第 14 章：心理学）<\/span><\/li><li data-term='奖励预测误差'>奖励预测误差 — 实际奖励与预测奖励之差，对应 TD 误差。 <span class=glossary-ref>（第 15 章：神经科学）<\/span><\/li><li data-term='模型-free 决策'>模型-free 决策 — 不依赖环境模型、凭经验直接反应的习惯性决策。 <span class=glossary-ref>（第 15 章：神经科学）<\/span><\/li><li data-term='td-gammon'>TD-Gammon — 用 TD(λ) 与自我对弈训练价值网络的西洋双陆棋程序。 <span class=glossary-ref>（第 16 章：应用及案例分析）<\/span><\/li><li data-term='蒙特卡洛树搜索'>蒙特卡洛树搜索 — 用采样与价值估计在博弈树中分配访问次数的搜索算法。 <span class=glossary-ref>（第 16 章：应用及案例分析）<\/span><\/li><li data-term='经验回放'>经验回放 — 存储历史转移并随机采样以打破相关性的机制。 <span class=glossary-ref>（第 17 章：前沿技术）<\/span><\/li><li data-term='内在奖励'>内在奖励 — 由好奇心或计数等构造的、用于驱动探索的附加奖励。 <span class=glossary-ref>（第 17 章：前沿技术）<\/span><\/li><li data-term='元学习'>元学习 — 学习如何学习，使模型能快速适应新任务。 <span class=glossary-ref>（第 17 章：前沿技术）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：假设放松的四级阶梯<\/h2>\n<p>这本书的结构就是一条“逐步放松假设”的路：完全模型已知（DP）→ 只能采样（MC）→ 可在线自举（TD）→ 状态太多要逼近（函数逼近）→ 策略直接参数化（策略梯度）。每放松一级，就多一类稳定性问题。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n环境可模拟、状态少 → 动态规划或 Dyna。\n<\/li><li>\n只能采样、有终止 → MC 或 TD，优先 TD。\n<\/li><li>\n高风险场景 → Sarsa 类同轨方法更保守。\n<\/li><li>\n状态连续或巨大 → 函数逼近，线性优先，神经网络配目标网络。\n<\/li><li>\n动作连续 → 策略梯度或 actor-critic。\n<\/li><li>\n稀疏奖励 → 先设计内在奖励或课程，不要硬训。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>同时踩三要素还不做稳定化<\/strong>：函数逼近 + 自举 + 离轨，必然发散。\n<\/li><li>\n<strong>用 MC 处理无终止任务<\/strong>：回报不收敛，算法没有定义。\n<\/li><li>\n<strong>把奖励设计当小事<\/strong>：奖励写错会学出荒诞行为。\n<\/li><li>\n<strong>只看平均回报不看方差<\/strong>：高风险策略在仿真里好，在真实环境里崩。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>回报<\/td><td>G_t=R_{t+1}+γR_{t+2}+…<\/td><\/tr><tr><td>贝尔曼期望<\/td><td>v_π(s)=Σπ(a<\/td><td>s)Σp[r+γv_π(s&#x27;)]<\/td><\/tr><tr><td>贝尔曼最优<\/td><td>v_<em>(s)=max_aΣp[r+γv_<\/em>(s&#x27;)]<\/td><\/tr><tr><td>策略评估<\/td><td>V(s)←Σπ(a<\/td><td>s)Σp[r+γV(s&#x27;)]<\/td><\/tr><tr><td>价值迭代<\/td><td>V(s)←max_aΣp[r+γV(s&#x27;)]<\/td><\/tr><tr><td>TD(0)<\/td><td>V(S)←V(S)+α[R+γV(S&#x27;)-V(S)]<\/td><\/tr><tr><td>Sarsa<\/td><td>Q(S,A)←Q+α[R+γQ(S&#x27;,A&#x27;)-Q]<\/td><\/tr><tr><td>Q-learning<\/td><td>Q(S,A)←Q+α[R+γmax_aQ(S&#x27;,a)-Q]<\/td><\/tr><tr><td>n 步回报<\/td><td>G=R1+γR2+…+γ^{n-1}Rn+γ^nV(Sn)<\/td><\/tr><tr><td>半梯度 TD<\/td><td>w←w+αδ∇v(S;w)<\/td><\/tr><tr><td>策略梯度<\/td><td>∇J=E[Σ∇logπ(A<\/td><td>S)q(S,A)]<\/td><\/tr><tr><td>自注意力无关<\/td><td>—<\/td><\/tr><\/tbody><\/table>\n<h2>算法选择<\/h2>\n<table><thead><tr><th>条件<\/th><th>选择<\/th><\/tr><\/thead><tbody><tr><td>有模型、状态少<\/td><td>策略迭代 / 价值迭代<\/td><\/tr><tr><td>无模型、分幕<\/td><td>MC 控制 / TD 控制<\/td><\/tr><tr><td>无模型、在线<\/td><td>Sarsa / Q-learning<\/td><\/tr><tr><td>状态巨大<\/td><td>线性逼近或 DQN<\/td><\/tr><tr><td>连续动作<\/td><td>DDPG / PPO 类策略梯度<\/td><\/tr><\/tbody><\/table>\n<h2>排错顺序<\/h2>\n<p>回报不升 → 检查奖励尺度与折扣；价值不收敛 → 检查是否踩三要素；训练崩溃 → 检查步长、目标网络、特征归一化；探索不足 → 检查 ε 或内在奖励。<\/p>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
</body>
</html>
