el><label class='quiz-opt'><input type='radio' name='q31' value='1'> 加快学习率<\/label><label class='quiz-opt'><input type='radio' name='q31' value='2'> 增加探索<\/label><label class='quiz-opt'><input type='radio' name='q31' value='3'> 减少状态<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch11__": {"html": "<h1>测验：第 11 章：基于函数逼近的离轨策略方法<\/h1><div class='quiz-item' data-qid='q32' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 离轨学习的核心问题？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q32' value='0'> 计算太慢<\/label><label class='quiz-opt'><input type='radio' name='q32' value='1'> 数据分布与目标策略不匹配<\/label><label class='quiz-opt'><input type='radio' name='q32' value='2'> 需要模型<\/label><label class='quiz-opt'><input type='radio' name='q32' value='3'> 无法探索<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q33' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 重要性采样比率方差随长度如何变化？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q33' value='0'> 减小<\/label><label class='quiz-opt'><input type='radio' name='q33' value='1'> 不变<\/label><label class='quiz-opt'><input type='radio' name='q33' value='2'> 迅速增大<\/label><label class='quiz-opt'><input type='radio' name='q33' value='3'> 先增后减<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q34' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 致命三要素是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q34' value='0'> 逼近、自举、离轨<\/label><label class='quiz-opt'><input type='radio' name='q34' value='1'> 探索、奖励、策略<\/label><label class='quiz-opt'><input type='radio' name='q34' value='2'> 学习率、折扣、批大小<\/label><label class='quiz-opt'><input type='radio' name='q34' value='3'> 状态、动作、奖励<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch12__": {"html": "<h1>测验：第 12 章：资格迹<\/h1><div class='quiz-item' data-qid='q35' data-type='single'><p class='quiz-q'><b>Q1.<\/b> λ=0 的 λ 回报等价于？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q35' value='0'> TD(0)<\/label><label class='quiz-opt'><input type='radio' name='q35' value='1'> MC<\/label><label class='quiz-opt'><input type='radio' name='q35' value='2'> 动态规划<\/label><label class='quiz-opt'><input type='radio' name='q35' value='3'> 树回溯<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q36' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 资格迹的作用？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q36' value='0'> 加速探索<\/label><label class='quiz-opt'><input type='radio' name='q36' value='1'> 记录信用并反向分配<\/label><label class='quiz-opt'><input type='radio' name='q36' value='2'> 减少状态数<\/label><label class='quiz-opt'><input type='radio' name='q36' value='3'> 替代模型<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q37' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 替换迹相对累积迹的优势？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q37' value='0'> 计算更快<\/label><label class='quiz-opt'><input type='radio' name='q37' value='1'> 内存更小<\/label><label class='quiz-opt'><input type='radio' name='q37' value='2'> 避免重复访问过度更新<\/label><label class='quiz-opt'><input type='radio' name='q37' value='3'> 不需要 λ<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch13__": {"html": "<h1>测验：第 13 章：策略梯度方法<\/h1><div class='quiz-item' data-qid='q38' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 策略梯度定理不需要模型的关键？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q38' value='0'> 用了神经网络<\/label><label class='quiz-opt'><input type='radio' name='q38' value='1'> 状态分布导数项被消去<\/label><label class='quiz-opt'><input type='radio' name='q38' value='2'> 用了采样<\/label><label class='quiz-opt'><input type='radio' name='q38' value='3'> 用了基线<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q39' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 减去基线后期望与方差如何变化？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q39' value='0'> 期望不变方差降低<\/label><label class='quiz-opt'><input type='radio' name='q39' value='1'> 期望变大<\/label><label class='quiz-opt'><input type='radio' name='q39' value='2'> 期望变小<\/label><label class='quiz-opt'><input type='radio' name='q39' value='3'> 方差变大<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q40' data-type='single'><p class='quiz-q'><b>Q3.<\/b> Actor-Critic 中 critic 的作用？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q40' value='0'> 选动作<\/label><label class='quiz-opt'><input type='radio' name='q40' value='1'> 探索<\/label><label class='quiz-opt'><input type='radio' name='q40' value='2'> 提供价值与优势估计<\/label><label class='quiz-opt'><input type='radio' name='q40' value='3'> 存储经验<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch14__": {"html": "<h1>测验：第 14 章：心理学<\/h1><div class='quiz-item' data-qid='q41' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 强化学习最接近哪类条件反射？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q41' value='0'> 经典条件反射<\/label><label class='quiz-opt'><input type='radio' name='q41' value='1'> 操作性条件反射<\/label><label class='quiz-opt'><input type='radio' name='q41' value='2'> 观察学习<\/label><label class='quiz-opt'><input type='radio' name='q41' value='3'> 顿悟<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch15__": {"html": "<h1>测验：第 15 章：神经科学<\/h1><div class='quiz-item' data-qid='q42' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 多巴胺信号最接近哪个量？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q42' value='0'> 累积奖励<\/label><label class='quiz-opt'><input type='radio' name='q42' value='1'> TD 误差<\/label><label class='quiz-opt'><input type='radio' name='q42' value='2'> 学习率<\/label><label class='quiz-opt'><input type='radio' name='q42' value='3'> 折扣因子<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch16__": {"html": "<h1>测验：第 16 章：应用及案例分析<\/h1><div class='quiz-item' data-qid='q43' data-type='single'><p class='quiz-q'><b>Q1.<\/b> TD-Gammon 用 TD(λ) 而非 MC 的主因？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q43' value='0'> TD 更准<\/label><label class='quiz-opt'><input type='radio' name='q43' value='1'> 样本效率更高<\/label><label class='quiz-opt'><input type='radio' name='q43' value='2'> MC 不能用于棋类<\/label><label class='quiz-opt'><input type='radio' name='q43' value='3'> TD 不需要探索<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q44' data-type='single'><p class='quiz-q'><b>Q2.<\/b> AlphaGo 价值网络的作用？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q44' value='0'> 生成棋谱<\/label><label class='quiz-opt'><input type='radio' name='q44' value='1'> 缩小搜索宽度<\/label><label class='quiz-opt'><input type='radio' name='q44' value='2'> 评估局面减少搜索深度<\/label><label class='quiz-opt'><input type='radio' name='q44' value='3'> 存储经验<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch17__": {"html": "<h1>测验：第 17 章：前沿技术<\/h1><div class='quiz-item' data-qid='q45' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 经验回放的主要作用？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q45' value='0'> 增加探索<\/label><label class='quiz-opt'><input type='radio' name='q45' value='1'> 打破样本时间相关性<\/label><label class='quiz-opt'><input type='radio' name='q45' value='2'> 减少内存<\/label><label class='quiz-opt'><input type='radio' name='q45' value='3'> 替代目标网络<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q46' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 稀疏奖励下最直接的困难？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q46' value='0'> 计算太慢<\/label><label class='quiz-opt'><input type='radio' name='q46' value='1'> 内存不够<\/label><label class='quiz-opt'><input type='radio' name='q46' value='2'> 探索效率极低<\/label><label class='quiz-opt'><input type='radio' name='q46' value='3'> 无法并行<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__cards__": {"html": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "kind": "cards", "title": "抽认卡"}, "__glossary__": {"html": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='策略'>策略 — 在每个状态下选择动作的规则或概率分布。 <span class=glossary-ref>（第 1 章：导论）<\/span><\/li><li data-term='价值函数'>价值函数 — 从某状态或状态动作对出发的长期累积奖励期望。 <span class=glossary-ref>（第 1 章：导论）<\/span><\/li><li data-term='自举'>自举 — 用当前的估计值去更新另一个估计值，而不等真实回报。 <span class=glossary-ref>（第 1 章：导论）<\/span><\/li><li data-term='强化学习'>强化学习 — 在延迟奖励与自产数据下学习决策的范式。 <span class=glossary-ref>（第 1 章：导论）<\/span><\/li><li data-term='动作价值'>动作价值 — 选择某个动作的期望即时奖励。 <span class=glossary-ref>（第 2 章：多臂赌博机）<\/span><\/li><li data-term='ε-贪心'>ε-贪心 — 以 ε 概率随机探索、否则贪心选择的策略。 <span class=glossary-ref>（第 2 章：多臂赌博机）<\/span><\/li><li data-term='ucb'>UCB — 按价值加不确定性奖励选择动作的探索算法。 <span class=glossary-ref>（第 2 章：多臂赌博机）<\/span><\/li><li data-term='乐观初始值'>乐观初始值 — 把价值初值设得偏高以驱动早期探索的技巧。 <span class=glossary-ref>（第 2 章：多臂赌博机）<\/span><\/li><li data-term='关联搜索'>关联搜索 — 带状态、不同状态下最优动作不同的赌博机式任务。 <span class=glossary-ref>（第 2 章：多臂赌博机）<\/span><\/li><li data-term='马尔可夫决策过程'>马尔可夫决策过程 — 由状态、动作、转移概率、奖励构成的决策问题形式化。 <span class=glossary-ref>（第 3 章：有限马尔可夫决策过程）<\/span><\/li><li data-term='回报'>回报 — 从某时刻起折扣累积的奖励总和。 <span class=glossary-ref>（第 3 章：有限马尔可夫决策过程）<\/span><\/li><li data-term='折扣因子'>折扣因子 — 控制未来奖励权重的系数 γ。 <span class=glossary-ref>（第 3 章：有限马尔可夫决策过程）<\/span><\/li><li data-term='贝尔曼方程'>贝尔曼方程 — 把价值函数写成即时奖励与后继价值折扣和的关系式。 <span class=glossary-ref>（第 3 章：有限马尔可夫决策过程）<\/span><\/li><li data-term='最优价值函数'>最优价值函数 — 在所有策略中能达到的最大状态价值。 <span class=glossary-ref>（第 3 章：有限马尔可夫决策过程）<\/span><\/li><li data-term='策略评估'>策略评估 — 在给定策略下迭代计算其状态价值函数。 <span class=glossary-ref>（第 4 章：动态规划）<\/span><\/li><li data-term='策略迭代'>策略迭代 — 交替做策略评估与策略改进直到策略稳定。 <span class=glossary-ref>（第 4 章：动态规划）<\/span><\/li><li data-term='价值迭代'>价值迭代 — 把评估压缩为一步、直接迭代最优价值函数的算法。 <span class=glossary-ref>（第 4 章：动态规划）<\/span><\/li><li data-term='广义策略迭代'>广义策略迭代 — 评估与改进任意粒度交替的通用框架。 <span class=glossary-ref>（第 4 章：动态规划）<\/span><\/li><li data-term='蒙特卡洛方法'>蒙特卡洛方法 — 用完整一幕的实际回报估计价值的无模型方法。 <span class=glossary-ref>（第 5 章：蒙特卡洛方法）<\/span><\/li><li data-term='首次访问'>首次访问 — 每幕只在该状态首次出现时更新一次估计。 <span class=glossary-ref>（第 5 章：蒙特卡洛方法）<\/span><\/li><li data-term='重要性采样'>重要性采样 — 用比率修正不同分布下样本权重的方法。 <span class=glossary-ref>（第 5 章：蒙特卡洛方法）<\/span><\/li><li data-term='离轨策略'>离轨策略 — 评估或改进的策略与产生数据的策略不同。 <span class=glossary-ref>（第 5 章：蒙特卡洛方法）<\/span><\/li><li data-term='时序差分'>时序差分 — 用一步奖励加下一状态估计更新价值的自举方法。 <span class=glossary-ref>（第 6 章：时序差分学习）<\/span><\/li><li data-term='td 误差'>TD 误差 — 一步目标估计与当前估计之差。 <span class=glossary-ref>（第 6 章：时序差分学习）<\/span><\/li><li data-term='sarsa'>Sarsa — 用实际下一动作价值更新的同轨 TD 控制算法。 <span class=glossary-ref>（第 6 章：时序差分学习）<\/span><\/li><li data-term='q-learning'>Q-learning — 用下一状态最大动作价值更新的离轨 TD 控制算法。 <span class=glossary-ref>（第 6 章：时序差分学习）<\/span><\/li><li data-term='最大化偏差'>最大化偏差 — max 运算系统性高估带噪声价值的现象。 <span class=glossary-ref>（第 6 章：时序差分学习）<\/span><\/li><li data-term='n 步回报'>n 步回报 — 前 n 步用真实奖励、末端用估计收尾的回报。 <span class=glossary-ref>（第 7 章：n 步自举法）<\/span><\/li><li data-term='树回溯'>树回溯 — 对分支按策略概率展开加权、避免重要性采样的 n 步方法。 <span class=glossary-ref>（第 7 章：n 步自举法）<\/span><\/li><li data-term='模型'>模型 — 对环境转移与奖励分布的估计或采样器。 <span class=glossary-ref>（第 8 章：基于表格型方法的规划和学习）<\/span><\/li><li data-term='规划'>规划 — 用模型生成的模拟经验更新价值函数。 <span class=glossary-ref>（第 8 章：基于表格型方法的规划和学习）<\/span><\/li><li data-term='dyna'>Dyna — 结合直接强化学习、模型学习与规划的统一架构。 <span class=glossary-ref>（第 8 章：基于表格型方法的规划和学习）<\/span><\/li><li data-term='优先级扫描'>优先级扫描 — 按 TD 误差大小优先更新状态的规划方法。 <span class=glossary-ref>（第 8 章：基于表格型方法的规划和学习）<\/span><\/li><li data-term='函数逼近'>函数逼近 — 用参数化函数近似价值函数以避免枚举所有状态。 <span class=glossary-ref>（第 9 章：基于函数逼近的同轨策略预测）<\/span><\/li><li data-term='半梯度'>半梯度 — 把自举目标当作常数、只对当前估计求导的更新方式。 <span class=glossary-ref>（第 9 章：基于函数逼近的同轨策略预测）<\/span><\/li><li data-term='状态聚合'>状态聚合 — 把多个状态合并为一个单元共用同一价值。 <span class=glossary-ref>（第 9 章：基于函数逼近的同轨策略预测）<\/span><\/li><li data-term='粗编码'>粗编码 — 用多个重叠感受野表示状态以平滑泛化的编码方式。 <span class=glossary-ref>（第 9 章：基于函数逼近的同轨策略预测）<\/span><\/li><li data-term='半梯度 sarsa'>半梯度 Sarsa — 用函数逼近 q 并以半梯度方式更新的同轨控制算法。 <span class=glossary-ref>（第 10 章：基于函数逼近的同轨策略控制）<\/span><\/li><li data-term='平均收益'>平均收益 — 持续式任务中单位时间的期望奖励。 <span class=glossary-ref>（第 10 章：基于函数逼近的同轨策略控制）<\/span><\/li><li data-term='差分价值'>差分价值 — 相对平均收益定义的偏差累积价值。 <span class=glossary-ref>（第 10 章：基于函数逼近的同轨策略控制）<\/span><\/li><li data-term='目标网络'>目标网络 — 用滞后参数计算自举目标以稳定训练的机制。 <span class=glossary-ref>（第 10 章：基于函数逼近的同轨策略控制）<\/span><\/li><li data-term='离轨策略'>离轨策略 — 用与目标策略不同的行为策略采集数据。 <span class=glossary-ref>（第 11 章：基于函数逼近的离轨策略方法）<\/span><\/li><li data-term='重要性采样比率'>重要性采样比率 — 目标策略与行为策略动作概率的连乘比。 <span class=glossary-ref>（第 11 章：基于函数逼近的离轨策略方法）<\/span><\/li><li data-term='致命三要素'>致命三要素 — 函数逼近、自举、离轨同时存在导致发散风险的组合。 <span class=glossary-ref>（第 11 章：基于函数逼近的离轨策略方法）<\/span><\/li><li data-term='gtd'>GTD — 带梯度修正项、对离轨学习有收敛保证的算法族。 <span class=glossary-ref>（第 11 章：基于函数逼近的离轨策略方法）<\/span><\/li><li data-term='λ 回报'>λ 回报 — 所有权 n 步回报按 λ 几何加权的平均。 <span class=glossary-ref>（第 12 章：资格迹）<\/span><\/li><li data-term='资格迹'>资格迹 — 记录最近访问状态、用于回溯分配信用的短期记忆。 <span class=glossary-ref>（第 12 章：资格迹）<\/span><\/li><li data-term='替换迹'>替换迹 — 每次访问把迹置为该值而非累加的迹形式。 <span class=glossary-ref>（第 12 章：资格迹）<\/span><\/li><li data-term='td(λ)'>TD(λ) — 用资格迹统一 TD 与 MC 的时序差分算法族。 <span class=glossary-ref>（第 12 章：资格迹）<\/span><\/li><li data-term='策略梯度'>策略梯度 — 直接对策略参数求梯度以最大化期望回报的方法。 <span class=glossary-ref>（第 13 章：策略梯度方法）<\/span><\/li><li data-term='reinforce'>REINFORCE — 用整幕回报作为权重的蒙特卡洛策略梯度算法。 <span class=glossary-ref>（第 13 章：策略梯度方法）<\/span><\/li><li data-term='基线'>基线 — 与动作无关、用于降低策略梯度方差的状态函数。 <span class=glossary-ref>（第 13 章：策略梯度方法）<\/span><\/li><li data-term='actor-critic'>Actor-Critic — 策略网络与价值网络联合训练的结构。 <span class=glossary-ref>（第 13 章：策略梯度方法）<\/span><\/li><li data-term='操作性条件反射'>操作性条件反射 — 行为与其后果之间形成联结的学习过程。 <span class=glossary-ref>（第 14 章：心理学）<\/span><\/li><li data-term='次级强化物'>次级强化物 — 本身无强化作用、但因预测奖励而获得强化能力的刺激。 <span class=glossary-ref>（第 14 章：心理学）<\/span><\/li><li data-term='奖励预测误差'>奖励预测误差 — 实际奖励与预测奖励之差，对应 TD 误差。 <span class=glossary-ref>（第 15 章：神经科学）<\/span><\/li><li data-term='模型-free 决策'>模型-free 决策 — 不依赖环境模型、凭经验直接反应的习惯性决策。 <span class=glossary-ref>（第 15 章：神经科学）<\/span><\/li><li data-term='td-gammon'>TD-Gammon — 用 TD(λ) 与自我对弈训练价值网络的西洋双陆棋程序。 <span class=glossary-ref>（第 16 章：应用及案例分析）<\/span><\/li><li data-term='蒙特卡洛树搜索'>蒙特卡洛树搜索 — 用采样与价值估计在博弈树中分配访问次数的搜索算法。 <span class=glossary-ref>（第 16 章：应用及案例分析）<\/span><\/li><li data-term='经验回放'>经验回放 — 存储历史转移并随机采样以打破相关性的机制。 <span class=glossary-ref>（第 17 章：前沿技术）<\/span><\/li><li data-term='内在奖励'>内在奖励 — 由好奇心或计数等构造的、用于驱动探索的附加奖励。 <span class=glossary-ref>（第 17 章：前沿技术）<\/span><\/li><li data-term='元学习'>元学习 — 学习如何学习，使模型能快速适应新任务。 <span class=glossary-ref>（第 17 章：前沿技术）<\/span><\/li><\/ul>", "kind": "glossary", "title": "术语表"}, "__patterns__": {"html": "<h1>模式与框架库<\/h1>\n<h2>框架：假设放松的四级阶梯<\/h2>\n<p>这本书的结构就是一条“逐步放松假设”的路：完全模型已知（DP）→ 只能采样（MC）→ 可在线自举（TD）→ 状态太多要逼近（函数逼近）→ 策略直接参数化（策略梯度）。每放松一级，就多一类稳定性问题。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n环境可模拟、状态少 → 动态规划或 Dyna。\n<\/li><li>\n只能采样、有终止 → MC 或 TD，优先 TD。\n<\/li><li>\n高风险场景 → Sarsa 类同轨方法更保守。\n<\/li><li>\n状态连续或巨大 → 函数逼近，线性优先，神经网络配目标网络。\n<\/li><li>\n动作连续 → 策略梯度或 actor-critic。\n<\/li><li>\n稀疏奖励 → 先设计内在奖励或课程，不要硬训。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>同时踩三要素还不做稳定化<\/strong>：函数逼近 + 自举 + 离轨，必然发散。\n<\/li><li>\n<strong>用 MC 处理无终止任务<\/strong>：回报不收敛，算法没有定义。\n<\/li><li>\n<strong>把奖励设计当小事<\/strong>：奖励写错会学出荒诞行为。\n<\/li><li>\n<strong>只看平均回报不看方差<\/strong>：高风险策略在仿真里好，在真实环境里崩。\n<\/ul>", "kind": "模式库", "title": "模式库"}, "__cheatsheet__": {"html": "<h1>速查表<\/h1>\n<h2>公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>回报<\/td><td>G_t=R_{t+1}+γR_{t+2}+…<\/td><\/tr><tr><td>贝尔曼期望<\/td><td>v_π(s)=Σπ(a<\/td><td>s)Σp[r+γv_π(s&#x27;)]<\/td><\/tr><tr><td>贝尔曼最优<\/td><td>v_<em>(s)=max_aΣp[r+γv_<\/em>(s&#x27;)]<\/td><\/tr><tr><td>策略评估<\/td><td>V(s)←Σπ(a<\/td><td>s)Σp[r+γV(s&#x27;)]<\/td><\/tr><tr><td>价值迭代<\/td><td>V(s)←max_aΣp[r+γV(s&#x27;)]<\/td><\/tr><tr><td>TD(0)<\/td><td>V(S)←V(S)+α[R+γV(S&#x27;)-V(S)]<\/td><\/tr><tr><td>Sarsa<\/td><td>Q(S,A)←Q+α[R+γQ(S&#x27;,A&#x27;)-Q]<\/td><\/tr><tr><td>Q-learning<\/td><td>Q(S,A)←Q+α[R+γmax_aQ(S&#x27;,a)-Q]<\/td><\/tr><tr><td>n 步回报<\/td><td>G=R1+γR2+…+γ^{n-1}Rn+γ^nV(Sn)<\/td><\/tr><tr><td>半梯度 TD<\/td><td>w←w+αδ∇v(S;w)<\/td><\/tr><tr><td>策略梯度<\/td><td>∇J=E[Σ∇logπ(A<\/td><td>S)q(S,A)]<\/td><\/tr><tr><td>自注意力无关<\/td><td>—<\/td><\/tr><\/tbody><\/table>\n<h2>算法选择<\/h2>\n<table><thead><tr><th>条件<\/th><th>选择<\/th><\/tr><\/thead><tbody><tr><td>有模型、状态少<\/td><td>策略迭代 / 价值迭代<\/td><\/tr><tr><td>无模型、分幕<\/td><td>MC 控制 / TD 控制<\/td><\/tr><tr><td>无模型、在线<\/td><td>Sarsa / Q-learning<\/td><\/tr><tr><td>状态巨大<\/td><td>线性逼近或 DQN<\/td><\/tr><tr><td>连续动作<\/td><td>DDPG / PPO 类策略梯度<\/td><\/tr><\/tbody><\/table>\n<h2>排错顺序<\/h2>\n<p>回报不升 → 检查奖励尺度与折扣；价值不收敛 → 检查是否踩三要素；训练崩溃 → 检查步长、目标网络、特征归一化；探索不足 → 检查 ε 或内在奖励。<\/p>", "kind": "速查表", "title": "速查表"}}, "base_dir": "/home/user/Doubao/chats/38452296622422786/AI-点化学习系统/05-强化学习", "nav": [{"label": "学习路径", "href": "#/path"}, {"label": "章节", "children": [{"label": "第 1 章：导论", "href": "#/chapter/ch01"}, {"label": "第 2 章：多臂赌博机", "href": "#/chapter/ch02"}, {"label": "第 3 章：有限马尔可夫决策过程", "href": "#/chapter/ch03"}, {"label": "第 4 章：动态规划", "href": "#/chapter/ch04"}, {"label": "第 5 章：蒙特卡洛方法", "href": "#/chapter/ch05"}, {"label": "第 6 章：时序差分学习", "href": "#/chapter/ch06"}, {"label": "第 7 章：n 步自举法", "href": "#/chapter/ch07"}, {"label": "第 8 章：基于表格型方法的规划和学习", "href": "#/chapter/ch08"}, {"label": "第 9 章：基于函数逼近的同轨策略预测", "href": "#/chapter/ch09"}, {"label": "第 10 章：基于函数逼近的同轨策略控制", "href": "#/chapter/ch10"}, {"label": "第 11 章：基于函数逼近的离轨策略方法", "href": "#/chapter/ch11"}, {"label": "第 12 章：资格迹", "href": "#/chapter/ch12"}, {"label": "第 13 章：策略梯度方法", "href": "#/chapter/ch13"}, {"label": "第 14 章：心理学", "href": "#/chapter/ch14"}, {"label": "第 15 章：神经科学", "href": "#/chapter/ch15"}, {"label": "第 16 章：应用及案例分析", "href": "#/chapter/ch16"}, {"label": "第 17 章：前沿技术", "href": "#/chapter/ch17"}]}, {"label": "概念", "children": [{"label": "自举与采样", "href": "#/concept/c01"}, {"label": "探索与利用", "href": "#/concept/c02"}]}, {"label": "测验", "children": [{"label": "综合测验", "href": "#/quiz/all"}, {"label": "测验：第 1 章：导论", "href": "#/quiz/ch01"}, {"label": "测验：第 2 章：多臂赌博机", "href": "#/quiz/ch02"}, {"label": "测验：第 3 章：有限马尔可夫决策过程", "href": "#/quiz/ch03"}, {"label": "测验：第 4 章：动态规划", "href": "#/quiz/ch04"}, {"label": "测验：第 5 章：蒙特卡洛方法", "href": "#/quiz/ch05"}, {"label": "测验：第 6 章：时序差分学习", "href": "#/quiz/ch06"}, {"label": "测验：第 7 章：n 步自举法", "href": "#/quiz/ch07"}, {"label": "测验：第 8 章：基于表格型方法的规划和学习", "href": "#/quiz/ch08"}, {"label": "测验：第 9 章：基于函数逼近的同轨策略预测", "href": "#/quiz/ch09"}, {"label": "测验：第 10 章：基于函数逼近的同轨策略控制", "href": "#/quiz/ch10"}, {"label": "测验：第 11 章：基于函数逼近的离轨策略方法", "href": "#/quiz/ch11"}, {"label": "测验：第 12 章：资格迹", "href": "#/quiz/ch12"}, {"label": "测验：第 13 章：策略梯度方法", "href": "#/quiz/ch13"}, {"label": "测验：第 14 章：心理学", "href": "#/quiz/ch14"}, {"label": "测验：第 15 章：神经科学", "href": "#/quiz/ch15"}, {"label": "测验：第 16 章：应用及案例分析", "href": "#/quiz/ch16"}, {"label": "测验：第 17 章：前沿技术", "href": "#/quiz/ch17"}]}, {"label": "抽认卡", "href": "#/cards"}, {"label": "术语表", "href": "#/glossary"}, {"label": "模式库", "href": "#/patterns"}, {"label": "速查表", "href": "#/cheatsheet"}], "rendered": {"ch01": "<h1>第 1 章：导论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说出强化学习区别于监督学习的三个特征；列出强化学习智能体的四个要素；用井字棋例子说明“价值”与“试探”的关系；判断一个现实问题是否适合用强化学习。<\/p>\n<h2>一句话核心<\/h2>\n<p>强化学习研究“在只有延迟奖励、且自己的行为会改变未来数据分布的情况下，如何学会做决策”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三个关键特征（难度：基础）<\/h3>\n<ol><li>\n<strong>没有即时标签<\/strong>：只有奖励，而且可能延迟到几十步之后。\n<\/li><li>\n<strong>数据由策略产生<\/strong>：你看到的数据取决于你之前怎么行动，分布会随策略变化。\n<\/li><li>\n<strong>试错与探索<\/strong>：必须主动尝试没做过的动作，才能知道它好不好。\n<\/ol>\n<p><strong>与监督学习的对比<\/strong>：监督学习是“我给你每个问题的正确答案”，强化学习是“你做完一局我给你一个分数，具体哪一步错了你自己想”。<\/p>\n<h3>概念 2：四个要素（难度：基础）<\/h3>\n<ul><li>\n<strong>策略 π(a|s)<\/strong>：在每个状态选动作的规则，是智能体的核心。\n<\/li><li>\n<strong>奖励 R<\/strong>：环境给的即时信号，定义“什么算好”。\n<\/li><li>\n<strong>价值函数 v(s)<\/strong>：从该状态出发的长期累积奖励期望，比即时奖励更能指导决策。\n<\/li><li>\n<strong>模型（可选）<\/strong>：对环境转移的预测，有模型就能做规划。\n<\/ul>\n<p><strong>价值为什么必要<\/strong>：奖励是眼前的，价值是长远的。只看奖励会在“小奖励的短路径”和“大奖励的长路径”之间选错。<\/p>\n<h3>概念 3：井字棋例子（难度：进阶）<\/h3>\n<p>用一张表存每个局面的“胜率估计”。下棋时：选一个自己估计胜率最高的走法，但有 ε 概率随机走（探索）。对局结束后，用结果反过来更新路径上每个局面的估计：<code>V(s) ← V(s) + α[V(s&#x27;) - V(s)]<\/code>。<\/p>\n<p><strong>这个例子包含全部要素<\/strong>：价值函数（那张表）、策略（ε-贪心选点）、奖励（赢了 +1）、以及“用自己的估计更新自己”（自举）。后面十几章都是把这个粗糙的想法做严谨。<\/p>\n<h3>概念 4：什么时候不该用（难度：进阶）<\/h3>\n<p>如果环境是静态的、有大量标注数据、且决策之间互不影响，监督学习更划算。强化学习的优势在“序列决策 + 反馈延迟 + 需要探索”的场景。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  S[&quot;状态 s&quot;] --&gt; A[&quot;智能体选动作 a&quot;]\n  A --&gt; E[&quot;环境&quot;]\n  E --&gt; R[&quot;奖励 r&quot;]\n  E --&gt; S2[&quot;新状态 s&#x27;&quot;]\n  S2 --&gt; S<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：注意从状态到动作再到环境，形成一个闭环。数据不是事先准备好的，是这个环转出来的。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为奖励设计是小事——实际上奖励写错，智能体会学出荒诞但“最优”的行为，这叫奖励黑客。\n<\/li><li>\n别以为价值函数就是打折的奖励和——实际上在有模型偏差、函数逼近时它只是个估计，会错。\n<\/li><li>\n别以为探索越少越好——实际上不探索就永远不知道别的动作有多好。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n强化学习与监督学习最本质的差别是？（答案：C；解析：数据由策略产生且奖励延迟，没有即时正确标签。）\n<ul>\n<li>\nA. 用了神经网络　B. 数据更多　C. 无即时标签且数据分布随策略变化　D. 需要 GPU\n<\/li><li>\n四个要素中，直接决定“做什么”的是？（答案：A；解析：策略 π(a|s) 是行为规则。）\n<\/li><li>\nA. 策略　B. 奖励　C. 价值函数　D. 模型\n<\/li><li>\n井字棋例子中“自举”体现在？（答案：B；解析：用自己的价值估计 V(s&#x27;) 更新 V(s)。）\n<\/li><li>\nA. 用奖励更新　B. 用自己的估计更新自己的估计　C. 用对手的策略更新　D. 用随机数更新\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三大特征：延迟奖励、数据自产、必须探索。\n<\/li><li>\n四要素：策略、奖励、价值、模型。\n<\/li><li>\n自举 = 用自己的估计更新自己的估计。\n<\/ul>", "ch02": "<h1>第 2 章：多臂赌博机<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1 章、期望与方差\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出 ε-贪心的增量式实现；解释乐观初始值为什么能驱动探索；写出 UCB 的选择公式并说明探索项的作用；区分赌博机与完整强化学习问题的差别。<\/p>\n<h2>一句话核心<\/h2>\n<p>赌博机是强化学习里“只有探索与利用、没有状态”的最简形态，所有探索策略都先在这里验证。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：动作价值与增量更新（难度：基础）<\/h3>\n<p>第 a 个臂的价值 <code>q(a) = E[R|A=a]<\/code>。用采样平均估计：<code>Q_{n+1} = Q_n + (1/n)(R_n - Q_n)<\/code>。<\/p>\n<p><strong>为什么写成增量式<\/strong>：直接存总和再除以次数需要 O(n) 内存；增量式每步只算一次减法、一次除法，内存恒定。把 1/n 换成常数 α 就得到“指数近因加权平均”，适合非平稳环境。<\/p>\n<p><strong>实例<\/strong>：前三次收益 1、2、3。Q 依次为 1、1.5、2；增量式第四步若收益 4，Q = 2 + (1/4)(4-2) = 2.5，与 (1+2+3+4)/4=2.5 一致。<\/p>\n<h3>概念 2：ε-贪心（难度：基础）<\/h3>\n<p>以 1-ε 选当前 Q 最大的臂，以 ε 均匀随机选。<strong>它的探索是“盲探”<\/strong>——不管某个臂已经被试过一万次，被随机选中的概率和没试过的一样。<\/p>\n<p><strong>改进方向<\/strong>：让探索偏向“不确定性大”的臂，这就是乐观初始值和 UCB 的思路。<\/p>\n<h3>概念 3：乐观初始值与 UCB（难度：进阶）<\/h3>\n<p><strong>乐观初始值<\/strong>：把所有 Q 初始化成一个偏高的值（比如 5，而真实均值只有 1）。这样每个臂第一次被选中都会得到“失望”，Q 下降；算法于是转向别的臂，直到全部被拉回现实。它是“用初值骗出探索”，前期探索密集，且随时间自然衰减。<\/p>\n<p><strong>UCB<\/strong>：<code>A_t = argmax_a [Q_t(a) + c√(ln t / N_t(a))]<\/code>。第二项是“不确定性奖励”：N 小（试得少）时它大，鼓励探索；试多了自然变小。c 控制探索强度。<\/p>\n<p><strong>实例<\/strong>：t=100 时，臂 A 试了 90 次、Q=0.8；臂 B 试了 10 次、Q=0.6。取 c=2：A 的项 = 2√(ln100/90)=2×0.226=0.45，总分 1.25；B 的项 = 2√(ln100/10)=2×0.679=1.36，总分 1.96。B 胜出——尽管当前均值更低，但不确定性更大。<\/p>\n<h3>概念 4：梯度赌博机与关联搜索（难度：进阶）<\/h3>\n<p><strong>梯度赌博机<\/strong>：不估价值，直接学“选各臂的概率” <code>H(a)<\/code>，用 <code>softmax<\/code> 转成概率，按 <code>H(a) ← H(a) + α(R - R̄)(1 - π(a))<\/code> 更新。它适合价值会漂移的非平稳环境。<\/p>\n<p><strong>关联搜索<\/strong>：赌博机加上“状态”就变成关联搜索任务——不同状态下最优臂不同。这是从赌博机通往完整强化学习的桥梁。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  E[&quot;探索 试没试过的&quot;] --&gt; T[&quot;权衡&quot;]\n  X[&quot;利用 选当前最好的&quot;] --&gt; T\n  T --&gt; R[&quot;长期收益最大&quot;]\n  U[&quot;UCB 不确定性加分&quot;] --&gt; E<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：探索与利用不是对立，而是同一个目标的两条路径。UCB 把“该探索多少”量化成了一个可计算的加分项。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 ε-贪心足够好——实际上它的探索是盲目的，在臂很多时浪费大量步数。\n<\/li><li>\n别以为乐观初始值能一直用——实际上非平稳环境里初值很快失效，还得靠 α 衰减。\n<\/li><li>\n别以为赌博机就是强化学习——实际上它没有状态转移，没有“这一步影响下一步”的结构。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n增量式均值更新中，第 n 次的步长是？（答案：B；解析：Q_{n+1}=Q_n+(1/n)(R_n-Q_n)。）\n<ul>\n<li>\nA. α 固定　B. 1/n　C. n　D. 1\n<\/li><li>\nUCB 的探索项在什么情况下变大？（答案：A；解析：N_t(a) 小即试得少时，√(ln t/N) 变大。）\n<\/li><li>\nA. 该臂被尝试次数少　B. 该臂价值高　C. 总步数少　D. c 取负\n<\/li><li>\n乐观初始值驱动探索的机制是？（答案：C；解析：初值偏高，每次尝试都会“失望”，迫使算法转向别的臂。）\n<\/li><li>\nA. 随机扰动　B. 衰减学习率　C. 高初值导致失望驱动转向　D. 梯度上升\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n增量式均值：Q += (1/n)(R-Q)，换 α 就变指数加权。\n<\/li><li>\nε-贪心盲探，UCB 按不确定性探索。\n<\/li><li>\n乐观初始值：用高初值骗出前期探索。\n<\/li><li>\n赌博机无状态，关联搜索才引入状态。\n<\/ul>", "ch03": "<h1>第 3 章：有限马尔可夫决策过程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 2 章、概率与期望\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出回报的定义并说明折扣因子的两个作用；推导贝尔曼期望方程；区分 v(s) 与 q(s,a) 并写出两者的关系式；推导贝尔曼最优方程并说明 max 的位置。<\/p>\n<h2>一句话核心<\/h2>\n<p>MDP 把“决策问题”形式化成四元组，贝尔曼方程则把“长期价值”递归成“即时奖励 + 下一状态价值”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：MDP 与回报（难度：基础）<\/h3>\n<p>四元组 <code>(S, A, P, R)<\/code>，其中 <code>P(s&#x27;,r|s,a)<\/code> 是转移概率。回报 <code>G_t = R_{t+1} + γR_{t+2} + γ²R_{t+3} + ...<\/code>。<\/p>\n<p><strong>γ 的两个作用<\/strong>：一是数学上保证无穷和收敛（γ&lt;1 时上界是 R_max/(1-γ)）；二是语义上控制“短视程度”，γ 越接近 1 越看重长远。<\/p>\n<p><strong>episodic 与 continuing<\/strong>：有终止状态的任务叫分幕式，回报是有限和；没有终止的叫持续式，必须靠折扣才收敛。<\/p>\n<h3>概念 2：贝尔曼期望方程（难度：高难）<\/h3>\n<p><code>v_π(s) = Σ_a π(a|s) Σ_{s&#x27;,r} p(s&#x27;,r|s,a)[r + γ v_π(s&#x27;)]<\/code>。<\/p>\n<p><strong>推导过程<\/strong>：把 G_t 拆成 <code>R_{t+1} + γG_{t+1}<\/code>，对 G_{t+1} 取期望就得到 <code>v_π(s&#x27;)<\/code>，再对动作和转移概率求期望。<strong>这一步是全章的核心：它把“无穷长的和”变成了“一步 + 下一状态的价值”。<\/strong><\/p>\n<p><code>q_π(s,a) = Σ_{s&#x27;,r} p(s&#x27;,r|s,a)[r + γ Σ_{a&#x27;} π(a&#x27;|s&#x27;) q_π(s&#x27;,a&#x27;)]<\/code>。<\/p>\n<p><strong>两者的关系<\/strong>：<code>v_π(s) = Σ_a π(a|s) q_π(s,a)<\/code>；<code>q_π(s,a) = Σ_{s&#x27;,r} p[r + γ v_π(s&#x27;)]<\/code>。<\/p>\n<h3>概念 3：贝尔曼最优方程（难度：高难）<\/h3>\n<p><code>v_<em>(s) = max_a Σ_{s&#x27;,r} p(s&#x27;,r|s,a)[r + γ v_<\/em>(s&#x27;)]<\/code>， <code>q_<em>(s,a) = Σ_{s&#x27;,r} p(s&#x27;,r|s,a)[r + γ max_{a&#x27;} q_<\/em>(s&#x27;,a&#x27;)]<\/code>。<\/p>\n<p><strong>max 的位置很关键<\/strong>：它必须在动作上取，而不是在状态上。因为策略是对动作的选择。贝尔曼最优方程是非线性的（因为有 max），这导致它一般没有闭式解，只能迭代求解。<\/p>\n<p><strong>为什么最优策略一定存在且是确定性的<\/strong>：对有限 MDP，存在一个确定性策略在每个状态都取使 q_*(s,a) 最大的动作，且它同时最优于所有状态。<\/p>\n<h3>概念 4：一个手算实例（难度：进阶）<\/h3>\n<p>两状态 A、B，A 执行动作后必到 B 得奖励 0；B 执行动作后必回 A 得奖励 1。γ=0.9。 设 v(A)=x，v(B)=y。贝尔曼：x = 0 + 0.9y，y = 1 + 0.9x。 解得：x = 0.9(1+0.9x) = 0.9+0.81x → 0.19x=0.9 → x=4.7368，y=5.2632。 验算：从 A 出发每两步拿 1，折扣后总回报 = 0.9 + 0.81×... 收敛到 4.7368，对得上。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  S[&quot;状态 s&quot;] --&gt;|&quot;π(a|s)&quot;| A[&quot;动作 a&quot;]\n  A --&gt;|&quot;p(s&#x27;,r|s,a)&quot;| N[&quot;下一状态 s&#x27; 与奖励 r&quot;]\n  N --&gt;|&quot;γ v(s&#x27;)&quot;| V[&quot;价值回传&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两条边上的概率分别是策略与转移概率。贝尔曼方程就是对这两层概率各求一次期望。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 γ=1 一定更好——实际上持续式任务里 γ=1 会让回报发散，且让智能体完全不为未来打折、难以收敛。\n<\/li><li>\n别以为最优价值函数可以直接算出来——实际上有 max 就没有闭式解，必须迭代。\n<\/li><li>\n别以为 v 和 q 只是记号不同——实际上 q 多了一个动作维度，是控制问题里真正要用的量。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nγ 的作用不包括？（答案：C；解析：它保证收敛并控制视野，不改变奖励尺度。）\n<ul>\n<li>\nA. 保证无穷和收敛　B. 控制短视程度　C. 放大即时奖励　D. 使持续式任务有定义\n<\/li><li>\n贝尔曼最优方程中 max 取在哪一维？（答案：A；解析：在动作上取，因为策略选的是动作。）\n<\/li><li>\nA. 动作　B. 状态　C. 时间　D. 奖励\n<\/li><li>\nv_π 与 q_π 的关系是？（答案：B；解析：v 是 q 在策略分布下的期望。）\n<\/li><li>\nA. q 是 v 的期望　B. v 是 q 按策略加权平均　C. 两者相等　D. 无法关联\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nG_t = R_{t+1} + γG_{t+1}，贝尔曼方程靠这个递推。\n<\/li><li>\nγ 保证收敛 + 控制视野。\n<\/li><li>\n最优方程在动作上取 max，非线性，需迭代。\n<\/li><li>\nv_π(s)=Σπ(a|s)q_π(s,a)。\n<\/ul>", "ch04": "<h1>第 4 章：动态规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出策略评估的迭代式并说明它为什么收敛；写出策略改进定理的结论；区分策略迭代与价值迭代；解释异步 DP 与广义策略迭代的关系。<\/p>\n<h2>一句话核心<\/h2>\n<p>已知完整模型时，动态规划用“评估—改进”的循环把贝尔曼方程迭代求解出来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：策略评估（难度：进阶）<\/h3>\n<p><code>V_{k+1}(s) ← Σ_a π(a|s) Σ_{s&#x27;,r} p[r + γV_k(s&#x27;)]<\/code>，反复迭代直到 V 不再变化。<\/p>\n<p><strong>为什么收敛<\/strong>：这个更新是一个 γ-压缩映射（γ&lt;1），每次迭代都把误差至少压到 γ 倍，所以必然收敛到 v_π。这是压缩映射不动点定理的直接应用。<\/p>\n<p><strong>实例<\/strong>：4×4 网格世界，每步奖励 -1，γ=1，随机策略。迭代 1 次后每格 -1，2 次后 -2……最终收敛到“到终点的负步数”。这个例子说明评估在算“按当前策略走，平均要走多少步”。<\/p>\n<h3>概念 2：策略改进（难度：高难）<\/h3>\n<p>对每个状态，取 <code>argmax_a Σ_{s&#x27;,r} p[r + γV(s&#x27;)]<\/code>。<strong>策略改进定理<\/strong>保证：这样得到的贪婪策略 π&#x27; 一定不差于原策略 π，即 <code>v_{π&#x27;}(s) ≥ v_π(s)<\/code> 对所有 s 成立。<\/p>\n<p><strong>为什么会更好<\/strong>：原策略是在“已知 V 的情况下”选的，贪婪策略是在同样的 V 上取最大，所以每个状态的一步收益都不低于原来。这个论证只依赖一步，但通过贝尔曼方程的递归，它推广到长期。<\/p>\n<h3>概念 3：策略迭代与价值迭代（难度：进阶）<\/h3>\n<ul><li>\n<strong>策略迭代<\/strong>：评估到收敛 → 改进 → 再评估，直到策略不再变。外层循环通常很少（几次到十几次）。\n<\/li><li>\n<strong>价值迭代<\/strong>：把评估只做一步就立刻改进，合并成一个更新：<code>V_{k+1}(s) ← max_a Σ p[r + γV_k(s&#x27;)]<\/code>。\n<\/ul>\n<p><strong>差别<\/strong>：策略迭代每次评估很贵但外层少；价值迭代每步便宜但需要更多步。二者都是广义策略迭代的特例。<\/p>\n<h3>概念 4：异步 DP（难度：进阶）<\/h3>\n<p>不必等全表更新完，可以按任意顺序只更新一部分状态。只要每个状态被无限次访问，收敛性仍成立。这为后面的“采样更新”（只更新实际访问到的状态）铺路。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  E[&quot;策略评估 求 v_π&quot;] --&gt; I[&quot;策略改进 取贪婪&quot;]\n  I --&gt; E\n  E --&gt; C{&quot;策略不变?&quot;}\n  C --&gt;|是| O[&quot;最优策略&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：评估和改进交替进行，两者的不动点就是最优策略。价值迭代只是把这个环压成一步。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 DP 只适用于小问题——实际上它的思想（用估计更新估计）是整个强化学习的骨架，只是“全表扫描”这一步在大问题上做不了。\n<\/li><li>\n别以为策略迭代一定比价值迭代好——实际上状态多时价值迭代更省。\n<\/li><li>\n别以为 DP 需要精确模型就毫无用处——实际上很多规划算法是它的近似版本。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n策略评估收敛的理论依据是？（答案：B；解析：贝尔曼更新是 γ-压缩映射。）\n<ul>\n<li>\nA. 凸性　B. 压缩映射不动点定理　C. 大数定律　D. 中心极限定理\n<\/li><li>\n价值迭代与策略迭代的核心差别是？（答案：C；解析：价值迭代每次只评估一步就改进。）\n<\/li><li>\nA. 是否需要模型　B. 是否用 max　C. 评估做几步　D. 是否需要探索\n<\/li><li>\n策略改进定理保证？（答案：A；解析：贪婪策略不差于原策略。）\n<\/li><li>\nA. 新策略不差于旧策略　B. 新策略一定最优　C. 收敛速度　D. 探索充分性\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nDP = 评估 + 改进，两者都是贝尔曼方程的应用。\n<\/li><li>\n评估收敛靠 γ-压缩。\n<\/li><li>\n策略迭代外层少、价值迭代每步省。\n<\/li><li>\n异步 DP 为采样方法铺路。\n<\/ul>", "ch05": "<h1>第 5 章：蒙特卡洛方法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 4 章、期望与方差\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：区分首次访问与每次访问 MC；说出 MC 与 DP 的根本差别；写出同轨策略 MC 控制的流程；解释重要性采样为什么需要、普通与加权两种估计的取舍。<\/p>\n<h2>一句话核心<\/h2>\n<p>MC 不靠模型，靠“把一整幕跑完，用真实回报当目标”；它的估计无偏，但方差大。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：用回报代替期望（难度：进阶）<\/h3>\n<p><code>V(s) ← 平均(该状态之后实际得到的 G_t)<\/code>。不需要转移概率，只要有完整的一幕。<\/p>\n<p><strong>与 DP 的对比<\/strong>：DP 用“下一状态价值的期望”更新（自举、有偏、低方差）；MC 用“实际回报”更新（不自举、无偏、高方差）。这是强化学习里最核心的一组权衡。<\/p>\n<h3>概念 2：首次访问与每次访问（难度：进阶）<\/h3>\n<ul><li>\n<strong>首次访问 MC<\/strong>：每幕里只在该状态第一次出现时更新一次。\n<\/li><li>\n<strong>每次访问 MC<\/strong>：每次出现都更新。\n<\/ul>\n<p>两者都收敛到 v_π。首次访问的估计更“独立”，每次访问样本利用率更高但样本相关。<\/p>\n<h3>概念 3：MC 控制（难度：高难）<\/h3>\n<p>估值对象是 q(s,a)，因为没模型时只知道 v 无法选动作。流程：按当前策略跑完一幕 → 对每个出现的 (s,a) 用回报更新 Q → 用 Q 做 ε-贪婪改进 → 重复。<\/p>\n<p><strong>探索问题<\/strong>：如果策略是纯贪婪，某些 (s,a) 永远不会被访问，Q 永远得不到更新。所以必须 ε-软策略，或者用“探索起点”（每一幕从随机状态动作开始）。<\/p>\n<h3>概念 4：离轨重要性采样（难度：高难）<\/h3>\n<p>离轨时数据由行为策略 b 产生，要评估目标策略 π。用重要性采样比率 <code>ρ = Π π(a_t|s_t)/b(a_t|s_t)<\/code> 给回报加权，修正分布差异。<\/p>\n<ul><li>\n<strong>普通重要性采样<\/strong>：<code>V = (Σρ·G)/n<\/code>，无偏但方差可能极大（比率连乘会爆炸）。\n<\/li><li>\n<strong>加权重要性采样<\/strong>：<code>V = Σ(ρ·G)/Σρ<\/code>，有偏但方差小得多，实践中更常用。\n<\/ul>\n<p><strong>为什么会爆炸<\/strong>：序列越长，连乘的比率越多；若 π 与 b 差异大，单个 ρ 就能到 10^3 量级，一个样本把平均值拉飞。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  P[&quot;按策略跑完一幕&quot;] --&gt; G[&quot;得到真实回报 G&quot;]\n  G --&gt; U[&quot;更新 Q(s,a) 的均值&quot;]\n  U --&gt; I[&quot;ε-贪婪改进策略&quot;]\n  I --&gt; P<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这个环必须等一幕结束才能转一次，所以 MC 不能用于没有终止的任务。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 MC 无偏就一定更好——实际上方差大意味着需要更多样本，实际收敛可能更慢。\n<\/li><li>\n别以为重要性采样只是加权——实际上普通 IS 的方差可能无界，工程上几乎都用加权版本。\n<\/li><li>\n别以为 MC 只能用于分幕任务——实际上持续式任务也能用，但要截断或用平均收益形式。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nMC 与 DP 的核心差别是？（答案：B；解析：MC 用真实回报、不需要模型；DP 用期望、需要模型。）\n<ul>\n<li>\nA. 是否需要神经网络　B. 是否用真实回报代替期望　C. 是否有偏　D. 是否用 max\n<\/li><li>\n普通重要性采样权重连乘的风险是？（答案：C；解析：比率可爆炸，方差无界。）\n<\/li><li>\nA. 有偏　B. 需要模型　C. 方差可能极大　D. 无法收敛\n<\/li><li>\nMC 控制为什么必须保持探索？（答案：A；解析：纯贪婪会让部分状态动作永不访问，Q 无法更新。）\n<\/li><li>\nA. 否则部分动作永不探索　B. 否则方差太大　C. 否则需要模型　D. 否则无法分幕\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nMC：跑完整幕、用真实回报、无偏高方差、不需要模型。\n<\/li><li>\n首次访问 vs 每次访问：更新频率不同，都收敛。\n<\/li><li>\n控制要估 q 不要估 v；必须保持探索。\n<\/li><li>\n加权重要性采样：有偏但方差小，实际首选。\n<\/ul>", "ch06": "<h1>第 6 章：时序差分学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出 TD(0) 的更新式并解释 TD 误差；说明 TD 为什么是“MC 与 DP 的折中”；写出 Sarsa 与 Q-learning 的更新式并说出两者学的东西有什么不同；解释最大化偏差与双学习怎么解决它。<\/p>\n<h2>一句话核心<\/h2>\n<p>TD 用“一步奖励 + 下一状态估计”代替完整回报，既不需要模型，也不必等一幕结束。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：TD(0) 与 TD 误差（难度：进阶）<\/h3>\n<p><code>V(S_t) ← V(S_t) + α[R_{t+1} + γV(S_{t+1}) - V(S_t)]<\/code>。<\/p>\n<p>方括号里是 <strong>TD 误差<\/strong> <code>δ_t = R_{t+1} + γV(S_{t+1}) - V(S_t)<\/code>：它衡量“新信息与旧估计的差距”。TD 误差是强化学习里最重要的一个量，不仅用于更新，还被认为是大脑学习信号的原型（第 15 章）。<\/p>\n<p><strong>为什么它是折中<\/strong>：目标 <code>R+γV(S&#x27;)<\/code> 里有真实奖励（像 MC）也有估计值（像 DP）。所以它自举、有偏、但方差比 MC 小得多，而且能在线学习（不必等幕结束）。<\/p>\n<h3>概念 2：Sarsa（难度：高难）<\/h3>\n<p><code>Q(S_t,A_t) ← Q(S_t,A_t) + α[R_{t+1} + γQ(S_{t+1},A_{t+1}) - Q(S_t,A_t)]<\/code>。<\/p>\n<p>名字来自用到的五元组 <code>(S,A,R,S&#x27;,A&#x27;)<\/code>。它用<strong>实际选出的下一个动作<\/strong> A_{t+1} 的价值做目标，所以学的是<strong>当前策略<\/strong>（含探索）的价值。<strong>同轨<\/strong>策略。<\/p>\n<h3>概念 3：Q-learning（难度：高难）<\/h3>\n<p><code>Q(S_t,A_t) ← Q(S_t,A_t) + α[R_{t+1} + γ max_a Q(S_{t+1},a) - Q(S_t,A_t)]<\/code>。<\/p>\n<p>用下一状态的最大动作价值，不管实际选了什么。所以它直接学<strong>最优<\/strong>动作价值，与行为策略无关——<strong>离轨<\/strong>。<\/p>\n<p><strong>行为差异的实例<\/strong>：在悬崖边行走的任务里，Sarsa 因为要考虑“ε 探索可能随机走进悬崖”，会学得离崖边远一些，更安全；Q-learning 学的是最优路径，贴着崖边走，训练中掉下去的次数更多。<\/p>\n<h3>概念 4：期望 Sarsa 与最大化偏差（难度：高难）<\/h3>\n<p><strong>期望 Sarsa<\/strong>：把 <code>Q(S&#x27;,A&#x27;)<\/code> 换成 <code>Σ_a π(a|S&#x27;)Q(S&#x27;,a&#x27;)<\/code>。方差比 Sarsa 小（不依赖一次采样），又不像 Q-learning 那样引入 max 偏差。<\/p>\n<p><strong>最大化偏差<\/strong>：Q-learning 的 max 会让“被噪声高估的动作”被反复选中。例子：10 个动作真实价值都是 0、估计带噪声，则 max 估计的期望是正数而不是 0。<\/p>\n<p><strong>双学习（Double Q-learning）<\/strong>：维护两套 Q，用 Q1 选动作、Q2 估值（或交换），把“选择”和“评估”分开，消除偏差。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  M[&quot;MC 用完整 G&quot;] --&gt; T[&quot;TD 用 R+γV(S&#x27;)&quot;]\n  D[&quot;DP 用期望&quot;] --&gt; T\n  T --&gt; S[&quot;Sarsa 同轨&quot;]\n  T --&gt; Q[&quot;Q-learning 离轨 用 max&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：TD 在中间位置：左边是无偏高方差，右边是有偏低方差。Sarsa 和 Q-learning 是 TD 在控制任务上的两条分叉。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 TD 有偏就是缺点——实际上偏差换来方差大幅下降，实际收敛常常更快。\n<\/li><li>\n别以为 Q-learning 总能找到最优路径就更好用——实际上它在训练中可能反复踩坑，不适合高风险环境。\n<\/li><li>\n别以为双学习只是“平均两个估计”——实际上关键是解耦选择与评估。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nTD 误差的定义是？（答案：A；解析：R_{t+1}+γV(S_{t+1})-V(S_t)。）\n<ul>\n<li>\nA. 目标估计减当前估计　B. 奖励减学习率　C. 价值减动作价值　D. 折扣减奖励\n<\/li><li>\nSarsa 学的是？（答案：B；解析：用实际动作价值，学当前策略。）\n<\/li><li>\nA. 最优策略价值　B. 当前策略价值　C. 平均收益　D. 模型\n<\/li><li>\nQ-learning 的最大化偏差怎么产生？（答案：C；解析：max 会选中被噪声高估的动作。）\n<\/li><li>\nA. 学习率太大　B. 折扣太小　C. max 选择高估动作　D. 探索不足\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nTD 误差 δ = R + γV(S&#x27;) - V(S)。\n<\/li><li>\nSarsa 同轨学当前策略，Q-learning 离轨学最优。\n<\/li><li>\n期望 Sarsa 降方差，双学习消 max 偏差。\n<\/li><li>\n高风险场景优先考虑 SarSa 类保守行为。\n<\/ul>", "ch07": "<h1>第 7 章：n 步自举法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 5、6 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出 n 步 TD 的回报形式；说明 n 从 1 增大到无穷时如何从 TD 连续过渡到 MC；解释 n 步方法为什么在偏差与方差之间提供连续的旋钮；说清树回溯与 n 步的关系。<\/p>\n<h2>一句话核心<\/h2>\n<p>n 步就是把“等几步再自举”这件事变成一个可调参数：n=1 是 TD，n=∞ 是 MC。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：n 步回报（难度：进阶）<\/h3>\n<p><code>G_{t:t+n} = R_{t+1} + γR_{t+2} + ... + γ^{n-1}R_{t+n} + γ^n V(S_{t+n})<\/code>。<\/p>\n<p>前 n 个奖励是真实的，最后一个用估计收尾。n=1 时就是 TD(0)：<code>R_{t+1}+γV(S_{t+1})<\/code>；n 趋于无穷（或到幕结束）时就是 MC 的完整回报。<\/p>\n<h3>概念 2：偏差与方差的连续调节（难度：进阶）<\/h3>\n<p>n 小 → 更多依赖估计（偏差大、方差小）；n 大 → 更多依赖真实奖励（偏差小、方差大）。<\/p>\n<p><strong>这不是理论上的漂亮话<\/strong>：实践中 n 常取 3 到 10，因为太小的 n 收敛慢、太大的 n 方差高。<\/p>\n<h3>概念 3：n 步 Sarsa 与离轨（难度：高难）<\/h3>\n<p>n 步 Sarsa 用 n 步回报更新 <code>Q(S_t,A_t)<\/code>，目标里含 <code>Q(S_{t+n},A_{t+n})<\/code>。<strong>离轨的 n 步方法<\/strong>要用重要性采样把行为策略的比率乘进每一步，比率数量随 n 增长，方差问题更严重。<\/p>\n<h3>概念 4：树回溯（难度：高难）<\/h3>\n<p>树回溯（Tree Backup）不采样中间动作，而是对每一层的所有可能动作按策略概率加权求和。它结合了“期望更新”的无偏性和“n 步”的在线性，方差比重要性采样版本小很多。<\/p>\n<p><strong>实例<\/strong>：三步树回溯，目标 = R1 + γΣ_a π(a|S1)Q(S1,a) 展开到第三层。它把分支全部展开，所以不需要重要性采样比率。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  T1[&quot;n=1 TD 低方差高偏差&quot;] --&gt; N[&quot;n 增大&quot;]\n  N --&gt; TM[&quot;n=∞ MC 无偏高方差&quot;]\n  TB[&quot;树回溯 分层加权展开&quot;] --&gt; N<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这是一根连续的旋钮，不是一个非此即彼的选择。树回溯是这条旋钮上“方差更小的那一侧”。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 n 越大越准——实际上 n 大时方差上升，实际性能未必更好。\n<\/li><li>\n别以为 n 步只能用于预测——实际上它同样可以直接用于控制（n 步 Sarsa）。\n<\/li><li>\n别以为树回溯只是 n 步的变体——实际上它改变了“中间动作是否采样”这个根本设定。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nn=1 的 n 步回报等价于？（答案：A；解析：只剩一个真实奖励加 γV(S&#x27;)。）\n<ul>\n<li>\nA. TD(0)　B. MC　C. 动态规划　D. 树回溯\n<\/li><li>\nn 增大时方差与偏差如何变化？（答案：C；解析：更依赖真实奖励，偏差减、方差增。）\n<\/li><li>\nA. 都减　B. 都增　C. 偏差减方差增　D. 不变\n<\/li><li>\n树回溯不需要重要性采样的原因是？（答案：B；解析：对中间动作按策略概率加权展开，不采样。）\n<\/li><li>\nA. 它不需要模型　B. 中间动作全部展开加权　C. 它只用 TD　D. 它只用于同轨\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nn 步回报 = n 个真实奖励 + 一个估计收尾。\n<\/li><li>\nn 是偏差—方差旋钮：1 是 TD，∞ 是 MC。\n<\/li><li>\n树回溯展开分支，避免重要性采样的方差爆炸。\n<\/ul>", "ch08": "<h1>第 8 章：基于表格型方法的规划和学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 4、6、7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：区分“学习”与“规划”在强化学习里的含义；画出 Dyna 的结构并说明它为什么比纯模型学习更省样本；解释优先级扫描的优先级怎么定；区分期望更新与采样更新。<\/p>\n<h2>一句话核心<\/h2>\n<p>学习从真实经验里更新价值，规划从模型产生的模拟经验里更新价值——两者用的是同一套更新规则，只是数据来源不同。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：模型与规划（难度：进阶）<\/h3>\n<p><strong>模型<\/strong>给出 <code>p(s&#x27;,r|s,a)<\/code> 的估计或采样器。<strong>规划<\/strong>指用模型生成模拟经验，再对价值做更新。它不需要真实交互，所以能在两次决策之间“多想几步”。<\/p>\n<p><strong>为什么规划能加速<\/strong>：真实样本昂贵（机器人动一次要时间、要磨损），模拟样本几乎免费。<\/p>\n<h3>概念 2：Dyna（难度：高难）<\/h3>\n<p>结构：真实交互一步 → 直接 RL 更新（如 Q-learning）→ 把这一步存进模型 → 循环 n 次：从模型里随机抽一个存过的状态动作，生成模拟转移，做同样的更新。<\/p>\n<p><strong>关键点<\/strong>：规划和学习的更新是同一个更新，只是数据来自不同地方。Dyna-Q 在格子迷宫上比纯 Q-learning 快数倍，因为它每真实一步额外做了 n 次“想象”。<\/p>\n<h3>概念 3：优先级扫描（难度：高难）<\/h3>\n<p>不是随机抽状态，而是优先更新“TD 误差大”的状态。用优先队列存 <code>|δ|<\/code>，每次弹出最大的，更新后把它前驱状态的优先级重算并插回队列。<\/p>\n<p><strong>为什么有效<\/strong>：TD 误差大说明该状态的估计刚被显著修正，它的前驱也可能需要修正。误差会沿着依赖链向后传播，优先处理能加速收敛。<\/p>\n<h3>概念 4：期望更新与采样更新（难度：高难）<\/h3>\n<ul><li>\n<strong>期望更新<\/strong>：对一个状态动作，对所有可能的下一状态按概率加权求和。精度高，但要对每个分支都算。\n<\/li><li>\n<strong>采样更新<\/strong>：只采一个分支。方差大但计算便宜。\n<\/ul>\n<p><strong>在 Dyna 里的意义<\/strong>：如果分支因子很大（比如 1000 种可能转移），期望更新一次要算 1000 项，采样更新只算 1 项。计算预算固定时，做 1000 次采样更新通常比做 1 次期望更新更能降低误差。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  R[&quot;真实经验&quot;] --&gt; L[&quot;直接 RL 更新&quot;]\n  R --&gt; M[&quot;存入模型&quot;]\n  M --&gt; S[&quot;模拟经验&quot;]\n  S --&gt; P[&quot;规划更新&quot;]\n  L --&gt; V[&quot;价值表&quot;]\n  P --&gt; V<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两条路在最后一个节点汇合。这说明“学习”与“规划”在算法层面没有本质差异。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为规划必须用精确模型——实际上采样模型（能生成一个可能的下一状态）就够用。\n<\/li><li>\n别以为模型一定准——实际上模型误差会被规划放大，这叫模型偏差。\n<\/li><li>\n别以为优先级扫描一定比 Dyna 好——实际上维护优先队列有开销，状态少时优势不明显。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n学习中“规划”的数据来源是？（答案：B；解析：模型生成的模拟经验。）\n<ul>\n<li>\nA. 真实交互　B. 模型模拟　C. 人工标注　D. 随机噪声\n<\/li><li>\nDyna 相对纯 Q-learning 的优势在于？（答案：C；解析：每步真实经验后额外做 n 次模拟更新，样本效率高。）\n<\/li><li>\nA. 不需要模型　B. 不需要探索　C. 样本效率更高　D. 一定收敛更快\n<\/li><li>\n分支因子很大时更划算的是？（答案：A；解析：期望更新要算全部分支，采样更新只算一个。）\n<\/li><li>\nA. 采样更新　B. 期望更新　C. 两者等价　D. 都不划算\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n学习用真实经验，规划用模拟经验，更新规则相同。\n<\/li><li>\nDyna = 直接 RL + 模型 + n 次模拟更新。\n<\/li><li>\n优先级扫描按 TD 误差排队。\n<\/li><li>\n分支多时采样更新更省。\n<\/ul>", "ch09": "<h1>第 9 章：基于函数逼近的同轨策略预测<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 6 章、线性代数与梯度下降\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出半梯度 TD 的更新式并解释“半”在哪；说明线性函数逼近下 TD 与 MC 的收敛条件差异；解释状态聚合与粗编码的作用；说出为什么非线性逼近（神经网络）会引入新的不稳定。<\/p>\n<h2>一句话核心<\/h2>\n<p>状态太多存不下表时，用参数化函数 v(s;w) 近似价值，更新就从“改一个格子”变成“沿梯度改一批参数”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：函数逼近的代价（难度：进阶）<\/h3>\n<p>表格式方法每个状态独立存一个数；函数逼近用一组参数覆盖所有状态。好处是泛化（相似状态共享信息），坏处是<strong>改变一个状态的估计会影响其他状态<\/strong>。<\/p>\n<p><strong>实例<\/strong>：用线性 <code>v(s;w)=wᵀx(s)<\/code>，更新一个状态会让所有与它特征相似的状态一起移动。这正是泛化，也是干扰的来源。<\/p>\n<h3>概念 2：半梯度 TD（难度：高难）<\/h3>\n<p><code>w ← w + α[R + γv(S&#x27;;w) - v(S;w)] ∇_w v(S;w)<\/code>。<\/p>\n<p><strong>“半梯度”的含义<\/strong>：真正的梯度下降要求对目标里的 <code>v(S&#x27;;w)<\/code> 也求导（它是 w 的函数），但这里把它当常数。所以这不是真梯度，只是“半”个。后果是它不保证在离轨或非线性情形下收敛。<\/p>\n<p><strong>线性情形为什么仍收敛<\/strong>：对线性逼近，半梯度 TD 收敛到 TD 不动点，且该点的均方误差有界。这是有严格证明的。<\/p>\n<h3>概念 3：状态聚合与粗编码（难度：进阶）<\/h3>\n<ul><li>\n<strong>状态聚合<\/strong>：把状态分组，每组共用一个值。分组方式可以是均匀网格，也可以按访问频率。\n<\/li><li>\n<strong>粗编码<\/strong>：每个状态由多个重叠的感受野表示，特征向量是多个基函数的叠加。重叠带来平滑泛化。\n<\/ul>\n<p><strong>Tile coding<\/strong>：把空间切成多套错位的网格，每个状态在每套网格里落在一个格子里，特征是这些格子的指示。它计算快、泛化可控，是线性逼近的经典强基线。<\/p>\n<h3>概念 4：非线性逼近的不稳定性（难度：高难）<\/h3>\n<p>神经网络逼近时，更新一个状态会通过共享参数影响大量状态，且目标是自己的输出（自举），形成“追逐移动靶”的反馈回路。若步长太大、特征相关性强，就会出现<strong>发散<\/strong>（权重越来越大）。<\/p>\n<p><strong>关键概念“致命三要素”<\/strong>（下一章详述）：函数逼近 + 自举 + 离轨，三者同时出现时容易发散。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  S[&quot;状态 s&quot;] --&gt; F[&quot;特征 x(s)&quot;]\n  F --&gt; V[&quot;v=wᵀx&quot;]\n  V --&gt; E[&quot;TD 误差&quot;]\n  E --&gt; G[&quot;∇v 更新 w&quot;]\n  G --&gt; V<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：注意反馈箭头。参数改了自己又去算目标，这就是自举带来的闭环，也是不稳定之源。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为函数逼近只是“省内存”——实际上它改变了收敛性质，表格式的保证在逼近下大多失效。\n<\/li><li>\n别以为半梯度是笔误——实际上它是刻意近似，为了计算方便，代价是失去真梯度的保证。\n<\/li><li>\n别以为神经网络逼近一定更好——实际上线性方法在特征设计合理时更稳、更快。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n半梯度 TD 中“半”指？（答案：B；解析：目标里的 v(S&#x27;) 未求导，被当常数。）\n<ul>\n<li>\nA. 学习率减半　B. 目标项不求导　C. 只用一半样本　D. 只用正向\n<\/li><li>\n线性半梯度 TD 的收敛保证是？（答案：A；解析：线性情形下收敛到 TD 不动点，均方误差有界。）\n<\/li><li>\nA. 收敛到 TD 不动点　B. 一定全局最优　C. 一定发散　D. 无任何保证\n<\/li><li>\n函数逼近带来的新问题是？（答案：C；解析：更新一个状态会影响其他状态，泛化与干扰并存。）\n<\/li><li>\nA. 需要模型　B. 无法探索　C. 状态间相互干扰　D. 无法计算\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n函数逼近 = 用参数覆盖所有状态，换来泛化也带来干扰。\n<\/li><li>\n半梯度：目标项不求导。\n<\/li><li>\n线性情形收敛到 TD 不动点；非线性可能发散。\n<\/li><li>\n致命三要素：逼近 + 自举 + 离轨。\n<\/ul>", "ch10": "<h1>第 10 章：基于函数逼近的同轨策略控制<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 9 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出半梯度 Sarsa 的更新式；解释 episodic 与 continuing 任务在控制目标上的差别；说出平均收益形式下差分价值与差分动作价值的定义；解释为什么同轨控制也会发散。<\/p>\n<h2>一句话核心<\/h2>\n<p>控制比预测多了一层 max 或采样，函数逼近下这层额外结构会让稳定性问题更严重。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：半梯度 Sarsa（难度：进阶）<\/h3>\n<p><code>w ← w + α[R + γq(S&#x27;,A&#x27;;w) - q(S,A;w)] ∇_w q(S,A;w)<\/code>，配合 ε-贪婪从 q 选动作。<\/p>\n<p><strong>为什么用 q 而不是 v<\/strong>：没有模型时，从 v 无法推出动作的好坏，必须直接估动作价值。所以控制任务里函数逼近的对象通常是 q(s,a;w)，输入是状态动作对。<\/p>\n<h3>概念 2：分幕式与持续式（难度：进阶）<\/h3>\n<p>分幕式任务有终止状态，回报有限；持续式任务没有终点，回报无穷，必须用<strong>平均收益<\/strong>形式：<code>r(π) = lim E[R_t]<\/code>，价值定义为“相对平均收益的偏差” <code>v(s) = E[Σ(R - r(π))]<\/code>。<\/p>\n<p><strong>差值形式的意义<\/strong>：它把“无穷和”变成“相对基准的有限偏差”，这样才能定义收敛目标。<\/p>\n<h3>概念 3：发散的条件（难度：高难）<\/h3>\n<p>同轨控制也可能发散，经典反例是 Baird 反例：状态特征线性相关、更新分布不均匀时，半梯度 Sarsa 的权重会发散。<\/p>\n<p><strong>为什么会发散<\/strong>：函数逼近使不同状态的更新相互干扰；自举使目标依赖于正在被更新的参数；离轨或分布不均让某些状态被过度更新。三者叠加形成正反馈。<\/p>\n<h3>概念 4：收敛的可行方案（难度：高难）<\/h3>\n<ul><li>\n用真正的梯度方法（如 GQ、GTD），它们对目标项也求导，有收敛保证但计算更贵。\n<\/li><li>\n用“目标网络 + 经验回放”（DQN 的做法），打断自举的正反馈。\n<\/li><li>\n缩小步长、正则化、特征归一化，缓解但不根治。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  Q[&quot;q(s,a;w)&quot;] --&gt; A[&quot;ε-贪婪选动作&quot;]\n  A --&gt; E[&quot;环境给 R, S&#x27;&quot;]\n  E --&gt; T[&quot;TD 目标&quot;]\n  T --&gt; U[&quot;半梯度更新 w&quot;]\n  U --&gt; Q<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：环绕一圈，参数既定义策略又定义目标。这个闭环是发散风险的来源。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为同轨就一定安全——实际上只要用函数逼近和自举，同轨也会发散。\n<\/li><li>\n别以为平均收益只是“把奖励减个常数”——实际上它改变了价值的定义与更新目标。\n<\/li><li>\n别以为目标网络只是工程技巧——实际上它切断了自举的正反馈，有稳定化作用。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n控制任务里函数逼近的对象通常是？（答案：B；解析：无模型时只能用 q(s,a) 选动作。）\n<ul>\n<li>\nA. v(s)　B. q(s,a)　C. 模型 p　D. 奖励函数\n<\/li><li>\n平均收益形式的价值定义为？（答案：C；解析：相对平均收益的累积偏差期望。）\n<\/li><li>\nA. 总奖励　B. 折扣总奖励　C. 相对平均收益的偏差累积　D. 最大奖励\n<\/li><li>\n目标网络稳定训练的原理是？（答案：A；解析：用旧参数算目标，打断自举正反馈。）\n<\/li><li>\nA. 用滞后参数算目标　B. 加快学习率　C. 增加探索　D. 减少状态\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n控制用 q 不用 v；更新是半梯度。\n<\/li><li>\n持续式任务用平均收益与差分价值。\n<\/li><li>\n同轨 + 逼近 + 自举仍可能发散（Baird 反例）。\n<\/li><li>\n稳定手段：真梯度、目标网络、小步长。\n<\/ul>", "ch11": "<h1>第 11 章：基于函数逼近的离轨策略方法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 9、10 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说出离轨学习的两大用处；写出重要性采样比率的连乘形式；解释普通与加权重要性采样在方差上的差异；说明 GTD 与强调 TD 为什么能收敛。<\/p>\n<h2>一句话核心<\/h2>\n<p>离轨让你“用别人的经验学自己的策略”，代价是分布不匹配，必须修正或改变更新方式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：离轨的两大用处（难度：进阶）<\/h3>\n<ol><li>\n<strong>从示范中学习<\/strong>：人类或别的智能体的经验可以复用。\n<\/li><li>\n<strong>探索与利用分离<\/strong>：用探索性策略采数据，同时学一个贪婪的目标策略。\n<\/ol>\n<h3>概念 2：重要性采样修正（难度：高难）<\/h3>\n<p><code>ρ_{t:T-1} = Π_{k=t}^{T-1} π(A_k|S_k)/b(A_k|S_k)<\/code>。目标策略概率大于行为策略时 ρ&gt;1，样本被放大；反之缩小。<\/p>\n<p><strong>方差问题<\/strong>：连乘使 ρ 随长度指数变化。T 长时几乎必有某个 ρ 极大或极小，导致估计不稳定。<\/p>\n<p><strong>两种估计<\/strong>：普通 IS 无偏但方差无界；加权 IS 有偏但方差小且有界。实践上基本用加权。<\/p>\n<h3>概念 3：离轨 TD 与致命三要素（难度：高难）<\/h3>\n<p>离轨 TD 用 ρ 乘 TD 误差更新。<strong>致命三要素<\/strong>：函数逼近、自举、离轨。三者同时存在时，更新算子的谱半径可能大于 1，权重发散。<\/p>\n<p><strong>为什么要强调这个<\/strong>：因为很多“看起来能用”的算法组合实际会崩；这条结论给出了判断标准——只要你的设定同时踩中这三样，就要额外做稳定性处理。<\/p>\n<h3>概念 4：GTD 与强调 TD（难度：高难）<\/h3>\n<ul><li>\n<strong>GTD<\/strong>：在更新中加一个对价值函数梯度的修正项（跟着 β 的次级学习），使更新方向对齐真正的梯度，从而保证收敛。\n<\/li><li>\n<strong>强调 TD（Emphatic TD）<\/strong>：用“强调权重”调整不同时间步的重要性，让离轨更新在收敛性上有保证，且不依赖额外的次级步长。\n<\/ul>\n<p><strong>共同思路<\/strong>：不改数据，改更新规则，让算子的谱半径回到 1 以内。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  B[&quot;行为策略 b 采数据&quot;] --&gt; R[&quot;重要性比率 ρ&quot;]\n  R --&gt; T[&quot;修正后的 TD 更新&quot;]\n  T --&gt; P[&quot;目标策略 π 的价值&quot;]\n  P -.-&gt;|&quot;策略改进&quot;| B<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：比率是“把 b 的分布掰成 π 的分布”的校正因子。比率越偏离 1，估计越不稳。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为离轨一定更快——实际上重要性采样带来的方差常常抵消掉数据复用的收益。\n<\/li><li>\n别以为加权 IS 有偏就不能用——实际上它一致且方差小，是工程首选。\n<\/li><li>\n别以为致命三要素只影响理论——实际上不加处理时训练真的会崩。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n离轨学习的核心问题是？（答案：B；解析：数据分布与目标策略不匹配，需要修正。）\n<ul>\n<li>\nA. 计算太慢　B. 分布不匹配　C. 需要模型　D. 无法探索\n<\/li><li>\n重要性采样比率的方差随序列长度如何变化？（答案：C；解析：连乘导致指数级变化，方差迅速增大。）\n<\/li><li>\nA. 减小　B. 不变　C. 迅速增大　D. 先增后减\n<\/li><li>\n致命三要素指的是？（答案：A；解析：函数逼近、自举、离轨。）\n<\/li><li>\nA. 逼近、自举、离轨　B. 探索、奖励、策略　C. 学习率、折扣、批大小　D. 状态、动作、奖励\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n离轨 = 用 b 的数据学 π，必须用 ρ 修正。\n<\/li><li>\n普通 IS 无偏方差大，加权 IS 有偏方差小。\n<\/li><li>\n逼近 + 自举 + 离轨 = 可能发散。\n<\/li><li>\nGTD、强调 TD 靠改更新规则恢复收敛。\n<\/ul>", "ch12": "<h1>第 12 章：资格迹<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 7、9、11 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出 λ 回报的定义并说明它与 n 步回报的关系；解释资格迹在做什么（把“哪一步该为结果负责”记录下来）；区分累积迹与替换迹；说明 TD(λ) 为什么是 MC 与 TD 的统一。<\/p>\n<h2>一句话核心<\/h2>\n<p>资格迹给每个“最近被访问过的状态”记一个随时间衰减的信用分，让一次结果能按信用分回溯地更新很多步之前的状态。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：λ 回报（难度：高难）<\/h3>\n<p><code>G_t^λ = (1-λ) Σ_{n=1}^∞ λ^{n-1} G_{t:t+n}<\/code>，是所有权 n 步回报的几何加权平均。λ=0 时只剩 G_{t:t+1}（TD(0)）；λ=1 时退化为完整回报（MC）。<\/p>\n<p><strong>为什么用几何权重<\/strong>：越远的 n 步回报权重越小，符合“越远越不确定”的直觉，且权重和为 1（(1-λ)Σλ^{n-1}=1）。<\/p>\n<h3>概念 2：前向与后向视角（难度：高难）<\/h3>\n<ul><li>\n<strong>前向视角<\/strong>：直接算 λ 回报再更新，需要看完整未来，不能在线。\n<\/li><li>\n<strong>后向视角<\/strong>：资格迹 <code>z_t = γλ z_{t-1} + ∇v(S_t)<\/code>，每次得到新奖励就按 z 更新所有权重。两者在数学上等价（对线性情形严格相等）。\n<\/ul>\n<p><strong>为什么后向能在线<\/strong>：因为迹累积了“最近哪些状态参与了”，所以来一个新奖励就能立刻按迹分配信用。<\/p>\n<h3>概念 3：累积迹与替换迹（难度：高难）<\/h3>\n<ul><li>\n<strong>累积迹<\/strong>：每次访问就加 1（或加梯度），多次访问会累加很高。\n<\/li><li>\n<strong>替换迹<\/strong>：每次访问把该维直接置为 1（或梯度值），不累加。替换迹更稳，因为它避免了同一状态被短时间反复访问导致的过度更新。\n<\/ul>\n<h3>概念 4：Sarsa(λ) 与荷兰迹（难度：高难）<\/h3>\n<p>Sarsa(λ) 对 q 用迹更新，收敛性比单步 Sarsa 好，且能更快传播信用。<strong>荷兰迹<\/strong>是一种特殊构造，使“迹的加权和等于 λ 回报”，在函数逼近下也有更好的性质。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  S1[&quot;访问 s1&quot;] --&gt; Z1[&quot;迹+1&quot;]\n  S2[&quot;访问 s2&quot;] --&gt; Z2[&quot;迹+1 同时旧迹衰减&quot;]\n  R[&quot;收到奖励&quot;] --&gt; U[&quot;按迹分配更新&quot;]\n  Z1 --&gt; U\n  Z2 --&gt; U<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：迹像一个短期记忆表，记录“最近谁参与过”。奖励来了按这张表分账。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 λ 只是一个超参数——实际上它决定了“信用回溯多远”，λ=1 就等于 MC。\n<\/li><li>\n别以为前向和后向只是实现差异——实际上它们在非线性逼近下不再严格等价。\n<\/li><li>\n别以为迹越大越好——实际上迹会让早期状态被过度更新，替换迹就是为了抑制这一点。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nλ=0 的 λ 回报等价于？（答案：A；解析：只剩一步回报 G_{t:t+1}，即 TD(0)。）\n<ul>\n<li>\nA. TD(0)　B. MC　C. 动态规划　D. 树回溯\n<\/li><li>\n资格迹的作用是？（答案：B；解析：记录最近参与的状态，把信用反向分配。）\n<\/li><li>\nA. 加速探索　B. 记录信用并反向分配　C. 减少状态数　D. 替代模型\n<\/li><li>\n替换迹相对累积迹的优势是？（答案：C；解析：不累加，避免重复访问导致过度更新。）\n<\/li><li>\nA. 计算更快　B. 内存更小　C. 避免重复访问的过度更新　D. 不需要 λ\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nλ 回报 = 所有 n 步回报的几何加权平均。\n<\/li><li>\n前向看未来，后向用迹在线更新，线性情形等价。\n<\/li><li>\n替换迹比累积迹稳。\n<\/li><li>\nTD(λ) 在 λ=0 与 λ=1 两端连接 TD 与 MC。\n<\/ul>", "ch13": "<h1>第 13 章：策略梯度方法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 9、11 章、微积分\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出策略梯度定理的形式并说明为什么不需要环境模型；推出 REINFORCE 的更新式；解释基线的引入为什么不改变期望；区分 actor-critic 与纯策略梯度的差别。<\/p>\n<h2>一句话核心<\/h2>\n<p>不再通过价值间接决定动作，而是直接把策略参数化，用“让高回报动作概率变大”的梯度去调它。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：策略参数化（难度：进阶）<\/h3>\n<p><code>π(a|s,θ)<\/code>，离散动作用 softmax，连续动作用高斯（输出均值与方差）。<\/p>\n<p><strong>与值函数方法的差别<\/strong>：值函数方法先估价值再隐式导出策略；策略梯度直接改策略，能处理连续动作、能学随机策略（在博弈中有用）。<\/p>\n<h3>概念 2：策略梯度定理（难度：高难）<\/h3>\n<p><code>∇J(θ) = Σ_s d_π(s) Σ_a q_π(s,a) ∇π(a|s,θ)<\/code>，可改写为 <code>E[Σ_t ∇log π(A_t|S_t,θ) q_π(S_t,A_t)]<\/code>。<\/p>\n<p><strong>为什么不需要模型<\/strong>：定理把“策略参数变化如何影响状态分布”那一项消掉了，只剩下对动作概率的梯度。这是它最漂亮的地方。<\/p>\n<p><strong><code>∇log π<\/code> 的含义<\/strong>：它指向“让这个被选动作概率变大”的方向。乘上 q 就是“如果这个动作价值高，就往这个方向多推”。<\/p>\n<h3>概念 3：REINFORCE（难度：高难）<\/h3>\n<p>用一幕的实际回报 G_t 代替 q：<code>θ ← θ + α Σ_t G_t ∇log π(A_t|S_t,θ)<\/code>。<\/p>\n<p><strong>问题<\/strong>：G_t 方差很大，学习慢。<\/p>\n<h3>概念 4：基线（难度：高难）<\/h3>\n<p>把 G_t 换成 <code>G_t - b(s)<\/code>。<strong>因为 <code>E[b(s)∇log π] = b(s)Σ_a ∇π(a|s) = b(s)∇1 = 0<\/code><\/strong>，减去任意只依赖状态的基线不改变期望，只降低方差。<\/p>\n<p>常用基线是状态价值 <code>v(s;w)<\/code>，用另一个网络学出来。这就是 actor-critic 的雏形。<\/p>\n<h3>概念 5：Actor-Critic 与连续动作（难度：高难）<\/h3>\n<ul><li>\n<strong>Actor<\/strong>：策略网络，负责选动作。\n<\/li><li>\n<strong>Critic<\/strong>：价值网络，负责评价，提供低方差的优势估计 <code>A = R + γv(S&#x27;) - v(S)<\/code>。\n<\/ul>\n<p><strong>连续动作<\/strong>：输出均值 μ(s) 与标准差 σ(s)，动作从高斯采样。更新时对 μ 和 σ 分别求导。σ 学出来代表探索强度，会随训练自适应。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  S[&quot;状态 s&quot;] --&gt; P[&quot;策略网络 π(a|s,θ)&quot;]\n  P --&gt; A[&quot;采样动作 a&quot;]\n  A --&gt; E[&quot;环境&quot;]\n  E --&gt; R[&quot;奖励与新状态&quot;]\n  R --&gt; C[&quot;价值网络 估 v&quot;]\n  C --&gt; G[&quot;优势 A&quot;]\n  G --&gt; U[&quot;更新 θ&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两条网络分别负责“做”和“评”。critic 的价值越准，actor 的更新越稳。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为策略梯度不需要值函数——实际上纯 REINFORCE 可以不用，但加 critic 能大幅降方差。\n<\/li><li>\n别以为基线可以随便改——实际上它必须与动作无关，否则会引入偏差。\n<\/li><li>\n别以为策略梯度只能处理离散动作——实际上它对连续动作更自然，值函数方法反而要先做 argmax 近似。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n策略梯度定理不需要模型的关键在于？（答案：B；解析：状态分布对参数的导数项被消掉。）\n<ul>\n<li>\nA. 用了神经网络　B. 状态分布导数项被消去　C. 用了采样　D. 用了基线\n<\/li><li>\n减去基线的期望变化是？（答案：A；解析：E[b∇logπ]=0，期望不变方差降低。）\n<\/li><li>\nA. 期望不变、方差降低　B. 期望变大　C. 期望变小　D. 方差变大\n<\/li><li>\nActor-Critic 中 critic 的作用是？（答案：C；解析：提供低方差的价值/优势估计。）\n<\/li><li>\nA. 选动作　B. 探索　C. 评价动作、提供优势估计　D. 存储经验\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n策略梯度：∇logπ 乘价值，直接推高好动作的概率。\n<\/li><li>\n定理消掉了状态分布导数，所以无模型可用。\n<\/li><li>\n基线不改变期望，只降方差。\n<\/li><li>\nActor 做、Critic 评，连续动作输出均值方差。\n<\/ul>", "ch14": "<h1>第 14 章：心理学<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 6 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说清经典条件反射与操作性条件反射的差别；解释“次级强化物”与“延迟强化”的关系；说明动物行为中的探索—利用权衡与 RL 的对应。<\/p>\n<h2>一句话核心<\/h2>\n<p>动物学习行为的方式，与强化学习的核心机制高度同构：都是“用预测误差驱动更新”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：两种条件反射（难度：基础）<\/h3>\n<p><strong>经典条件反射<\/strong>（巴甫洛夫）：中性刺激与无条件刺激配对，形成刺激—刺激联结。<strong>操作性条件反射<\/strong>（斯金纳）：行为与后果联结，形成行为—结果联结。强化学习对应的是后者。<\/p>\n<h3>概念 2：次级强化与延迟（难度：进阶）<\/h3>\n<p>动物会把中性刺激变成“次级强化物”，因为它预测了未来的奖励。这正是 TD 学习在做的事：一个刺激的价值等于它对未来奖励的预测。<\/p>\n<p><strong>延迟强化<\/strong>：奖励延迟时，动物会把信用分配到“奖励到来之前的那个刺激”上，而不是所有刺激。这对应资格迹的信用分配。<\/p>\n<h3>概念 3：探索与习惯（难度：进阶）<\/h3>\n<p>动物在不确定环境里会保持一定探索；在稳定环境里会形成习惯（低认知成本的自动行为）。这与 ε-贪心的“长期保留小比例探索”和“模型-free 的习惯性策略”都能对应。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  S[&quot;刺激&quot;] --&gt; P[&quot;预测价值&quot;]\n  P --&gt; E[&quot;预测误差&quot;]\n  E --&gt; U[&quot;更新预测&quot;]\n  U --&gt; P<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这个环与 TD 学习的更新环结构完全一致，只是“预测”由神经系统完成。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为心理学这一章是“闲聊”——实际上它提供了强化学习概念的历史来源，很多术语（强化、折扣、习惯）都是从行为主义借来的。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n强化学习最接近哪种条件反射？（答案：B；解析：行为—结果联结，即操作性条件反射。）\n<ul>\n<li>\nA. 经典条件反射　B. 操作性条件反射　C. 观察学习　D. 顿悟\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n操作性条件反射对应 RL 的行为—结果框架。\n<\/li><li>\n次级强化物 = 对未来奖励的预测，对应价值函数。\n<\/li><li>\n延迟强化需要信用分配，对应资格迹。\n<\/ul>", "ch15": "<h1>第 15 章：神经科学<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：第 14 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说出多巴胺信号与 TD 误差的对应关系；解释“奖励预测误差”在实验中如何被观测到；说明大脑的强化学习机制与人工 RL 的差异。<\/p>\n<h2>一句话核心<\/h2>\n<p>多巴胺神经元的活动模式，与 TD 误差的曲线形状高度吻合——这是“算法在生物体上找到对应物”的最强证据之一。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：奖励预测误差（难度：进阶）<\/h3>\n<p>实验现象：动物未预期地得到奖励时，多巴胺水平骤升；预期会得到却没得到时，骤降；一直预期会得到时，没有变化。<\/p>\n<p><strong>这正好是 δ = R + γV(S&#x27;) - V(S)<\/strong>：当 V(S) 已经预测到奖励，R+γV(S&#x27;)-V(S) 接近 0，信号不变化；预测落空则 δ 为负。<\/p>\n<h3>概念 2：时间上的对应（难度：进阶）<\/h3>\n<p>若奖励总在刺激后固定时间出现，多巴胺峰值会从“奖励时刻”逐渐前移到“刺激时刻”。这正是价值从奖励向预测刺激转移的过程，与 TD 学习的收敛行为一致。<\/p>\n<h3>概念 3：差异与局限（难度：进阶）<\/h3>\n<p>大脑同时做模型-free 与模型-based 的决策，且两者会竞争；人工 RL 通常只实现其中一种。此外生物体的探索机制、记忆结构远比 ε-贪心复杂。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  R[&quot;奖励到来&quot;] --&gt; D[&quot;多巴胺变化&quot;]\n  P[&quot;已有预测&quot;] --&gt; D\n  D --&gt;|&quot;正误差 增强&quot;| L[&quot;学习&quot;]\n  D --&gt;|&quot;负误差 抑制&quot;| L<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：多巴胺不是“奖励信号”，而是“奖励与预测之差”的信号。这是本章最关键的一句。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为多巴胺等于快乐——实际上它更像误差信号，快乐是另一个层面的描述。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n多巴胺信号最接近哪个量？（答案：B；解析：奖励预测误差，即 TD 误差。）\n<ul>\n<li>\nA. 累积奖励　B. TD 误差　C. 学习率　D. 折扣因子\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n多巴胺 ≈ TD 误差，不是奖励本身。\n<\/li><li>\n峰值随学习前移，对应价值转移到预测刺激。\n<\/li><li>\n大脑同时有模型-free 与模型-based 两套。\n<\/ul>", "ch16": "<h1>第 16 章：应用及案例分析<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 6、13 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说清 TD-Gammon 为什么用 TD(λ) 而不是纯 MC；列出 AlphaGo 中策略网络、价值网络、MCTS 各自的分工；判断一个应用场景是否适合用 RL 而非监督学习。<\/p>\n<h2>一句话核心<\/h2>\n<p>成功的 RL 应用往往不是“纯 RL”，而是“RL + 强先验 + 搜索”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：TD-Gammon（难度：进阶）<\/h3>\n<p>西洋双陆棋程序，用 TD(λ) 学一个价值网络，自我对弈产生数据。它证明了“不用人类棋谱、只靠自我对弈 + TD 学习”可以达到顶尖水平。<\/p>\n<p><strong>为什么用 TD 而不是 MC<\/strong>：棋局状态空间巨大、回报稀疏，MC 需要等一局结束才能更新；TD 每步都能更新，样本效率高得多。<\/p>\n<h3>概念 2：AlphaGo 的三个组件（难度：进阶）<\/h3>\n<ul><li>\n<strong>策略网络<\/strong>：给出落子概率，缩小搜索宽度。\n<\/li><li>\n<strong>价值网络<\/strong>：评估局面，替代深搜到底。\n<\/li><li>\n<strong>MCTS<\/strong>：把两者结合，按访问次数与价值做树搜索。\n<\/ul>\n<p><strong>为什么需要组合<\/strong>：纯策略网络会漏掉罕见好手；纯搜索在巨大分支下算不完；价值网络给搜索提供“早停”的依据。<\/p>\n<h3>概念 3：适用性判断（难度：进阶）<\/h3>\n<p>适合 RL 的信号：序列决策、反馈延迟、环境可模拟、有明确的奖励定义。不适合：一次性决策、标签充足、错误代价极高且不可模拟。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  P[&quot;策略网络 缩宽度&quot;] --&gt; M[&quot;MCTS&quot;]\n  V[&quot;价值网络 缩深度&quot;] --&gt; M\n  M --&gt; A[&quot;选点&quot;]\n  A --&gt; S[&quot;自我对弈&quot;]\n  S --&gt; T[&quot;训练两个网络&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：策略网络和价值网络分别解决搜索的“宽”和“深”两个难题。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 AlphaGo 全靠 RL——实际上它大量使用了监督学习（人类棋谱预训练）与搜索。\n<\/li><li>\n别以为自我对弈一定有效——实际上没有强先验和搜索，自我对弈容易退化。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nTD-Gammon 用 TD(λ) 而不用 MC 的主因是？（答案：B；解析：回报稀疏且延迟，TD 能每步更新，样本效率高。）\n<ul>\n<li>\nA. TD 更准　B. 样本效率更高　C. MC 不能用于棋类　D. TD 不需要探索\n<\/li><li>\nAlphaGo 中价值网络的主要作用是？（答案：C；解析：评估局面，减少搜索深度。）\n<\/li><li>\nA. 生成棋谱　B. 缩小搜索宽度　C. 评估局面减少搜索深度　D. 存储经验\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nTD-Gammon 证明自我对弈 + TD(λ) 可行。\n<\/li><li>\nAlphaGo = 策略网络 + 价值网络 + MCTS。\n<\/li><li>\n成功应用几乎都不是“纯 RL”。\n<\/ul>", "ch17": "<h1>第 17 章：前沿技术<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：全书\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说出深度强化学习的三个主要难点；解释通用价值函数与元学习的思路；说明为什么“探索”在稀疏奖励下是核心瓶颈。<\/p>\n<h2>一句话核心<\/h2>\n<p>强化学习的前沿问题集中在三处：样本效率、稳定性、以及稀疏奖励下的探索。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：深度 RL 的三难（难度：进阶）<\/h3>\n<ol><li>\n<strong>样本效率低<\/strong>：DQN 在 Atari 上要几百万帧，人几分钟就会。\n<\/li><li>\n<strong>不稳定<\/strong>：函数逼近 + 自举 + 离轨的三要素，靠目标网络与经验回放缓解。\n<\/li><li>\n<strong>超参敏感<\/strong>：学习率、回放大小、目标网络更新频率互相牵制。\n<\/ol>\n<h3>概念 2：经验回放与目标网络（难度：进阶）<\/h3>\n<ul><li>\n<strong>经验回放<\/strong>：把转移存进缓冲区，随机采样训练，打破样本时间相关性。\n<\/li><li>\n<strong>目标网络<\/strong>：用一份滞后的参数算 TD 目标，定期同步，避免“追自己”。\n<\/ul>\n<p><strong>这两者是 DQN 能工作的关键<\/strong>，不是可选项。<\/p>\n<h3>概念 3：通用价值函数与元学习（难度：高难）<\/h3>\n<p><strong>通用价值函数<\/strong>：不针对单一任务，而是学一个“对大量任务都近似最优”的价值函数，新任务只需少量交互就能适应。<\/p>\n<p><strong>元学习<\/strong>：学“怎么学”，让初始化参数或超参数本身可通过少量样本快速适应。<\/p>\n<h3>概念 4：稀疏奖励与探索（难度：高难）<\/h3>\n<p>奖励几乎全为 0 时，随机探索几乎不可能碰到奖励，梯度信号为零。常用手段：内在奖励（好奇心、计数）、课程学习（先易后难）、示范数据、分层 RL。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  S[&quot;样本效率&quot;] --&gt; P[&quot;深度 RL 的瓶颈&quot;]\n  T[&quot;稳定性&quot;] --&gt; P\n  E[&quot;探索&quot;] --&gt; P\n  P --&gt; R[&quot;回放/目标网络/内在奖励&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三个瓶颈各有对应手段，但没有一个手段能同时解决三者。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为深度 RL 就是“把 Q 表换成神经网络”——实际上稳定性需要一整套配套机制。\n<\/li><li>\n别以为探索只靠 ε——实际上稀疏奖励下需要内在动机或示范。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n经验回放的主要作用是？（答案：B；解析：打破样本时间相关性，稳定训练。）\n<ul>\n<li>\nA. 增加探索　B. 打破样本相关性　C. 减少内存　D. 替代目标网络\n<\/li><li>\n稀疏奖励下最直接的困难是？（答案：C；解析：几乎采不到奖励，梯度信号为零。）\n<\/li><li>\nA. 计算太慢　B. 内存不够　C. 探索效率极低　D. 无法并行\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三难：样本效率、稳定性、探索。\n<\/li><li>\nDQN 的两个支柱：经验回放 + 目标网络。\n<\/li><li>\n稀疏奖励靠内在奖励、课程、示范、分层。\n<\/ul>", "c01": "<h1>自举与采样<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6、9 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>自举指用当前的估计值去更新另一个估计值；采样指用一次实际观测近似期望。两者是 TD 方法的两根支柱。<\/p>\n<h2>为什么重要<\/h2>\n<p>所有偏差—方差权衡都来自这两件事的组合：自举降方差但引入偏差，采样无偏但方差大。理解这一点，才能判断某个算法为什么在某类问题上不稳。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  B[&quot;自举 用估计更新估计&quot;] --&gt; T[&quot;TD&quot;]\n  S[&quot;采样 用观测近似期望&quot;] --&gt; T\n  T --&gt; D[&quot;偏差小方差中&quot;]\n  M[&quot;纯采样 MC&quot;] --&gt; V[&quot;无偏高方差&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>自举的代价是“目标是移动的”：参数一改，目标也变。这就是为什么函数逼近下会出现追逐移动靶的不稳定。采样的代价是方差：单次观测与期望的差距可能很大。<\/p>\n<p>n 步方法本质上是这两者的连续插值：n 小自举多，n 大采样多。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为自举是“作弊”<\/strong>——它是用已有信息做合理外推，只要收敛条件满足，结果是对的。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 6 章<\/td><td>TD(0)<\/td><td>一步自举<\/td><\/tr><tr><td>第 7 章<\/td><td>n 步<\/td><td>连续插值<\/td><\/tr><tr><td>第 9 章<\/td><td>函数逼近<\/td><td>自举 + 逼近导致不稳定<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：贝尔曼方程\n<\/li><li>\n后续：半梯度、致命三要素\n<\/ul>", "c02": "<h1>探索与利用<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2、13 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>利用是选当前估计最好的动作，探索是尝试信息不足的动作；两者的张力是所有序贯决策问题的核心。<\/p>\n<h2>为什么重要<\/h2>\n<p>不探索会永久错过更优动作；只探索则浪费收益。几乎所有 RL 算法的性能差异，一半来自探索策略的设计。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  U[&quot;不确定性大的动作&quot;] --&gt; E[&quot;探索&quot;]\n  Q[&quot;估计高的动作&quot;] --&gt; X[&quot;利用&quot;]\n  E --&gt; T[&quot;长期收益&quot;]\n  X --&gt; T<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>四种主流做法：ε-贪心（盲探）、乐观初始值（用高初值骗探索）、UCB（按不确定性加分）、汤普森采样（按后验概率抽动作）。<\/p>\n<p>在深度 RL 里还有内在奖励（好奇心、计数）与熵正则，它们把探索写进目标函数而不是行为规则。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为探索只是“加随机”<\/strong>——结构化探索（按不确定性）通常效率高一个数量级。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>赌博机<\/td><td>ε-贪心、UCB、乐观初值<\/td><\/tr><tr><td>第 13 章<\/td><td>策略梯度<\/td><td>熵正则鼓励随机策略<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：动作价值\n<\/li><li>\n后续：内在奖励、课程学习\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：问题与要素<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：导论<\/a><br>检查点：用井字棋例子说清价值与自举<\/li><li class='path-step' id='path-02'><strong>步骤 02：探索与利用<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：多臂赌博机<\/a><br>检查点：手算一次 UCB 的选择<\/li><li class='path-step' id='path-03'><strong>步骤 03：MDP 与贝尔曼方程<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：有限马尔可夫决策过程<\/a><br>检查点：手解两状态互相转移的价值方程<\/li><li class='path-step' id='path-04'><strong>步骤 04：动态规划<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：动态规划<\/a><br>检查点：说出策略迭代与价值迭代的差别<\/li><li class='path-step' id='path-05'><strong>步骤 05：蒙特卡洛<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：蒙特卡洛方法<\/a><br>检查点：区分首次访问与每次访问，说明 IS 的风险<\/li><li class='path-step' id='path-06'><strong>步骤 06：时序差分<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：时序差分学习<\/a><br>检查点：写出 Sarsa 与 Q-learning 并说出行为差异<\/li><li class='path-step' id='path-07'><strong>步骤 07：n 步自举<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：n 步自举法<\/a><br>检查点：说明 n 如何连续调节偏差与方差<\/li><li class='path-step' id='path-08'><strong>步骤 08：规划与学习<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：基于表格型方法的规划和学习<\/a><br>检查点：画出 Dyna 结构并解释优先级扫描<\/li><li class='path-step' id='path-09'><strong>步骤 09：函数逼近预测<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：基于函数逼近的同轨策略预测<\/a><br>检查点：写出半梯度 TD 并说明“半”在哪<\/li><li class='path-step' id='path-10'><strong>步骤 10：函数逼近控制<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章：基于函数逼近的同轨策略控制<\/a><br>检查点：解释 Baird 反例与目标网络的作用<\/li><li class='path-step' id='path-11'><strong>步骤 11：离轨策略<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章：基于函数逼近的离轨策略方法<\/a><br>检查点：写出重要性采样比率并说明致命三要素<\/li><li class='path-step' id='path-12'><strong>步骤 12：资格迹<\/strong><br>阅读：<a href=\"#/chapter/ch12\">第 12 章：资格迹<\/a><br>检查点：说明 λ 回报与 TD(λ) 两端的关系<\/li><li class='path-step' id='path-13'><strong>步骤 13：策略梯度<\/strong><br>阅读：<a href=\"#/chapter/ch13\">第 13 章：策略梯度方法<\/a><br>检查点：推出 REINFORCE 并解释基线为何不引入偏差<\/li><li class='path-step' id='path-14'><strong>步骤 14：心理学与神经科学<\/strong><br>阅读：<a href=\"#/chapter/ch14\">第 14 章：心理学<\/a>、<a href=\"#/chapter/ch15\">第 15 章：神经科学<\/a><br>检查点：说清多巴胺与 TD 误差的对应<\/li><li class='path-step' id='path-15'><strong>步骤 15：应用与前沿<\/strong><br>阅读：<a href=\"#/chapter/ch16\">第 16 章：应用及案例分析<\/a>、<a href=\"#/chapter/ch17\">第 17 章：前沿技术<\/a><br>检查点：判断一个场景是否适合 RL<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__quiz_ch01__": "<h1>测验：第 1 章：导论<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 强化学习与监督学习最本质的差别？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 用了神经网络<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> 数据更多<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 无即时标签且数据分布随策略变化<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 需要 GPU<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 四要素中直接决定行为的是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 策略<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 奖励<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 价值函数<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 模型<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 自举的含义？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 用奖励更新<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 用自己的估计更新自己的估计<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 用对手策略更新<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 用随机数更新<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：多臂赌博机<\/h1><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q1.<
