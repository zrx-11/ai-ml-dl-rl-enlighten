<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>动手学深度学习</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
.layout{display:flex;min-height:100vh}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:0;height:100vh;overflow-y:auto}
.sidebar h1{font-size:17px;margin:2px 0 2px}
.sidebar .sub{font-size:12px;color:var(--muted);margin-bottom:10px}
#q{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page blockquote blockquote{border-color:var(--muted)}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.topbar{position:sticky;top:0;background:var(--bg);padding:8px 0;display:flex;justify-content:flex-end;z-index:10}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
.empty{color:var(--muted);padding:20px 0}
@media print{.sidebar,.topbar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:760px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}}
</style>
</head>
<body>
<div class="layout">
  <aside class="sidebar">
    <h1>动手学深度学习</h1>
    <div class="sub">每个模型都配可运行代码，原理与实现同步推进</div>
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div class="sub" id="progress-label">进度 0%</div>
    <input id="q" type="search" placeholder="搜索章节 / 概念 / 术语 / 全文…">
    <nav id="nav"></nav>
  </aside>
  <main class="main">
    <div class="topbar"><button id="theme-btn">🌙 深色</button></div>
    <div id="view" class="page"></div>
  </main>
</div>

["regularization"]}, {"id": "f10", "chapterId": "ch03", "front": "梯度裁剪怎么做？", "back": "梯度范数超阈值时按 θ/||g|| 缩放。", "tags": ["stability"]}, {"id": "f11", "chapterId": "ch04", "front": "Module 封装了什么？", "back": "子层结构、参数登记、前向逻辑。", "tags": ["module"]}, {"id": "f12", "chapterId": "ch04", "front": "参数与超参数的区别？", "back": "参数由梯度更新，超参数由验证集选择。", "tags": ["parameter"]}, {"id": "f13", "chapterId": "ch04", "front": "自定义层为什么要显式登记参数？", "back": "优化器只遍历登记过的参数。", "tags": ["layer"]}, {"id": "f14", "chapterId": "ch05", "front": "卷积输出尺寸公式？", "back": "(H-K+2P)/S+1。", "tags": ["cnn"]}, {"id": "f15", "chapterId": "ch05", "front": "多通道卷积核的形状？", "back": "(输出通道, 输入通道, 核高, 核宽)。", "tags": ["cnn"]}, {"id": "f16", "chapterId": "ch05", "front": "1×1 卷积为什么有用？", "back": "等价于通道维全连接，可降维或升维且参数少。", "tags": ["cnn"]}, {"id": "f17", "chapterId": "ch05", "front": "池化反向传播规则？", "back": "梯度只传给正向取到最大值的位置。", "tags": ["pooling"]}, {"id": "f18", "chapterId": "ch05", "front": "LeNet 的结构要点？", "back": "两个卷积池化块 + 三个全连接层。", "tags": ["lenet"]}, {"id": "f19", "chapterId": "ch06", "front": "RNN 隐状态更新式？", "back": "h_t=φ(W_hh h_{t-1}+W_xh x_t+b_h)。", "tags": ["rnn"]}, {"id": "f20", "chapterId": "ch06", "front": "BPTT 梯度为什么会爆炸或消失？", "back": "沿时间连乘雅可比，范数大于 1 爆炸、小于 1 消失。", "tags": ["bptt"]}, {"id": "f21", "chapterId": "ch06", "front": "LSTM 细胞状态为什么能保留长程信息？", "back": "更新是加法，梯度可近似原样回传。", "tags": ["lstm"]}, {"id": "f22", "chapterId": "ch06", "front": "GRU 的两个门？", "back": "重置门与更新门。", "tags": ["gru"]}, {"id": "f23", "chapterId": "ch06", "front": "双向 RNN 的适用条件？", "back": "整段输入已知，不需要实时输出。", "tags": ["rnn"]}, {"id": "f24", "chapterId": "ch07", "front": "动量法的更新式？", "back": "v_t=βv_{t-1}+g_t，θ←θ-ηv_t。", "tags": ["optimizer"]}, {"id": "f25", "chapterId": "ch07", "front": "AdaGrad 与 RMSProp 的差别？", "back": "前者累加平方导致停滞，后者用指数移动平均。", "tags": ["optimizer"]}, {"id": "f26", "chapterId": "ch07", "front": "Adam 的偏置修正公式？", "back": "m̂=m/(1-β₁^t)，v̂=v/(1-β₂^t)。", "tags": ["adam"]}, {"id": "f27", "chapterId": "ch07", "front": "学习率预热的动机？", "back": "避免训练初期梯度过大导致发散。", "tags": ["schedule"]}, {"id": "f28", "chapterId": "ch08", "front": "数据并行与模型并行的区别？", "back": "前者分数据、每卡全模型；后者切模型、跨卡传中间结果。", "tags": ["distributed"]}, {"id": "f29", "chapterId": "ch08", "front": "显存不足的四种缓解手段？", "back": "减 batch、梯度累积、混合精度、重计算。", "tags": ["memory"]}, {"id": "f30", "chapterId": "ch08", "front": "异步计算的主要代价？", "back": "调试困难、计时需显式同步。", "tags": ["performance"]}, {"id": "f31", "chapterId": "ch09", "front": "图像增广为什么等价于正则？", "back": "扩大分布覆盖，逼模型学不变特征而非记忆位置。", "tags": ["augmentation"]}, {"id": "f32", "chapterId": "ch09", "front": "微调的标准流程？", "back": "加载预训练→换分类头→冻结或全解冻→小学习率训练。", "tags": ["finetune"]}, {"id": "f33", "chapterId": "ch09", "front": "锚框解决了什么问题？", "back": "把任意框回归变成相对参考框的小幅偏移回归。", "tags": ["detection"]}, {"id": "f34", "chapterId": "ch09", "front": "NMS 的流程？", "back": "按分数排序，保留最高，删除 IoU 超阈值的框，重复。", "tags": ["detection"]}, {"id": "f35", "chapterId": "ch09", "front": "语义分割与实例分割的差别？", "back": "前者同类不区分个体，后者区分。", "tags": ["segmentation"]}, {"id": "f36", "chapterId": "ch10", "front": "word2vec 的两种训练方式？", "back": "跳元模型 skip-gram 与连续词袋 CBOW。", "tags": ["embedding"]}, {"id": "f37", "chapterId": "ch10", "front": "负采样的核心思想？", "back": "把全词表 softmax 换成正例加少量负例的二分类。", "tags": ["embedding"]}, {"id": "f38", "chapterId": "ch10", "front": "GloVe 与 word2vec 的差异？", "back": "GloVe 拟合全局共现矩阵，word2vec 看局部窗口。", "tags": ["embedding"]}, {"id": "f39", "chapterId": "ch10", "front": "注意力的计算式？", "back": "α=softmax(score)，c=Σαh，按相关性加权求和。", "tags": ["attention"]}, {"id": "f40", "chapterId": "ch10", "front": "Transformer 自注意力公式？", "back": "softmax(QKᵀ/√d_k)V。", "tags": ["transformer"]}, {"id": "f41", "chapterId": "ch11", "front": "排错的第一顺位是什么？", "back": "形状。形状错必然导致后续全错。", "tags": ["debug"]}, {"id": "f42", "chapterId": "ch11", "front": "结果不可复现的常见原因？", "back": "随机种子未固定或用了非确定性算子。", "tags": ["debug"]}], "companion": "d2l学习伴侣.html"}, "pages": {"ch01": {"html": "<h1>第 1 章：深度学习简介<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说清深度学习与机器学习、人工智能三者的关系；列出深度学习在哪些任务上明显超过传统方法、为什么；解释“端到端训练”相对“手工设计特征”的优势与代价。<\/p>\n<h2>一句话核心<\/h2>\n<p>深度学习不是一门新算法，而是“用多层可微模块拼成一个函数，再用梯度把整条流水线一起调”的这套做法。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三者关系（难度：基础）<\/h3>\n<p>人工智能是最大的圈，目标是让机器完成需要智能的任务；机器学习是其中的方法子集，靠数据而不是手写规则；深度学习是机器学习里用多层神经网络的那一支。<strong>包含关系不能反过来说<\/strong>：深度学习属于机器学习，但机器学习不等于深度学习。<\/p>\n<h3>概念 2：关键转折点（难度：基础）<\/h3>\n<p>三件事凑齐之后深度学习才起来：<strong>数据<\/strong>（ImageNet 百万级标注）、<strong>算力<\/strong>（GPU 并行矩阵运算）、<strong>算法<\/strong>（ReLU 缓解梯度消失、Dropout 抑制过拟合、批归一化稳定训练）。少任何一样都不成立——这不是修辞，2012 年之前的网络结构与之后差别并不大，差别在数据量和算力。<\/p>\n<h3>概念 3：端到端的代价（难度：进阶）<\/h3>\n<p>传统流水线是人工设计特征再交给分类器；深度学习把特征也交给梯度学。好处是不用猜特征，坏处是<strong>不可解释、不可局部修改<\/strong>：模型错了你很难定位是哪一层的问题，只能靠可视化、探针、消融实验去查。<\/p>\n<p><strong>类比<\/strong>：传统方法像手工流水线，每道工序有专人负责，出问题能定位到工位；端到端像一台黑箱机器，输入原料直接出成品，效率高但坏了只能整体排查。<\/p>\n<p><strong>类比失效的地方<\/strong>：黑箱并非完全不可查，梯度、激活可视化、注意力权重都能提供线索，只是比逐工序排查贵得多。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  AI[&quot;人工智能&quot;] --&gt; ML[&quot;机器学习&quot;]\n  ML --&gt; DL[&quot;深度学习&quot;]\n  D[&quot;大数据&quot;] --&gt; DL\n  C[&quot;GPU 算力&quot;] --&gt; DL\n  A[&quot;算法改进&quot;] --&gt; DL<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是概念层级，右边是三个使能条件。缺一个，深度学习就停留在论文里。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为深度学习什么任务都更强——实际上表格数据上梯度提升树常赢，深度网络的优势集中在图像、语音、文本这类高维有结构的数据。\n<\/li><li>\n别以为端到端就一定更好——实际上数据量不足时，人工特征 + 简单模型更稳。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n深度学习兴起的三个必要条件不包括？（答案：C；解析：数据、算力、算法是三个条件，理论完备性不是。）\n<ul>\n<li>\nA. 大规模数据　B. GPU 算力　C. 完备的理论保证　D. 训练算法改进\n<\/li><li>\n端到端训练的主要代价是？（答案：B；解析：可解释性与局部可修改性变差。）\n<\/li><li>\nA. 训练变慢　B. 难定位错误来源　C. 必须用 GPU　D. 不能处理图像\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三个圈：AI ⊃ ML ⊃ DL。\n<\/li><li>\n三条件：数据、算力、算法。\n<\/li><li>\n端到端换来性能，付出可解释性。\n<\/ul>", "kind": "chapter", "title": "第 1 章：深度学习简介"}, "ch02": {"html": "<h1>第 2 章：预备知识<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1 章、Python 基础\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：用 NDArray 完成张量的创建、切片、广播与矩阵乘法；用自动求导算出复合函数的梯度；把书里的数学符号（求和、期望、正态分布）翻译成代码。<\/p>\n<h2>一句话核心<\/h2>\n<p>这一章的全部内容是为后面铺路：数据是张量，求导靠 autograd，概率用来描述不确定性。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：NDArray 与张量（难度：基础）<\/h3>\n<p>NDArray 就是多维数组，与 NumPy 的 ndarray 几乎一样，区别是它能放到 GPU 上、能自动求导。常见操作：创建（<code>zeros<\/code>、<code>arange<\/code>、<code>normal<\/code>）、变形（<code>reshape<\/code>）、拼接（<code>concat<\/code>）、求和（<code>sum<\/code> 可指定轴）。<\/p>\n<p><strong>轴的概念<\/strong>：二维数组 <code>(行, 列)<\/code>，<code>sum(axis=0)<\/code> 沿行方向压，得到每列的和；<code>sum(axis=1)<\/code> 得到每行的和。这个方向约定初学者最容易搞反，记住“axis 指定的是被消掉的那一维”。<\/p>\n<h3>概念 2：自动求导（难度：进阶）<\/h3>\n<p>给变量 <code>attach_grad()<\/code> 声明要算梯度，在 <code>autograd.record()<\/code> 里做前向，调用 <code>backward()<\/code> 后梯度写在 <code>.grad<\/code> 里。<\/p>\n<p><strong>为什么需要它<\/strong>：手写反向传播容易错，而且每换一个模型就要重写。自动求导把“记录计算图 + 反向执行链式法则”这两件事交给框架，你只需要写前向。<\/p>\n<p><strong>实例<\/strong>：<code>y = 2 <em> x <\/em> x<\/code>，x=3 时 y=18。对 x 求导是 4x=12。代码里 <code>x=[1,2,3,4]<\/code> 时梯度是 <code>[4,8,12,16]<\/code>，可以用手算核对。<\/p>\n<h3>概念 3：概率回顾（难度：基础）<\/h3>\n<p>期望是加权平均，方差衡量离散程度。<strong>正态分布<\/strong>由均值 μ 和标准差 σ 决定，68% 的值落在 μ±σ 内。<strong>条件概率<\/strong> <code>P(A|B)=P(A,B)/P(B)<\/code>，贝叶斯公式由它直接变形得到。<\/p>\n<p><strong>为什么这三样必学<\/strong>：后面线性回归的噪声假设、softmax 的概率解释、变分自编码器的采样，全靠这几条。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  X[&quot;输入张量&quot;] --&gt; F[&quot;前向计算 记录计算图&quot;]\n  F --&gt; Y[&quot;输出&quot;]\n  Y --&gt; B[&quot;backward&quot;]\n  B --&gt; G[&quot;各参数的 .grad&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：正向记录、反向取梯度，这个机制贯穿全书每一章的代码。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为自动求导会保存整个计算图占满内存——实际上只有声明了梯度的变量参与的运算才记录，且用完可清空。\n<\/li><li>\n别以为 <code>axis<\/code> 是“保留哪一维”——实际上它指定的是被消去的那一维。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n二维数组 <code>sum(axis=0)<\/code> 的结果形状是？（答案：B；解析：axis=0 消掉行维，剩下列数。）\n<ul>\n<li>\nA. 行数　B. 列数　C. 标量　D. 原形状\n<\/li><li>\n<code>y=2x²<\/code> 在 x=3 处的导数是？（答案：C；解析：dy/dx=4x=12。）\n<\/li><li>\nA. 6　B. 18　C. 12　D. 2\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n张量操作三件套：变形、广播、按轴求和。\n<\/li><li>\n自动求导 = 记录计算图 + 反向执行。\n<\/li><li>\n期望、方差、条件概率是后面所有概率模型的语言。\n<\/ul>", "kind": "chapter", "title": "第 2 章：预备知识"}, "ch03": {"html": "<h1>第 3 章：深度学习基础<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 1、2 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出线性回归与 softmax 回归的损失、梯度和更新式；解释多层感知机为什么必须加非线性激活；说清权重衰减与 Dropout 各自的作用机制；判断训练中出现 NaN 时最可能是哪个环节的问题。<\/p>\n<h2>一句话核心<\/h2>\n<p>本章把“模型—损失—优化”这条主线在三个由浅到深的模型上各走一遍：线性回归、softmax 回归、多层感知机，再加上让训练稳定的几个技巧。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：线性回归（难度：基础）<\/h3>\n<p>模型 <code>ŷ = wᵀx + b<\/code>，损失用平方误差 <code>ℓ = (ŷ-y)²/2<\/code>，整个训练集上取平均。小批量随机梯度下降：每次抽 B 个样本，<code>w ← w - η (1/B) Σ ∂ℓ/∂w<\/code>。<\/p>\n<p><strong>闭式解与梯度下降的关系<\/strong>：线性回归有闭式解 <code>w=(XᵀX)^{-1}Xᵀy<\/code>，但特征维度高时矩阵求逆代价太大，所以实践中仍用梯度下降。这是“有解析解也未必用它”的典型例子。<\/p>\n<h3>概念 2：softmax 回归（难度：进阶）<\/h3>\n<p>多分类时输出每个类的分数 o_j，<code>ŷ_j = exp(o_j)/Σ_k exp(o_k)<\/code>，损失用交叉熵 <code>ℓ = -Σ y_j log ŷ_j<\/code>（y 是 one-hot）。<\/p>\n<p><strong>梯度为什么这么干净<\/strong>：对 o_j 求导得 <code>ŷ_j - y_j<\/code>。这个结果值得记牢：预测减标签，没有额外的饱和因子。这就是第 5 章能写出漂亮反向公式的原因。<\/p>\n<p><strong>数值稳定性<\/strong>：<code>exp<\/code> 遇到大数会溢出。做法是先减去最大值 <code>o_j - max(o)<\/code>，softmax 结果不变但不会溢出。这个技巧在几乎所有实现里都有。<\/p>\n<h3>概念 3：多层感知机（难度：进阶）<\/h3>\n<p><code>H = σ(XW₁+b₁)<\/code>，<code>O = HW₂+b₂<\/code>。如果没有 σ，<code>O = XW₁W₂ + ...<\/code> 仍是线性，等价于单层。<strong>激活函数的存在是为了让“深”有意义。<\/strong><\/p>\n<p><strong>通用近似<\/strong>：单隐层、足够多神经元可以逼近任意连续函数，但所需神经元可能指数级多；深层用少得多的参数达到同样表达力。<\/p>\n<h3>概念 4：过拟合与正则（难度：进阶）<\/h3>\n<ul><li>\n<strong>权重衰减<\/strong>：损失加 <code>λ/2 ||w||²<\/code>，梯度里多出 <code>λw<\/code>，每次更新都把 w 往 0 拉一点。\n<\/li><li>\n<strong>Dropout<\/strong>：训练时按概率 p 把隐藏层输出置 0，再做 <code>/(1-p)<\/code> 缩放保持期望；推理时全部启用、不缩放。\n<\/li><li>\n<strong>早停<\/strong>：验证误差开始上升就停。\n<\/ul>\n<p><strong>实例<\/strong>：三层网络在 100 个样本上训练，训练损失降到 0.01 而验证损失升到 2.0，这是典型过拟合。加 λ=0.1 的权重衰减后训练损失升到 0.3、验证损失降到 0.8，泛化变好。<\/p>\n<h3>概念 5：数值稳定性与初始化（难度：高难）<\/h3>\n<p>反向传播是连乘，激活值或梯度稍偏离 1，几十层后就会爆炸或消失。对策：合理的初始化（Xavier/He）、批归一化、梯度裁剪、用 ReLU 类激活。<\/p>\n<p><strong>梯度裁剪<\/strong>：当梯度范数超过阈值 θ 时按比例缩放，<code>g ← g × θ/||g||<\/code>。它是 RNN 训练的标配，因为序列长时梯度极易爆炸。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  D[&quot;数据&quot;] --&gt; M[&quot;模型 线性/softmax/MLP&quot;]\n  M --&gt; L[&quot;损失 平方误差/交叉熵&quot;]\n  L --&gt; G[&quot;梯度 反向传播&quot;]\n  G --&gt; O[&quot;优化器 小批量 SGD&quot;]\n  O --&gt; M\n  M --&gt; V{&quot;验证集表现&quot;}\n  V --&gt;|&quot;变差&quot;| S[&quot;早停/加正则&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：左边是训练闭环，右下角是监控出口。训练不是一直跑，要盯着验证集决定何时停。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 softmax 回归是“回归”——实际上它是分类模型，只是借用了回归的线性打分形式。\n<\/li><li>\n别以为 Dropout 只在训练时随机就够——实际上推理时的缩放必须配套，否则输出尺度不一致。\n<\/li><li>\n别以为损失变成 NaN 一定是学习率太大——实际上也可能是 exp 溢出、除零、log(0)，要按顺序查。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nsoftmax 对分数的梯度是？（答案：B；解析：∂ℓ/∂o_j = ŷ_j - y_j。）\n<ul>\n<li>\nA. ŷ_j　B. ŷ_j - y_j　C. y_j - ŷ_j　D. 1\n<\/li><li>\nMLP 去掉激活函数会怎样？（答案：C；解析：多层线性变换等价于单层线性变换。）\n<\/li><li>\nA. 变成 SVM　B. 训练更快　C. 退化为线性模型　D. 不影响结果\n<\/li><li>\n权重衰减在梯度上表现为？（答案：A；解析：损失加 λ/2||w||² 后梯度多出 λw 项。）\n<\/li><li>\nA. 每次更新多减 λw　B. 学习率变小　C. 梯度被裁剪　D. 参数被置零\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n线性回归：平方损失 + 小批量 SGD。\n<\/li><li>\nsoftmax + 交叉熵，梯度是预测减标签。\n<\/li><li>\n没有非线性，深层等于单层。\n<\/li><li>\n正则三件套：权重衰减、Dropout、早停。\n<\/ul>", "kind": "chapter", "title": "第 3 章：深度学习基础"}, "ch04": {"html": "<h1>第 4 章：深度学习计算<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：用 Module 类组织一个模型并管理其参数；区分“参数”与“超参数”；把模型保存到文件再读回来；说明数据放到 GPU 上之后哪些操作会自动跟随、哪些必须手动。<\/p>\n<h2>一句话核心<\/h2>\n<p>模型是一个“装着参数的容器”，训练脚本只跟容器打交道；容器把参数、前向逻辑、初始化规则封装在一起。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：Module 与层（难度：基础）<\/h3>\n<p><code>nn.Module<\/code> 的子类在 <code>__init__<\/code> 里声明子层，在 <code>forward<\/code> 里定义数据怎么流。框架通过 <code>__setattr__<\/code> 自动把子层登记到参数表里，所以不需要手动维护参数列表。<\/p>\n<p><strong>为什么要封装<\/strong>：一个模型可能有几十层，手动管理每个参数的名字、形状、初始化方式几乎不可能不出错。封装之后 <code>net.parameters()<\/code> 一次拿到全部。<\/p>\n<h3>概念 2：参数管理（难度：进阶）<\/h3>\n<p><code>net.parameters()<\/code> 返回所有参数，<code>net.named_parameters()<\/code> 带名字。初始化用 <code>net.apply(init_fn)<\/code> 遍历每个子模块。<\/p>\n<p><strong>参数与超参数的区别<\/strong>：参数是梯度能改的（权重、偏置、BN 的 γ/β）；超参数是训练前定的（学习率、层数、正则强度）。后者只能靠验证集搜。<\/p>\n<h3>概念 3：自定义层（难度：进阶）<\/h3>\n<p>无参数的层（如自己实现一个中心化层）直接写 <code>forward<\/code>；有参数的层要在 <code>__init__<\/code> 里 <code>self.params = [self.w, self.b]<\/code> 登记，否则优化器拿不到它们。<\/p>\n<h3>概念 4：读写与 GPU（难度：进阶）<\/h3>\n<p>保存用 <code>np.save<\/code> 或框架的 <code>save<\/code>，读回时<strong>必须先建同结构模型再 load<\/strong>。GPU 上要注意：<code>net.to(device)<\/code> 只搬参数，数据必须自己 <code>.to(device)<\/code>；运算要求两边在同一设备上，否则报错。<\/p>\n<p><strong>实例<\/strong>：<code>X<\/code> 在 CPU、<code>W<\/code> 在 GPU，做 <code>X @ W<\/code> 直接报错。常见写法是 <code>X = X.to(device)<\/code> 之后再前向。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  M[&quot;Module&quot;] --&gt; P[&quot;参数 parameters&quot;]\n  M --&gt; F[&quot;forward 前向逻辑&quot;]\n  M --&gt; S[&quot;子层 递归登记&quot;]\n  P --&gt; O[&quot;优化器&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：优化器只认参数，不认模块结构。所以自定义层如果忘了登记参数，训练时它永远不更新，也不会报错——这是最隐蔽的一类 bug。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为把模型 <code>.to(device)<\/code> 之后数据会自动跟过去——实际上数据要手动搬。\n<\/li><li>\n别以为自定义层里的张量会自动成为参数——实际上必须显式加入参数列表，否则不会被优化。\n<\/li><li>\n别以为保存模型等于保存代码——实际上只存参数，读回要靠同样的类定义。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n自定义层里忘了登记参数会怎样？（答案：C；解析：优化器拿不到该参数，它永远保持初值，且不报错。）\n<ul>\n<li>\nA. 报错　B. 自动登记　C. 该参数不更新　D. 模型无法前向\n<\/li><li>\n模型搬到 GPU 后数据要？（答案：B；解析：参数在哪个设备，数据就必须显式搬过去。）\n<\/li><li>\nA. 自动跟随　B. 手动搬　C. 无需搬　D. 只能留 CPU\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nModule = 参数的容器 + 前向逻辑。\n<\/li><li>\n参数靠梯度改，超参数靠验证集选。\n<\/li><li>\n自定义层要显式登记参数；GPU 上数据要手动搬。\n<\/ul>", "kind": "chapter", "title": "第 4 章：深度学习计算"}, "ch05": {"html": "<h1>第 5 章：卷积神经网络<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 3、4 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出卷积层输出尺寸公式并手算多通道情形；解释 1×1 卷积为什么能改变通道数；说明池化层在反向时如何传梯度；画出 LeNet 的结构并算出它的参数量。<\/p>\n<h2>一句话核心<\/h2>\n<p>卷积层用“局部连接 + 权重共享”替换全连接，把图像的空间结构写进网络结构里。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：互相关与卷积（难度：进阶）<\/h3>\n<p>深度学习里说的“卷积”实际是互相关：核不翻转，直接逐元素乘加。二维互相关的输出 <code>Y[i,j] = ΣΣ X[i+a, j+b] W[a,b]<\/code>。<\/p>\n<p><strong>多通道<\/strong>：输入 3 通道、输出 2 通道时，核的形状是 <code>(输出通道, 输入通道, 核高, 核宽)<\/code>，即 <code>(2,3,3,3)<\/code>。每个输出通道由全部输入通道加权求和得到——不是每个输入通道配一个输出通道。<\/p>\n<p><strong>1×1 卷积<\/strong>：核大小为 1，看起来什么也没做，但它对每个位置做跨通道的线性组合，可以把 256 通道压到 64 通道，参数量只有 256×64。它等价于在通道维度上做全连接，常用于降维和增加非线性。<\/p>\n<h3>概念 2：填充与步幅（难度：基础）<\/h3>\n<p>输出尺寸 <code>(H-K+2P)/S + 1<\/code>。常见组合：K=3、P=1、S=1 保持尺寸；K=3、P=1、S=2 尺寸减半；K=5、P=2、S=1 保持尺寸。<\/p>\n<p><strong>为什么常用奇数核<\/strong>：奇数核有中心点，填充对称时输出尺寸容易保持一致，实现上更整齐。<\/p>\n<h3>概念 3：池化（难度：进阶）<\/h3>\n<p><code>K=2、S=2<\/code> 的最大池化把每个 2×2 区域压成一个数，尺寸减半。它没有参数。反向时梯度只回传给正向取到最大值的那个位置，其余位置为 0——所以实现里必须记住 argmax。<\/p>\n<h3>概念 4：LeNet（难度：进阶）<\/h3>\n<p>结构：卷积(1→6, 5×5) → 池化 → 卷积(6→16, 5×5) → 池化 → 全连接 120 → 84 → 10。<\/p>\n<p><strong>参数量算一遍<\/strong>：第一层 6×1×5×5+6=156；第二层 16×6×5×5+16=2416；全连接 16×5×5=400 到 120 是 400×120+120=48120。总约 6 万。相比同样输入尺寸的全连接网络（28×28 直接连 120 个神经元就要 9 万多参数一层），卷积省了一个数量级。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  I[&quot;输入 1×28×28&quot;] --&gt; C1[&quot;卷积 6×5×5&quot;]\n  C1 --&gt; P1[&quot;池化 2×2&quot;]\n  P1 --&gt; C2[&quot;卷积 16×5×5&quot;]\n  C2 --&gt; P2[&quot;池化 2×2&quot;]\n  P2 --&gt; F[&quot;全连接 120→84→10&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：注意空间尺寸逐层缩小、通道数逐层增加。这是 CNN 的通用节奏：越深，感受野越大、语义越抽象。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为卷积核必须翻转才是卷积——实际上深度学习框架默认做互相关，不翻转，公式与实现一致更方便。\n<\/li><li>\n别以为 1×1 卷积是“无用的卷积”——实际上它是通道维的全连接，是现代网络降维的核心组件。\n<\/li><li>\n别以为池化只是为了省算力——实际上它扩大了后续层的感受野，并提供一定的平移不变性。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n输入 32×32、核 5×5、P=2、S=1，输出尺寸？（答案：C；解析：(32-5+4)/1+1=32。）\n<ul>\n<li>\nA. 28　B. 30　C. 32　D. 34\n<\/li><li>\n输入 3 通道输出 64 通道、核 3×3 的卷积层参数量？（答案：B；解析：3×3×3×64+64=1792。）\n<\/li><li>\nA. 576　B. 1792　C. 2304　D. 1728\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n输出尺寸 = (H-K+2P)/S+1。\n<\/li><li>\n多通道卷积核形状是 (出, 入, 高, 宽)。\n<\/li><li>\n1×1 卷积 = 通道维全连接。\n<\/li><li>\n池化无参数，反向只传 argmax。\n<\/ul>", "kind": "chapter", "title": "第 5 章：卷积神经网络"}, "ch06": {"html": "<h1>第 6 章：循环神经网络<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 3、5 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出 RNN 的隐状态更新式并说明参数共享的含义；解释通过时间反向传播为什么会梯度爆炸/消失；对比 GRU 与 LSTM 的门控结构；说清双向 RNN 与深层 RNN 各自的适用场景。<\/p>\n<h2>一句话核心<\/h2>\n<p>RNN 把“上一步的隐状态”当作额外输入，让网络有了记忆；代价是反向传播要沿时间连乘，梯度极易失控。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：序列模型与 RNN（难度：进阶）<\/h3>\n<p><code>h_t = φ(W_hh h_{t-1} + W_xh x_t + b_h)<\/code>，<code>o_t = W_ho h_t + b_o<\/code>。<\/p>\n<p><strong>参数共享<\/strong>：所有时间步用同一组 W 和 b。这带来两个后果：一是参数量与序列长度无关，二是同一个模式出现在不同位置都能被识别。<\/p>\n<p><strong>隐状态的含义<\/strong>：它是“到目前为止看过的东西的压缩摘要”。注意它是个固定维度的向量，序列再长也只能塞进这么多信息——这是 RNN 长程记忆差的根本原因。<\/p>\n<h3>概念 2：通过时间反向传播 BPTT（难度：高难）<\/h3>\n<p>把展开后的 T 个时间步当成 T 层网络做反向传播。梯度里会出现 <code>∏ ∂h_t/∂h_{t-1}<\/code>，每个因子含 <code>W_hh<\/code> 与激活导数。若它们范数小于 1，连乘后指数衰减（梯度消失）；大于 1 则指数增长（梯度爆炸）。<\/p>\n<p><strong>对策<\/strong>：梯度裁剪（爆炸）、门控结构（消失）、截断 BPTT（限制回传步数）。<\/p>\n<h3>概念 3：GRU 与 LSTM（难度：高难）<\/h3>\n<p><strong>GRU<\/strong>：重置门 <code>r_t<\/code> 控制“忽略多少过去”，更新门 <code>z_t<\/code> 控制“保留多少过去”。<code>h_t = z_t ⊙ h_{t-1} + (1-z_t) ⊙ h̃_t<\/code>。<\/p>\n<p><strong>LSTM<\/strong>：三个门（输入、遗忘、输出）加一个细胞状态 <code>c_t<\/code>。关键在细胞状态的更新是<strong>加法<\/strong>：<code>c_t = f_t ⊙ c_{t-1} + i_t ⊙ c̃_t<\/code>。加法让梯度可以近乎原样地沿时间传回去，这是 LSTM 缓解梯度消失的核心机制，不是靠“门更复杂”。<\/p>\n<p><strong>类比<\/strong>：GRU 像一个人做笔记，决定哪些旧内容擦掉、哪些新内容写上；LSTM 像一条传送带（细胞状态），上面只做小幅增删，所以东西能一直传很远。<\/p>\n<p><strong>类比失效的地方<\/strong>：LSTM 也会遗忘，只是遗忘由学出来的门控制，不是完全不丢。<\/p>\n<h3>概念 4：双向与深层（难度：进阶）<\/h3>\n<p><strong>双向 RNN<\/strong>：正向和反向各跑一个 RNN，拼起来。适合“整句已知”的任务（分类、标注），不适合在线预测（未来还没来）。<\/p>\n<p><strong>深层 RNN<\/strong>：在时间维之外再堆层，第 l 层的输出作为第 l+1 层的输入。层数增加会放大梯度问题，通常配残差连接。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  X1[&quot;x1&quot;] --&gt; H1[&quot;h1&quot;]\n  H1 --&gt; H2[&quot;h2&quot;]\n  X2[&quot;x2&quot;] --&gt; H2\n  H2 --&gt; H3[&quot;h3&quot;]\n  X3[&quot;x3&quot;] --&gt; H3\n  H1 --&gt; O1[&quot;o1&quot;]\n  H2 --&gt; O2[&quot;o2&quot;]\n  H3 --&gt; O3[&quot;o3&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：横向是时间展开，纵向是同一组参数在不同时刻复用。反向传播要沿着这条横向链一路乘回去。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 RNN 能记住任意长的历史——实际上隐状态维度固定，长程信息会被覆盖。\n<\/li><li>\n别以为 LSTM 解决了梯度消失——实际上它只是让梯度更容易保留，极长序列上仍会衰减。\n<\/li><li>\n别以为双向 RNN 总比单向好——实际上需要实时输出的任务不能用双向，因为它偷看了未来。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nRNN 参数共享的含义是？（答案：B；解析：所有时间步共用同一组权重。）\n<ul>\n<li>\nA. 不同时间步不同权重　B. 所有时间步共用一组权重　C. 只共享偏置　D. 每层共享\n<\/li><li>\nLSTM 缓解梯度消失的关键设计是？（答案：C；解析：细胞状态采用加法更新，梯度可近似原样回传。）\n<\/li><li>\nA. 更多参数　B. 三个门　C. 细胞状态的加法更新　D. 双向结构\n<\/li><li>\n双向 RNN 不适合哪类任务？（答案：A；解析：需要实时逐词输出时未来信息不可得。）\n<\/li><li>\nA. 实时流式预测　B. 整句情感分类　C. 命名实体标注　D. 离线文本分类\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nRNN：隐状态携带历史，参数在时间上共享。\n<\/li><li>\nBPTT 连乘导致梯度爆炸/消失，对策是裁剪与门控。\n<\/li><li>\nLSTM 的核心是细胞状态的加法路径。\n<\/li><li>\n双向要未来信息，实时任务不能用。\n<\/ul>", "kind": "chapter", "title": "第 6 章：循环神经网络"}, "ch07": {"html": "<h1>第 7 章：优化算法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 3 章、凸优化基础\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：区分优化目标与泛化目标为什么不是一回事；手推动量与 Adam 的更新式；说明 AdaGrad 的学习率为什么单调递减、RMSProp 如何修正；列出学习率调度的三种常用策略。<\/p>\n<h2>一句话核心<\/h2>\n<p>优化算法解决的是“怎么在非凸、有噪声、参数尺度差异大的曲面上走得稳”，而不是“怎么找到全局最优”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：优化与泛化的分离（难度：进阶）<\/h3>\n<p>训练损失最小不等于泛化最好。原因有三：经验风险只是真实风险的近似；模型容量过大会记住噪声；非凸问题的局部极小可能恰好泛化不错，追求全局最小反而过拟合。<\/p>\n<p><strong>实践含义<\/strong>：不要死磕训练损失，要盯验证集。<\/p>\n<h3>概念 2：动量法（难度：进阶）<\/h3>\n<p><code>v_t = β v_{t-1} + (1-β) g_t<\/code>（有的写法不带 1-β），<code>θ ← θ - η v_t<\/code>。<\/p>\n<p><strong>为什么有效<\/strong>：在梯度方向一致的维度上，速度累积使步长变大；在来回震荡的维度上，正负抵消使步长变小。效果等价于“按维度自适应调整步长”。<\/p>\n<p><strong>实例<\/strong>：β=0.9 时，连续 10 步梯度都是 1，速度趋于 10 而不是 1，相当于学习率放大 10 倍。这也是动量需要配更小学习率的原因。<\/p>\n<h3>概念 3：自适应学习率（难度：高难）<\/h3>\n<ul><li>\n<strong>AdaGrad<\/strong>：<code>s_t = s_{t-1} + g_t²<\/code>，<code>θ ← θ - η g_t/√(s_t+ε)<\/code>。梯度一直大的维度分母大、步长自动变小。缺点是 s 单调累加，后期学习率趋近 0，训练提前停滞。\n<\/li><li>\n<strong>RMSProp<\/strong>：把累加改成指数移动平均 <code>s_t = γ s_{t-1} + (1-γ) g_t²<\/code>，解决 AdaGrad 停滞的问题。\n<\/li><li>\n<strong>Adam<\/strong>：同时估一阶矩 m（动量）和二阶矩 v（尺度），并做偏置修正 <code>m̂ = m/(1-β₁ᵗ)<\/code>、<code>v̂ = v/(1-β₂ᵗ)<\/code>，最后 <code>θ ← θ - η m̂/(√v̂+ε)<\/code>。\n<\/ul>\n<p><strong>偏置修正为什么必要<\/strong>：m 和 v 初值为 0，前几步会系统性偏小；除以 (1-βᵗ) 正好把它拉回无偏估计。不修正的话，训练初期步长会异常小。<\/p>\n<h3>概念 4：学习率调度（难度：进阶）<\/h3>\n<ul><li>\n<strong>分段常数<\/strong>：每隔若干 epoch 降一半。\n<\/li><li>\n<strong>余弦退火<\/strong>：沿余弦曲线从 η_max 降到 η_min，后期精细收敛。\n<\/li><li>\n<strong>预热<\/strong>：前若干步从很小的学习率线性升到目标值，避免初期梯度爆炸（Transformer 训练标配）。\n<\/ul>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  G[&quot;梯度&quot;] --&gt; S[&quot;SGD 直接走&quot;]\n  G --&gt; M[&quot;动量 累积速度&quot;]\n  G --&gt; A[&quot;AdaGrad 累积平方&quot;]\n  A --&gt; R[&quot;RMSProp 改移动平均&quot;]\n  M --&gt; AD[&quot;Adam 一阶+二阶+修正&quot;]\n  R --&gt; AD<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从 SGD 到 Adam 是一条不断加机制的路：先加惯性，再加按维缩放，最后合体并修正偏差。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Adam 不需要调学习率——实际上默认 1e-3 只是起点，很多任务要调到 1e-4。\n<\/li><li>\n别以为 AdaGrad 一定比 SGD 好——实际上它在长训练中会停滞，稀疏数据上才明显占优。\n<\/li><li>\n别以为动量越大越好——实际上 β 太大时速度会overshoot，来回振荡。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nAdam 的偏置修正解决什么问题？（答案：B；解析：一二阶矩初值为 0 导致前几步估计偏小。）\n<ul>\n<li>\nA. 梯度爆炸　B. 初期估计偏小　C. 学习率衰减　D. 内存占用\n<\/li><li>\nAdaGrad 的主要缺陷是？（答案：C；解析：平方累加单调增长，学习率趋近 0，训练停滞。）\n<\/li><li>\nA. 需要更多内存　B. 不能处理稀疏数据　C. 后期学习率趋零　D. 无法并行\n<\/li><li>\n动量法在震荡维度上的效果是？（答案：A；解析：正负梯度相互抵消，步长变小。）\n<\/li><li>\nA. 步长变小　B. 步长变大　C. 不变　D. 变成 0\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n优化目标 ≠ 泛化目标，盯验证集。\n<\/li><li>\n动量 = 按维度自适应的步长；Adam = 动量 + 二阶矩 + 偏置修正。\n<\/li><li>\nAdaGrad 会停滞，RMSProp 用移动平均修正。\n<\/li><li>\n预热 + 余弦退火是现代训练的常用组合。\n<\/ul>", "kind": "chapter", "title": "第 7 章：优化算法"}, "ch08": {"html": "<h1>第 8 章：计算性能<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 4、7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说清异步计算为什么能提速、代价是什么；解释数据并行与模型并行的分工；判断一个训练瓶颈在算力、显存还是通信。<\/p>\n<h2>一句话核心<\/h2>\n<p>深度学习训练的性能问题，九成是“GPU 等 CPU”或“卡等卡”，很少是真的算不过来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：异步计算（难度：进阶）<\/h3>\n<p>Python 发出指令后不等 GPU 算完就返回，靠队列排队。好处是 CPU 与 GPU 能重叠工作；代价是调试困难——报错位置和真正出错的位置可能差很远，而且必须显式同步（如 <code>.wait_to_read()<\/code>）才能测时间。<\/p>\n<p><strong>实例<\/strong>：连续发 1000 个矩阵乘法，Python 侧几乎瞬间返回，实际执行时间要在最后同步时才能测到。<\/p>\n<h3>概念 2：自动并行与计算图（难度：进阶）<\/h3>\n<p>框架会把计算图里没有依赖的节点并行调度。所以写法上要尽量让独立计算并列，而不是串成一长条。<\/p>\n<h3>概念 3：多 GPU 训练（难度：高难）<\/h3>\n<ul><li>\n<strong>数据并行<\/strong>：每张卡放完整模型，各算一部分数据，梯度汇总后统一更新。最常用。\n<\/li><li>\n<strong>模型并行<\/strong>：一个大模型切成几块分放不同卡，中间结果要跨卡传输。用于单卡放不下的大模型。\n<\/li><li>\n<strong>参数服务器<\/strong>：把参数集中存放，worker 拉取、计算、推送梯度。适合超大规模集群。\n<\/ul>\n<p><strong>瓶颈判断<\/strong>：单卡训练时 GPU 利用率低 → 查数据加载（IO 瓶颈）；多卡扩展比差 → 查通信带宽；显存 OOM → 查批大小与模型并行。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  D[&quot;数据分片&quot;] --&gt; G1[&quot;GPU1 前向反向&quot;]\n  D --&gt; G2[&quot;GPU2 前向反向&quot;]\n  G1 --&gt; A[&quot;梯度汇总 all-reduce&quot;]\n  G2 --&gt; A\n  A --&gt; U[&quot;统一更新参数&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：数据并行的关键是最后那一步通信。卡越多，通信占比越高，扩展比越差。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为卡越多越快——实际上通信开销会吃掉收益，超过一定规模后加速比趋平。\n<\/li><li>\n别以为异步计算总是好事——实际上它让计时和调试都变难，必须显式同步。\n<\/li><li>\n别以为 OOM 只能减小 batch——实际上也可以用梯度累积、混合精度、重计算来省显存。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n数据并行中每张卡存放？（答案：B；解析：每卡一份完整模型，数据分片。）\n<ul>\n<li>\nA. 模型的一部分　B. 完整模型　C. 只有参数　D. 只有数据\n<\/li><li>\n单卡 GPU 利用率低最可能的原因？（答案：A；解析：数据加载跟不上，GPU 在等 CPU。）\n<\/li><li>\nA. 数据加载瓶颈　B. 算力不足　C. 显存不足　D. 通信瓶颈\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n异步计算：CPU 与 GPU 重叠，但调试与计时都变难。\n<\/li><li>\n数据并行分数据、模型并行分模型。\n<\/li><li>\n先判断瓶颈在 IO、算力、显存还是通信，再选手段。\n<\/ul>", "kind": "chapter", "title": "第 8 章：计算性能"}, "ch09": {"html": "<h1>第 9 章：计算机视觉<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 5、7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说清图像增广为什么等价于一种正则；写出微调的标准流程；解释 IoU、锚框、NMS 在目标检测里各解决什么问题；区分语义分割与实例分割；说明风格迁移的损失由哪两部分构成。<\/p>\n<h2>一句话核心<\/h2>\n<p>计算机视觉的进展一半来自模型结构，一半来自“怎么把图像任务转化成可优化的损失”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：图像增广（难度：基础）<\/h3>\n<p>随机翻转、裁剪、变色、旋转，扩大训练集的分布覆盖。<strong>它等价于一种正则<\/strong>：模型不能靠“记住固定位置的固定像素”来分类，必须学更不变的特征。<\/p>\n<p><strong>注意<\/strong>：增广不能破坏标签语义。把“6”旋转 180° 就变成“9”，这类增广会引入错标。<\/p>\n<h3>概念 2：微调（难度：进阶）<\/h3>\n<p>标准流程：加载预训练权重 → 替换最后的分类层（输出维度改为自己的类别数）→ 冻结前面的层或全部解冻 → 用较小学习率训练。<\/p>\n<p><strong>两类参数的学习率可以不同<\/strong>：预训练部分用 1e-5，新分类头用 1e-3，这叫差别学习率，实践中很常用。<\/p>\n<h3>概念 3：目标检测三件套（难度：高难）<\/h3>\n<ul><li>\n<strong>IoU<\/strong>：两个框的交集面积除以并集面积，衡量框的重合度，也是评估指标。\n<\/li><li>\n<strong>锚框<\/strong>：在特征图每个位置预设多个不同尺度/比例的参考框，模型预测“相对锚框的偏移量 + 是否包含物体”。这样把“回归任意框”变成“回归小幅偏移”，学起来稳定得多。\n<\/li><li>\n<strong>NMS<\/strong>：同一物体会有多个高分框，按分数排序，保留最高的，删掉与它 IoU 超过阈值的其余框，重复。没有 NMS 会输出一堆重叠框。\n<\/ul>\n<p><strong>实例<\/strong>：两个框 A=[0,0,100,100]、B=[50,50,150,150]。交集 50×50=2500，并集 10000+10000-2500=17500，IoU=0.143，低于常见阈值 0.5，判为不同物体。<\/p>\n<h3>概念 4：分割与风格迁移（难度：高难）<\/h3>\n<p><strong>语义分割<\/strong>：每个像素分类，同类不区分个体；<strong>实例分割<\/strong>：还要区分不同个体。FCN 用转置卷积把特征图放大回原尺寸，逐像素分类。<\/p>\n<p><strong>风格迁移<\/strong>：内容损失比较生成图与内容图在深层特征上的差异，风格损失比较 Gram 矩阵（特征通道间的相关性）。两者加权求和作为总损失，直接对生成图像做梯度下降。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  I[&quot;图像&quot;] --&gt; B[&quot;骨干网络 特征&quot;]\n  B --&gt; C[&quot;分类头&quot;]\n  B --&gt; D[&quot;检测头 框+类别&quot;]\n  B --&gt; E[&quot;分割头 逐像素&quot;]\n  B --&gt; S[&quot;风格/内容损失&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：同一个骨干可以接不同头，这是迁移学习在视觉里通用的原因——底层特征是共享的。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为增广越多越好——实际上破坏语义的增广会直接制造错误标签。\n<\/li><li>\n别以为 NMS 可以省掉——实际上没有它检测输出无法使用。\n<\/li><li>\n别以为微调必须冻结所有层——实际上数据量稍大时全部微调效果更好，只是学习率要小。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nIoU 的定义是？（答案：B；解析：交集面积除以并集面积。）\n<ul>\n<li>\nA. 交集除以两者面积之和　B. 交集除以并集　C. 并集除以交集　D. 中心点距离\n<\/li><li>\nNMS 的作用是？（答案：C；解析：抑制同一物体的重复检测框。）\n<\/li><li>\nA. 生成锚框　B. 计算损失　C. 去除重叠框　D. 放大特征图\n<\/li><li>\n风格迁移的风格损失基于？（答案：A；解析：特征图的 Gram 矩阵，刻画通道间相关性。）\n<\/li><li>\nA. Gram 矩阵　B. 像素差　C. 分类交叉熵　D. IoU\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n增广 = 正则，但不能破坏标签语义。\n<\/li><li>\n微调：换头、冻结或全解冻、小学习率。\n<\/li><li>\n检测三件套：IoU 度量、锚框回归偏移、NMS 去重。\n<\/li><li>\n风格迁移 = 内容损失 + 风格损失，直接优化图像。\n<\/ul>", "kind": "chapter", "title": "第 9 章：计算机视觉"}, "ch10": {"html": "<h1>第 10 章：自然语言处理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 6、9 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说清 word2vec 的两种训练方式与负采样为什么能加速；解释 GloVe 与 word2vec 的目标差异；画出 seq2seq + 注意力的结构；写出 Transformer 自注意力的计算式并说明为什么除以 √d_k。<\/p>\n<h2>一句话核心<\/h2>\n<p>NLP 的核心难题是“把变长序列变成定长表示”，词嵌入解决“词怎么表示”，注意力解决“信息怎么对齐”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：词嵌入（难度：进阶）<\/h3>\n<p><strong>one-hot 的问题<\/strong>：词表一万，每个词是一万维稀疏向量，任意两词内积为 0，无法表达相似性。<\/p>\n<p><strong>word2vec 两种方式<\/strong>：<\/p>\n<ul><li>\n<strong>跳元模型（skip-gram）<\/strong>：用中心词预测上下文。<code>P(w_o|w_c) = exp(u_oᵀv_c)/Σ exp(u_kᵀv_c)<\/code>。\n<\/li><li>\n<strong>连续词袋（CBOW）<\/strong>：用上下文预测中心词。\n<\/ul>\n<p><strong>负采样<\/strong>：分母要对整个词表求和，代价太大。改成“正样本 + 若干随机负样本”的二分类任务，把 O(V) 降到 O(K)。<\/p>\n<h3>概念 2：GloVe（难度：进阶）<\/h3>\n<p>word2vec 只看局部窗口，GloVe 直接拟合全局共现矩阵：<code>w_iᵀw̃_j + b_i + b̃_j ≈ log X_ij<\/code>，用加权最小二乘。<strong>它把“局部上下文预测”换成“全局统计拟合”，两者最终得到的嵌入性质相近。<\/strong><\/p>\n<h3>概念 3：seq2seq 与注意力（难度：高难）<\/h3>\n<p>编码器把输入序列压成一个定长向量，解码器从它生成输出。<strong>问题<\/strong>：无论句子多长都压成一个向量，长句信息丢失严重。<\/p>\n<p><strong>注意力<\/strong>：解码每一步都回头看编码器的所有隐状态，按相关性加权求和。<code>α_{t,s} = softmax(score(h_t, h̄_s))<\/code>，<code>c_t = Σ α_{t,s} h̄_s<\/code>。这样信息不再被压缩，而是按需取用。<\/p>\n<h3>概念 4：Transformer（难度：高难）<\/h3>\n<p>自注意力：<code>Attention(Q,K,V) = softmax(QKᵀ/√d_k)V<\/code>。<\/p>\n<p><strong>为什么除 √d_k<\/strong>：Q 与 K 的每个分量独立、方差为 1，点积的方差是 d_k。d_k 大时点积数值很大，softmax 会进入饱和区，梯度趋近 0。除以 √d_k 把方差拉回 1，这是为了梯度稳定，不是为了数值范围好看。<\/p>\n<p><strong>多头<\/strong>：把 Q、K、V 投影到 h 组低维子空间分别做注意力再拼接。不同头能关注不同的关系（语法、指代、位置）。<\/p>\n<p><strong>位置编码<\/strong>：自注意力本身对顺序无感（打乱输入结果不变），所以必须额外加位置信息。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  T[&quot;输入词序列&quot;] --&gt; E[&quot;词嵌入+位置编码&quot;]\n  E --&gt; A[&quot;多头自注意力&quot;]\n  A --&gt; N[&quot;残差+层归一化&quot;]\n  N --&gt; F[&quot;前馈网络&quot;]\n  F --&gt; O[&quot;输出表示&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：注意残差与层归一化的位置。没有残差，深层 Transformer 训不动。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为词嵌入维度越高越好——实际上维度要与语料规模匹配，太大反而学不好。\n<\/li><li>\n别以为注意力机制有可解释性就等于因果——实际上注意力权重高不代表该词决定了输出。\n<\/li><li>\n别以为 Transformer 不需要位置编码——实际上去掉之后它退化成词袋模型。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n负采样把复杂度从 O(V) 降到？（答案：B；解析：只算少量负样本，复杂度与负样本数 K 相关。）\n<ul>\n<li>\nA. O(1)　B. O(K)　C. O(log V)　D. 不变\n<\/li><li>\n自注意力除以 √d_k 的目的是？（答案：C；解析：把点积方差拉回 1，避免 softmax 饱和导致梯度消失。）\n<\/li><li>\nA. 减少参数　B. 加快收敛　C. 防止点积过大使 softmax 饱和　D. 归一化输入\n<\/li><li>\nTransformer 为什么需要位置编码？（答案：A；解析：自注意力对顺序不敏感。）\n<\/li><li>\nA. 自注意力无序　B. 防止过拟合　C. 减少计算　D. 词嵌入维度不够\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\none-hot 无法表达相似，词嵌入可以。\n<\/li><li>\n负采样把词表求和变成二分类。\n<\/li><li>\n注意力解决长序列压缩问题。\n<\/li><li>\n除以 √d_k 是为了 softmax 不饱和；位置编码补顺序信息。\n<\/ul>", "kind": "chapter", "title": "第 10 章：自然语言处理"}, "ch11": {"html": "<h1>第 11 章：附录：数学与工具<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：全书\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：查清书里用到的线代、微积分、概率符号；用书里的工具脚本跑通一次训练；知道遇到环境问题该看哪一节。<\/p>\n<h2>一句话核心<\/h2>\n<p>附录不是“选读”，它是全书的符号表与排错手册。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：数学符号回顾（难度：基础）<\/h3>\n<ul><li>\n<strong>求和与求平均<\/strong>：<code>Σᵢ xᵢ<\/code> 是求和，除以 n 是平均。期望 <code>E[X]<\/code> 就是按概率加权的平均。\n<\/li><li>\n<strong>矩阵运算<\/strong>：<code>Aᵀ<\/code> 是转置（行变列），<code>A ⊙ B<\/code> 是逐元素乘，<code>A @ B<\/code> 是矩阵乘。\n<\/li><li>\n<strong>范数<\/strong>：<code>||x||₂<\/code> 是欧氏长度，<code>||x||₁<\/code> 是绝对值之和。L1 产生稀疏、L2 抑制大幅值，前面第 11 章讲过。\n<\/li><li>\n<strong>偏导与链式法则<\/strong>：<code>∂f/∂x<\/code> 表示只对 x 求导、其余视为常数；复合函数用链式法则连乘。\n<\/ul>\n<h3>概念 2：常用工具（难度：基础）<\/h3>\n<ul><li>\n<strong>环境<\/strong>：conda 或 venv 隔离依赖，GPU 版本要装对应 CUDA 的包。\n<\/li><li>\n<strong>数据<\/strong>：<code>DataLoader<\/code> 负责批处理与打乱，<code>num_workers<\/code> 影响数据加载速度。\n<\/li><li>\n<strong>可视化<\/strong>：训练曲线（损失、准确率随 epoch 变化）是最基本的诊断工具。\n<\/ul>\n<h3>概念 3：排错清单（难度：进阶）<\/h3>\n<ol><li>\n形状报错 → 打印每一步的 <code>shape<\/code>，对照公式核。\n<\/li><li>\n损失不降 → 查学习率、初始化、激活、梯度范数。\n<\/li><li>\n损失变 NaN → 查 exp 溢出、log(0)、除零、学习率过大。\n<\/li><li>\n显存 OOM → 减 batch、梯度累积、混合精度、重计算。\n<\/li><li>\n结果不可复现 → 固定随机种子、关闭非确定性算子。\n<\/ol>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  E[&quot;报错&quot;] --&gt; S[&quot;形状?&quot;]\n  S --&gt;|是| P[&quot;逐层打印 shape&quot;]\n  S --&gt;|否| L[&quot;损失不降?&quot;]\n  L --&gt;|是| H[&quot;学习率/初始化/梯度&quot;]\n  L --&gt;|否| N[&quot;NaN?&quot;]\n  N --&gt;|是| O[&quot;溢出/除零/log0&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：排错要从最确定的问题开始，形状错误永远是第一顺位，因为它必然导致后续全错。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为数学附录可以跳过——实际上符号不懂，后面每一章的公式都读不下去。\n<\/li><li>\n别以为结果不可复现是玄学——实际上多半是随机种子或非确定性算子的问题。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<code>A ⊙ B<\/code> 与 <code>A @ B<\/code> 的区别？（答案：B；解析：前者逐元素乘，后者矩阵乘。）\n<ul>\n<li>\nA. 完全相同　B. 逐元素乘 vs 矩阵乘　C. 都是转置　D. 前者是求逆\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n符号表：Σ、E、ᵀ、⊙、@、‖·‖。\n<\/li><li>\n排错顺序：形状 → 损失 → NaN → 显存 → 复现性。\n<\/ul>", "kind": "chapter", "title": "第 11 章：附录：数学与工具"}, "c01": {"html": "<h1>自动求导与计算图<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2、3 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>框架在前向时记录每一步运算，反向时按记录逆序执行链式法则，自动算出所有参数的梯度。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“推导反向公式”这件容易出错的事变成机械过程。模型一改，梯度自动跟着变。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  X[&quot;输入&quot;] --&gt; O1[&quot;运算节点&quot;]\n  W[&quot;参数&quot;] --&gt; O1\n  O1 --&gt; O2[&quot;运算节点&quot;]\n  O2 --&gt; L[&quot;损失&quot;]\n  L -.-&gt; O2\n  O2 -.-&gt; O1<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>只有声明需要梯度的变量参与的运算才被记录。反向执行完后梯度存在 <code>.grad<\/code> 里，优化器读它更新参数。<\/p>\n<p>一个实操要点：梯度会累加而不是覆盖，所以每轮更新前必须清零，否则会越滚越大——这是新手最常见的错误之一。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为梯度会每轮自动清零<\/strong>——必须手动清，否则等于把历史梯度全加在一起。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>autograd 入门<\/td><td>基本用法<\/td><\/tr><tr><td>第 3 章<\/td><td>训练循环<\/td><td>每轮清零梯度<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：链式法则\n<\/li><li>\n后续：优化器、梯度裁剪\n<\/ul>", "kind": "concept", "title": "自动求导与计算图"}, "c02": {"html": "<h1>缩放点积注意力<\/h1>\n<ul><li>\n<strong>难度<\/strong>：高难 | <strong>涉及章节<\/strong>：第 10 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>用查询 Q 与键 K 的点积衡量相关性，经 softmax 得到权重，再对值 V 加权求和。<\/p>\n<h2>为什么重要<\/h2>\n<p>它是 Transformer 的核心，也是今天几乎所有大模型的基石。理解它等于理解了“序列内部如何互相参考”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  Q[&quot;Q&quot;] --&gt; D[&quot;QKᵀ&quot;]\n  K[&quot;K&quot;] --&gt; D\n  D --&gt; S[&quot;除以 √d_k&quot;]\n  S --&gt; M[&quot;softmax&quot;]\n  V[&quot;V&quot;] --&gt; W[&quot;加权求和&quot;]\n  M --&gt; W<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>点积越大说明查询与键越匹配。除以 √d_k 是因为每个分量方差为 1 时点积方差为 d_k，维数高时点积过大会让 softmax 进入饱和区、梯度消失。<\/p>\n<p>多头机制把 Q、K、V 投影到多个低维子空间，让不同头关注不同类型的关系，最后拼接。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为注意力权重能直接当解释<\/strong>——高权重不等于因果贡献，它只是相关性的一种度量。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 10 章<\/td><td>seq2seq 注意力<\/td><td>解决长序列压缩<\/td><\/tr><tr><td>第 10 章<\/td><td>Transformer<\/td><td>自注意力 + 多头 + 位置编码<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：softmax、矩阵乘法\n<\/li><li>\n后续：多头注意力、位置编码\n<\/ul>", "kind": "concept", "title": "缩放点积注意力"}, "__path__": {"html": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：定位与背景<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：深度学习简介<\/a><br>检查点：说清深度学习兴起的三个条件<\/li><li class='path-step' id='path-02'><strong>步骤 02：张量、自动求导与概率<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：预备知识<\/a><br>检查点：写完一段 autograd 代码并手算核对梯度<\/li><li class='path-step' id='path-03'><strong>步骤 03：线性回归、softmax 与 MLP<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：深度学习基础<\/a><br>检查点：独立写出 softmax 回归的完整训练循环<\/li><li class='path-step' id='path-04'><strong>步骤 04：模型构造与参数管理<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：深度学习计算<\/a><br>检查点：自定义一个有参数的层并确认它被优化器更新<\/li><li class='path-step' id='path-05'><strong>步骤 05：卷积网络<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：卷积神经网络<\/a><br>检查点：手算三种配置的卷积输出尺寸与参数量<\/li><li class='path-step' id='path-06'><strong>步骤 06：循环网络与门控<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：循环神经网络<\/a><br>检查点：画出 LSTM 的门控数据流并解释加法路径<\/li><li class='path-step' id='path-07'><strong>步骤 07：优化算法<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：优化算法<\/a><br>检查点：手推 Adam 一步更新<\/li><li class='path-step' id='path-08'><strong>步骤 08：计算性能<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：计算性能<\/a><br>检查点：针对三种瓶颈各给一条对策<\/li><li class='path-step' id='path-09'><strong>步骤 09：计算机视觉任务<\/strong><br>阅读：<a href=\"#/chapter/ch09\">第 9 章：计算机视觉<\/a><br>检查点：写出微调流程并算一个 IoU<\/li><li class='path-step' id='path-10'><strong>步骤 10：自然语言处理与 Transformer<\/strong><br>阅读：<a href=\"#/chapter/ch10\">第 10 章：自然语言处理<\/a><br>检查点：推导 √d_k 缩放的方差理由<\/li><li class='path-step' id='path-11'><strong>步骤 11：符号与排错<\/strong><br>阅读：<a href=\"#/chapter/ch11\">第 11 章：附录：数学与工具<\/a><br>检查点：按排错清单定位一个真实报错<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "kind": "path", "title": "学习路径"}, "__quiz_all__": {"html": "<p>（无综合题）<\/p>", "kind": "quiz", "title": "综合测验"}, "__quiz_ch01__": {"html": "<h1>测验：第 1 章：深度学习简介<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 深度学习兴起的三个必要条件不包括？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> 大规模数据<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> GPU 算力<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> 完备的理论保证<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 训练算法改进<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 端到端训练的主要代价？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> 训练变慢<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> 难定位错误来源<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> 必须用 GPU<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 不能处理图像<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch02__": {"html": "<h1>测验：第 2 章：预备知识<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 二维数组 sum(axis=0) 的结果形状？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 行数<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 列数<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 标量<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 原形状<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> y=2x² 在 x=3 处的导数？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 6<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 18<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 12<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 2<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch03__": {"html": "<h1>测验：第 3 章：深度学习基础<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> softmax 对分数的梯度是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> ŷ_j<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> ŷ_j - y_j<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> y_j - ŷ_j<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 1<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> MLP 去掉激活函数的后果？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 变成 SVM<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 训练更快<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 退化为线性模型<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 不影响结果<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 权重衰减在梯度上的体现？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 每次更新多减 λw<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 学习率变小<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 梯度被裁剪<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 参数被置零<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='blank'><p class='quiz-q'><b>Q4.<\/b> softmax 计算前先减去____，可避免指数溢出。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch04__": {"html": "<h1>测验：第 4 章：深度学习计算<\/h1><div class='quiz-item' data-qid='q09' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 自定义层漏登记参数的后果？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q09' value='0'> 报错<\/label><label class='quiz-opt'><input type='radio' name='q09' value='1'> 自动登记<\/label><label class='quiz-opt'><input type='radio' name='q09' value='2'> 该参数不更新<\/label><label class='quiz-opt'><input type='radio' name='q09' value='3'> 模型无法前向<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 模型搬到 GPU 后数据怎么办？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 自动跟随<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 手动搬<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 无需搬<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 只能留 CPU<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "kind": "quiz", "title": "测验"}, "__quiz_ch05__": {"html": "<h1>测验：第 5 章：卷积神经网络<\/h1><div class='quiz-item' data-qid='q11' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 输入 32×32、K=5、P=2、S=1，输出尺寸？<\/p><div class='quiz-opts'><label class='q
