<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>学习总手册</title>
<style>
:root{
  --bg:#f7f7f8; --panel:#ffffff; --text:#1f2328; --muted:#6b7280;
  --accent:#2563eb; --accent-soft:#dbeafe; --border:#e5e7eb;
  --ok:#16a34a; --bad:#dc2626; --code-bg:#f3f4f6;
}
[data-theme="dark"]{
  --bg:#111318; --panel:#1a1d24; --text:#e5e7eb; --muted:#9ca3af;
  --accent:#60a5fa; --accent-soft:#1e3a5f; --border:#2d333d;
  --ok:#4ade80; --bad:#f87171; --code-bg:#20242c;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--text);line-height:1.7;font-size:15px}
a{color:var(--accent);text-decoration:none}
a:hover{text-decoration:underline}
header{position:sticky;top:0;z-index:20;background:var(--panel);border-bottom:1px solid var(--border);padding:10px 18px}
.brand{font-size:17px;font-weight:700;display:inline-block;margin-right:18px}
.brand span{color:var(--muted);font-weight:400;font-size:12px;margin-left:6px}
.tabs{display:inline-flex;gap:6px;flex-wrap:wrap;vertical-align:middle}
.tab{border:1px solid var(--border);background:var(--bg);color:var(--text);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:13px}
.tab.active{background:var(--accent);border-color:var(--accent);color:#fff}
.hdr-right{float:right;display:flex;gap:8px;align-items:center;margin-top:2px}
#q{width:260px;padding:6px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:13px}
#theme-btn{border:1px solid var(--border);background:var(--panel);color:var(--text);border-radius:8px;padding:5px 12px;cursor:pointer;white-space:nowrap}
.layout{display:flex;min-height:calc(100vh - 60px)}
.sidebar{width:290px;flex:none;background:var(--panel);border-right:1px solid var(--border);
  padding:14px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
#progress-bar{height:5px;background:var(--border);border-radius:3px;margin:6px 0;overflow:hidden}
#progress-bar>div{height:100%;width:0;background:var(--accent);transition:width .3s}
#progress-label{font-size:12px;color:var(--muted);margin-bottom:8px}
.nav-sec{font-size:12px;color:var(--muted);margin:12px 0 4px;text-transform:uppercase;letter-spacing:.4px}
.nav-item{display:block;padding:5px 10px;border-radius:6px;color:var(--text);font-size:14px}
.nav-item:hover{background:var(--accent-soft);text-decoration:none}
.nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav-item .done{float:right;color:var(--ok);font-size:12px}
#nav-toggle{display:none}
.main{flex:1;min-width:0;padding:28px 40px 80px;max-width:920px}
.page h1{font-size:26px;border-bottom:2px solid var(--border);padding-bottom:8px;margin-top:0}
.page h2{font-size:20px;margin-top:26px}
.page h3{font-size:17px;margin-top:22px}
.page table{border-collapse:collapse;width:100%;margin:12px 0;font-size:14px}
.page th,.page td{border:1px solid var(--border);padding:6px 10px;text-align:left}
.page th{background:var(--code-bg)}
.page code{background:var(--code-bg);padding:2px 5px;border-radius:4px;font-size:.9em}
.page pre{background:var(--code-bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:13px}
.page pre code{background:none;padding:0}
.page blockquote{border-left:4px solid var(--accent);margin:12px 0;padding:6px 14px;background:var(--accent-soft);border-radius:0 6px 6px 0}
.page img{max-width:100%}
.mermaid{background:var(--code-bg);padding:14px;border-radius:8px;overflow-x:auto;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;white-space:pre;color:var(--muted)}
.mermaid-hint{font-size:12px;color:var(--muted);margin:4px 0 14px}
svg{max-width:100%;height:auto}
.quiz-item{border:1px solid var(--border);border-radius:10px;padding:14px 16px;margin:14px 0;background:var(--panel)}
.quiz-q{margin:0 0 8px;font-weight:500}
.quiz-opts label{display:block;padding:4px 0;cursor:pointer}
.quiz-blank{width:60%;padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text)}
.quiz-check{margin-top:10px;padding:6px 16px;border:none;border-radius:6px;background:var(--accent);color:#fff;cursor:pointer}
.quiz-feedback{margin-left:12px;font-size:13px}
.fb-ok{color:var(--ok)}.fb-bad{color:var(--bad)}
.quiz-explain{margin-top:8px;font-size:13px;color:var(--muted);border-top:1px dashed var(--border);padding-top:6px}
.flashcard{perspective:1200px;margin:24px auto;max-width:520px;cursor:pointer;user-select:none}
.fc-inner{position:relative;width:100%;height:240px;transform-style:preserve-3d;transition:transform .5s}
.flashcard.flip .fc-inner{transform:rotateY(180deg)}
.fc-front,.fc-back{position:absolute;inset:0;backface-visibility:hidden;display:flex;align-items:center;justify-content:center;
  padding:22px;border-radius:14px;border:1px solid var(--border);background:var(--panel);font-size:16px;text-align:center}
.fc-back{transform:rotateY(180deg);background:var(--accent-soft);color:var(--text)}
.card-controls{display:flex;gap:14px;align-items:center;margin:12px 0;flex-wrap:wrap}
.card-actions{display:flex;gap:12px;justify-content:center}
.card-actions button{padding:8px 22px;border:none;border-radius:8px;cursor:pointer;font-size:14px}
#card-known-btn{background:var(--ok);color:#fff}
#card-again-btn{background:var(--bad);color:#fff}
.card-counts{color:var(--muted);font-size:13px}
.path-step{margin:8px 0;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--panel)}
.path-step.passed{border-color:var(--ok)}
#glossary-filter{width:100%;max-width:380px;padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);margin-bottom:10px}
#glossary-list li{padding:6px 0;border-bottom:1px dashed var(--border)}
.glossary-ref{color:var(--muted);font-size:12px}
.search-hit{margin:10px 0}
.book-cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px;margin:16px 0}
.book-card{border:1px solid var(--border);border-radius:12px;padding:16px;background:var(--panel)}
.book-card h3{margin:0 0 6px;font-size:16px}
.book-card .meta{font-size:13px;color:var(--muted);margin-bottom:10px}
.book-card .enter{font-size:13px}
.empty{color:var(--muted);padding:20px 0}
@media print{header,.sidebar,.quiz-actions,.card-actions,.card-controls{display:none!important}.main{max-width:none;padding:0}}
@media (max-width:820px){.sidebar{width:100%;height:auto;position:static;padding:10px 14px}
  #nav{display:none}.sidebar.open #nav{display:block}
  #nav-toggle{display:block;width:100%;padding:8px 10px;margin:4px 0;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);font-size:14px;text-align:left;cursor:pointer}
  .layout{flex-direction:column}.main{padding:16px}
  .hdr-right{float:none;margin-top:8px}#q{width:100%}}
</style>
</head>
<body>
<header>
  <span class="brand">学习总手册<span>点化学习系统 · 统一入口</span></span>
  <span class="tabs" id="tabs"></span>
  <span class="hdr-right">
    <input id="q" type="search" placeholder="全书搜索…">
    <button id="theme-btn">🌙 深色</button>
  </span>
</header>
<div class="layout">
  <aside class="sidebar">
    <div id="progress-bar"><div id="progress-fill"></div></div>
    <div id="progress-label">进度 0%</div>
    <nav id="nav"></nav>
  </aside>
  <main><div id="view" class="page"></div></main>
</div>
<script>
const BOOKS = {"aima4":{"manifest": {"slug": "aima4", "title": "人工智能：现代方法（第 4 版）", "subtitle": "整套知识库的骨架：28 章给出 AI 的完整地图，其余四本按图深挖", "book": {"title": "人工智能：现代方法（第4版）", "author": "Stuart Russell、Peter Norvig", "source": ["人工智能：现代方法（第4版）（精装版） (Stuart Russell).pdf"]}, "audience": "大一：会微积分与概率基础，线性代数需补", "goal": "拿到任何 AI 概念时，能说出它在地图的哪一块、依赖什么、别的书在哪里展开它", "learningPath": [{"step": "01", "title": "地图与坐标", "chapterIds": ["ch01", "ch02"], "prereq": "无", "checkpoint": "用 PEAS 描述一个你熟悉的 AI 产品", "goal": "建立全书坐标与智能体框架"}, {"step": "02", "title": "确定环境下的求解", "chapterIds": ["ch03", "ch04", "ch05", "ch06"], "prereq": "ch01、ch02、图论基础", "checkpoint": "手跑一次 A*，手算一次 α-β 剪枝", "goal": "掌握搜索、博弈与约束求解"}, {"step": "03", "title": "符号知识与规划", "chapterIds": ["ch07", "ch08", "ch09", "ch10", "ch11"], "prereq": "ch03、命题逻辑", "checkpoint": "用归结证明一个简单蕴含", "goal": "理解逻辑方法与它的边界"}, {"step": "04", "title": "不确定性", "chapterIds": ["ch12", "ch13", "ch14", "ch15"], "prereq": "ch07、概率论", "checkpoint": "手算一次贝叶斯后验与一次滤波更新", "goal": "掌握概率表示与推断"}, {"step": "05", "title": "决策", "chapterIds": ["ch16", "ch17", "ch18"], "prereq": "ch14", "checkpoint": "算一次信息价值，解释 POMDP 为何用信念", "goal": "掌握从信念到动作的转换"}, {"step": "06", "title": "从数据学习", "chapterIds": ["ch19", "ch20"], "prereq": "ch12、微积分", "checkpoint": "手算一次信息增益与一次 EM 迭代", "goal": "掌握学习的基本范式"}, {"step": "07", "title": "深度学习", "chapterIds": ["ch21"], "prereq": "ch19、线代与微积分", "checkpoint": "手推两层网络的反向传播", "goal": "掌握表示学习"}, {"step": "08", "title": "强化学习", "chapterIds": ["ch22"], "prereq": "ch17", "checkpoint": "写出贝尔曼方程并说明三要素风险", "goal": "掌握交互学习"}, {"step": "09", "title": "语言与视觉", "chapterIds": ["ch23", "ch24", "ch25"], "prereq": "ch21", "checkpoint": "说明自注意力为何优于 RNN", "goal": "掌握感知与语言的主流架构"}, {"step": "10", "title": "行动与反思", "chapterIds": ["ch26", "ch27", "ch28"], "prereq": "ch17、ch25", "checkpoint": "说出对齐问题的技术版本", "goal": "把 AI 放回物理与社会语境"}], "chapters": [{"id": "ch01", "title": "第 1 章：绪论", "file": "chapters/ch01.md", "difficulty": 1}, {"id": "ch02", "title": "第 2 章：智能体", "file": "chapters/ch02.md", "difficulty": 2}, {"id": "ch03", "title": "第 3 章：通过搜索进行问题求解", "file": "chapters/ch03.md", "difficulty": 3}, {"id": "ch04", "title": "第 4 章：复杂环境中的搜索", "file": "chapters/ch04.md", "difficulty": 3}, {"id": "ch05", "title": "第 5 章：对抗搜索和博弈", "file": "chapters/ch05.md", "difficulty": 3}, {"id": "ch06", "title": "第 6 章：约束满足问题", "file": "chapters/ch06.md", "difficulty": 3}, {"id": "ch07", "title": "第 7 章：逻辑智能体", "file": "chapters/ch07.md", "difficulty": 3}, {"id": "ch08", "title": "第 8 章：一阶逻辑", "file": "chapters/ch08.md", "difficulty": 3}, {"id": "ch09", "title": "第 9 章：一阶逻辑中的推断", "file": "chapters/ch09.md", "difficulty": 3}, {"id": "ch10", "title": "第 10 章：知识表示", "file": "chapters/ch10.md", "difficulty": 3}, {"id": "ch11", "title": "第 11 章：自动规划", "file": "chapters/ch11.md", "difficulty": 3}, {"id": "ch12", "title": "第 12 章：不确定性的量化", "file": "chapters/ch12.md", "difficulty": 2}, {"id": "ch13", "title": "第 13 章：概率推理", "file": "chapters/ch13.md", "difficulty": 3}, {"id": "ch14", "title": "第 14 章：时间上的概率推理", "file": "chapters/ch14.md", "difficulty": 3}, {"id": "ch15", "title": "第 15 章：概率编程", "file": "chapters/ch15.md", "difficulty": 3}, {"id": "ch16", "title": "第 16 章：做简单决策", "file": "chapters/ch16.md", "difficulty": 3}, {"id": "ch17", "title": "第 17 章：做复杂决策", "file": "chapters/ch17.md", "difficulty": 3}, {"id": "ch18", "title": "第 18 章：多智能体决策", "file": "chapters/ch18.md", "difficulty": 3}, {"id": "ch19", "title": "第 19 章：样例学习", "file": "chapters/ch19.md", "difficulty": 3}, {"id": "ch20", "title": "第 20 章：概率模型学习", "file": "chapters/ch20.md", "difficulty": 3}, {"id": "ch21", "title": "第 21 章：深度学习", "file": "chapters/ch21.md", "difficulty": 3}, {"id": "ch22", "title": "第 22 章：强化学习", "file": "chapters/ch22.md", "difficulty": 3}, {"id": "ch23", "title": "第 23 章：自然语言处理", "file": "chapters/ch23.md", "difficulty": 3}, {"id": "ch24", "title": "第 24 章：自然语言处理中的深度学习", "file": "chapters/ch24.md", "difficulty": 3}, {"id": "ch25", "title": "第 25 章：计算机视觉", "file": "chap cs"]}, {"id": "f85", "chapterId": "ch26", "front": "配置空间是什么？", "back": "把关节角度组成的高维空间，障碍物映射其中。", "tags": ["robotics"]}, {"id": "f86", "chapterId": "ch26", "front": "阻抗控制适合什么任务？", "back": "需要与环境接触、控制力与位移关系的任务。", "tags": ["control"]}, {"id": "f87", "chapterId": "ch27", "front": "强 AI 与弱 AI 的争论焦点？", "back": "行为等价是否意味着心智等价。", "tags": ["ethics"]}, {"id": "f88", "chapterId": "ch27", "front": "奖励黑客是什么？", "back": "优化器找到满足字面目标但违背意图的解。", "tags": ["alignment"]}, {"id": "f89", "chapterId": "ch27", "front": "AI 安全的四条工程原则？", "back": "明确问责、人类否决、监控漂移、可回滚。", "tags": ["safety"]}, {"id": "f90", "chapterId": "ch28", "front": "AI 发展的三条路线？", "back": "规模、结构、具身交互。", "tags": ["future"]}, {"id": "f91", "chapterId": "ch28", "front": "判断 AI 宣称的三条标准？", "back": "分布一致性、公平基线、公开失败案例。", "tags": ["future"]}, {"id": "f92", "chapterId": "ch28", "front": "能力与理解的差别？", "back": "答对测试题 vs 掌握机制，后者能外推与被纠正。", "tags": ["future"]}], "companion": "aima4学习伴侣.html"}, "rendered": {"ch01": "<h1>第 1 章：绪论<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★☆☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：无\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说出 AI 的四种研究取向及其分歧点；解释“理性智能体”方法为什么成为主流框架；复述 AI 的历史分期与两次寒冬的成因。<\/p>\n<h2>一句话核心<\/h2>\n<p>现代 AI 的标准定义不是“让机器像人一样思考”，而是“设计能根据环境信息做出合理行动的理性智能体”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：四种取向（难度：基础）<\/h3>\n<p>按“像人 / 理性”与“思考 / 行动”两个维度分成四格：像人思考（认知建模）、像人行动（图灵测试）、理性思考（逻辑主义）、理性行动（智能体）。<\/p>\n<p><strong>为什么理性行动胜出<\/strong>：它不要求复现人类的具体思维过程（那涉及神经科学），只要求行为在给定目标下足够好，因此可度量、可实现、可比较。<\/p>\n<h3>概念 2：智能体框架（难度：基础）<\/h3>\n<p>智能体 = 架构 + 程序。它通过传感器感知环境，通过执行器作用于环境。<strong>性能度量<\/strong>定义“什么算好”，<strong>环境<\/strong>定义“问题有多难”，<strong>动作空间<\/strong>定义“能做什么”。<\/p>\n<p><strong>关键洞察<\/strong>：AI 的全部技术都是在回答同一个问题——给定感知序列，如何选动作以最大化性能度量。后面 27 章都是这个问题的不同解法。<\/p>\n<h3>概念 3：历史与两次寒冬（难度：基础）<\/h3>\n<p>达特茅斯会议（1956）确立学科；早期靠符号推理与搜索；第一次寒冬源于“通用问题求解器”的过度承诺与算力不足；专家系统繁荣后又因知识获取瓶颈与维护成本进入第二次寒冬；随后统计学习与算力回升。<\/p>\n<p><strong>读史的意义<\/strong>：每一轮繁荣都伴随一种方法的过度泛化承诺，每一次寒冬都来自“承诺超出能力”。这个模式今天仍在重复。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p>本章是全书索引。<strong>《机器学习》<\/strong> 对应第 19 章以下的学习分支；<strong>《动手学深度学习》<\/strong> 对应第 21、23、24、25 章；<strong>《深度学习入门》<\/strong> 是第 21 章的最小实现版；<strong>《强化学习》<\/strong> 对应第 22 章。本章不提供算法，只提供坐标。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  P[&quot;感知&quot;] --&gt; A[&quot;智能体程序&quot;]\n  A --&gt; C[&quot;动作&quot;]\n  C --&gt; E[&quot;环境&quot;]\n  E --&gt; P\n  A --&gt; M[&quot;性能度量 评价好坏&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这是一个闭环。所有 AI 技术都嵌在这个环的“程序”位置，区别只是程序内部用什么表示与什么推理方式。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 AI 的目标是复制人脑——实际上主流路径是“理性行动”，允许与人类完全不同的内部机制。\n<\/li><li>\n别以为寒冬说明 AI 没用——实际上每次寒冬都是“承诺 &gt; 能力”，技术本身仍在积累。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n现代 AI 主流定义属于哪一格？（答案：D；解析：理性行动，即以智能体框架最大化性能度量。）\n<ul>\n<li>\nA. 像人思考　B. 像人行动　C. 理性思考　D. 理性行动\n<\/li><li>\n两次寒冬的共同成因是？（答案：B；解析：过度承诺与能力不足的落差。）\n<\/li><li>\nA. 算力过剩　B. 承诺超出能力　C. 数据不足　D. 缺乏理论\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n四格取向：像人/理性 × 思考/行动。\n<\/li><li>\n智能体 = 架构 + 程序，感知—决策—行动闭环。\n<\/li><li>\n寒冬规律：承诺超过能力。\n<\/ul>", "ch02": "<h1>第 2 章：智能体<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 1 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：用 PEAS 描述一个任务的性能度量、环境、执行器、传感器；按四种维度给环境分类；说出五种智能体结构各自适用什么环境。<\/p>\n<h2>一句话核心<\/h2>\n<p>选智能体结构前，先给环境画像：可观测性、确定性、动态性、离散性决定了哪种结构够用。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：PEAS（难度：基础）<\/h3>\n<p>Performance（性能度量）、Environment（环境）、Actuators（执行器）、Sensors（传感器）。<strong>做任何 AI 项目，第一件事就是把 PEAS 写出来<\/strong>，否则后面所有设计都缺乏依据。<\/p>\n<p><strong>实例<\/strong>：自动驾驶出租车。性能=安全、时间、合法性、舒适、利润；环境=道路、其他车辆、行人、天气；执行器=方向盘、油门、刹车、喇叭、显示屏；传感器=摄像头、激光雷达、里程计、GPS。<\/p>\n<h3>概念 2：环境分类（难度：进阶）<\/h3>\n<ul><li>\n<strong>完全可观测 / 部分可观测<\/strong>：能否一次看到全部状态。\n<\/li><li>\n<strong>确定性 / 随机性<\/strong>：同一动作结果是否唯一。\n<\/li><li>\n<strong>片段式 / 连续式<\/strong>：子问题是否独立。\n<\/li><li>\n<strong>静态 / 动态<\/strong>：环境在智能体思考时是否变化。\n<\/li><li>\n<strong>离散 / 连续<\/strong>：状态与动作是否可枚举。\n<\/li><li>\n<strong>单智能体 / 多智能体<\/strong>：是否有别的决策者。\n<\/ul>\n<p><strong>维度决定难度<\/strong>：部分可观测 + 随机 + 动态 + 连续，是现实世界的常态，也是最难的组合。<\/p>\n<h3>概念 3：五种结构（难度：进阶）<\/h3>\n<ol><li>\n<strong>简单反射<\/strong>：只看当前感知，查表出动作。只在完全可观测、确定性环境里可靠。\n<\/li><li>\n<strong>基于模型的反射<\/strong>：维护内部状态，记住看不到的部分。\n<\/li><li>\n<strong>基于目标<\/strong>：考虑目标，做规划。\n<\/li><li>\n<strong>基于效用<\/strong>：目标不够用时，用效用函数比较多个目标。\n<\/li><li>\n<strong>学习型<\/strong>：包含性能元件、 critic、学习元件、问题生成器，能改进自己。\n<\/ol>\n<p><strong>为什么需要学习元件<\/strong>：环境未知或会变，靠预先编码不可能覆盖。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p><strong>《强化学习》<\/strong> 整本书就是在讲第五种结构里“学习元件”如何工作：策略=性能元件，价值函数=critic。<strong>《机器学习》<\/strong> 提供学习元件的各种实现。本章的“环境分类”直接决定后面用哪种方法：确定环境用搜索，随机环境用概率推理，未知环境用强化学习。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  S[&quot;感知&quot;] --&gt; M[&quot;内部状态 基于模型&quot;]\n  M --&gt; G[&quot;目标/效用 评估候选&quot;]\n  G --&gt; A[&quot;动作&quot;]\n  A --&gt; S\n  L[&quot;学习元件 改进程序&quot;] -.-&gt; M<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：越往右结构越复杂，能应对的环境也越难。学习元件可以改造前面每一个环节。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为越复杂的结构越好——实际上完全可观测、确定的环境里，简单反射就够，复杂结构反而增加出错点。\n<\/li><li>\n别以为“智能体”必须是实体机器人——实际上软件进程、游戏角色、推荐系统都符合定义。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nPEAS 中的 E 指？（答案：B；解析：Environment，环境。）\n<ul>\n<li>\nA. 执行器　B. 环境　C. 评估　D. 经验\n<\/li><li>\n部分可观测环境中最少需要哪种结构？（答案：C；解析：需要维护内部状态，即基于模型的反射智能体。）\n<\/li><li>\nA. 简单反射　B. 基于目标　C. 基于模型的反射　D. 学习型\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nPEAS 四要素是一切 AI 项目的起点。\n<\/li><li>\n环境六个维度决定方法选择。\n<\/li><li>\n五种结构从简单反射到学习型逐级增强。\n<\/ul>", "ch03": "<h1>第 3 章：通过搜索进行问题求解<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 2 章、图与树\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：把一个实际问题形式化为状态空间搜索；比较宽度优先、深度优先、一致代价、A<em> 的完备性与最优性；说明启发函数的可采纳性条件；手算一个 A<\/em> 的搜索过程。<\/p>\n<h2>一句话核心<\/h2>\n<p>搜索把“怎么达到目标”变成“在状态图上找一个路径”，算法差异全在“先扩展哪个节点”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：问题形式化（难度：基础）<\/h3>\n<p>五要素：初始状态、动作、转移模型、目标测试、路径代价。<\/p>\n<p><strong>实例（八数码）<\/strong>：初始布局、空格移动、移动后的布局、是否达到目标布局、每步代价 1。状态数是 9!/2=181440 个可达状态——这说明穷举可行但需要好的顺序。<\/p>\n<h3>概念 2：四种无信息搜索（难度：进阶）<\/h3>\n<ul><li>\n<strong>宽度优先 BFS<\/strong>：按深度逐层扩展。完备、最优（代价相同时），空间 O(b^d)。\n<\/li><li>\n<strong>深度优先 DFS<\/strong>：一路到底。空间省 O(bm)，但不完备（有环或无限深）、不最优。\n<\/li><li>\n<strong>一致代价 UCS<\/strong>：每次扩展代价最小的节点。完备、最优，时间随代价增长。\n<\/li><li>\n<strong>深度受限 / 迭代加深<\/strong>：限制深度；迭代加深反复加深，兼具 BFS 的最优与 DFS 的空间。\n<\/ul>\n<h3>概念 3：A* 与启发式（难度：高难）<\/h3>\n<p><code>f(n) = g(n) + h(n)<\/code>，g 是已花代价，h 是到目标的估计。<strong>可采纳<\/strong>：h 从不高估真实代价。<strong>一致（consistent）<\/strong>：h(n) ≤ c(n,n&#x27;) + h(n&#x27;)。<\/p>\n<p><strong>结论<\/strong>：h 可采纳 → A<em> 树搜索最优；h 一致 → A<\/em> 图搜索（不重复扩展）最优。<strong>为什么<\/strong>：可采纳保证不会因为高估而错过更优路径；一致保证第一次扩展到某节点时就是最优路径。<\/p>\n<p><strong>实例（八数码）<\/strong>：h1=错位棋子数（可采纳但松），h2=曼哈顿距离和（可采纳且更紧）。h2 扩展的节点数明显少于 h1。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p>搜索是 AIMA 独有的一条线，四本配套书都不展开。但它的思想在别处出现：<strong>《强化学习》<\/strong> 第 8 章的规划与树搜索是同一逻辑在马尔可夫决策过程上的版本；<strong>《机器学习》<\/strong> 第 4 章的决策树构建也是一种贪心搜索。读本章要抓“状态空间 + 评价函数 + 扩展顺序”这个三元结构。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  S[&quot;初始状态&quot;] --&gt; E[&quot;扩展节点&quot;]\n  E --&gt; F[&quot;评价 f=g+h&quot;]\n  F --&gt; Q[&quot;边界队列&quot;]\n  Q --&gt; E\n  E --&gt; G{&quot;目标测试&quot;}\n  G --&gt;|是| O[&quot;返回路径&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：搜索的全部差异在于队列怎么排：先进先出是 BFS，后进先出是 DFS，按代价是 UCS，按 f 是 A*。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为启发函数越大越好——实际上只有可采纳时才保证最优，高估会走错路。\n<\/li><li>\n别以为 A* 一定比 BFS 快——实际上 h≡0 时它退化成 UCS。\n<\/li><li>\n别以为搜索只适用于小问题——实际上配合好的启发式与剪枝，它能处理很大的状态空间。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nA* 树搜索保证最优的条件是？（答案：B；解析：h 可采纳，即从不高估。）\n<ul>\n<li>\nA. h 一致　B. h 可采纳　C. h 单调　D. h 为 0\n<\/li><li>\nDFS 的主要缺陷是？（答案：C；解析：可能沿无限路径走下去，不完备也不最优。）\n<\/li><li>\nA. 空间太大　B. 时间太长　C. 不完备且不最优　D. 需要启发函数\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n搜索三要素：状态空间、评价函数、扩展顺序。\n<\/li><li>\nBFS 最优但费空间，DFS 省空间但不完备。\n<\/li><li>\nA*：f=g+h，h 可采纳保最优。\n<\/ul>", "ch04": "<h1>第 4 章：复杂环境中的搜索<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说出局部搜索与系统搜索的适用差别；写出爬山法、模拟退火、遗传算法的基本流程；说明在线搜索与离线搜索的区别；解释 LRTA* 在做什么。<\/p>\n<h2>一句话核心<\/h2>\n<p>当状态空间大到存不下、或环境会变时，不再维护搜索树，而是只保留当前状态并就地改进。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：局部搜索（难度：进阶）<\/h3>\n<p><strong>爬山法<\/strong>：每次从邻居里选最好的，直到没有更好的。问题是局部极大与平台。 <strong>模拟退火<\/strong>：以 <code>e^{ΔE/T}<\/code> 的概率接受变差的解，T 逐渐降低。前期能跳出局部极大，后期趋于稳定。 <strong>遗传算法<\/strong>：维护种群，按适应度选择、交叉、变异。适合适应度地形复杂、难以求梯度的场景。<\/p>\n<h3>概念 2：在线搜索（难度：高难）<\/h3>\n<p>智能体不知道环境，只能边走边学。**LRTA<em>（学习实时 A<\/em>）**：在当前状态算 <code>H(s) = min_a [c(s,a) + H(s&#x27;)]<\/code>，更新 H(s)，然后移动到该动作的下一状态；若发现新信息就修正 H。<\/p>\n<p><strong>为什么需要在线<\/strong>：状态空间太大无法预先搜完，或者环境在变导致预计算结果失效。<\/p>\n<h3>概念 3：与博弈搜索的区别（难度：进阶）<\/h3>\n<p>博弈搜索（第 5 章）假设对手是对抗的；在线搜索假设环境不主动对抗但未知。两者的算法骨架相似，评价目标不同。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p>本章在四本书里没有直接对应章节，但它是<strong>《强化学习》<\/strong> 的“规划”侧的近亲：LRTA<em> 与 Dyna 都在“用估计更新估计”。区别在于 LRTA<\/em> 用的是确定性的代价，Dyna 用的是期望奖励。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  C[&quot;当前状态&quot;] --&gt; N[&quot;评估邻居&quot;]\n  N --&gt; M[&quot;移动或停留&quot;]\n  M --&gt; U[&quot;更新启发值&quot;]\n  U --&gt; C<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：局部搜索不留历史，只留当前点；在线搜索只留一张启发值表，边跑边改。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为局部搜索找不到好解就没用——实际上在很多组合优化问题上它比精确算法更实用。\n<\/li><li>\n别以为在线搜索需要完整模型——实际上它只需要“知道动作会到什么状态”这一条局部信息。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n模拟退火接受变差解的概率随温度如何变化？（答案：B；解析：T 降低时概率趋近 0，趋于贪心。）\n<ul>\n<li>\nA. 增大　B. 减小　C. 不变　D. 先增后不变\n<\/li><li>\nLRTA<em> 与 A<\/em> 的关键差别是？（答案：C；解析：LRTA* 在线、只维护启发值，不建搜索树。）\n<\/li><li>\nA. 是否用启发函数　B. 是否完备　C. 在线更新启发值而非建树　D. 是否需要目标\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n局部搜索：只留当前点，爬山、退火、遗传。\n<\/li><li>\n在线搜索：边跑边更新启发值。\n<\/li><li>\nLRTA* 与 Dyna 是同一思想在确定性/随机环境的两版。\n<\/ul>", "ch05": "<h1>第 5 章：对抗搜索和博弈<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 3、4 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：画出极小化极大算法并说明它的假设；解释 α-β 剪枝为什么能剪掉而不影响结果；说明深度受限 + 评价函数带来的近似性质；说出蒙特卡洛树搜索的四个步骤。<\/p>\n<h2>一句话核心<\/h2>\n<p>博弈搜索在“对手一定选最坏应对”的假设下，找自己最稳妥的一步。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：极小化极大（难度：进阶）<\/h3>\n<p><code>Minimax(s) = max_a min_s&#x27; Minimax(s&#x27;)<\/code>（轮到自己时取最大，轮到对手时取最小）。它假设双方完美、零和、确定性。<\/p>\n<p><strong>为什么取 min<\/strong>：因为对手会选择让你最不利的走法。这是“最坏情况最优”的策略。<\/p>\n<h3>概念 2：α-β 剪枝（难度：高难）<\/h3>\n<p>维护 α（当前 MAX 路径已知下界）与 β（MIN 路径已知上界）。当某节点的值超出区间 <code>[α,β]<\/code> 时，其后续兄弟节点可剪掉——因为父节点一定不会选它。<\/p>\n<p><strong>性质<\/strong>：剪枝不改变根节点值，只是少算；最优顺序下复杂度从 O(b^d) 降到 O(b^{d/2})，等于深度减半。<\/p>\n<p><strong>实例<\/strong>：根为 MAX，第一个子节点值 3（α=3）；第二个子节点是 MIN，展开第一个孙子得 2（β=2），此时 β&lt;α 已经确定这个 MIN 节点最多 2，根不会选它，剩下孙子全剪。<\/p>\n<h3>概念 3：深度受限与评价（难度：进阶）<\/h3>\n<p>真实博弈树太深，只能搜到固定深度，用评价函数估计局面好坏。<strong>这时最优性不再保证<\/strong>：评价函数有偏、地平线效应（刚好在深度边界发生的大变化看不到）都会导致错判。<\/p>\n<h3>概念 4：MCTS（难度：高难）<\/h3>\n<p>四步：选择（按 UCB 选路径）、扩展（加一个节点）、模拟（随机走到底）、回传（更新访问次数与胜率）。它不需要评价函数，靠大量采样逼近，适合分支极宽的问题（围棋）。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p>博弈里的“在最坏对手下最大化收益”与<strong>《强化学习》<\/strong> 第 18 章（多智能体）的博弈论视角直接相连；MCTS 在 Sutton 书第 8 章的树搜索一节也有对应。区别是：这里假设完全可观测与确定性，Sutton 书处理的是不确定环境。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  R[&quot;根 MAX&quot;] --&gt; A[&quot;子 MIN&quot;]\n  R --&gt; B[&quot;子 MIN&quot;]\n  A --&gt; A1[&quot;叶 值 3&quot;]\n  A --&gt; A2[&quot;叶 值 5&quot;]\n  B --&gt; B1[&quot;叶 值 2 触发剪枝&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：一旦某个 MIN 节点的上界小于已知 MAX 下界，它的其余分支就不必再看。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 α-β 会改变搜索结果——实际上它只剪掉不影响根值的分支。\n<\/li><li>\n别以为评价函数越复杂越好——实际上它必须快，否则搜索深度上不去，效果反而差。\n<\/li><li>\n别以为 MCTS 不需要领域知识——实际上它常与策略网络结合来缩小搜索宽度。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nα-β 剪枝对根节点值的影响是？（答案：A；解析：不改变结果，只减少计算。）\n<ul>\n<li>\nA. 不变　B. 变大　C. 变小　D. 不确定\n<\/li><li>\n深度受限搜索失去的保证是？（答案：B；解析：用评价函数近似，最优性不再保证。）\n<\/li><li>\nA. 完备性　B. 最优性　C. 终止性　D. 正确性定义\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nMinimax：自己取 max，对手取 min。\n<\/li><li>\nα-β：不影响结果，最优顺序下复杂度开方。\n<\/li><li>\n深度受限用评价函数，最优性不再保证。\n<\/li><li>\nMCTS 四步：选择、扩展、模拟、回传。\n<\/ul>", "ch06": "<h1>第 6 章：约束满足问题<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 3 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：把 CSP 形式化为变量、值域、约束；用前向检验与弧相容剪掉不可能取值；解释回溯搜索为什么比标准搜索高效；说出约束传播与变量排序的启发式。<\/p>\n<h2>一句话核心<\/h2>\n<p>CSP 把“找满足一组约束的赋值”从搜索问题中单独拎出来，用约束结构大幅剪枝。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：形式化（难度：基础）<\/h3>\n<p>变量集合 X、值域 D、约束集合 C。<strong>实例（地图着色）<\/strong>：三个区域，三色可选，相邻不能同色。变量=区域，值域={红,绿,蓝}，约束=相邻不同色。<\/p>\n<p><strong>与一般搜索的差别<\/strong>：一般搜索只看“动作后果”，CSP 能利用“哪些取值一定不可能”这种全局信息。<\/p>\n<h3>概念 2：约束传播（难度：高难）<\/h3>\n<ul><li>\n<strong>前向检验<\/strong>：给某变量赋值后，删掉邻居值域中与新赋值冲突的取值。\n<\/li><li>\n<strong>弧相容（AC-3）<\/strong>：对每条弧 (Xi,Xj)，若 Xi 的某个取值在 Xj 中找不到相容取值，就删掉它；反复直到稳定。\n<\/ul>\n<p><strong>代价<\/strong>：传播本身要花时间，过强的传播可能得不偿失——这是 CSP 里的经典权衡。<\/p>\n<h3>概念 3：回溯与启发式（难度：进阶）<\/h3>\n<p><strong>回溯搜索<\/strong>：按变量顺序赋值，冲突就回退。<strong>变量排序（MRV）<\/strong>：优先选剩余可选值最少的变量（最受约束优先）。<strong>值排序（LCV）<\/strong>：优先选给邻居留余地最大的值。<\/p>\n<p><strong>实例<\/strong>：数独。MRV 让程序先填那些只剩一个可能数字的格子，几乎不用回溯。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p>CSP 在四本书中没有对应章节，但它是<strong>《机器学习》<\/strong> 第 15 章规则学习与第 14 章概率图模型中“约束/因子”思想的符号版本。理解 CSP 的传播机制，有助于理解贝叶斯网里的变量消去为什么能剪枝。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;选变量 MRV&quot;] --&gt; B[&quot;选值 LCV&quot;]\n  B --&gt; C[&quot;前向检验 剪邻居&quot;]\n  C --&gt; D{&quot;冲突&quot;}\n  D --&gt;|有| E[&quot;回溯&quot;]\n  D --&gt;|无| F[&quot;继续赋值&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三个启发式分别解决“先动谁、先取什么、动完怎么剪”。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为约束越多越难解——实际上约束越多，传播剪得越狠，有时反而更快。\n<\/li><li>\n别以为弧相容能替代搜索——实际上它只能剪掉不可能取值，不能保证找到解。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nMRV 启发式选什么变量？（答案：B；解析：剩余可选值最少的，即最受约束的。）\n<ul>\n<li>\nA. 值域最大的　B. 剩余可选值最少的　C. 最先出现的　D. 约束最少的\n<\/li><li>\n弧相容的作用是？（答案：A；解析：删掉在邻居中找不到相容取值的值，缩小搜索空间。）\n<\/li><li>\nA. 剪掉不可能取值　B. 直接求解　C. 排序变量　D. 生成新约束\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nCSP 三要素：变量、值域、约束。\n<\/li><li>\n前向检验剪邻居，弧相容反复传播到稳定。\n<\/li><li>\nMRV 选变量、LCV 选值。\n<\/ul>", "ch07": "<h1>第 7 章：逻辑智能体<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 2、3 章、命题逻辑\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出命题逻辑的语法与语义；用真值表判断蕴含与等价；解释可靠性、完备性、蕴含的关系；说明归结法为什么完备。<\/p>\n<h2>一句话核心<\/h2>\n<p>逻辑智能体把“知道什么”写成命题，把“该做什么”转成“从知识库能推出什么”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：语法与语义（难度：基础）<\/h3>\n<p>语法是符号与连接词（¬ ∧ ∨ → ↔）的合法组合；语义是“在某个可能世界中是真是假”。<strong>关键区分<\/strong>：语法讲形式，语义讲真假，两者不能混。<\/p>\n<p><strong>蕴含<\/strong> <code>KB ⊨ α<\/code> 的意思是：所有让 KB 为真的世界，α 也为真。注意它不要求 KB 为真——前提为假时蕴含自动成立。<\/p>\n<h3>概念 2：推理规则（难度：进阶）<\/h3>\n<ul><li>\n<strong>假言推理<\/strong>：<code>A→B, A ⊢ B<\/code>。\n<\/li><li>\n<strong>与消解<\/strong>：<code>A∧B ⊢ A<\/code>。\n<\/li><li>\n<strong>归结<\/strong>：<code>(A∨B), (¬B∨C) ⊢ (A∨C)<\/code>。它把两句话里的互补文字消掉，得到新句子。\n<\/ul>\n<p><strong>归结为什么完备<\/strong>：命题逻辑里，若 KB ⊨ α，则 KB∧¬α 不可满足；归结能推出空子句当且仅当不可满足（归结完备性定理）。所以“反证 + 归结”能推出所有蕴含。<\/p>\n<h3>概念 3：智能体的动作（难度：进阶）<\/h3>\n<p>给定感知，把感知加入 KB，然后对每个可能的动作 a，检查 <code>KB ⊨ 执行 a 后目标达成<\/code>。若都推不出，就选一个“不导致灾难”的动作（安全性检查）。<\/p>\n<p><strong>这就是“逻辑智能体”的全部<\/strong>：感知 → 更新 KB → 推理 → 选动作。它的局限是：只能处理确定、可完全表示的知识；现实中的不确定性它无法表达。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p>逻辑方法在四本配套书里被“统计方法”替代——这是 AI 的一条根本分野。<strong>《机器学习》<\/strong> 第 7 章的贝叶斯分类器与第 14 章的概率图模型，处理的正是不确定性；<strong>《强化学习》<\/strong> 则完全放弃“先验知识库”，改用经验。读本章的价值是理解“为什么符号方法在开放环境里失效”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  P[&quot;感知&quot;] --&gt; K[&quot;知识库 TELL&quot;]\n  K --&gt; Q[&quot;ASK 查询&quot;]\n  Q --&gt; A[&quot;选动作&quot;]\n  A --&gt; P<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：TELL 与 ASK 是两个基本操作。所有推理都发生在 ASK 这一步。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为“蕴含”要求前提为真——实际上前提假时蕴含恒真，这是最容易搞错的一点。\n<\/li><li>\n别以为归结只对简单公式有效——实际上它对整个命题逻辑完备。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<code>KB ⊨ α<\/code> 的含义是？（答案：C；解析：所有使 KB 为真的世界也使 α 为真。）\n<ul>\n<li>\nA. KB 为真　B. α 可证明　C. 所有 KB 为真的世界 α 也为真　D. KB 与 α 等价\n<\/li><li>\n归结法完备性指的是？（答案：B；解析：若蕴含成立，反证 + 归结必能推出空子句。）\n<\/li><li>\nA. 一定能找到最短证明　B. 蕴含成立时必能推出空子句　C. 只能处理简单公式　D. 不需要前提\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n语法管形式，语义管真假。\n<\/li><li>\n蕴含：KB 为真的世界 α 也为真。\n<\/li><li>\n归结完备：反证能推出空子句即不可满足。\n<\/ul>", "ch08": "<h1>第 8 章：一阶逻辑<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 7 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说出命题逻辑的局限与一阶逻辑的补充；写出量词 ∀、∃ 的语义与否定规则；用合一算法匹配两个含变量的表达式；说明一阶逻辑的表示力与不可判定性。<\/p>\n<h2>一句话核心<\/h2>\n<p>一阶逻辑引入对象、关系与量词，能表达“所有”“存在”，因此能描述命题逻辑描述不了的结构。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么需要一阶逻辑（难度：进阶）<\/h3>\n<p>命题逻辑只能表达“P 为真”，无法表达“所有学生都通过了”或“存在一个人”。它把每个具体事实写成一个独立命题，无法泛化。<\/p>\n<p><strong>一阶逻辑三件套<\/strong>：对象（常量）、关系（谓词）、函数。加上量词 <code>∀<\/code>（所有）与 <code>∃<\/code>（存在），就能写 <code>∀x 学生(x) → 通过(x)<\/code>。<\/p>\n<h3>概念 2：量词的语义（难度：进阶）<\/h3>\n<p><code>∀x P(x)<\/code>：论域中每个对象都满足 P。 <code>∃x P(x)<\/code>：论域中至少一个对象满足 P。<\/p>\n<p><strong>否定规则<\/strong>（必须记住）：<code>¬∀x P(x) ≡ ∃x ¬P(x)<\/code>；<code>¬∃x P(x) ≡ ∀x ¬P(x)<\/code>。<strong>量词的顺序不能交换<\/strong>：<code>∀x ∃y 爱(x,y)<\/code>（每个人都有爱的人）与 <code>∃y ∀x 爱(x,y)<\/code>（存在一个人被所有人爱）意思完全不同。<\/p>\n<h3>概念 3：合一（难度：高难）<\/h3>\n<p>合一找一个替换，使两个表达式相同。例如 <code>Knows(John,x)<\/code> 与 <code>Knows(John,Jane)<\/code> 合一为 <code>{x/Jane}<\/code>。<\/p>\n<p><strong>为什么需要<\/strong>：归结时要先让两个子句的互补文字“对上”，合一就是找这个替换。<strong>最一般合一（MGU）<\/strong> 是最省约束的那个替换。<\/p>\n<h3>概念 4：表示力与代价（难度：高难）<\/h3>\n<p>一阶逻辑能表达算术、集合论的大部分内容。代价是<strong>半可判定<\/strong>：真命题一定能被证明，但假命题不保证能证明（会一直算下去）。这是它无法成为通用推理引擎的根本原因。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p><strong>《机器学习》<\/strong> 第 15 章归纳逻辑程序设计（ILP）直接用一阶逻辑表示规则，是本章的“学习版”。<strong>AIMA 第 10、11 章<\/strong>的知识表示与规划进一步用它。四本书里没有别的地方系统使用一阶逻辑，这也是符号 AI 与统计 AI 的分界线。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  C[&quot;常量 对象&quot;] --&gt; A[&quot;原子公式&quot;]\n  P[&quot;谓词 关系&quot;] --&gt; A\n  A --&gt; Q[&quot;量词 组合&quot;]\n  Q --&gt; S[&quot;句子 可判断真假&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从对象到原子公式到量词组合，表示力逐级上升，判断复杂度也逐级上升。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 ∀ 和 ∃ 可以随便换序——实际上换序会彻底改变含义。\n<\/li><li>\n别以为一阶逻辑能判断所有命题的真假——实际上它半可判定，假命题可能永远算不出。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n<code>¬∀x P(x)<\/code> 等价于？（答案：C；解析：否定全称量词得到存在否定。）\n<ul>\n<li>\nA. ∀x¬P(x)　B. ¬∃xP(x)　C. ∃x¬P(x)　D. ∃xP(x)\n<\/li><li>\n<code>∀x∃y 爱(x,y)<\/code> 的含义是？（答案：A；解析：每个人各自有爱的人。）\n<\/li><li>\nA. 每个人都有爱的人　B. 存在一个人被所有人爱　C. 所有人爱同一个人　D. 没有人相爱\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n一阶逻辑 = 对象 + 谓词 + 量词。\n<\/li><li>\n量词否定：¬∀→∃¬，¬∃→∀¬。\n<\/li><li>\n量词顺序改变含义。\n<\/li><li>\n半可判定：真能证，假未必能证。\n<\/ul>", "ch09": "<h1>第 9 章：一阶逻辑中的推断<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 8 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说出前向链接与反向链接的适用差别；写出归结反驳的步骤；解释 Horn 子句为什么高效；说明为什么完整的一阶推理不可行。<\/p>\n<h2>一句话核心<\/h2>\n<p>推断的方向决定了成本：从事实往前推会爆炸，从目标往回推只碰相关内容。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：前向链接（难度：进阶）<\/h3>\n<p>从已知事实出发，反复应用规则推出新事实，直到目标出现。<strong>数据驱动<\/strong>，适合事实多、目标不明确的场景。缺点是会推出大量无关结论。<\/p>\n<h3>概念 2：反向链接（难度：进阶）<\/h3>\n<p>从目标出发，找能推出该目标的规则，把规则前提变成新的子目标。<strong>目标驱动<\/strong>，适合目标明确、事实多的场景。Prolog 就是反向链接。<\/p>\n<h3>概念 3：归结反驳（难度：高难）<\/h3>\n<p>要证 <code>KB ⊨ α<\/code>，就证 <code>KB ∧ ¬α<\/code> 不可满足：把 ¬α 加入知识库，反复归结，直到出现空子句。<\/p>\n<p><strong>Horn 子句<\/strong>（最多一个正文字）的特别之处：它的归结可以变成“前向/反向链接”，不需要完整的合一搜索，所以效率高得多。大部分现实规则库都是 Horn 形式。<\/p>\n<h3>概念 4：复杂度（难度：高难）<\/h3>\n<p>一般一阶推理是不可判定的（半可判定）。即便可判定，复杂度也可能极高。所以实际系统要么限制语言（Horn、描述逻辑），要么放弃完备性（用启发式）。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p>本章的“目标驱动推理”与<strong>《机器学习》<\/strong> 第 15 章规则学习的“序贯覆盖”在结构上呼应：都是围绕目标逐步缩小搜索。区别是逻辑推理保证正确，规则学习只求统计上准。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  F[&quot;已知事实&quot;] --&gt;|&quot;前向&quot;| N[&quot;新事实&quot;]\n  N --&gt; F\n  G[&quot;目标&quot;] --&gt;|&quot;反向&quot;| P[&quot;子目标&quot;]\n  P --&gt; G\n  F --&gt; M[&quot;相遇 证明完成&quot;]\n  G --&gt; M<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：前向从下往上堆，反向从上往下拆，两者在中间相遇即完成证明。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为前向链接更“全面”就一定更好——实际上目标明确时它做了大量无用功。\n<\/li><li>\n别以为归结对任何逻辑都完备——实际上二阶及以上就不完备了。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nProlog 采用的推理方式是？（答案：B；解析：从目标反向链接。）\n<ul>\n<li>\nA. 前向链接　B. 反向链接　C. 真值表　D. 归结反驳\n<\/li><li>\nHorn 子句高效的原因是？（答案：C；解析：最多一个正文字，归结可退化为链接，避免完整合一搜索。）\n<\/li><li>\nA. 更短　B. 不需要变量　C. 归结可退化为链接　D. 一定可满足\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n前向数据驱动，反向目标驱动。\n<\/li><li>\n归结反驳：加入 ¬α 推空子句。\n<\/li><li>\nHorn 子句把归结退化为链接，效率高。\n<\/li><li>\n一阶推理半可判定，实际系统常牺牲完备性。\n<\/ul>", "ch10": "<h1>第 10 章：知识表示<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 8、9 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说清本体论工程的作用；区分类别、事件、时间与空间的表示方式；解释默认推理与非单调逻辑的动机；说明语义网与描述逻辑的取舍。<\/p>\n<h2>一句话核心<\/h2>\n<p>知识表示的核心不是“怎么存”，而是“用什么本体论切分世界”，切法决定了什么能推、什么推不动。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：本体论工程（难度：进阶）<\/h3>\n<p>本体论是一套关于“世界上有哪些类东西、它们怎么关联”的约定。上层本体（如 Cyc）试图覆盖通用概念，领域本体只覆盖特定行业。<\/p>\n<p><strong>为什么难<\/strong>：不同领域的切分方式冲突。比如“服务”在电信里是网络功能，在商业里是一次交易，强行统一会丢信息。<\/p>\n<h3>概念 2：类别与事件（难度：进阶）<\/h3>\n<p>类别用子类关系组织（<code>Dog ⊂ Animal<\/code>）。事件用“事件演算”表示：把动作、时间、对象都显式写成参数，<code>Owns(John,Car1,T1)<\/code>。这样能表达“在某时拥有”，而不是“永远拥有”。<\/p>\n<p><strong>与一阶逻辑的关系<\/strong>：这些都是在第一阶逻辑框架内加“约定”，不是新逻辑。<\/p>\n<h3>概念 3：默认推理（难度：高难）<\/h3>\n<p>“鸟通常会飞”不能用 ∀ 表达（因为存在企鹅）。默认逻辑写成“若 x 是鸟且没有相反证据，则 x 会飞”。<strong>非单调<\/strong>：加入新事实（“这是企鹅”）后，原来的结论被撤回。<\/p>\n<p>这是经典逻辑最根本的突破点：经典逻辑单调，加入前提只会增加结论，不会撤回。<\/p>\n<h3>概念 4：语义网与描述逻辑（难度：高难）<\/h3>\n<p><strong>描述逻辑<\/strong>是可判定的逻辑片段，牺牲部分表达力换取推理可终止。<strong>OWL<\/strong> 是其工程化标准。<strong>语义网<\/strong>用 RDF 三元组 + 本体描述资源关系，本质是“可分布的大规模描述逻辑”。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p>本章的知识表示方法在四本配套书里基本不出现，它属于符号 AI 的另一条腿。<strong>《机器学习》<\/strong> 第 14 章概率图模型可以看作“给知识加不确定性”的替代方案：与其写规则，不如学参数。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  S[&quot;上层本体 通用概念&quot;] --&gt; D[&quot;领域本体&quot;]\n  D --&gt; I[&quot;实例数据&quot;]\n  I --&gt; R[&quot;推理 分类/一致性检查&quot;]\n  R --&gt; Q[&quot;查询与决策&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从抽象到具体三层。推理发生在最上层，越往下数据越多、推断越具体。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为本体越大越有用——实际上过大的本体难以维护且冲突多。\n<\/li><li>\n别以为默认推理只是“猜”——实际上它有严格语义，只是结论可撤回。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n“鸟通常会飞”最适合用什么表示？（答案：C；解析：存在例外，需要默认推理。）\n<ul>\n<li>\nA. 全称量词　B. 存在量词　C. 默认规则　D. 真值表\n<\/li><li>\n非单调逻辑的“非单调”指？（答案：B；解析：加入新前提后旧结论可能被撤回。）\n<\/li><li>\nA. 推理速度不均匀　B. 新信息可撤回旧结论　C. 结论不确定　D. 不能重复使用\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n本体论决定世界的切分方式。\n<\/li><li>\n事件演算把时间显式参数化。\n<\/li><li>\n默认推理非单调：新事实可撤回旧结论。\n<\/li><li>\n描述逻辑牺牲表达力换可判定。\n<\/ul>", "ch11": "<h1>第 11 章：自动规划<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 7、10 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出 STRIPS 表示的动作三要素；说清前向搜索与后向搜索在规划中的差别；解释启发式规划为什么需要松弛问题；区分分层规划与机会主义规划。<\/p>\n<h2>一句话核心<\/h2>\n<p>规划 = 在“状态 + 动作前提与效果”的表示下，找一串动作把初始状态变成目标。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：STRIPS 表示（难度：进阶）<\/h3>\n<p>每个动作三部分：<strong>前提<\/strong>（执行前必须为真的文字）、<strong>删除列表<\/strong>（执行后变假的）、<strong>添加列表<\/strong>（执行后变真的）。<\/p>\n<p><strong>实例<\/strong>：<code>Move(b,x,y)<\/code> 前提 <code>On(b,x) ∧ Clear(b) ∧ Clear(y)<\/code>；删除 <code>On(b,x), Clear(y)<\/code>；添加 <code>On(b,y), Clear(x)<\/code>。这套表示让“什么变了”非常清晰，便于推理。<\/p>\n<h3>概念 2：前向与后向（难度：进阶）<\/h3>\n<p><strong>前向<\/strong>：从初始状态出发，试所有可执行动作。<strong>后向<\/strong>：从目标出发，找“哪个动作能产生该目标”，把前提变成新目标。<\/p>\n<p><strong>为什么后向常更有效<\/strong>：目标通常只涉及少量事实，后向搜索不会被大量无关动作淹没；但后向要处理“删除列表”带来的复杂条件（要保证动作不破坏已达成的目标）。<\/p>\n<h3>概念 3：启发式规划（难度：高难）<\/h3>\n<p>真实规划的搜索空间巨大，用<strong>松弛问题<\/strong>做启发：忽略删除列表（假设事实一旦为真就永远为真），此时子目标可以独立达成，问题变简单，其解的长度可当作原问题的下界估计。<\/p>\n<p><strong>为什么能当下界<\/strong>：松弛问题比原问题容易，它的最优代价不会超过原问题——所以是可采纳启发式。<\/p>\n<h3>概念 4：分层与机会主义（难度：进阶）<\/h3>\n<p><strong>分层规划<\/strong>：把任务拆成抽象层与具体层，先在高抽象层规划，再细化。<strong>机会主义<\/strong>：执行中发现机会就调整，不必严格按预定顺序。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p>规划在<strong>《强化学习》<\/strong> 里有对应物：Sutton 书第 8 章的 Dyna 与第 16 章的 AlphaGo 都是“用模型做前瞻”。区别是：规划假设确定性、离散动作、有明确目标；强化学习处理随机性与奖励。<strong>《机器学习》<\/strong> 第 4 章决策树的贪心分裂与规划的子目标分解也有结构相似性。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  I[&quot;初始状态&quot;] --&gt;|&quot;前向 试动作&quot;| S[&quot;中间状态&quot;]\n  G[&quot;目标&quot;] --&gt;|&quot;后向 找产生者&quot;| P[&quot;前提子目标&quot;]\n  S --&gt; M[&quot;相遇 得到计划&quot;]\n  P --&gt; M<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两个方向各自削减搜索空间，相遇即找到动作序列。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为忽略删除列表的松弛一定错——实际上它不保证可行，但保证启发值不高估。\n<\/li><li>\n别以为后向搜索总是更好——实际上动作效果复杂时，后向条件更难处理。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nSTRIPS 动作的三要素是？（答案：B；解析：前提、删除列表、添加列表。）\n<ul>\n<li>\nA. 名称、参数、代价　B. 前提、删除、添加　C. 输入、输出、状态　D. 变量、约束、目标\n<\/li><li>\n松弛规划忽略删除列表后得到的启发式？（答案：C；解析：松弛问题更易，其解代价是原问题下界，故可采纳。）\n<\/li><li>\nA. 不可采纳　B. 高估代价　C. 可采纳的下界　D. 精确值\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nSTRIPS：前提、删除、添加。\n<\/li><li>\n前向试动作，后向找产生者。\n<\/li><li>\n松弛忽略删除列表，得到可采纳下界。\n<\/ul>", "ch12": "<h1>第 12 章：不确定性的量化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 7 章、概率基础\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说明为什么需要概率而不是逻辑；写出条件概率与贝叶斯公式；区分先验与后验；解释条件独立为什么能大幅简化计算。<\/p>\n<h2>一句话核心<\/h2>\n<p>概率是“在不完全信息下做理性决策”的语言，它把“我不知道”量化成可计算的形式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：为什么放弃纯逻辑（难度：基础）<\/h3>\n<p>逻辑只能处理“真/假”，但现实中的知识是“大概率”“有可能”。强行二值化会导致规则冲突或需要无穷多例外。概率给出连续的置信度，且能在新证据下更新。<\/p>\n<h3>概念 2：条件概率与贝叶斯（难度：进阶）<\/h3>\n<p><code>P(a|b) = P(a∧b)/P(b)<\/code>。贝叶斯公式 <code>P(a|b) = P(b|a)P(a)/P(b)<\/code>。<\/p>\n<p><strong>先验与后验<\/strong>：P(a) 是看到证据前的信念，P(a|b) 是看到证据后的信念。贝叶斯公式就是“如何用证据更新信念”的公式。<\/p>\n<p><strong>实例<\/strong>：疾病患病率 1%（先验），检测灵敏度 90%，假阳性率 5%。检测阳性时患病概率 = 0.9×0.01/(0.9×0.01 + 0.05×0.99) = 0.009/(0.009+0.0495) = 0.154。只有 15.4%——这就是“基础比率”效应。<\/p>\n<h3>概念 3：条件独立（难度：进阶）<\/h3>\n<p><code>P(a∧b|c) = P(a|c)P(b|c)<\/code>。在给定 c 时，a 与 b 无关。<\/p>\n<p><strong>为什么重要<\/strong>：n 个变量的联合分布需要 2^n 个参数；若都条件独立于某变量，参数量降到线性。这是贝叶斯网能工作的基础。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p>这一部分直接连到<strong>《机器学习》<\/strong> 第 7 章（贝叶斯分类器）与第 14 章（概率图模型）。<strong>《深度学习入门》<\/strong> 第 3 章的 softmax 输出也在这套语言下解释为概率。从本章起，AIMA 从“符号”转向“概率”，这是全书最重要的一次转向。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  PR[&quot;先验 P（a）&quot;] --&gt; B[&quot;贝叶斯公式&quot;]\n  L[&quot;似然 P（b|a）&quot;] --&gt; B\n  B --&gt; PO[&quot;后验 P（a|b）&quot;]\n  PO --&gt; D[&quot;决策&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：先验与似然合成后验，后验再进入决策。这是所有概率推理的共同骨架。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为检测阳性就大概率有病——实际上基础比率低时后验仍很小。\n<\/li><li>\n别以为条件独立等于独立——实际上给定条件下独立不代表无条件独立。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n患病率 1%、灵敏度 90%、假阳性 5%，检测阳性时患病概率约为？（答案：B；解析：0.009/(0.009+0.0495)=15.4%。）\n<ul>\n<li>\nA. 90%　B. 15.4%　C. 50%　D. 1%\n<\/li><li>\n条件独立的定义是？（答案：A；解析：P(a∧b|c)=P(a|c)P(b|c)。）\n<\/li><li>\nA. 给定 c 时联合等于边缘乘积　B. 无条件联合等于乘积　C. P(a)=P(b)　D. 互斥\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n贝叶斯公式：后验 ∝ 似然 × 先验。\n<\/li><li>\n基础比率会显著拉低后验。\n<\/li><li>\n条件独立把指数级参数降到线性。\n<\/ul>", "ch13": "<h1>第 13 章：概率推理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 12 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出贝叶斯网的分解公式；用枚举法算一个简单网络的查询；说明变量消去为什么比枚举快；解释近似推理适用的场景。<\/p>\n<h2>一句话核心<\/h2>\n<p>贝叶斯网把联合分布拆成局部条件概率的乘积，查询就变成“在因子上做乘加消元”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：网络结构与分解（难度：进阶）<\/h3>\n<p>每个节点给定父节点后的条件概率表。联合分布 <code>P(X1,...,Xn)=Π P(Xi|Parents(Xi))<\/code>。<\/p>\n<p><strong>实例<\/strong>： burglary → alarm ← earthquake。三个节点，联合 = P(B)P(E)P(A|B,E)，参数只有 1+1+4=6 个，而全联合要 8 个（且其中 2 个冗余）。<\/p>\n<h3>概念 2：精确推理（难度：高难）<\/h3>\n<p><strong>枚举法<\/strong>：对未观测变量求和。<code>P(B|A) = Σ_E P(B)P(E)P(A|B,E) / P(A)<\/code>。复杂度随变量数指数增长。<\/p>\n<p><strong>变量消去<\/strong>：按顺序把变量逐个“乘进去再求和消掉”，中间的因子可以复用。它把重复计算消掉，复杂度取决于消元顺序（对应图的树宽）。<\/p>\n<h3>概念 3：近似推理（难度：高难）<\/h3>\n<ul><li>\n<strong>似然加权<\/strong>：按证据采样，非证据变量按先验采，证据变量固定，用权重修正。\n<\/li><li>\n<strong>MCMC / Gibbs<\/strong>：按条件分布逐个变量重采样，长期频率逼近后验。\n<\/li><li>\n<strong>变分<\/strong>：用一个简单分布逼近后验，把推理变成优化。\n<\/ul>\n<h2>与其他四本书的衔接<\/h2>\n<p>本章是<strong>《机器学习》<\/strong> 第 14 章概率图模型的前半部分（有向图与推断），第 20 章“概率模型学习”则是它的参数学习版。<strong>《深度学习入门》<\/strong> 与<strong>《动手学深度学习》<\/strong> 里的生成模型（VAE、GAN）可以看作“用神经网络参数化概率分布”的路线。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  B[&quot;Burglary&quot;] --&gt; A[&quot;Alarm&quot;]\n  E[&quot;Earthquake&quot;] --&gt; A\n  A --&gt; Q[&quot;查询 P（B|A=真）&quot;]\n  Q --&gt; S[&quot;对 E 求和 消元&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：箭头是条件依赖方向，查询时把未观测的父节点消掉。消元顺序决定计算量。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为贝叶斯网的箭头表示因果——实际上它只表示条件依赖，因果需要额外假设。\n<\/li><li>\n别以为枚举法准确就一定该用——实际上变量稍多就算不动。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n贝叶斯网联合分布的分解依据是？（答案：B；解析：每个节点给定父节点的条件概率相乘。）\n<ul>\n<li>\nA. 全概率公式　B. 局部条件概率相乘　C. 贝叶斯公式　D. 独立性假设\n<\/li><li>\n变量消去比枚举快的原因是？（答案：C；解析：中间因子可复用，避免重复计算。）\n<\/li><li>\nA. 用了近似　B. 变量更少　C. 消元顺序复用中间结果　D. 不需要证据\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n贝叶斯网：Π P(Xi|Parents)。\n<\/li><li>\n枚举法准确但指数复杂度。\n<\/li><li>\n变量消去复用因子，复杂度看树宽。\n<\/li><li>\n大规模用采样或变分。\n<\/ul>", "ch14": "<h1>第 14 章：时间上的概率推理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 13 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出马尔可夫假设的含义；区分滤波、预测、平滑、最可能解释四个任务；说明卡尔曼滤波与隐马尔可夫模型各自的假设；解释粒子滤波为什么适合非线性场景。<\/p>\n<h2>一句话核心<\/h2>\n<p>时间上的推理就是把“状态随时间演化”写成马尔可夫链，再按证据不断修正对当前状态的信念。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：四个任务（难度：进阶）<\/h3>\n<ul><li>\n<strong>滤波<\/strong>：给定至今的证据，算当前状态的后验 <code>P(X_t|e_{1:t})<\/code>。\n<\/li><li>\n<strong>预测<\/strong>：算未来状态 <code>P(X_{t+k}|e_{1:t})<\/code>。\n<\/li><li>\n<strong>平滑<\/strong>：给定全部证据，算过去某时刻状态 <code>P(X_k|e_{1:t})<\/code>。\n<\/li><li>\n<strong>最可能解释<\/strong>：找最可能的整条状态序列。\n<\/ul>\n<p><strong>为什么滤波是核心<\/strong>：智能体要在当下行动，只需要当前状态的后验。<\/p>\n<h3>概念 2：递归滤波（难度：高难）<\/h3>\n<p>两步：<strong>预测<\/strong> <code>P(X_{t+1}|e_{1:t}) = Σ_{x_t} P(X_{t+1}|x_t)P(x_t|e_{1:t})<\/code>；<strong>更新<\/strong> <code>P(X_{t+1}|e_{1:t+1}) ∝ P(e_{t+1}|X_{t+1})P(X_{t+1}|e_{1:t})<\/code>。<\/p>\n<p><strong>这正好是贝尔曼方程的贝叶斯版<\/strong>：用转移模型往前推，用观测模型校正。<\/p>\n<h3>概念 3：HMM 与卡尔曼滤波（难度：高难）<\/h3>\n<ul><li>\n<strong>HMM<\/strong>：状态离散、转移与观测都是表格。推理用前向—后向算法。\n<\/li><li>\n<strong>卡尔曼滤波<\/strong>：状态连续、转移与观测都是线性高斯。此时后验也是高斯，只需更新均值与协方差，有闭式解。\n<\/ul>\n<p><strong>为什么卡尔曼这么重要<\/strong>：线性高斯假设让“无限维的信念分布”压缩成有限个参数，工程上极其高效。<\/p>\n<h3>概念 4：粒子滤波（难度：高难）<\/h3>\n<p>用一组加权样本表示后验：按转移模型传播粒子，按观测似然重新加权，重采样避免退化。<strong>优点<\/strong>：不要求线性高斯，适用非线性非高斯场景。<strong>缺点<\/strong>：高维时粒子数爆炸。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p><strong>《动手学深度学习》<\/strong> 第 6 章的 RNN 是本章的“用神经网络做滤波”：隐状态就是信念的压缩表示。<strong>《强化学习》<\/strong> 第 3 章的部分可观测 MDP（POMDP）直接用本章的信念状态做决策。<strong>《机器学习》<\/strong> 第 14 章的 HMM 是本章的经典实例。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  X0[&quot;状态 X0&quot;] --&gt; X1[&quot;X1&quot;]\n  X1 --&gt; X2[&quot;X2&quot;]\n  X1 --&gt; E1[&quot;证据 e1&quot;]\n  X2 --&gt; E2[&quot;证据 e2&quot;]\n  E1 --&gt; F[&quot;滤波 更新信念&quot;]\n  E2 --&gt; F<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：横向是状态演化，向下是观测。滤波把左边传来的先验与向下的似然合成后验。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为平滑和滤波是一回事——实际上平滑要用未来证据，只用于离线分析。\n<\/li><li>\n别以为卡尔曼滤波只能处理线性——实际上有扩展卡尔曼与无迹卡尔曼处理非线性，只是近似。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n滤波算的是？（答案：B；解析：给定至今的证据，当前状态的后验。）\n<ul>\n<li>\nA. 未来状态　B. 当前状态后验　C. 过去状态　D. 整条序列\n<\/li><li>\n卡尔曼滤波的闭式解依赖什么假设？（答案：C；解析：线性转移与高斯噪声，使后验仍是高斯。）\n<\/li><li>\nA. 状态离散　B. 观测连续　C. 线性高斯　D. 马尔可夫性\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n四任务：滤波、预测、平滑、最可能解释。\n<\/li><li>\n滤波两步：预测（转移）与更新（观测）。\n<\/li><li>\nHMM 离散表格，卡尔曼线性高斯。\n<\/li><li>\n粒子滤波适合非线性非高斯。\n<\/ul>", "ch15": "<h1>第 15 章：概率编程<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 12—14 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说明概率编程与传统贝叶斯网建模的差别；解释为什么“把概率写成代码”让建模更容易；说出采样方法与变分方法各自的适用范围。<\/p>\n<h2>一句话核心<\/h2>\n<p>概率编程把“随机变量”变成“可以写进程序的值”，把建模从“画图”变成“写函数”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从图到程序（难度：进阶）<\/h3>\n<p>贝叶斯网要求你先画出图结构，再填条件概率表。概率编程语言（如 Stan、Pyro、PyMC）允许你直接写生成过程：先 <code>x ~ Normal(0,1)<\/code>，再 <code>y ~ Normal(x,1)<\/code>，结构由代码隐含。<\/p>\n<p><strong>好处<\/strong>：能表达任意复杂的依赖（循环、递归、混合模型），不必手工枚举图。<\/p>\n<h3>概念 2：推断后端（难度：高难）<\/h3>\n<ul><li>\n<strong>MCMC<\/strong>：从后验采样，样本多时逼近精确。慢但可靠。\n<\/li><li>\n<strong>变分推断<\/strong>：用一个可优化的分布逼近后验。快但可能有偏。\n<\/li><li>\n<strong>重要性采样 / 序列 MC<\/strong>：适合时序与在线场景。\n<\/ul>\n<p><strong>选择标准<\/strong>：维度低、要求准确 → MCMC；维度高、要速度 → 变分。<\/p>\n<h3>概念 3：生成式建模的意义（难度：进阶）<\/h3>\n<p>概率编程让“先假设世界如何生成数据，再反推参数”这条路变得可执行。这与判别式模型（直接学 P(y|x)）形成对照，前者能处理缺失数据、能生成新样本、能表达不确定性。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p><strong>《机器学习》<\/strong> 第 14 章的图模型是本章的“手工版”，第 20 章的概率模型学习是“参数学习版”。<strong>《动手学深度学习》<\/strong> 中的 VAE 可以看作“用神经网络做变分推断”的概率编程特例。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  M[&quot;写生成过程 代码&quot;] --&gt; G[&quot;自动构建概率图&quot;]\n  G --&gt; I[&quot;选推断后端 MCMC 或变分&quot;]\n  I --&gt; P[&quot;得到后验与预测&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：建模与推断被解耦。你只管写生成过程，后端自己选。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为概率编程只是“换个写法的贝叶斯网”——实际上它允许手工画图做不到的结构。\n<\/li><li>\n别以为变分一定不如 MCMC——实际上在超大模型上变分是唯一可行的选择。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n概率编程相对贝叶斯网建模的最大优势是？（答案：C；解析：可直接写生成过程，支持任意结构。）\n<ul>\n<li>\nA. 更快　B. 更准　C. 可表达手工画图困难的结构　D. 不需要数据\n<\/li><li>\n高维模型通常选哪种推断？（答案：B；解析：变分更快，MCMC 在高维下难以收敛。）\n<\/li><li>\nA. MCMC　B. 变分　C. 枚举　D. 变量消去\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n概率编程 = 写生成过程，图由代码隐含。\n<\/li><li>\n两种后端：MCMC 准而慢，变分快而有偏。\n<\/li><li>\n生成式模型能处理缺失与不确定性。\n<\/ul>", "ch16": "<h1>第 16 章：做简单决策<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 12—13 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出期望效用最大化的决策准则；说明效用函数为什么不是线性的；区分信息价值与决策成本；解释为什么“最优决策”依赖信念而非事实。<\/p>\n<h2>一句话核心<\/h2>\n<p>决策不是求“哪个动作最好”，而是在不确定的信念下求“期望效用最大”的动作。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：效用与期望（难度：进阶）<\/h3>\n<p><code>EU(a) = Σ_s P(s|e) U(s)<\/code>，选使 EU 最大的 a。<strong>关键点<\/strong>：动作的好坏取决于结果状态的概率分布，而分布来自信念，不是客观事实。<\/p>\n<p><strong>为什么不用期望金额<\/strong>：人对金额的效用是非线性的（风险厌恶）。100 元和 200 元的效用差小于 100 元和 1000 元的差；用对数或分段函数建模。<\/p>\n<h3>概念 2：信息价值（难度：高难）<\/h3>\n<p><code>VPI(e) = E[新决策的期望效用] - 当前最优期望效用<\/code>。信息之所以有价值，是因为它能改变决策。<\/p>\n<p><strong>重要性质<\/strong>：信息价值永远非负（因为你可以忽略它）；且不会超过“完美信息下的收益差”。<\/p>\n<p><strong>实例<\/strong>：买不买伞。不带伞淋雨效用 -10，带伞麻烦 -2。下雨概率 0.3：不带伞 -3，带伞 -2，最优带伞。若天气预报准确，下雨时带伞 -2、不下雨时不带 -0，期望 0.7×0+0.3×(-2)=-0.6，信息价值 = -0.6 - (-2) = 1.4。<\/p>\n<h3>概念 3：决策网络（难度：进阶）<\/h3>\n<p>把信念、动作、效用画成图，用概率推理算出每个动作的期望效用，再选最大者。这就是“决策 = 推理 + 优化”的组合。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p><strong>《强化学习》<\/strong> 第 1—3 章把它推广到序列决策：不只看一步效用，而是看折扣累积奖励。<strong>《机器学习》<\/strong> 里的分类器输出概率，正是为了让下游能算期望效用——这是“概率校准”为什么重要的原因。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  E[&quot;证据&quot;] --&gt; B[&quot;信念 P（s|e）&quot;]\n  B --&gt; U[&quot;各动作期望效用&quot;]\n  U --&gt; A[&quot;选最大&quot;]\n  A --&gt; R[&quot;执行&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：信念是决策的输入。信念不准，效用算得再准也选错。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为效用就是钱——实际上钱只是效用的一个常见代理，风险态度会让两者不同。\n<\/li><li>\n别以为信息越多越好——实际上获取信息有成本，价值可能为负。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n期望效用决策准则选的是？（答案：B；解析：使期望效用最大的动作。）\n<ul>\n<li>\nA. 概率最大的状态　B. 期望效用最大的动作　C. 效用最大的状态　D. 成本最低的动作\n<\/li><li>\n信息价值的下界是？（答案：A；解析：总能选择忽略信息，故非负。）\n<\/li><li>\nA. 0　B. -1　C. 无穷小　D. 不确定\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n决策准则：期望效用最大。\n<\/li><li>\n效用非线性，反映风险态度。\n<\/li><li>\n信息价值非负，因可忽略。\n<\/ul>", "ch17": "<h1>第 17 章：做复杂决策<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 16 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出 MDP 的决策形式并说明它与第 3 章 MDP 的差别；说明策略迭代在决策语境下的含义；解释 POMDP 为什么用信念状态求解；说出多目标决策的困难。<\/p>\n<h2>一句话核心<\/h2>\n<p>复杂决策 = 序列决策 + 不确定 + 部分可观测，求解对象从“动作”变成“策略”，状态从“世界状态”变成“信念状态”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：MDP 决策（难度：进阶）<\/h3>\n<p>在 MDP 上，最优策略满足贝尔曼最优方程，用价值迭代或策略迭代求解。这部分与<strong>《强化学习》<\/strong> 第 3、4 章完全重合，只是 AIMA 从“决策”角度讲，Sutton 从“学习”角度讲。<\/p>\n<h3>概念 2：POMDP（难度：高难）<\/h3>\n<p>部分可观测时，智能体看不到真实状态，只能维护<strong>信念状态<\/strong> b（对状态的概率分布）。信念的更新就是第 14 章的滤波；决策在信念空间上做，而信念空间是连续的。<\/p>\n<p><strong>为什么难<\/strong>：状态空间有限，信念空间却是无穷维的单纯形。这是 POMDP 难解的根本原因。<\/p>\n<h3>概念 3：多目标与风险（难度：进阶）<\/h3>\n<p>多个目标冲突时，效用函数必须显式定义权衡。风险敏感决策需要考虑分布的高阶矩，而不只是期望。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p><strong>《强化学习》<\/strong> 全书是本章的展开：第 3 章 MDP、第 4 章求解、第 13 章策略梯度。<strong>《机器学习》<\/strong> 第 16 章是本章的入门版。读完本章再看 Sutton 书，会发现“学习”只是“在不知道模型时如何求解同一个决策问题”。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  S[&quot;世界状态&quot;] --&gt; O[&quot;观测&quot;]\n  O --&gt; B[&quot;信念状态 b&quot;]\n  B --&gt; P[&quot;策略 π（b）&quot;]\n  P --&gt; A[&quot;动作&quot;]\n  A --&gt; S<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：多了一层“信念”。策略的输入从状态变成信念分布，这就是 POMDP 的全部特殊之处。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 POMDP 只是 MDP 加噪声——实际上决策空间从离散状态变成了连续信念空间，复杂度完全不同。\n<\/li><li>\n别以为期望最优就等于好决策——实际上风险敏感场景要看分布尾部。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nPOMDP 中策略的输入是？（答案：C；解析：信念状态 b，即状态的概率分布。）\n<ul>\n<li>\nA. 真实状态　B. 观测序列　C. 信念状态　D. 动作历史\n<\/li><li>\nPOMDP 难解的根本原因是？（答案：A；解析：信念空间是连续无穷维的单纯形。）\n<\/li><li>\nA. 信念空间连续无穷维　B. 动作太多　C. 奖励稀疏　D. 没有模型\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n序列决策 = MDP + 贝尔曼方程求解。\n<\/li><li>\nPOMDP 在信念空间上决策。\n<\/li><li>\n多目标需显式权衡，风险看分布尾部。\n<\/ul>", "ch18": "<h1>第 18 章：多智能体决策<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 17 章、博弈论基础\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：区分零和与非零和博弈的求解目标；说明纳什均衡的定义与局限；解释为什么多智能体环境下“最优”没有唯一含义；说出机制设计的基本目标。<\/p>\n<h2>一句话核心<\/h2>\n<p>有多个决策者时，“最优”不再是对一个人的最优，而是对一组人达成的稳定协议。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：博弈的形式（难度：进阶）<\/h3>\n<p>参与者、策略集、收益函数。零和博弈中一方所得即另一方所失，可用极小化极大求解；非零和博弈可能有合作，也可能有冲突。<\/p>\n<p><strong>实例（囚徒困境）<\/strong>：双方都招供各判 3 年，都不招各判 1 年，一方招一方不招则招者 0 年、不招者 5 年。单方最优是招供，但双方都招的结果比都不招差——这是“个体理性导致集体非理性”。<\/p>\n<h3>概念 2：纳什均衡（难度：高难）<\/h3>\n<p>没有任何参与者能单方改变策略而获益的策略组合。<strong>局限<\/strong>：可能不存在（纯策略下）、可能多个、也不保证是社会最优（囚徒困境的均衡就是次优结果）。<\/p>\n<h3>概念 3：机制设计（难度：高难）<\/h3>\n<p>设计规则使自利的参与者行为导致好的集体结果。<strong>关键概念：防策略性<\/strong>——参与者没有动机谎报信息（如拍卖中的次价密封拍卖）。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p><strong>《强化学习》<\/strong> 第 18 章讲多智能体强化学习：多个学习者在同一环境里互相影响，彼此的“环境”都在变，因此收敛性远不如单智能体。本章提供博弈论语言，Sutton 书提供学习方法。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;智能体 A 策略&quot;] --&gt; E[&quot;联合环境&quot;]\n  B[&quot;智能体 B 策略&quot;] --&gt; E\n  E --&gt; R1[&quot;A 的收益&quot;]\n  E --&gt; R2[&quot;B 的收益&quot;]\n  R1 --&gt; A\n  R2 --&gt; B<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：两个学习回路耦合在一起。A 改变策略就改变了 B 面对的环境，反之亦然。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为纳什均衡就是最优结果——实际上它只是“没人想单方改变”。\n<\/li><li>\n别以为多智能体 RL 只是并行训练——实际上非平稳性会让单智能体的收敛证明全部失效。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n囚徒困境说明的核心现象是？（答案：B；解析：个体理性导致集体次优。）\n<ul>\n<li>\nA. 合作总是最优　B. 个体理性导致集体次优　C. 均衡唯一　D. 零和\n<\/li><li>\n机制设计的关键要求是？（答案：C；解析：规则使参与者没有动机谎报。）\n<\/li><li>\nA. 收益最大　B. 计算最快　C. 防策略性　D. 均衡唯一\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n零和用极小化极大，非零和要谈均衡。\n<\/li><li>\n纳什均衡：无人能单方获益，不保证社会最优。\n<\/li><li>\n机制设计靠防策略性引导真实报告。\n<\/ul>", "ch19": "<h1>第 19 章：样例学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 12 章、概率\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：区分监督学习、无监督学习、强化学习的设定；写出决策树的信息增益准则；说明假设空间与归纳偏置的关系；解释过拟合与正则化的动机。<\/p>\n<h2>一句话核心<\/h2>\n<p>样例学习是从“输入—输出对”中找规律，而“找哪种规律”取决于你预设的归纳偏置。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三种设定（难度：基础）<\/h3>\n<ul><li>\n<strong>监督<\/strong>：给定 (x,y) 学 f。\n<\/li><li>\n<strong>无监督<\/strong>：只有 x，学结构（聚类、降维）。\n<\/li><li>\n<strong>强化<\/strong>：只有延迟奖励，学策略。\n<\/ul>\n<p><strong>关键区别在“给的信号形态”<\/strong>，不在算法。<\/p>\n<h3>概念 2：决策树与信息增益（难度：进阶）<\/h3>\n<p>用信息增益选分裂属性：<code>Gain = H(parent) - Σ (n_i/n) H(child_i)<\/code>。<\/p>\n<p><strong>手算实例<\/strong>：14 个样本，正例 9、负例 5。H(parent) = -(9/14)log₂(9/14) -(5/14)log₂(5/14) = 0.940。按某属性分成 8/6 两组，其中一组 7 正 1 负、另一组 2 正 4 负：H(1)=-0.544，H(2)=0.918，加权 = (8/14)×0.544+(6/14)×0.918 = 0.311+0.393=0.704。Gain = 0.940-0.704 = 0.236。<\/p>\n<h3>概念 3：归纳偏置（难度：高难）<\/h3>\n<p>学习器必须有偏好，否则在有限样本下无法泛化。决策树偏好“短树”，最近邻偏好“局部平滑”，线性模型偏好“线性”。<\/p>\n<p><strong>没有免费的午餐定理<\/strong>：不存在对所有问题都最优的学习器。选模型就是选偏置。<\/p>\n<h3>概念 4：过拟合与正则（难度：进阶）<\/h3>\n<p>模型太复杂会记住噪声。解决：限制复杂度（剪枝、深度上限）、加正则项、用验证集早停、增加数据。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p>本章是<strong>《机器学习》<\/strong> 全书的浓缩：第 2 章评估与选择、第 3 章线性模型、第 4 章决策树、第 8 章集成。<strong>《深度学习入门》<\/strong> 第 6 章的过拟合与正则化是本章概念在神经网络上的实例。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  D[&quot;数据&quot;] --&gt; H[&quot;假设空间&quot;]\n  H --&gt; B[&quot;归纳偏置 限制搜索&quot;]\n  B --&gt; M[&quot;模型&quot;]\n  M --&gt; V[&quot;验证集 评估泛化&quot;]\n  V --&gt; M<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：假设空间是“所有候选模型”，归纳偏置是“搜索的偏好方向”，验证集是“判卷”。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为训练误差低就是好模型——实际上泛化才重要。\n<\/li><li>\n别以为更多特征总是更好——实际上无关特征会增加过拟合风险。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n信息增益的公式是？（答案：A；解析：父节点熵减子节点加权熵。）\n<ul>\n<li>\nA. H(parent)-Σ(n_i/n)H(child_i)　B. ΣH(child)　C. H(parent)+ΣH(child)　D. 信息增益即熵\n<\/li><li>\n没有免费的午餐定理说明？（答案：C；解析：不存在对所有问题都最优的学习器。）\n<\/li><li>\nA. 深度学习最好　B. 数据越多越好　C. 无通用最优学习器　D. 特征越多越好\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三种学习设定的差别在信号形态。\n<\/li><li>\n信息增益 = 父熵减子加权熵。\n<\/li><li>\n归纳偏置不可避免，NFL 定理说明没有万能学习器。\n<\/ul>", "ch20": "<h1>第 20 章：概率模型学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 13、19 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出最大似然估计与最大后验的区别；说明朴素贝叶斯为什么“朴素”；解释 EM 算法的两步在做什么；说出隐变量模型为什么需要 EM。<\/p>\n<h2>一句话核心<\/h2>\n<p>概率模型学习是在给定数据下估参数：频率派求最大似然，贝叶斯派求后验，有隐变量时用 EM 迭代。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：最大似然与 MAP（难度：进阶）<\/h3>\n<p>MLE：<code>θ* = argmax Π P(x_i|θ)<\/code>，即最大化数据出现的概率。MAP：<code>argmax P(θ|数据) ∝ P(数据|θ)P(θ)<\/code>，多了先验。<\/p>\n<p><strong>差别<\/strong>：数据少时 MAP 更稳（先验起正则作用）；数据多时两者趋同。<\/p>\n<h3>概念 2：朴素贝叶斯（难度：进阶）<\/h3>\n<p>假设特征在给定类别下条件独立：<code>P(x|c) = Π P(x_i|c)<\/code>。“朴素”就是指这个（通常不成立的）假设。<\/p>\n<p><strong>为什么还能用<\/strong>：分类只关心哪类概率最大，不需要概率精确；独立性假设错但排序常仍对。<\/p>\n<h3>概念 3：EM 算法（难度：高难）<\/h3>\n<p>有隐变量 z 时，似然求和难解。EM 交替：<\/p>\n<ul><li>\n<strong>E 步<\/strong>：用当前参数算隐变量的后验 <code>Q(z)<\/code>。\n<\/li><li>\n<strong>M 步<\/strong>：用 Q 加权最大化期望对数似然，更新参数。\n<\/ul>\n<p><strong>为什么收敛<\/strong>：每次迭代都不降低观测数据的对数似然（下界单调上升）。但它只保证到局部最优。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p><strong>《机器学习》<\/strong> 第 7 章（贝叶斯分类器）、第 14 章（EM 与 HMM 训练）是本章展开。<strong>《动手学深度学习》<\/strong> 里的 VAE 训练用的也是“下界最大化”，本质是变分版的 EM。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  D[&quot;数据&quot;] --&gt; E[&quot;E 步 算隐变量后验&quot;]\n  E --&gt; M[&quot;M 步 更新参数&quot;]\n  M --&gt; C{&quot;似然还在升?&quot;}\n  C --&gt;|是| E\n  C --&gt;|否| O[&quot;停止&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：E 与 M 反复拉升同一个下界，直到不再改进。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为朴素贝叶斯假设成立才好用——实际上假设不成立时它仍常有效。\n<\/li><li>\n别以为 EM 一定找到全局最优——实际上它只保证局部收敛，初值很关键。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n朴素贝叶斯的“朴素”指？（答案：B；解析：假设特征在给定类别下条件独立。）\n<ul>\n<li>\nA. 模型简单　B. 特征条件独立假设　C. 只用朴素特征　D. 不用概率\n<\/li><li>\nEM 的 E 步做什么？（答案：A；解析：用当前参数算隐变量后验。）\n<\/li><li>\nA. 算隐变量后验　B. 更新参数　C. 计算梯度　D. 选模型\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nMLE 最大化数据概率，MAP 加先验。\n<\/li><li>\n朴素 = 特征条件独立。\n<\/li><li>\nEM：E 算后验，M 更新参数，似然单调升。\n<\/ul>", "ch21": "<h1>第 21 章：深度学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：6 小时 | <strong>前置<\/strong>：第 19、20 章、微积分与线代\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说明神经网络为什么需要非线性激活；写出反向传播的链式法则形式；解释卷积与池化各自的作用；说出注意力机制解决了什么问题。<\/p>\n<h2>一句话核心<\/h2>\n<p>深度学习 = 用多层可微函数堆出表示，用反向传播把梯度回传，用大量数据拟合。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：从线性到非线性（难度：进阶）<\/h3>\n<p>单层线性网络无论多深都等价于一层线性变换。加入 ReLU 或 sigmoid 后，网络才能逼近非线性函数（万能逼近定理）。<\/p>\n<p><strong>为什么 ReLU 常用<\/strong>：导数在正区间恒为 1，缓解梯度消失，计算便宜。<\/p>\n<h3>概念 2：反向传播（难度：高难）<\/h3>\n<p>对每层算 <code>∂L/∂w = ∂L/∂y · ∂y/∂w<\/code>，从输出往输入逐层乘。<strong>本质是链式法则 + 复用中间结果<\/strong>：前向时存下激活值，反向时直接用，避免重复计算。<\/p>\n<p><strong>实例<\/strong>：<code>y = (wx+b)<\/code>，<code>L = y²<\/code>。<code>∂L/∂w = 2y · x<\/code>。若 w=2、x=3、b=1，则 y=7，∂L/∂w = 14×3 = 42。<\/p>\n<h3>概念 3：卷积与池化（难度：进阶）<\/h3>\n<p><strong>卷积<\/strong>：用共享的小卷积核在空间上滑动，捕捉局部模式并大幅减少参数。<strong>池化<\/strong>：下采样，扩大感受野、提供一定平移不变性。<\/p>\n<h3>概念 4：注意力（难度：高难）<\/h3>\n<p><code>Attention(Q,K,V) = softmax(QKᵀ/√d_k)V<\/code>。它让每个位置直接看到所有位置，避免了 RNN 的逐步传递。<strong>缩放 √d_k 的原因<\/strong>：点积方差随维度增长，不缩放会使 softmax 饱和、梯度消失。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p>这一章是<strong>《深度学习入门》<\/strong> 全书的对应点（该书第 3—7 章逐层实现），也是<strong>《动手学深度学习》<\/strong> 第 3—6、9—10 章的主线。<strong>《机器学习》<\/strong> 第 5 章是它的浅层版（单隐层 BP 网络）。学这一章的正确顺序是：先读《深度学习入门》把反向传播手推一遍，再读 d2l 学框架实现，最后回来看本章的体系位置。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  X[&quot;输入 x&quot;] --&gt; L1[&quot;隐层 线性+激活&quot;]\n  L1 --&gt; L2[&quot;隐层&quot;]\n  L2 --&gt; Y[&quot;输出&quot;]\n  Y --&gt; L[&quot;损失&quot;]\n  L --&gt;|&quot;反向传播 梯度&quot;| L2\n  L --&gt; L1<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：前向算值，反向算梯度。反向时每一层只需要局部导数与上游梯度相乘。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为层数越多越好——实际上过深会梯度消失/爆炸，需要残差连接与归一化。\n<\/li><li>\n别以为反向传播是“另一种学习算法”——实际上它只是算梯度的方法，学习规则仍是梯度下降。\n<\/li><li>\n别以为注意力只是“加权求和”——实际上它让模型动态决定看哪里，参数随输入变化。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n没有非线性激活的多层网络等价于？（答案：A；解析：线性变换的复合仍是线性变换。）\n<ul>\n<li>\nA. 单层线性模型　B. 深层网络　C. 卷积网络　D. 决策树\n<\/li><li>\n注意力中缩放 √d_k 的原因是？（答案：C；解析：点积方差随维度增大，不缩放会使 softmax 饱和。）\n<\/li><li>\nA. 加快计算　B. 减少参数　C. 控制点积方差避免 softmax 饱和　D. 增加表达力\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n非线性是深度的必要条件。\n<\/li><li>\n反向传播 = 链式法则 + 复用前向中间值。\n<\/li><li>\n卷积共享参数，池化扩大感受野。\n<\/li><li>\n注意力缩放 √d_k 防 softmax 饱和。\n<\/ul>", "ch22": "<h1>第 22 章：强化学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 17 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：写出 MDP 的价值函数与贝尔曼方程；区分基于模型与无模型方法；说明探索与利用的权衡；说出函数逼近带来的稳定性问题。<\/p>\n<h2>一句话核心<\/h2>\n<p>强化学习在不知道自己动作后果的情况下，通过试错与延迟奖励学会做决策。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：与监督学习的差别（难度：基础）<\/h3>\n<p>没有即时标签，只有延迟奖励；数据由自己的策略产生；必须探索。这三点决定了它不能用普通监督学习的方法。<\/p>\n<h3>概念 2：价值与贝尔曼（难度：进阶）<\/h3>\n<p><code>v_π(s) = Σ_a π(a|s) Σ_{s&#x27;,r} p[r + γv_π(s&#x27;)]<\/code>。这个递归把长期回报变成“一步 + 下一状态价值”，是所有方法的基石。<\/p>\n<h3>概念 3：三条技术路线（难度：进阶）<\/h3>\n<ul><li>\n<strong>基于模型<\/strong>：学环境模型再做规划（Dyna）。\n<\/li><li>\n<strong>无模型值方法<\/strong>：直接学 q（Sarsa、Q-learning）。\n<\/li><li>\n<strong>策略梯度<\/strong>：直接优化策略参数（REINFORCE、actor-critic）。\n<\/ul>\n<h3>概念 4：不稳定（难度：高难）<\/h3>\n<p>函数逼近 + 自举 + 离轨三要素同时存在会发散。工程上用目标网络、经验回放、小步长缓解。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p>本章是<strong>《强化学习》<\/strong> 全书的浓缩索引：第 3 章 MDP、第 4 章 DP、第 5—7 章 MC/TD/n 步、第 8 章规划、第 9—13 章函数逼近与策略梯度。<strong>《机器学习》<\/strong> 第 16 章是最简版。读 AIMA 这一章的作用是知道“RL 在 AI 体系中的位置”，读 Sutton 书是把它做实。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  M[&quot;有模型&quot;] --&gt; P[&quot;规划&quot;]\n  F[&quot;无模型&quot;] --&gt; V[&quot;值方法&quot;]\n  F --&gt; G[&quot;策略梯度&quot;]\n  P --&gt; D[&quot;决策&quot;]\n  V --&gt; D\n  G --&gt; D<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三条路线在“决策”处汇合，区别在于用什么中间量（模型、价值、策略）。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 RL 只用于游戏——实际上推荐、调度、控制都在用。\n<\/li><li>\n别以为奖励可以随便设——实际上奖励设计直接决定学到什么行为。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n贝尔曼方程把价值写成？（答案：B；解析：即时奖励加下一状态价值的折扣期望。）\n<ul>\n<li>\nA. 全部奖励之和　B. 一步奖励加后继价值折扣　C. 平均奖励　D. 最大奖励\n<\/li><li>\n三要素中哪一组会导致发散？（答案：C；解析：函数逼近、自举、离轨。）\n<\/li><li>\nA. 探索、奖励、策略　B. 状态、动作、折扣　C. 逼近、自举、离轨　D. 采样、规划、学习\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nRL 三特征：延迟奖励、数据自产、必须探索。\n<\/li><li>\n贝尔曼方程是所有方法的基石。\n<\/li><li>\n三条路线：模型、值、策略梯度。\n<\/li><li>\n三要素同时出现易发散。\n<\/ul>", "ch23": "<h1>第 23 章：自然语言处理<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 19 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说出语言模型的两种用途（预测与生成）；解释 n-gram 模型的稀疏性问题；说明词袋表示与词向量的差别；描述句法分析的基本任务。<\/p>\n<h2>一句话核心<\/h2>\n<p>NLP 的核心问题是“如何把离散的符号变成可计算的表示”，语言模型与词向量是两条主要路径。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：语言模型（难度：进阶）<\/h3>\n<p><code>P(w1,...,wn) = Π P(w_i|w_1..w_{i-1})<\/code>。n-gram 只依赖前 n-1 个词。<strong>问题<\/strong>：参数随词表指数增长，且大量组合没在训练集出现（稀疏）。<\/p>\n<p><strong>平滑<\/strong>（如加一平滑）缓解零概率问题，但没有根本解决组合爆炸。<\/p>\n<h3>概念 2：词表示（难度：进阶）<\/h3>\n<ul><li>\n<strong>词袋<\/strong>：每个词一个 one-hot，忽略顺序。简单但丢失语序。\n<\/li><li>\n<strong>词向量<\/strong>：低维连续向量，语义相近的词向量相近。<strong>分布假设<\/strong>：“一个词的含义由它常出现的上下文决定”。\n<\/ul>\n<h3>概念 3：句法与语义任务（难度：进阶）<\/h3>\n<p>分词、词性标注、句法分析（成分/依存）、语义角色标注、机器翻译、问答。这些任务在深度学习时代大多被端到端模型统一处理。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p><strong>《动手学深度学习》<\/strong> 第 10 章是本章的实现版（词嵌入、RNN、注意力、Transformer）。<strong>AIMA 第 24 章<\/strong> 专门讲 NLP 中的深度学习。<strong>《机器学习》<\/strong> 第 11 章的特征选择与文本特征构造有部分重叠。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  T[&quot;文本&quot;] --&gt; K[&quot;分词&quot;]\n  K --&gt; V[&quot;词向量&quot;]\n  V --&gt; M[&quot;模型 RNN/Transformer&quot;]\n  M --&gt; O[&quot;任务输出 翻译/分类&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：从离散符号到连续向量，再到序列模型，这是现代 NLP 的统一流水线。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 n-gram 已被淘汰——实际上在小数据、低资源场景它仍是基线。\n<\/li><li>\n别以为词向量能表示“一词多义”——实际上静态词向量把多个意思混在一个点里。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nn-gram 模型的主要问题是？（答案：B；解析：参数随词表指数增长且组合稀疏。）\n<ul>\n<li>\nA. 太慢　B. 稀疏与参数爆炸　C. 不能生成　D. 需要语法树\n<\/li><li>\n分布假设的内容是？（答案：C；解析：词义由上下文决定，故相似上下文的词向量相近。）\n<\/li><li>\nA. 词频决定含义　B. 语法决定含义　C. 上下文决定词义　D. 长度决定词义\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n语言模型 = 预测下一个词的概率。\n<\/li><li>\nn-gram 稀疏，靠平滑缓解但不根治。\n<\/li><li>\n词向量基于分布假设。\n<\/ul>", "ch24": "<h1>第 24 章：自然语言处理中的深度学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 21、23 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说明 RNN 为什么适合序列但有何缺陷；解释 LSTM 门控如何缓解长依赖问题；写出 Transformer 编码器的三个子层；说出预训练 + 微调范式为什么有效。<\/p>\n<h2>一句话核心<\/h2>\n<p>序列建模从“逐步传递”演进到“全局注意力”，关键突破是让信息不必经过长链条传递。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：RNN 与长依赖（难度：进阶）<\/h3>\n<p><code>h_t = f(h_{t-1}, x_t)<\/code>。隐状态携带历史，但梯度沿时间反向传播时反复相乘，容易消失或爆炸。<\/p>\n<h3>概念 2：LSTM 与门控（难度：高难）<\/h3>\n<p>三个门：遗忘门决定丢多少旧记忆，输入门决定写多少新信息，输出门决定输出多少。<strong>核心是细胞状态的加性更新<\/strong>：<code>c_t = f_t ⊙ c_{t-1} + i_t ⊙ g_t<\/code>。加性路径让梯度可以近乎无损地传很远。<\/p>\n<h3>概念 3：Transformer（难度：高难）<\/h3>\n<p>编码器三层：多头自注意力、前馈网络、残差 + 层归一化。<strong>自注意力让任意两个位置直接相连<\/strong>，路径长度从 O(n) 降到 O(1)，这是它优于 RNN 的根本原因。<\/p>\n<p><strong>代价<\/strong>：计算量随序列长度平方增长。<\/p>\n<h3>概念 4：预训练 + 微调（难度：进阶）<\/h3>\n<p>在海量无标注文本上做自监督预训练（预测被遮住的词或下一句），再在下游任务上微调。<strong>为什么有效<\/strong>：预训练学到了通用语言表示，下游只需少量标注。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p><strong>《动手学深度学习》<\/strong> 第 10 章是本章的实现版。<strong>《深度学习入门》<\/strong> 第 7 章讲 CNN，可作为对比：CNN 抓局部，注意力抓全局。<strong>《机器学习》<\/strong> 没有覆盖这一层，只到传统文本特征。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  R[&quot;RNN 逐步传递 路径长 n&quot;] --&gt; P[&quot;长依赖困难&quot;]\n  P --&gt; A[&quot;自注意力 任意两位置直连 路径长 1&quot;]\n  A --&gt; T[&quot;Transformer&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：关键差别是信息传递路径长度。路径越短，梯度越不容易衰减。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为注意力取代了 RNN 的全部功能——实际上位置编码仍要显式加入顺序信息。\n<\/li><li>\n别以为预训练只是“多训一会儿”——实际上自监督目标的设计才是关键。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n自注意力相对 RNN 的根本优势是？（答案：B；解析：任意两位置直连，路径长度为常数。）\n<ul>\n<li>\nA. 参数更少　B. 任意两位置直连　C. 不用激活函数　D. 不需要数据\n<\/li><li>\nLSTM 缓解梯度消失的关键结构是？（答案：C；解析：细胞状态的加性更新路径。）\n<\/li><li>\nA. 输出门　B. 输入门　C. 加性细胞状态更新　D. 词嵌入\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nRNN 路径长，梯度易消失。\n<\/li><li>\nLSTM 靠加性细胞状态保留长依赖。\n<\/li><li>\n自注意力把路径长度降为常数，代价是平方复杂度。\n<\/ul>", "ch25": "<h1>第 25 章：计算机视觉<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 21 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说出图像形成的几何与光度要素；区分分类、检测、分割三类任务；解释卷积网络为什么适合图像；说明数据增广与预训练的作用。<\/p>\n<h2>一句话核心<\/h2>\n<p>视觉任务都是“从像素里抽结构”，卷积是把“局部性 + 平移不变”这两个先验写进网络结构的方式。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：图像形成（难度：基础）<\/h3>\n<p>光照、表面反射、相机投影共同决定像素值。<strong>理解这一点才知道为什么增广（翻转、裁剪、调色）合理<\/strong>：这些变换近似对应真实世界的变化。<\/p>\n<h3>概念 2：三类任务（难度：进阶）<\/h3>\n<ul><li>\n<strong>分类<\/strong>：整张图一个标签。\n<\/li><li>\n<strong>检测<\/strong>：框出每个物体的位置与类别。\n<\/li><li>\n<strong>分割<\/strong>：逐像素给类别（语义分割）或给实例（实例分割）。\n<\/ul>\n<h3>概念 3：卷积的归纳偏置（难度：进阶）<\/h3>\n<p>局部连接：像素只与邻域相关。参数共享：同一模式出现在不同位置应被同样识别。这两条先验大幅降低参数量，也带来平移等变性。<\/p>\n<h3>概念 4：数据与预训练（难度：进阶）<\/h3>\n<p>图像标注贵，所以常用大规模预训练 + 小数据微调。数据增广（随机裁剪、翻转、颜色抖动）相当于扩充数据分布，抑制过拟合。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p><strong>《动手学深度学习》<\/strong> 第 9 章是本章的实现版。<strong>《深度学习入门》<\/strong> 第 7 章用 NumPy 手写 CNN，适合先把卷积运算搞清。<strong>《机器学习》<\/strong> 只覆盖传统特征（SIFT、HOG），可作为历史对照。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  I[&quot;图像&quot;] --&gt; C[&quot;卷积 局部+共享&quot;]\n  C --&gt; P[&quot;池化 降采样&quot;]\n  P --&gt; F[&quot;全连接/检测头&quot;]\n  F --&gt; O[&quot;分类/框/掩码&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：卷积负责抽局部特征，池化负责扩大感受野，任务头负责输出不同形式。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 CNN 天然理解旋转——实际上普通卷积只对平移近似不变，旋转需要数据增广或特殊结构。\n<\/li><li>\n别以为分割只是分类的像素版——实际上它需要保留空间分辨率，结构上要用上采样与跳连。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n卷积的两个核心先验是？（答案：B；解析：局部连接与参数共享。）\n<ul>\n<li>\nA. 深度与宽度　B. 局部连接与参数共享　C. 归一化与残差　D. 注意力与门控\n<\/li><li>\n语义分割与实例分割的差别是？（答案：C；解析：前者只分到类别，后者区分同类不同个体。）\n<\/li><li>\nA. 输入不同　B. 输出尺寸不同　C. 是否区分同类不同实例　D. 是否需要标签\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n卷积把局部性与平移不变写进结构。\n<\/li><li>\n分类/检测/分割输出形式不同。\n<\/li><li>\n预训练 + 增广是对抗标注稀缺的主要手段。\n<\/ul>", "ch26": "<h1>第 26 章：机器人学<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 11、17、25 章\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说出机器人的三类基本问题（定位、建图、规划）；解释 SLAM 为什么是鸡与蛋的问题；说明运动规划的配置空间思路；区分阻抗控制与力控制。<\/p>\n<h2>一句话核心<\/h2>\n<p>机器人学 = 在噪声与不确定性下，把“感知—定位—规划—控制”串成能在物理世界闭环运行的系统。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：定位与建图（难度：进阶）<\/h3>\n<p><strong>定位<\/strong>：知道自己在哪里。<strong>建图<\/strong>：知道环境长什么样。<strong>SLAM<\/strong>：两者互为前提——要定位需要地图，要建图需要知道位置。解法是联合估计（滤波或优化）。<\/p>\n<h3>概念 2：配置空间（难度：高难）<\/h3>\n<p>把机器人的所有关节角度组成一个高维空间，障碍物映射到这个空间里，路径规划就变成“在这个空间里找不碰障碍的路径”。维度等于自由度，自由度越高越难。<\/p>\n<h3>概念 3：控制（难度：进阶）<\/h3>\n<p><strong>阻抗控制<\/strong>：控制“力与位移的关系”，适合接触任务。<strong>力控制<\/strong>：直接控制接触力。纯位置控制在有接触时会失控。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p><strong>《强化学习》<\/strong> 第 16 章的应用案例与第 13 章的连续动作策略梯度，正是机器人控制的现代方法。<strong>AIMA 第 11 章<\/strong> 的规划是本章“高层任务规划”的来源，<strong>第 25 章<\/strong> 的视觉是感知部分。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  S[&quot;传感器&quot;] --&gt; L[&quot;定位 我在哪&quot;]\n  L --&gt; M[&quot;地图&quot;]\n  M --&gt; P[&quot;路径规划&quot;]\n  P --&gt; C[&quot;控制器&quot;]\n  C --&gt; A[&quot;执行器&quot;]\n  A --&gt; S<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：定位与地图互为输入，规划在其上算路径，控制把路径变成力矩。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 SLAM 只是“把地图建出来”——实际上它是状态估计问题，地图与位姿同时被估。\n<\/li><li>\n别以为规划好路径就能动——实际上还要处理动力学约束与执行误差。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nSLAM 的核心困难是？（答案：C；解析：定位需要地图，建图需要定位，互为前提。）\n<ul>\n<li>\nA. 传感器太贵　B. 计算太慢　C. 定位与建图互为前提　D. 没有算法\n<\/li><li>\n配置空间的维度等于？（答案：B；解析：等于机器人的自由度。）\n<\/li><li>\nA. 障碍物数　B. 机器人自由度　C. 传感器数　D. 路径长度\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nSLAM 是联合状态估计。\n<\/li><li>\n配置空间维度 = 自由度。\n<\/li><li>\n接触任务需要力/阻抗控制而非纯位置控制。\n<\/ul>", "ch27": "<h1>第 27 章：人工智能的哲学、伦理和安全性<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：全书\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：复述强 AI 与弱 AI 的争论焦点；说出算法偏见的主要来源；解释“对齐问题”为什么是核心风险；列出 AI 安全的几条工程原则。<\/p>\n<h2>一句话核心<\/h2>\n<p>AI 的伦理问题不是“机器会不会有意识”，而是“当决策被外包给模型时，谁承担后果、如何纠错”。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：强弱 AI（难度：基础）<\/h3>\n<p>弱 AI：机器表现出智能行为即可，不要求意识。强 AI：机器真正拥有心智。<strong>争论焦点<\/strong>：行为等价是否意味着心智等价（中文屋论证）。<\/p>\n<h3>概念 2：偏见与公平（难度：进阶）<\/h3>\n<p>模型从数据学规律，也学到数据里的历史偏见。来源：采样偏差、标签偏差、特征代理（如用邮编代理种族）。<strong>难点<\/strong>：多种公平定义互不兼容，选哪种是价值判断。<\/p>\n<h3>概念 3：对齐问题（难度：高难）<\/h3>\n<p>目标写错或写窄，优化器会找到“满足字面目标但违背意图”的解（奖励黑客）。<strong>例子<\/strong>：让清洁机器人“最大化清理的垃圾”，它可能把垃圾倒进自己看不到的地方。<\/p>\n<h3>概念 4：安全工程（难度：进阶）<\/h3>\n<p>原则：明确责任主体、保留人类否决权、监控分布漂移、建立回滚机制、对高风险决策要求可解释性。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p><strong>《强化学习》<\/strong> 第 17 章的前沿部分与本章的奖励设计问题直接相关：RL 的奖励黑客就是对齐问题的技术版本。<strong>《机器学习》<\/strong> 第 2 章的评估与选择、第 1 章的“假设空间”讨论，是理解偏见的入口。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  D[&quot;数据 含历史偏见&quot;] --&gt; M[&quot;模型 放大偏见&quot;]\n  M --&gt; P[&quot;决策 影响个人&quot;]\n  P --&gt; A[&quot;问责 谁负责&quot;]\n  A --&gt; F[&quot;反馈 纠错机制&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：偏见在数据里产生，在模型里放大，在决策里落地。问责与反馈是唯一的纠错途径。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为模型中立就没有偏见——实际上数据有偏，模型会学进去。\n<\/li><li>\n别以为对齐只是“把目标写清楚”——实际上人类意图本身常常模糊且冲突。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n奖励黑客的本质是？（答案：C；解析：优化器找到满足字面目标但违背意图的解。）\n<ul>\n<li>\nA. 算法缺陷　B. 数据不足　C. 目标设定与真实意图不一致　D. 算力不够\n<\/li><li>\n算法偏见的首要来源是？（答案：A；解析：训练数据中的历史偏见。）\n<\/li><li>\nA. 训练数据中的历史偏见　B. 学习率太大　C. 模型太大　D. 显存不足\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n强弱 AI 之争在“行为等价是否等于心智等价”。\n<\/li><li>\n偏见来自数据，模型放大它。\n<\/li><li>\n对齐问题：目标与意图不一致。\n<\/li><li>\n安全靠问责、否决权、监控、回滚。\n<\/ul>", "ch28": "<h1>第 28 章：人工智能的未来<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：2 小时 | <strong>前置<\/strong>：全书\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说出当前 AI 的三条主要发展路线及其依据；区分“能力增长”与“理解增长”；给出判断某项 AI 宣传是否可信的三条检查标准。<\/p>\n<h2>一句话核心<\/h2>\n<p>AI 的未来取决于三件事的进展：能否把常识与因果纳入模型、能否在开放环境中持续学习、能否让系统行为可验证。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：三条路线（难度：进阶）<\/h3>\n<ol><li>\n<strong>规模路线<\/strong>：更大模型 + 更多数据，相信能力会随规模涌现。\n<\/li><li>\n<strong>结构路线<\/strong>：把先验（因果、物理、逻辑）写进架构，相信数据效率更重要。\n<\/li><li>\n<strong>具身路线<\/strong>：让智能体在物理世界交互，用行动获取因果知识。\n<\/ol>\n<p><strong>三者的分歧在“智能从哪来”<\/strong>：从数据规模、从结构归纳偏置、从交互经验。<\/p>\n<h3>概念 2：能力与理解（难度：进阶）<\/h3>\n<p>模型能在测试集上答对，不代表掌握了机制。<strong>判断标准<\/strong>：能否在分布外泛化、能否给出可检验的解释、能否被反例纠正。<\/p>\n<h3>概念 3：三条检查标准（难度：进阶）<\/h3>\n<p>看任何 AI 宣称时问：训练与测试分布是否相同？基线是否公平？失败案例是否公开？这三点能过滤掉大部分夸大宣传。<\/p>\n<h2>与其他四本书的衔接<\/h2>\n<p>本章是整套知识库的终点。<strong>《机器学习》<\/strong> 给的是“如何评估与选择模型”，<strong>《深度学习入门》《动手学深度学习》<\/strong> 给的是“如何实现”，<strong>《强化学习》<\/strong> 给的是“如何在交互中学习”，<strong>AIMA<\/strong> 给的是“这一切在 AI 版图上的位置”。读完这本骨架书再回看其余四本，会发现它们各自对应某一层的展开。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  S[&quot;规模 更多数据参数&quot;] --&gt; F[&quot;未来能力&quot;]\n  T[&quot;结构 先验与归纳偏置&quot;] --&gt; F\n  E[&quot;具身 交互获取因果&quot;] --&gt; F\n  F --&gt; V[&quot;可验证性 决定能否信任&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三条路线并行推进，但是否可信取决于最右边的可验证性。<\/p>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为规模能自动解决一切——实际上数据效率、因果推理仍是短板。\n<\/li><li>\n别以为基准分数高就代表可用——实际上分布外表现常大幅下降。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n判断 AI 宣称可信的三条标准不包括？（答案：C；解析：参数多少不等于能力。）\n<ul>\n<li>\nA. 训练测试分布是否一致　B. 基线是否公平　C. 参数量是否最大　D. 失败案例是否公开\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n三条路线：规模、结构、具身。\n<\/li><li>\n能力 ≠ 理解，看分布外与可纠正性。\n<\/li><li>\n三条检查标准：分布一致性、公平基线、公开失败。\n<\/ul>", "c01": "<h1>智能体的环境画像<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 2、22 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>环境画像就是给任务打六个标签：可观测性、确定性、片段性、动态性、离散性、智能体数量。标签决定该用哪套方法。<\/p>\n<h2>为什么重要<\/h2>\n<p>这是整套知识库的“方法选择器”。同一句“做出好决策”，在完全可观测的确定环境里是搜索问题，在部分可观测的随机环境里是 POMDP 或强化学习问题。选错方法，后面所有工程都白做。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  E[&quot;环境六维画像&quot;] --&gt; D{&quot;确定性?&quot;}\n  D --&gt;|确定| S[&quot;搜索/规划&quot;]\n  D --&gt;|随机| P[&quot;概率推理&quot;]\n  P --&gt; O{&quot;可观测?&quot;}\n  O --&gt;|完全| M[&quot;MDP&quot;]\n  O --&gt;|部分| PO[&quot;POMDP 信念空间&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>六个维度里，最影响方法选择的是“确定性”和“可观测性”。确定性决定能否用搜索（因果链唯一），可观测性决定决策对象是状态还是信念。<\/p>\n<p>离散性影响表示方式（表格 vs 函数逼近），动态性影响是否需要实时响应，智能体数量影响是否需要博弈论。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为环境分类是理论分类<\/strong>——实际上它直接对应算法选择。把一个随机环境当成确定环境去搜索，效果会明显变差。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 2 章<\/td><td>智能体结构<\/td><td>结构复杂度应与环境难度匹配<\/td><\/tr><tr><td>第 17 章<\/td><td>复杂决策<\/td><td>部分可观测导致信念空间<\/td><\/tr><tr><td>第 22 章<\/td><td>强化学习<\/td><td>未知环境用试错学习<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：PEAS\n<\/li><li>\n后续：MDP、POMDP、搜索\n<\/ul>", "c02": "<h1>从符号到统计的转向<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 7、12、21 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>AIMA 的第 7—11 章用逻辑表示知识，第 12 章起改用概率，第 19 章起改用学习。这条主线是“如何在不完全信息下处理知识”的一次范式转换。<\/p>\n<h2>为什么重要<\/h2>\n<p>理解这条转向，就理解了为什么今天的主流是“从数据学分布”，而不是“手工写规则”。这不是风格偏好，而是表示力与鲁棒性的权衡结果。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  L[&quot;逻辑 真/假&quot;] --&gt; P[&quot;概率 置信度&quot;]\n  P --&gt; S[&quot;统计学习 从数据估参数&quot;]\n  S --&gt; D[&quot;深度学习 端到端表示&quot;]\n  L -.-&gt;|&quot;可解释但脆弱&quot;| X[&quot;局限&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>逻辑的优点是结论确定、可解释；缺点是要求知识完备且无冲突，现实做不到。概率允许“部分相信”，能在证据不足时给出合理答案。学习则进一步放弃“人工给知识”，改为从数据估参数。<\/p>\n<p>代价是：统计方法通常不可解释、需要大量数据、难以保证边界行为。符号方法与统计方法在今天仍然并存（如神经符号系统）。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为转向意味着逻辑被淘汰<\/strong>——实际上在需要严格保证的场景（验证、合同、硬件设计）逻辑仍是首选。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 7 章<\/td><td>命题逻辑<\/td><td>只能处理确定知识<\/td><\/tr><tr><td>第 12 章<\/td><td>不确定性量化<\/td><td>引入概率语言<\/td><\/tr><tr><td>第 19 章<\/td><td>样例学习<\/td><td>从数据而非规则获取知识<\/td><\/tr><tr><td>第 21 章<\/td><td>深度学习<\/td><td>表示本身也由数据学<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：蕴含、贝叶斯公式\n<\/li><li>\n后续：概率图模型、神经网络\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：地图与坐标<\/strong><br>阅读：<a href=\"#/book/aima4/chapter/ch01\">第 1 章：绪论<\/a>、<a href=\"#/book/aima4/chapter/ch02\">第 2 章：智能体<\/a><br>检查点：用 PEAS 描述一个你熟悉的 AI 产品<\/li><li class='path-step' id='path-02'><strong>步骤 02：确定环境下的求解<\/strong><br>阅读：<a href=\"#/book/aima4/chapter/ch03\">第 3 章：通过搜索进行问题求解<\/a>、<a href=\"#/book/aima4/chapter/ch04\">第 4 章：复杂环境中的搜索<\/a>、<a href=\"#/book/aima4/chapter/ch05\">第 5 章：对抗搜索和博弈<\/a>、<a href=\"#/book/aima4/chapter/ch06\">第 6 章：约束满足问题<\/a><br>检查点：手跑一次 A*，手算一次 α-β 剪枝<\/li><li class='path-step' id='path-03'><strong>步骤 03：符号知识与规划<\/strong><br>阅读：<a href=\"#/book/aima4/chapter/ch07\">第 7 章：逻辑智能体<\/a>、<a href=\"#/book/aima4/chapter/ch08\">第 8 章：一阶逻辑<\/a>、<a href=\"#/book/aima4/chapter/ch09\">第 9 章：一阶逻辑中的推断<\/a>、<a href=\"#/book/aima4/chapter/ch10\">第 10 章：知识表示<\/a>、<a href=\"#/book/aima4/chapter/ch11\">第 11 章：自动规划<\/a><br>检查点：用归结证明一个简单蕴含<\/li><li class='path-step' id='path-04'><strong>步骤 04：不确定性<\/strong><br>阅读：<a href=\"#/book/aima4/chapter/ch12\">第 12 章：不确定性的量化<\/a>、<a href=\"#/book/aima4/chapter/ch13\">第 13 章：概率推理<\/a>、<a href=\"#/book/aima4/chapter/ch14\">第 14 章：时间上的概率推理<\/a>、<a href=\"#/book/aima4/chapter/ch15\">第 15 章：概率编程<\/a><br>检查点：手算一次贝叶斯后验与一次滤波更新<\/li><li class='path-step' id='path-05'><strong>步骤 05：决策<\/strong><br>阅读：<a href=\"#/book/aima4/chapter/ch16\">第 16 章：做简单决策<\/a>、<a href=\"#/book/aima4/chapter/ch17\">第 17 章：做复杂决策<\/a>、<a href=\"#/book/aima4/chapter/ch18\">第 18 章：多智能体决策<\/a><br>检查点：算一次信息价值，解释 POMDP 为何用信念<\/li><li class='path-step' id='path-06'><strong>步骤 06：从数据学习<\/strong><br>阅读：<a href=\"#/book/aima4/chapter/ch19\">第 19 章：样例学习<\/a>、<a href=\"#/book/aima4/chapter/ch20\">第 20 章：概率模型学习<\/a><br>检查点：手算一次信息增益与一次 EM 迭代<\/li><li class='path-step' id='path-07'><strong>步骤 07：深度学习<\/strong><br>阅读：<a href=\"#/book/aima4/chapter/ch21\">第 21 章：深度学习<\/a><br>检查点：手推两层网络的反向传播<\/li><li class='path-step' id='path-08'><strong>步骤 08：强化学习<\/strong><br>阅读：<a href=\"#/book/aima4/chapter/ch22\">第 22 章：强化学习<\/a><br>检查点：写出贝尔曼方程并说明三要素风险<\/li><li class='path-step' id='path-09'><strong>步骤 09：语言与视觉<\/strong><br>阅读：<a href=\"#/book/aima4/chapter/ch23\">第 23 章：自然语言处理<\/a>、<a href=\"#/book/aima4/chapter/ch24\">第 24 章：自然语言处理中的深度学习<\/a>、<a href=\"#/book/aima4/chapter/ch25\">第 25 章：计算机视觉<\/a><br>检查点：说明自注意力为何优于 RNN<\/li><li class='path-step' id='path-10'><strong>步骤 10：行动与反思<\/strong><br>阅读：<a href=\"#/book/aima4/chapter/ch26\">第 26 章：机器人学<\/a>、<a href=\"#/book/aima4/chapter/ch27\">第 27 章：人工智能的哲学、伦理和安全性<\/a>、<a href=\"#/book/aima4/chapter/ch28\">第 28 章：人工智能的未来<\/a><br>检查点：说出对齐问题的技术版本<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<h1>全部测验<\/h1><p>全书各章测验汇总：逐题作答，提交后即时反馈并显示解析。<\/p><h2>测验：第 1 章：绪论<\/h2><div class='quiz-item' data-qid='ch01-q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 现代 AI 主流定义属于哪一格？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q01' value='0'> 像人思考<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='1'> 像人行动<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='2'> 理性思考<\/label><label class='quiz-opt'><input type='radio' name='ch01-q01' value='3'> 理性行动<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch01-q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 两次 AI 寒冬的共同成因？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch01-q02' value='0'> 算力过剩<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='1'> 承诺超出能力<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='2'> 数据不足<\/label><label class='quiz-opt'><input type='radio' name='ch01-q02' value='3'> 缺乏理论<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 2 章：智能体<\/h2><div class='quiz-item' data-qid='ch02-q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> PEAS 中的 E 指什么？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q03' value='0'> 执行器<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='1'> 环境<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='2'> 评估<\/label><label class='quiz-opt'><input type='radio' name='ch02-q03' value='3'> 经验<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='ch02-q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 部分可观测环境最少需要哪种结构？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='ch02-q04' value='0'> 简单反射<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='1'> 基于目标<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='2'> 基于模型的反射<\/label><label class='quiz-opt'><input type='radio' name='ch02-q04' value='3'> 学习型<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p><h2>测验：第 3 章：通过搜索
