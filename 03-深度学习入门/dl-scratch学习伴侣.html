strong>mini-batch<\/strong>：整个训练集太大，一次全算显存放不下，于是每次随机抽一小批（比如 100 条）算平均梯度再更新。抽完所有样本叫一个 epoch。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart TD\n  A[&quot;取一批数据&quot;] --&gt; B[&quot;前向传播得输出&quot;]\n  B --&gt; C[&quot;算损失&quot;]\n  C --&gt; D[&quot;求梯度&quot;]\n  D --&gt; E[&quot;按梯度反方向更新参数&quot;]\n  E --&gt; F{&quot;还有数据吗&quot;}\n  F --&gt;|有| A\n  F --&gt;|没有| G[&quot;一个 epoch 结束&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：这个环每转一圈参数就变一次；梯度的正负号决定方向，学习率决定步长，损失函数的形状决定这条路好不好走。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：蒙着眼睛下山。你只能用脚感受当前这一点的坡度（梯度），然后朝最陡的下坡方向迈一步（学习率是步长）。步子太大容易跨过山谷冲到对面山坡，步子太小可能一整天下不了山。\n<\/li><li>\n实例：f(x)=x²，在 x=2 处中心差分，h=1e-4：f(2.0001)=4.00040001，f(1.9999)=3.99960001，差 0.0008，除以 2h=0.0002 得 4.0000。解析导数 2x=4，对得上。用这个例子可以校验任何数值微分实现。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为训练损失降得越低越好——实际上损失降到 0 往往意味着把训练集背下来了，测试集反而变差，这叫过拟合。\n<\/li><li>\n别以为梯度是“参数该取的值”——实际上梯度是方向加斜率，参数该取多少还要乘学习率再相减。\n<\/li><li>\n别以为交叉熵和均方误差只是习惯不同——实际上在分类任务上它们的梯度性质差别很大，交叉熵配 softmax 的梯度不会饱和。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n正确类概率输出 0.1 与输出 0.9，交叉熵相差约多少倍？（答案：C；解析：-log0.1=2.303，-log0.9=0.105，约 22 倍。）\n<ul>\n<li>\nA. 1.5 倍　B. 9 倍　C. 22 倍　D. 相同\n<\/li><li>\n中心差分比前向差分更准，原因是？（答案：B；解析：中心差分把一阶误差项抵消掉，误差是 h² 量级而非 h 量级。）\n<\/li><li>\nA. 计算量更大　B. 一阶误差被抵消　C. 用了两次前向　D. h 取更小\n<\/li><li>\n训练损失持续下降但测试准确率不动，最可能是什么问题？（答案：A；解析：这是典型的过拟合，模型在记训练集的噪声。）\n<\/li><li>\nA. 过拟合　B. 学习率过小　C. 梯度消失　D. 数据太少导致必须继续训练\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n损失 = 错得多离谱；梯度 = 往哪改；学习率 = 改多大。\n<\/li><li>\n分类用交叉熵，因为配 softmax 梯度是 y-t，不会饱和。\n<\/li><li>\n中心差分误差 h²，只用于验算，不做训练。\n<\/ul>", "ch05": "<h1>第 5 章：误差反向传播法<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 4 章（梯度与链式法则）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：把“买苹果”这种日常计算画成计算图并手算反向传播；说出加法节点与乘法节点在反向时分别做什么；解释为什么反向传播比数值微分快几个数量级；说明梯度消失是怎么在深层 sigmoid 网络里发生的。<\/p>\n<h2>一句话核心<\/h2>\n<p>反向传播就是链式法则的流水线版：从最后的损失往回走，每经过一个节点，把上游传来的梯度乘以本节点的局部导数，一层层乘下去。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：链式法则（难度：基础）<\/h3>\n<p>若 <code>z = f(y)<\/code>、<code>y = g(x)<\/code>，则 <code>dz/dx = (dz/dy) × (dy/dx)<\/code>。复合多少层就乘多少次，这就是全部。<\/p>\n<p><strong>类比<\/strong>：汇率换算。100 人民币换美元再换日元，最终金额对人民币的敏感度，等于“日元对美元的汇率 × 美元对人民币的汇率”。两段变化的乘积就是总变化。<\/p>\n<h3>概念 2：计算图与两个基本节点（难度：进阶）<\/h3>\n<p>计算图把每一步运算画成一个节点，箭头是数据流。反向传播时，从最右边传一个 1 回来（表示“损失对自己求导等于 1”），每过一个节点按规则处理：<\/p>\n<ul><li>\n<strong>加法节点<\/strong>：把上游梯度原样分给两个输入。因为 <code>z = x + y<\/code>，<code>∂z/∂x = 1<\/code>，所以乘 1 就是不变。\n<\/li><li>\n<strong>乘法节点<\/strong>：把上游梯度乘以“另一个输入的值”。因为 <code>z = x × y<\/code>，<code>∂z/∂x = y<\/code>，所以 x 收到的梯度是上游 × y。\n<\/ul>\n<p><strong>买苹果实例<\/strong>：苹果单价 10 元，买 100 个，消费税 10%。 正向：10 × 100 = 1000（苹果总额），1000 × 1.1 = 1100（含税总价）。 反向：从 1100 起，传回 1。<\/p>\n<ul><li>\n过消费税节点（乘法，另一个输入 1.1）：上游 1 × 1.1 = 1.1，传回给“1000”的是 1.1。\n<\/li><li>\n过“10×100”节点（乘法）：对单价 10 的梯度 = 上游 1.1 × 100 = 110；对数量 100 的梯度 = 1.1 × 10 = 11。\n<p>含义：单价每涨 1 元，总价涨 110 元；数量每多 1 个，总价涨 11 元。这两个数就是“敏感度”，也就是梯度。<\/p>\n<\/ul>\n<h3>概念 3：为什么反向传播快（难度：进阶）<\/h3>\n<p>数值微分算一个参数的梯度要两次前向；反向传播一次前向加一次反向，就把<strong>所有<\/strong>参数的梯度一次算齐。参数越多，优势越大。代价是要在正向时把中间结果存下来（每个节点的输入值），内存换时间。<\/p>\n<p><strong>实现层面<\/strong>：把每个层写成一个类，正向 <code>forward<\/code> 返回输出并缓存输入，反向 <code>backward<\/code> 接收上游梯度、返回本层对输入的梯度。整网就是把各层的 backward 从后往前串起来，这叫“层实现”。<\/p>\n<h3>概念 4：梯度消失（难度：高难）<\/h3>\n<p>sigmoid 的导数最大只有 0.25（在 x=0 处）。五层网络反向传播，梯度最多被乘 0.25 五次，即 1/1024，前面的层几乎收不到学习信号。<\/p>\n<p><strong>为什么 ReLU 缓解了这个问题<\/strong>：ReLU 正区导数恒为 1，梯度可以原样传过多层；负区直接 0。代价是可能“死掉”一部分神经元。工程上用 He 初始化、Batch Norm 等手段把激活值控制在合理范围。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  A[&quot;单价 10&quot;] --&gt; M1[&quot;乘法&quot;]\n  B[&quot;数量 100&quot;] --&gt; M1\n  M1 --&gt;|&quot;1000&quot;| M2[&quot;乘法 消费税 1.1&quot;]\n  M2 --&gt;|&quot;1100&quot;| L[&quot;损失&quot;]\n  L -.-&gt;|&quot;梯度 1&quot;| M2\n  M2 -.-&gt;|&quot;1.1&quot;| M1\n  M1 -.-&gt;|&quot;对单价 110 / 对数量 11&quot;| A<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：实线是正向数值，虚线是反向梯度。注意乘法的反向梯度会“交换”另一个输入——这是最容易记反的地方。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：一个多层审批流程。最后一步驳回，要追责到哪一层，得按每层的“放大倍数”往回折算。加法节点是“两人共同签字，责任各占一半（系数 1）”；乘法节点是“科长签字放大 3 倍”，责任就放大 3 倍传下去。\n<\/li><li>\n实例：上面苹果的例子可以直接用代码验证：把 <code>x=10, y=100, z=1.1<\/code> 代入 <code>z<em>x<\/em>y<\/code>，对 x 求偏导得 110，对 y 求偏导得 11，与手算一致。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为反向传播是“另一个网络在反向计算”——实际上它用的还是同一套权重和同一批中间结果，只是计算顺序反过来。\n<\/li><li>\n别以为乘法节点的梯度是“上游 × 自己”——实际上乘的是<strong>另一个输入<\/strong>的值。写成“上游 × 本节点输入”必错。\n<\/li><li>\n别以为层数越深学得越好——实际上 sigmoid 叠加会让梯度指数衰减，没有残差、归一化这些手段，深层网络根本训不动。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n加法节点反向时对两个输入的梯度是？（答案：A；解析：∂(x+y)/∂x=1，上游梯度原样分发。）\n<ul>\n<li>\nA. 都是上游梯度本身　B. 都是 0　C. 分别是两个输入的值　D. 相加后平分\n<\/li><li>\nz = x × y，x=3、y=5，从上游传回梯度 2，则对 x 的梯度是？（答案：C；解析：∂z/∂x=y=5，乘上游 2 得 10。）\n<\/li><li>\nA. 2　B. 3　C. 10　D. 15\n<\/li><li>\n五层纯 sigmoid 网络，梯度大约每层衰减到多少倍？（答案：B；解析：导数上界 0.25，五层最坏 0.25^5≈1/1024。）\n<\/li><li>\nA. 1/4　B. 1/1024　C. 1/5　D. 不变\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n链式法则：复合函数的导数是各段导数的乘积。\n<\/li><li>\n加法节点原样分发，乘法节点乘对方的值。\n<\/li><li>\n反向传播一次拿到全部梯度，代价是缓存中间结果。\n<\/li><li>\nsigmoid 导数上界 0.25，叠深了梯度指数衰减。\n<\/ul>", "ch06": "<h1>第 6 章：与学习相关的技巧<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：4 小时 | <strong>前置<\/strong>：第 5 章（反向传播）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：区分 SGD、Momentum、AdaGrad、Adam 四种更新规则各自解决了什么问题；解释权重初始值为什么会影响训练成败；说明 Batch Norm、Dropout、权值衰减分别在对付什么；给出划分训练/验证/测试集的正确做法。<\/p>\n<h2>一句话核心<\/h2>\n<p>训练能不能收敛，一半看梯度算得对不对，另一半看这些技巧：怎么走（优化器）、从哪出发（初始化）、走多稳（归一化）、别背题（正则化）。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：四种优化器（难度：进阶）<\/h3>\n<ul><li>\n<strong>SGD<\/strong>：<code>W ← W - η ∂E/∂W<\/code>，最朴素，沿当前梯度走。缺点是在“峡谷形”损失面上来回横跳。\n<\/li><li>\n<strong>Momentum<\/strong>：记住一个速度项 <code>v ← αv - η∂E/∂W<\/code>，<code>W ← W + v<\/code>。相当于给下山的小球加了惯性，方向一致的维度越走越快，来回抖的维度被平均掉。\n<\/li><li>\n<strong>AdaGrad<\/strong>：给每个参数配一个“历史梯度平方和”，学习率除以它的平方根。梯度一直很大的参数步子自动变小，很少更新的参数步子相对变大。\n<\/li><li>\n<strong>Adam<\/strong>：Momentum + AdaGrad，同时估一阶矩（方向）和二阶矩（尺度），再做偏置修正。工程上默认首选，但它不是万能的，有些任务上调好的 SGD 泛化更好。\n<\/ul>\n<p><strong>类比<\/strong>：SGD 是每步都重新看路的行人；Momentum 是推着独轮车下坡，有惯性；AdaGrad 是给每个方向配了不同的刹车力度；Adam 是两者合体再加自动挡。<\/p>\n<h3>概念 2：权重初始值（难度：进阶）<\/h3>\n<p>不能全初始化为 0——同一层所有神经元会算出完全一样的输出、收到完全一样的梯度，永远同步，等于只有一个神经元。<\/p>\n<p><strong>Xavier 初始化<\/strong>：按前一层神经元数 n 缩放，标准差取 <code>1/√n<\/code>，适合 sigmoid/tanh；<strong>He 初始化<\/strong>：标准差取 <code>√(2/n)<\/code>，专为 ReLU 设计，因为 ReLU 把一半输出打成 0，方差少了一半，需要放大回来。<\/p>\n<p><strong>实例对比<\/strong>：一个 100→100→100 的 sigmoid 网络，若权重标准差取 0.01，各层输出会迅速塌到 0.5 附近、几乎没差别；取标准差 1，激活值又会饱和到 0 和 1。取 1/√100=0.1 时，各层输出的分布宽度才稳定。<\/p>\n<h3>概念 3：Batch Norm 与正则化（难度：高难）<\/h3>\n<p><strong>Batch Norm<\/strong>：在每个 mini-batch 内，把该层输入按特征做标准化（减均值、除标准差），再乘一个可学习的 γ、加一个可学习的 β。作用是把每层输入拉回稳定分布，允许更大的学习率、对初始化不那么敏感。注意它训练时用批统计量、推理时用滑动平均，两者不一致是常见 bug 来源。<\/p>\n<p><strong>权值衰减<\/strong>：在损失里加 <code>λ/2 × ΣW²<\/code>，压制大权重，等价于 L2 正则。<\/p>\n<p><strong>Dropout<\/strong>：训练时随机把一部分神经元输出置 0（比如 50%），推理时全部启用并按比例缩放。作用是逼网络学冗余表示，不能依赖某几个特定神经元。<\/p>\n<p><strong>训练/验证/测试三分<\/strong>：训练集调参数，验证集挑超参数（学习率、层数、正则强度），测试集只在最后用一次。用测试集挑超参数等于提前偷看答案，报出来的准确率是虚的。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  D[&quot;训练集&quot;] --&gt;|&quot;更新参数&quot;| M[&quot;模型&quot;]\n  V[&quot;验证集&quot;] --&gt;|&quot;挑超参数&quot;| H[&quot;超参数搜索&quot;]\n  H --&gt; M\n  T[&quot;测试集&quot;] --&gt;|&quot;只用一次&quot;| R[&quot;最终评估&quot;]\n  M --&gt; R<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：三条数据的用途不能混。验证集参与选择但不参与梯度更新；测试集只在最后碰一次。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：备考。训练集是课后练习，验证集是模拟考（可以反复做、用来调复习策略），测试集是期末真题（做一次就定成绩）。拿真题反复调复习策略，期末考出来的分数就不代表真实水平。\n<\/li><li>\n实例：Dropout 在训练时的实现是对输出做 <code>mask = (rand(n) &gt; p)<\/code>，再 <code>out = out * mask / (1-p)<\/code>。这个除以 (1-p) 是“倒置 dropout”，保证训练与推理的期望一致，推理时不需要再缩放。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为 Adam 一定比 SGD 好——实际上很多图像分类任务里，调好的 SGD + Momentum 泛化更好，Adam 收敛快但有时更“锐”。\n<\/li><li>\n别以为 Batch Norm 只是加速——实际上它改变了每层的输入分布，有轻微正则效果，但它和 Dropout 同时用可能互相干扰。\n<\/li><li>\n别以为权重全初始化成 0 也能学——实际上对称性没被打破，整层神经元永远一样。\n<\/li><li>\n别以为验证集准确率高就可以直接报成绩——最终数字必须来自测试集，且只评估一次。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\nMomentum 主要解决 SGD 的什么问题？（答案：B；解析：惯性让方向一致的维度加速、来回震荡的维度被平均，缓解峡谷形损失面上的横跳。）\n<ul>\n<li>\nA. 梯度消失　B. 震荡与收敛慢　C. 过拟合　D. 显存不足\n<\/li><li>\nReLU 网络应优先用哪种初始化？（答案：C；解析：He 初始化按 √(2/n) 放大，补上 ReLU 砍掉一半方差。）\n<\/li><li>\nA. 全 0　B. Xavier　C. He　D. 固定 0.01\n<\/li><li>\n用测试集反复挑超参数会导致？（答案：A；解析：测试集信息泄露进模型选择，报出的准确率偏乐观。）\n<\/li><li>\nA. 评估结果偏乐观　B. 训练更慢　C. 梯度消失　D. 显存溢出\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\nSGD 朴素、Momentum 有惯性、AdaGrad 按维调步长、Adam 两者合体。\n<\/li><li>\n初始化要打破对称，ReLU 用 He，sigmoid 用 Xavier。\n<\/li><li>\n训练调参数、验证挑超参、测试只用一次。\n<\/ul>", "ch07": "<h1>第 7 章：卷积神经网络<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★★ | <strong>预估学时<\/strong>：5 小时 | <strong>前置<\/strong>：第 5、6 章（反向传播、优化技巧）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：手算一个 5×5 输入、3×3 卷积核、padding=1 的卷积输出尺寸；说清 padding、stride、池化各自的作用；解释卷积相对全连接省了多少参数、为什么这种“省”是合理的。<\/p>\n<h2>一句话核心<\/h2>\n<p>卷积 = 拿一个小窗口在图上滑动，每个位置做加权求和；它假设“同一个图案出现在图像任何位置都该被同样识别”，于是把参数共享起来。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：卷积运算（难度：进阶）<\/h3>\n<p>一个 3×3 的核在输入上从左到右、从上到下逐格移动，每停一次，把核覆盖的 9 个数与核的 9 个数逐项相乘再相加，得到一个输出值；所有位置的结果拼成输出特征图。<\/p>\n<p><strong>实例<\/strong>：输入 5×5 全 1 矩阵，核也是 3×3 全 1，不加 padding、步长 1。第一个位置（左上）覆盖 9 个 1，和为 9，输出 9。输出尺寸是 (5-3)/1 + 1 = 3，即 3×3 的 9。这 9 个位置全部相同，输出全是 9。<\/p>\n<p><strong>输出尺寸公式<\/strong>：<code>(H - KH + 2P)/S + 1<\/code>。H=5、KH=3、P=1、S=1 时得 (5-3+2)/1+1 = 5，输出和输入同尺寸，这就是 padding 的常用目的——保住尺寸。<\/p>\n<h3>概念 2：padding 与 stride（难度：基础）<\/h3>\n<p><strong>padding<\/strong>：在输入四周补 0。补 1 圈，尺寸不变；不补，每过一层尺寸缩 2。补 0 还有个副作用：边缘像素被扫到的次数少于中间，补 0 让边缘也能被完整覆盖。<\/p>\n<p><strong>stride<\/strong>：滑窗每次移动的格数。stride=2 时输出尺寸大约减半，用来快速降采样。<\/p>\n<h3>概念 3：池化（难度：基础）<\/h3>\n<p>池化在局部区域里取最大值（Max）或平均值（Average），然后输出一个数。它没有要学习的参数，作用是把特征图的尺寸压小、让后面几层看到更大范围，同时提供一点“位置微移不影响结果”的容忍度。<\/p>\n<p><strong>Max 池化的反向传播<\/strong>：梯度只回传给那个取到最大值的元素，其余位置梯度为 0。所以要记住正向时的 argmax 位置。<\/p>\n<h3>概念 4：im2col 与参数共享（难度：高难）<\/h3>\n<p>直接写四重循环做卷积非常慢。工程做法是 <strong>im2col<\/strong>：把每个滑动窗口覆盖的那块输入“拉直”成一列，把所有窗口拼成一个大矩阵，然后用一次矩阵乘法算出全部输出。代价是展开时会复制数据、占内存（大约 k_h×k_w 倍）。<\/p>\n<p><strong>参数对比<\/strong>：输入 3 通道、输出 64 通道、3×3 核的卷积层，参数是 3×3×3×64 + 64 = 1792 个。如果用全连接，输入 224×224×3 接到 64 个神经元，参数是 224×224×3×64 ≈ 963 万。差了五千倍。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  I[&quot;输入 5×5&quot;] --&gt; P[&quot;Padding 补 1 圈&quot;]\n  P --&gt; C[&quot;3×3 卷积 步长 1&quot;]\n  C --&gt; A[&quot;激活函数&quot;]\n  A --&gt; M[&quot;2×2 最大池化&quot;]\n  M --&gt; O[&quot;输出特征图&quot;]<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：纵向看每一层的空间尺寸怎么变。padding 让它不变，卷积核大小决定每次看多大范围，池化负责减半。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：拿一张镂空模板（卷积核）盖在照片上，只在镂空处看像素；把模板在整张照片上挪一圈，每个位置记一个分数。分数高的地方说明这个位置出现了模板要的那种纹理。同一块模板全程不换——这就是参数共享。\n<\/li><li>\n实例：5×5 输入、3×3 核、padding=0、stride=2，输出尺寸 = (5-3)/2+1 = 2，即 2×2。可以把 stride 想成“每次跨两格”，跨越位置只有 0 和 2 两档。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为卷积核是手工设计的边缘检测器——实际上核里的 9 个数是训练学出来的，只是学出来的结果常表现出边缘、纹理的形态。\n<\/li><li>\n别以为池化层有参数要训练——实际上 Max/Average 池化都没有参数，反向传播只是把梯度按正向选择的路径送回去。\n<\/li><li>\n别以为卷积一定比全连接准——实际上卷积的“局部连接 + 共享”是一种强先验，在图像、语音这类有平移结构的任务上才对；表格数据上用它未必划算。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n输入 7×7、3×3 卷积核、padding=1、stride=1，输出尺寸是？（答案：C；解析：(7-3+2)/1+1=7。）\n<ul>\n<li>\nA. 5×5　B. 6×6　C. 7×7　D. 9×9\n<\/li><li>\n卷积层参数远少于全连接层，根本原因是？（答案：B；解析：同一个核在所有位置复用，权重被共享。）\n<\/li><li>\nA. 卷积核更小　B. 权重在空间上共享　C. 用了池化　D. 输入通道少\n<\/li><li>\nMax 池化的反向传播把梯度传给？（答案：A；解析：只有正向取到最大值的那个位置接收梯度。）\n<\/li><li>\nA. 取到最大值的位置　B. 区域所有位置均分　C. 区域平均值位置　D. 不传梯度\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n输出尺寸 = (H-KH+2P)/S + 1。\n<\/li><li>\npadding 保尺寸，stride 降采样，池化无参数。\n<\/li><li>\n参数共享是卷积省参数的根本原因，也是它的先验假设。\n<\/ul>", "ch08": "<h1>第 8 章：深度学习<\/h1>\n<ul><li>\n<strong>难度<\/strong>：★★☆ | <strong>预估学时<\/strong>：3 小时 | <strong>前置<\/strong>：第 7 章（CNN）\n<\/ul>\n<h2>学习目标<\/h2>\n<p>学完本章，你能：说明“深层”到底带来了什么能力；解释迁移学习为什么能在小数据上奏效、要冻结哪部分、为什么要调小学习率；说出 GPU 与分布式训练解决的是哪一类瓶颈。<\/p>\n<h2>一句话核心<\/h2>\n<p>深度学习的“深”不是为了参数量，而是为了让网络逐层把像素组合成边缘、纹理、部件、物体这样的层级表示。<\/p>\n<h2>零基础讲解<\/h2>\n<h3>概念 1：层级特征（难度：进阶）<\/h3>\n<p>浅层卷积核看到的是边缘和颜色块；中层组合成纹理和简单部件（眼睛、轮子）；深层组合成完整物体。这种“由简到繁”的分层是端到端训练自己学出来的，不是人工规定的。<\/p>\n<p><strong>为什么不能只靠一层<\/strong>：一层网络要表示“一只猫”，需要极其复杂的组合规则；拆成多层，每层只学一个简单的变换，总复杂度被分摊了。这跟用积木搭房子一个道理：不需要一块巨大的异形积木，用标准小块叠出结构。<\/p>\n<h3>概念 2：迁移学习（难度：进阶）<\/h3>\n<p>拿在大数据集（ImageNet，1000 类、百万张图）上训好的网络，把最后的分类层换成自己的类别，前面的卷积层直接沿用。<\/p>\n<p><strong>两种用法<\/strong>：<\/p>\n<ol><li>\n<strong>冻结特征提取部分<\/strong>，只训练新分类头——数据很少时用，几百张图也能出效果；\n<\/li><li>\n<strong>全部微调<\/strong>，但用很小的学习率（比如 1e-4 甚至 1e-5）——数据稍多时用。学习率大的话，几步就把预训练学到的通用特征冲掉了。\n<\/ol>\n<p><strong>为什么有效<\/strong>：底层学到的边缘、纹理是几乎所有视觉任务共享的，不需要从头学。这是“知识迁移”在神经网络里的具体形式，不是比喻。<\/p>\n<h3>概念 3：为什么需要 GPU 与加速（难度：基础）<\/h3>\n<p>卷积的核心是大量矩阵乘法，可高度并行。CPU 几十个核心，GPU 上万个流处理器，同一批运算能并行到几千路。此外 cuDNN 这类库会针对卷积自动选算法（FFT、Winograd、im2col+GEMM）。<\/p>\n<p><strong>分布式训练<\/strong>：数据并行是每张卡放一份模型、各算一部分数据，再同步梯度。瓶颈通常在卡间通信而不是算力。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  P[&quot;像素&quot;] --&gt; E[&quot;边缘 浅层&quot;]\n  E --&gt; T[&quot;纹理与部件 中层&quot;]\n  T --&gt; O[&quot;物体 深层&quot;]\n  O --&gt; C[&quot;分类输出&quot;]\n  S[&quot;ImageNet 预训练权重&quot;] -.-&gt;|&quot;迁移&quot;| E\n  S -.-&gt; T<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<p>看图说明：横向是同一张图在网络里被逐层抽象的过程；虚线表示预训练权重可以直接填到浅层与中层。<\/p>\n<h2>类比与实例<\/h2>\n<ul><li>\n类比：教一个已经会开车的人开卡车。方向盘、油门、后视镜的用法是共通的（浅层特征），只需要重新学车身长度带来的转弯半径（新分类头）。从零教一个没摸过车的人，成本高得多。\n<\/li><li>\n实例：VGG16 在 ImageNet 上预训练，最后是全连接 1000 类。改成 5 类时，把最后那层换成 5 个输出、冻结前面所有卷积层，只训练新层。用几百张图、十几轮就能到不错的准确率；同样数据从零训，通常连收敛都困难。\n<\/ul>\n<h2>常见误解<\/h2>\n<ul><li>\n别以为层数越多准确率一定越高——实际上网络太深会出现退化问题，训练误差反而上升，残差连接就是为此设计的。\n<\/li><li>\n别以为微调时学习率可以照抄从头训练的值——实际上一旦学习率过大，预训练权重几步就被破坏，等于白拿。\n<\/li><li>\n别以为迁移学习只适用于图像——实际上自然语言处理里的预训练语言模型是同一套逻辑，只是“冻结”的层数和微调策略不同。\n<\/ul>\n<h2>自测题（答案）<\/h2>\n<ol><li>\n迁移学习时数据很少，最稳妥的做法是？（答案：A；解析：冻结卷积层只训分类头，避免少量数据把通用特征破坏掉。）\n<ul>\n<li>\nA. 冻结卷积层只训分类头　B. 全部层用大学习率微调　C. 从零训练　D. 只改输入尺寸\n<\/li><li>\n深层网络相对浅层网络的核心优势是？（答案：B；解析：分层表示让复杂函数被拆成多个简单变换的组合。）\n<\/li><li>\nA. 参数更少　B. 能学出层级化的特征表示　C. 不需要激活函数　D. 一定不会过拟合\n<\/li><li>\n微调时学习率要设小的原因是？（答案：C；解析：大学习率会在几步内把预训练学到的通用特征改坏。）\n<\/li><li>\nA. 显存不够　B. 防止过拟合　C. 避免破坏预训练权重　D. 加快收敛\n<\/ul>\n<\/ol>\n<h2>复习锚点<\/h2>\n<ul><li>\n“深”的价值是分层抽象，不是堆参数。\n<\/li><li>\n迁移学习：冻结 + 小学习率，两个细节都不能漏。\n<\/li><li>\nGPU 加速的本质是把矩阵乘法并行化。\n<\/ul>", "c01": "<h1>计算图与反向传播<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 5 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>把前向计算拆成一个个节点画成图，反向时从损失出发，按链式法则把梯度一层层乘回去。<\/p>\n<h2>为什么重要<\/h2>\n<p>它把“求所有参数的导数”从 O(参数数 × 前向代价) 降到 O(一次前向代价)。没有它，深度学习在算力上不成立。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  X[&quot;输入&quot;] --&gt; M[&quot;乘法节点&quot;]\n  W[&quot;权重&quot;] --&gt; M\n  M --&gt; S[&quot;加法节点 偏置&quot;]\n  S --&gt; A[&quot;激活&quot;]\n  A --&gt; L[&quot;损失&quot;]\n  L -.-&gt;|&quot;1&quot;| A\n  A -.-&gt;|&quot;局部导数&quot;| S\n  S -.-&gt;|&quot;原样分发&quot;| M\n  M -.-&gt;|&quot;乘对方的值&quot;| W<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>正向每经过一个节点，把输入缓存下来；反向时每个节点拿到“上游梯度”，乘以自己的局部导数，分发给自己的输入。加法节点局部导数为 1，乘法节点对某个输入的局部导数是另一个输入的值。<\/p>\n<p>两个必须记住的细节：一是缓存，正向不存中间值，反向就没东西可乘；二是顺序，必须严格逆序，因为每个节点要等它的下游算完才能算。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为反向传播要重新跑一遍网络<\/strong>——它复用正向缓存的中间结果，只做乘法和分发。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 4 章<\/td><td>数值微分<\/td><td>慢，只用于验算<\/td><\/tr><tr><td>第 5 章<\/td><td>计算图<\/td><td>一次拿到全部梯度<\/td><\/tr><tr><td>第 7 章<\/td><td>卷积层反向<\/td><td>池化的梯度只回传给 argmax<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：链式法则、矩阵乘法\n<\/li><li>\n后续：优化器、梯度消失\n<\/ul>", "c02": "<h1>过拟合与正则化<\/h1>\n<ul><li>\n<strong>难度<\/strong>：进阶 | <strong>涉及章节<\/strong>：第 6 章\n<\/ul>\n<h2>一句话定义<\/h2>\n<p>模型把训练集的噪声也学进去了，训练误差很低但新数据上表现差；正则化是一组“故意让模型难背题”的手段。<\/p>\n<h2>为什么重要<\/h2>\n<p>几乎所有真实项目最终卡在泛化，不在训练。能不能识别过拟合、能不能选对正则手段，决定了模型能不能上线。<\/p>\n<h2>图示<\/h2>\n<div class=\"mermaid\" data-src=\"1\">flowchart LR\n  U[&quot;欠拟合 两头都差&quot;] --&gt; G[&quot;合适&quot;]\n  G --&gt; O[&quot;过拟合 训练好 测试差&quot;]\n  R[&quot;加数据 加正则 早停&quot;] -.-&gt; O<\/div><p class=\"mermaid-hint\">↑ Mermaid 图示：联网时自动渲染为图表；离线时请阅读上方源码与正文说明。<\/p>\n<h2>详解<\/h2>\n<p>判断依据：训练损失继续降、验证损失开始升，这个拐点就是过拟合开始的位置。<\/p>\n<p>四种手段的机制不同：权值衰减压制权重幅度；Dropout 破坏神经元之间的固定搭配；数据增强改变输入分布；早停直接在选择轮数上做截断。它们可以叠加，但叠加过多会让模型欠拟合。<\/p>\n<h2>常见误解<\/h2>\n<p><strong>别以为训练准确率 99% 是好事<\/strong>——如果验证只有 70%，那 99% 只是记忆力的证明。<\/p>\n<h2>在书中出现的脉络<\/h2>\n<table><thead><tr><th>章节<\/th><th>语境<\/th><th>关键结论<\/th><\/tr><\/thead><tbody><tr><td>第 6 章<\/td><td>权值衰减、Dropout<\/td><td>两种最常用的正则<\/td><\/tr><tr><td>第 6 章<\/td><td>验证集<\/td><td>超参数只能在验证集上挑<\/td><\/tr><\/tbody><\/table>\n<h2>相关概念<\/h2>\n<ul><li>\n前置：损失函数、训练循环\n<\/li><li>\n后续：集成学习、交叉验证\n<\/ul>", "__path__": "<h1>学习路径<\/h1><p>按推荐顺序学习；每步通过检查点（自测题）后再继续。<\/p><ol class='path-list'><li class='path-step' id='path-01'><strong>步骤 01：数组与矩阵：把数据摆成正确的形状<\/strong><br>阅读：<a href=\"#/chapter/ch01\">第 1 章：Python 入门<\/a><br>检查点：能手算 2×3 与 3×2 的矩阵乘法，并说明广播从哪一维开始对齐<\/li><li class='path-step' id='path-02'><strong>步骤 02：感知机与线性可分<\/strong><br>阅读：<a href=\"#/chapter/ch02\">第 2 章：感知机<\/a><br>检查点：能自己配出一组解异或的两层权重并逐点验算<\/li><li class='path-step' id='path-03'><strong>步骤 03：神经网络前向传播<\/strong><br>阅读：<a href=\"#/chapter/ch03\">第 3 章：神经网络<\/a><br>检查点：写出 2→3→2 网络每一层的形状变化与参数量<\/li><li class='path-step' id='path-04'><strong>步骤 04：损失、梯度与学习<\/strong><br>阅读：<a href=\"#/chapter/ch04\">第 4 章：神经网络的学习<\/a><br>检查点：算出一个具体样本的交叉熵，并用中心差分校验梯度<\/li><li class='path-step' id='path-05'><strong>步骤 05：反向传播<\/strong><br>阅读：<a href=\"#/chapter/ch05\">第 5 章：误差反向传播法<\/a><br>检查点：手算苹果例子的全部反向梯度，并解释乘法节点为何乘“另一个输入”<\/li><li class='path-step' id='path-06'><strong>步骤 06：训练技巧<\/strong><br>阅读：<a href=\"#/chapter/ch06\">第 6 章：与学习相关的技巧<\/a><br>检查点：针对“损失震荡”“泛化差”“神经元大量死亡”三种症状各给两条对策<\/li><li class='path-step' id='path-07'><strong>步骤 07：卷积神经网络<\/strong><br>阅读：<a href=\"#/chapter/ch07\">第 7 章：卷积神经网络<\/a><br>检查点：手算三种 padding/stride 组合的输出尺寸与参数量<\/li><li class='path-step' id='path-08'><strong>步骤 08：深度学习与迁移学习<\/strong><br>阅读：<a href=\"#/chapter/ch08\">第 8 章：深度学习<\/a><br>检查点：为一个只有几百张图的任务写出完整的迁移学习配置<\/li><\/ol><p>进度：<span id='path-progress-label'>0/0<\/span><\/p>", "__quiz_all__": "<p>（无综合题）<\/p>", "__quiz_ch01__": "<h1>测验：第 1 章：Python 入门<\/h1><div class='quiz-item' data-qid='q01' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 形状 (2,3) 与形状 (3,) 相加，结果形状是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q01' value='0'> (3,)<\/label><label class='quiz-opt'><input type='radio' name='q01' value='1'> (2,3)<\/label><label class='quiz-opt'><input type='radio' name='q01' value='2'> (2,)<\/label><label class='quiz-opt'><input type='radio' name='q01' value='3'> 报错<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q02' data-type='single'><p class='quiz-q'><b>Q2.<\/b> (4,2) 与 (2,5) 做矩阵乘法，结果形状是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q02' value='0'> (4,5)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='1'> (2,5)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='2'> (4,2)<\/label><label class='quiz-opt'><input type='radio' name='q02' value='3'> 报错<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch02__": "<h1>测验：第 2 章：感知机<\/h1><div class='quiz-item' data-qid='q03' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 单层感知机无法实现异或，根本原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q03' value='0'> 输入只有两个<\/label><label class='quiz-opt'><input type='radio' name='q03' value='1'> 阶跃函数不可导<\/label><label class='quiz-opt'><input type='radio' name='q03' value='2'> 决策边界只能是直线<\/label><label class='quiz-opt'><input type='radio' name='q03' value='3'> 偏置取值不对<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q04' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 与门 w=(0.5,0.5)、b 由 -0.7 改为 -1.5，输出会怎样？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q04' value='0'> 变成或门<\/label><label class='quiz-opt'><input type='radio' name='q04' value='1'> 变成与非门<\/label><label class='quiz-opt'><input type='radio' name='q04' value='2'> 没有变化<\/label><label class='quiz-opt'><input type='radio' name='q04' value='3'> 四种输入全部输出 0<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch03__": "<h1>测验：第 3 章：神经网络<\/h1><div class='quiz-item' data-qid='q05' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 2→3→2 的全连接网络，权重与偏置共多少个参数？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q05' value='0'> 12<\/label><label class='quiz-opt'><input type='radio' name='q05' value='1'> 14<\/label><label class='quiz-opt'><input type='radio' name='q05' value='2'> 17<\/label><label class='quiz-opt'><input type='radio' name='q05' value='3'> 20<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q06' data-type='single'><p class='quiz-q'><b>Q2.<\/b> softmax 输出和为 1 主要由哪一步保证？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q06' value='0'> 取指数<\/label><label class='quiz-opt'><input type='radio' name='q06' value='1'> 除以总和<\/label><label class='quiz-opt'><input type='radio' name='q06' value='2'> 减去最大值<\/label><label class='quiz-opt'><input type='radio' name='q06' value='3'> 激活函数<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch04__": "<h1>测验：第 4 章：神经网络的学习<\/h1><div class='quiz-item' data-qid='q07' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 正确类概率分别为 0.1 和 0.9 时，交叉熵相差约多少倍？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q07' value='0'> 1.5 倍<\/label><label class='quiz-opt'><input type='radio' name='q07' value='1'> 9 倍<\/label><label class='quiz-opt'><input type='radio' name='q07' value='2'> 22 倍<\/label><label class='quiz-opt'><input type='radio' name='q07' value='3'> 相同<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q08' data-type='multi'><p class='quiz-q'><b>Q2.<\/b> 关于梯度下降，下列说法正确的是？（多选）<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='checkbox' name='q08' value='0'> 梯度方向是损失上升最快的方向<\/label><label class='quiz-opt'><input type='checkbox' name='q08' value='1'> 学习率越大收敛越快<\/label><label class='quiz-opt'><input type='checkbox' name='q08' value='2'> 参数沿梯度反方向更新<\/label><label class='quiz-opt'><input type='checkbox' name='q08' value='3'> 学习率过大会震荡<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q09' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 一批 100 条样本走完一次前向+反向叫一次 ____。（填两个字）<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch05__": "<h1>测验：第 5 章：误差反向传播法<\/h1><div class='quiz-item' data-qid='q10' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 加法节点反向传播时，对两个输入的梯度是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q10' value='0'> 都是上游梯度本身<\/label><label class='quiz-opt'><input type='radio' name='q10' value='1'> 都是 0<\/label><label class='quiz-opt'><input type='radio' name='q10' value='2'> 分别是两个输入的值<\/label><label class='quiz-opt'><input type='radio' name='q10' value='3'> 相加后平分<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q11' data-type='single'><p class='quiz-q'><b>Q2.<\/b> z=x×y，x=3、y=5，上游梯度 2，则对 x 的梯度是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q11' value='0'> 2<\/label><label class='quiz-opt'><input type='radio' name='q11' value='1'> 3<\/label><label class='quiz-opt'><input type='radio' name='q11' value='2'> 10<\/label><label class='quiz-opt'><input type='radio' name='q11' value='3'> 15<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q12' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 深层 sigmoid 网络训不动的直接原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q12' value='0'> 参数太多<\/label><label class='quiz-opt'><input type='radio' name='q12' value='1'> 梯度逐层被压到极小<\/label><label class='quiz-opt'><input type='radio' name='q12' value='2'> 损失函数选错<\/label><label class='quiz-opt'><input type='radio' name='q12' value='3'> 学习率太大<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch06__": "<h1>测验：第 6 章：与学习相关的技巧<\/h1><div class='quiz-item' data-qid='q13' data-type='single'><p class='quiz-q'><b>Q1.<\/b> Momentum 主要缓解 SGD 的什么问题？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q13' value='0'> 梯度消失<\/label><label class='quiz-opt'><input type='radio' name='q13' value='1'> 震荡与收敛慢<\/label><label class='quiz-opt'><input type='radio' name='q13' value='2'> 过拟合<\/label><label class='quiz-opt'><input type='radio' name='q13' value='3'> 显存不足<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q14' data-type='single'><p class='quiz-q'><b>Q2.<\/b> ReLU 网络优先用哪种初始化？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q14' value='0'> 全 0<\/label><label class='quiz-opt'><input type='radio' name='q14' value='1'> Xavier<\/label><label class='quiz-opt'><input type='radio' name='q14' value='2'> He<\/label><label class='quiz-opt'><input type='radio' name='q14' value='3'> 固定 0.01<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q15' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 用测试集反复挑超参数的后果是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q15' value='0'> 评估结果偏乐观<\/label><label class='quiz-opt'><input type='radio' name='q15' value='1'> 训练更慢<\/label><label class='quiz-opt'><input type='radio' name='q15' value='2'> 梯度消失<\/label><label class='quiz-opt'><input type='radio' name='q15' value='3'> 显存溢出<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch07__": "<h1>测验：第 7 章：卷积神经网络<\/h1><div class='quiz-item' data-qid='q16' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 输入 7×7、3×3 核、padding=1、stride=1，输出尺寸？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q16' value='0'> 5×5<\/label><label class='quiz-opt'><input type='radio' name='q16' value='1'> 6×6<\/label><label class='quiz-opt'><input type='radio' name='q16' value='2'> 7×7<\/label><label class='quiz-opt'><input type='radio' name='q16' value='3'> 9×9<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q17' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 卷积层参数远少于全连接层，根本原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q17' value='0'> 卷积核更小<\/label><label class='quiz-opt'><input type='radio' name='q17' value='1'> 权重在空间上共享<\/label><label class='quiz-opt'><input type='radio' name='q17' value='2'> 用了池化<\/label><label class='quiz-opt'><input type='radio' name='q17' value='3'> 输入通道少<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q18' data-type='blank'><p class='quiz-q'><b>Q3.<\/b> 卷积输出尺寸公式中，控制滑窗每次移动几格的是____。<\/p><input class='quiz-blank' type='text' placeholder='填写答案'><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__quiz_ch08__": "<h1>测验：第 8 章：深度学习<\/h1><div class='quiz-item' data-qid='q19' data-type='single'><p class='quiz-q'><b>Q1.<\/b> 数据很少时做迁移学习，最稳妥的做法是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q19' value='0'> 冻结卷积层只训分类头<\/label><label class='quiz-opt'><input type='radio' name='q19' value='1'> 全部层用大学习率微调<\/label><label class='quiz-opt'><input type='radio' name='q19' value='2'> 从零训练<\/label><label class='quiz-opt'><input type='radio' name='q19' value='3'> 只改输入尺寸<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q20' data-type='single'><p class='quiz-q'><b>Q2.<\/b> 微调时学习率要设小的原因是？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q20' value='0'> 显存不够<\/label><label class='quiz-opt'><input type='radio' name='q20' value='1'> 防止过拟合<\/label><label class='quiz-opt'><input type='radio' name='q20' value='2'> 避免破坏预训练权重<\/label><label class='quiz-opt'><input type='radio' name='q20' value='3'> 加快收敛<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><div class='quiz-item' data-qid='q21' data-type='single'><p class='quiz-q'><b>Q3.<\/b> 深层网络相对浅层网络的核心优势？<\/p><div class='quiz-opts'><label class='quiz-opt'><input type='radio' name='q21' value='0'> 参数更少<\/label><label class='quiz-opt'><input type='radio' name='q21' value='1'> 能学出层级化的特征表示<\/label><label class='quiz-opt'><input type='radio' name='q21' value='2'> 不需要激活函数<\/label><label class='quiz-opt'><input type='radio' name='q21' value='3'> 一定不过拟合<\/label><\/div><div class='quiz-actions'><button class='quiz-check'>检查答案<\/button><span class='quiz-feedback'><\/span><\/div><\/div><p class='quiz-summary'>完成作答后点击「检查答案」查看得分与解析。<\/p>", "__cards__": "<h1>抽认卡<\/h1><p>点击卡片翻面；判断「认识 / 不熟」以记录复习状态。<\/p><div class='card-controls'><label>按章节筛选：<select id='card-filter'><option value=''>全部<\/option><\/select><\/label><span class='card-counts'>认识 <b id='card-known'>0<\/b> · 不熟 <b id='card-again'>0<\/b> · 剩余 <b id='card-left'>0<\/b><\/span><\/div><div id='card-stage'><div class='flashcard' id='flashcard'><div class='fc-inner'><div class='fc-front'><\/div><div class='fc-back'><\/div><\/div><\/div><\/div><div class='card-actions'><button id='card-again-btn'>不熟<\/button><button id='card-known-btn'>认识<\/button><\/div>", "__glossary__": "<h1>术语表<\/h1><input id='glossary-filter' type='search' placeholder='筛选术语…'><ul id='glossary-list'><li data-term='广播'>广播 — 形状不同的数组相加时，按右对齐规则把长度为 1 的维扩展后再逐元素运算。 <span class=glossary-ref>（第 1 章：Python 入门）<\/span><\/li><li data-term='形状'>形状 — 数组每一维的长度组成的元组，用 .shape 查看。 <span class=glossary-ref>（第 1 章：Python 入门）<\/span><\/li><li data-term='批量'>批量 — 一次把多条样本拼成一个矩阵送进网络，用矩阵乘法同时算完。 <span class=glossary-ref>（第 1 章：Python 入门）<\/span><\/li><li data-term='感知机'>感知机 — 对输入加权求和再与阈值比较输出 0/1 的最简单神经元模型。 <span class=glossary-ref>（第 2 章：感知机）<\/span><\/li><li data-term='偏置'>偏置 — 加权和里那个不乘输入的常数项，作用是平移决策边界。 <span class=glossary-ref>（第 2 章：感知机）<\/span><\/li><li data-term='线性可分'>线性可分 — 存在一条直线（或超平面）能把两类样本完全分开。 <span class=glossary-ref>（第 2 章：感知机）<\/span><\/li><li data-term='异或'>异或 — 两个输入相同输出 0、不同输出 1的逻辑运算，线性不可分的经典例子。 <span class=glossary-ref>（第 2 章：感知机）<\/span><\/li><li data-term='激活函数'>激活函数 — 对加权和做非线性变换的函数，常见 sigmoid、ReLU、阶跃。 <span class=glossary-ref>（第 3 章：神经网络）<\/span><\/li><li data-term='隐藏层'>隐藏层 — 输入与输出之间的层，负责把输入变换成更容易分类的表示。 <span class=glossary-ref>（第 3 章：神经网络）<\/span><\/li><li data-term='softmax'>softmax — 先取指数再归一化，把一组实数变成和为 1 的概率分布。 <span class=glossary-ref>（第 3 章：神经网络）<\/span><\/li><li data-term='神经元死亡'>神经元死亡 — ReLU 输入长期为负导致梯度恒 0、参数不再更新的现象。 <span class=glossary-ref>（第 3 章：神经网络）<\/span><\/li><li data-term='损失函数'>损失函数 — 衡量网络输出与正确标签差距的函数，训练的目标就是让它变小。 <span class=glossary-ref>（第 4 章：神经网络的学习）<\/span><\/li><li data-term='交叉熵'>交叉熵 — 分类常用的损失，等于正确类输出概率的负对数。 <span class=glossary-ref>（第 4 章：神经网络的学习）<\/span><\/li><li data-term='one-hot'>one-hot — 标签表示法，正确类位置为 1、其余为 0。 <span class=glossary-ref>（第 4 章：神经网络的学习）<\/span><\/li><li data-term='梯度'>梯度 — 损失对每个参数的偏导数排成的向量，指向损失上升最快方向。 <span class=glossary-ref>（第 4 章：神经网络的学习）<\/span><\/li><li data-term='中心差分'>中心差分 — 用 f(x+h) 与 f(x-h) 的差除以 2h 近似导数，误差更小。 <span class=glossary-ref>（第 4 章：神经网络的学习）<\/span><\/li><li data-term='mini-batch'>mini-batch — 从训练集随机抽取的一小批样本，用于一次参数更新。 <span class=glossary-ref>（第 4 章：神经网络的学习）<\/span><\/li><li data-term='epoch'>epoch — 把训练集所有样本完整过一遍。 <span class=glossary-ref>（第 4 章：神经网络的学习）<\/span><\/li><li data-term='链式法则'>链式法则 — 复合函数求导法则：总导数等于各层局部导数连乘。 <span class=glossary-ref>（第 5 章：误差反向传播法）<\/span><\/li><li data-term='计算图'>计算图 — 把运算步骤画成节点与箭头的图，正向算值、反向算梯度。 <span class=glossary-ref>（第 5 章：误差反向传播法）<\/span><\/li><li data-term='反向传播'>反向传播 — 从损失出发按链式法则逆序计算所有参数梯度的算法。 <span class=glossary-ref>（第 5 章：误差反向传播法）<\/span><\/li><li data-term='梯度消失'>梯度消失 — 深层网络中梯度逐层相乘后趋近于 0，导致浅层参数几乎不更新。 <span class=glossary-ref>（第 5 章：误差反向传播法）<\/span><\/li><li data-term='优化器'>优化器 — 根据梯度决定参数如何更新的算法，如 SGD、Momentum、Adam。 <span class=glossary-ref>（第 6 章：与学习相关的技巧）<\/span><\/li><li data-term='xavier 初始化'>Xavier 初始化 — 按 1/√n 缩放权重的初始化方法，适合 sigmoid 类激活。 <span class=glossary-ref>（第 6 章：与学习相关的技巧）<\/span><\/li><li data-term='he 初始化'>He 初始化 — 按 √(2/n) 缩放权重的初始化方法，适合 ReLU。 <span class=glossary-ref>（第 6 章：与学习相关的技巧）<\/span><\/li><li data-term='batch norm'>Batch Norm — 按 mini-batch 统计量标准化每层输入，再用可学习的 γ、β 缩放平移。 <span class=glossary-ref>（第 6 章：与学习相关的技巧）<\/span><\/li><li data-term='dropout'>Dropout — 训练时随机丢弃部分神经元输出，逼网络学冗余表示。 <span class=glossary-ref>（第 6 章：与学习相关的技巧）<\/span><\/li><li data-term='权值衰减'>权值衰减 — 在损失中加入权重平方项以压制过大权重，等价 L2 正则。 <span class=glossary-ref>（第 6 章：与学习相关的技巧）<\/span><\/li><li data-term='卷积'>卷积 — 用小窗口在输入上滑动做加权求和，得到特征图。 <span class=glossary-ref>（第 7 章：卷积神经网络）<\/span><\/li><li data-term='padding'>padding — 在输入四周补零，控制输出尺寸与边缘覆盖。 <span class=glossary-ref>（第 7 章：卷积神经网络）<\/span><\/li><li data-term='步长'>步长 — 滑窗每次移动的格数，越大输出越小。 <span class=glossary-ref>（第 7 章：卷积神经网络）<\/span><\/li><li data-term='池化'>池化 — 在局部区域取最大或平均来降采样，无参数。 <span class=glossary-ref>（第 7 章：卷积神经网络）<\/span><\/li><li data-term='im2col'>im2col — 把卷积窗口展开成矩阵以复用矩阵乘法加速的实现技巧。 <span class=glossary-ref>（第 7 章：卷积神经网络）<\/span><\/li><li data-term='参数共享'>参数共享 — 同一组权重在整个空间位置上复用，是卷积省参数的原因。 <span class=glossary-ref>（第 7 章：卷积神经网络）<\/span><\/li><li data-term='层级特征'>层级特征 — 网络浅层到深层逐级组合出的由简单到复杂的表示。 <span class=glossary-ref>（第 8 章：深度学习）<\/span><\/li><li data-term='迁移学习'>迁移学习 — 把在大数据集上训练好的网络参数迁移到新任务上。 <span class=glossary-ref>（第 8 章：深度学习）<\/span><\/li><li data-term='微调'>微调 — 在预训练模型基础上用较小学习率继续训练部分或全部层。 <span class=glossary-ref>（第 8 章：深度学习）<\/span><\/li><li data-term='退化问题'>退化问题 — 网络加深后训练误差反而上升的现象，残差连接可缓解。 <span class=glossary-ref>（第 8 章：深度学习）<\/span><\/li><\/ul>", "__patterns__": "<h1>模式与框架库<\/h1>\n<h2>框架：从“算得出”到“学得会”的四层结构<\/h2>\n<p>本书所有算法都落在同一个骨架上：<strong>表示（用什么函数）→ 损失（错得多离谱）→ 梯度（往哪改）→ 更新（改多少）<\/strong>。遇到任何新模型，先把它按这四层拆开，缺哪一层就是读不懂的地方。<\/p>\n<h2>决策规则<\/h2>\n<ul><li>\n要判断某个操作能不能训练 → 看它有没有可写的导数；没有就换光滑替代（阶跃→sigmoid，硬阈值→softmax+交叉熵）。\n<\/li><li>\n要做分类 → 输出层 softmax，损失交叉熵；要做回归 → 恒等输出，损失均方误差。\n<\/li><li>\n网络训不动 → 依次查：梯度是否消失（换 ReLU/加归一化）、初始化是否合理、学习率是否过大。\n<\/li><li>\n训练集好测试集差 → 先加正则（权值衰减、Dropout、数据增强），再考虑加数据。\n<\/ul>\n<h2>反模式<\/h2>\n<ul><li>\n<strong>用数值微分训练<\/strong>：慢两三个数量级，只配当验算工具。\n<\/li><li>\n<strong>权重全零初始化<\/strong>：对称性不破，整层等价于一个神经元。\n<\/li><li>\n<strong>拿测试集调超参数<\/strong>：评估结果虚高，等于自欺。\n<\/li><li>\n<strong>只堆层数不看梯度<\/strong>：sigmoid 叠加会梯度消失，加深反而更差。\n<\/ul>", "__cheatsheet__": "<h1>速查表<\/h1>\n<h2>公式<\/h2>\n<table><thead><tr><th>场景<\/th><th>内容<\/th><\/tr><\/thead><tbody><tr><td>矩阵乘法形状<\/td><td>(m,n) @ (n,p) → (m,p)<\/td><\/tr><tr><td>sigmoid 与导数<\/td><td>σ(x)=1/(1+e^{-x})，σ&#x27;=σ(1-σ)<\/td><\/tr><tr><td>softmax<\/td><td>y_k=e^{a_k}/Σe^{a_i}<\/td><\/tr><tr><td>交叉熵<\/td><td>E=-Σ t_k log y_k<\/td><\/tr><tr><td>均方误差<\/td><td>E=½Σ(y_k-t_k)²<\/td><\/tr><tr><td>中心差分<\/td><td>f&#x27;(x)≈[f(x+h)-f(x-h)]/(2h)，h≈1e-4<\/td><\/tr><tr><td>梯度下降<\/td><td>W ← W - η ∂E/∂W<\/td><\/tr><tr><td>卷积输出尺寸<\/td><td>(H-KH+2P)/S+1<\/td><\/tr><\/tbody><\/table>\n<h2>训练流程<\/h2>\n<ol><li>\n取 mini-batch → 2. 前向 → 3. 算损失 → 4. 反向算梯度 → 5. 优化器更新 → 6. 重复至一个 epoch 结束 → 7. 在验证集评估，挑超参数 → 8. 最后用测试集报一次成绩。\n<\/ol>\n<h2>排错顺序<\/h2>\n<p>损失不降 → 学习率、初始化、激活函数、梯度是否消失；损失降但泛化差 → 正则、数据增强、早停；数值溢出 → softmax 先减最大值、log 加 eps。<\/p>"}};
const pages = DATA.rendered;
const manifest = DATA.manifest;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const SLUG = manifest.slug || 'book';
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(SLUG+':'+k)||'null') }catch(e){ return null } },
  set(k,v){ try{ localStorage.setItem(SLUG+':'+k, JSON.stringify(v)) }catch(e){} }
};
let state = { visited: store.get('visited')||[], quiz: store.get('quiz')||{}, cards: store.get('cards')||{} };

/* ---------- 导航 ---------- */
function renderNav(){
  const nav = $('#nav'); nav.innerHTML='';
  const build = items => items.forEach(it=>{
    if(it.children){
      const sec=document.createElement('div'); sec.className='nav-sec'; sec.textContent=it.label; nav.appendChild(sec);
      it.children.forEach(c=>{
        const a=document.createElement('a'); a.className='nav-item'; a.href=c.href; a.textContent=c.label;
        const id=routeId(c.href);
        if(state.visited.includes(id)) a.innerHTML = esc(c.label)+' <span class="done">✓</span>';
        nav.appendChild(a);
      });
    }else{
      const a=document.createElement('a'); a.className='nav-item'; a.href=it.href; a.textContent=it.label;
      const id=routeId(it.href);
      if(state.visited.includes(id)) a.innerHTML = esc(it.label)+' <span class="done">✓</span>';
      nav.appendChild(a);
    }
  });
  build(DATA.nav);
  updateProgress();
}
function routeId(href){ return href.replace('#/',''); }

/* ---------- 路由 ---------- */
function routeIdFromHash(){
  let h = location.hash.replace(/^#\//,'');
  if(!h) return 'path';
  if(h==='path') return 'path';
  const m = h.match(/^(chapter|concept)\/(.+)$/);
  if(m) return m[1]+'/'+m[2];
  return h; // quiz/all, quiz/ch01, cards, glossary, patterns, cheatsheet
}
function showPage(rid){
  const id = rid==='path' ? '__path__' : rid.startsWith('quiz/') ? '__quiz_'+rid.split('/')[1]+'__' : rid==='cards'?'__cards__':rid==='glossary'?'__glossary__':rid==='patterns'?'__patterns__':rid==='cheatsheet'?'__cheatsheet__':rid.startsWith('chapter/')?rid.split('/')[1]:rid.startsWith('concept/')?rid.split('/')[1]:rid;
  const html = pages[id] || '<div class="empty">页面不存在</div>';
  $('#view').innerHTML = html;
  document.querySelectorAll('.nav-item').forEach(a=>a.classList.toggle('active', routeId(a.getAttribute('href'))===rid));
  if(!state.visited.includes(rid) && (rid.startsWith('chapter/')||rid.startsWith('concept/'))){
    state.visited.push(rid); store.set('visited', state.visited); renderNav();
  }
  window.scrollTo(0,0);
  if(rid==='cards') initCards();
  if(rid==='glossary') initGlossary();
  if(rid.startsWith('quiz')) initQuizzes(rid);
  if(id==='__path__') updatePath();
  renderMermaid();
}

/* ---------- 进度 ---------- */
function updateProgress(){
  const chs = (manifest.chapters||[]).length;
  const done = (manifest.chapters||[]).filter(c=>state.visited.includes('chapter/'+c.id)).length;
  const pct = chs? Math.round(done/chs*100) : 0;
  $('#progress-fill').style.width = pct+'%';
  $('#progress-label').textContent = `进度 ${pct}% · 已学 ${done}/${chs} 章`;
}
function updatePath(){
  document.querySelectorAll('.path-step').forEach(el=>{
    const step = el.id.replace('path-','');
    const s = (manifest.learningPath||[]).find(x=>x.step===step);
    if(s && (s.chapterIds||[]).every(c=>state.visited.includes('chapter/'+c))){
      el.classList.add('passed');
      const lbl = el.querySelector('.checkpoint-ok'); if(!lbl){ const sp=document.createElement('span'); sp.className='done'; sp.textContent=' ✓ 已完成'; el.appendChild(sp); }
    }
  });
}

/* ---------- 测验 ---------- */
function initQuizzes(rid){
  document.querySelectorAll('.quiz-item').forEach(item=>{
    const btn = item.querySelector('.quiz-check');
    if(!btn || item.dataset.inited){ return }
    item.dataset.inited='1';
    btn.addEventListener('click', ()=>{
      const qid = item.dataset.qid; const type = item.dataset.type;
      const q = (manifest.quizzes||[]).find(x=>x.id===qid); if(!q) return;
      let user, correct=false, fb;
      if(type==='single'){
        const sel = item.querySelector('input:checked');
        user = sel? parseInt(sel.value) : null;
        correct = user===q.answer;
        fb = correct?'✓ 正确':'✗ 错误'+(user==null?'（未作答）':'');
      } else if(type==='multi'){
        user = Array.from(item.querySelectorAll('input:checked')).map(i=>parseInt(i.value)).sort();
        const ans = Array.isArray(q.answer)? q.answer.slice().sort(): [q.answer];
        correct = user.length>0 && JSON.stringify(user)===JSON.stringify(ans);
        fb = correct?'✓ 正确':'✗ 错误';
      } else if(type==='blank'){
        const v = (item.querySelector('.quiz-blank').value||'').trim().toLowerCase();
        const a = String(q.answer).trim().toLowerCase();
        correct = v===a;
        fb = correct?'✓ 正确':'✗ 错误'+(v?'':'（未作答）');
      }
      item.querySelectorAll('input:checked').forEach(i=>{
        const val=parseInt(i.value);
        if(Array.isArray(q.answer)? q.answer.includes(val) : val===q.answer) i.parentElement.style.color='var(--ok)';
        else i.parentElement.style.color='var(--bad)';
      });
      const feed = item.querySelector('.quiz-feedback');
      feed.className = 'quiz-feedback '+(correct?'fb-ok':'fb-bad');
      feed.textContent = fb;
      let ex = item.querySelector('.quiz-explain');
      if(!ex){ ex=document.createElement('div'); ex.className='quiz-explain'; item.appendChild(ex); }
      ex.innerHTML = '解析：' + esc(q.explain||'');
      // 记录成绩（按章聚合）
      const ch = q.chapterId||'__all__';
      if(!state.quiz[ch]) state.quiz[ch]={done:0,total:0};
      state.quiz[ch].done = Math.min(state.quiz[ch].total+1, state.quiz[ch].done+1);
      state.quiz[ch].total += 1;
      store.set('quiz', state.quiz);
    });
  });
}

/* ---------- 抽认卡 ---------- */
let cardIdx = 0, cardList = [];
function initCards(){
  const cards = manifest.flashcards||[];
  cardList = cards.slice();
  cardIdx = 0;
  const sel = $('#card-filter');
  sel.innerHTML = '<option value="">全部</option>';
  [...new Set(cards.map(c=>c.chapterId).filter(Boolean))].forEach(c=>{
    const o=document.createElement('option'); o.value=c; o.textContent=manifestChTitle(c); sel.appendChild(o);
  });
  sel.onchange = ()=>{ const v=sel.value; cardList = v? cards.filter(c=>c.chapterId===v): cards.slice(); cardIdx=0; showCard(); };
  $('#flashcard').onclick = ()=>$('#flashcard').classList.toggle('flip');
  $('#card-known-btn').onclick = ()=>{ markCard(true); };
  $('#card-again-btn').onclick = ()=>{ markCard(false); };
  showCard();
}
function showCard(){
  updateCardCounts();
  if(cardIdx>=cardList.length){ $('#card-stage').innerHTML='<div class="empty">本组卡片已全部复习完 🎉</div>'; return; }
  const c = cardList[cardIdx];
  document.querySelector('.fc-front').textContent = c.front;
  document.querySelector('.fc-back').textContent = c.back;
  $('#flashcard').classList.remove('flip');
}
function markCard(known){
  const c = cardList[cardIdx]; if(!c) return;
  state.cards[c.id] = known?'known':'again';
  store.set('cards', state.cards);
  cardIdx++; showCard();
}
function updateCardCounts(){
  const known = Object.values(state.cards).filter(v=>v==='known').length;
  const again = Object.values(state.cards).filter(v=>v==='again').length;
  $('#card-known').textContent = known;
  $('#card-again').textContent = again;
  $('#card-left').textContent = Math.max(0, cardList.length-cardIdx);
}
function manifestChTitle(id){
  const c=(manifest.chapters||[]).find(x=>x.id===id); return c? c.title : id;
}

/* ---------- 术语表 ---------- */
function initGlossary(){
  const input = $('#glossary-filter');
  if(!input || input.dataset.inited) return;
  input.dataset.inited='1';
  input.oninput = ()=>{
    const v = input.value.trim().toLowerCase();
    document.querySelectorAll('#glossary-list li').forEach(li=>{
      li.style.display = (!v || li.dataset.term.includes(v)) ? '' : 'none';
    });
  };
}

/* ---------- 搜索 ---------- */
let searchIndex = null;
function buildSearchIndex(){
  if(searchIndex) return searchIndex;
  searchIndex = [];
  Object.entries(pages).forEach(([id, htmlText])=>{
    if(id.startsWith('__')) return;
    const text = htmlText.replace(/<[^>]+>/g,' ').replace(/\s+/g,' ');
    searchIndex.push({id, text});
  });
  return searchIndex;
}
$('#q').addEventListener('input', e=>{
  const v = e.target.value.trim().toLowerCase();
  if(!v){ showPage(routeIdFromHash()); return; }
  buildSearchIndex();
  const hits = searchIndex.filter(p=>p.text.toLowerCase().includes(v)).slice(0,20);
  const label = id => id.startsWith('chapter/')? ('章节：'+manifestChTitle(id.split('/')[1])) : id.startsWith('concept/')? ('概念：'+id.split('/')[1]) : id;
  $('#view').innerHTML = '<h1>搜索结果：'+esc(v)+'</h1>' +
    (hits.length? hits.map(h=>`<div class="search-hit"><a href="#/${h.id}">${esc(label(h.id))}</a><br><span class="sub">${esc(h.text.slice(0,180))}</span></div>`).join('')
                 : '<div class="empty">未找到相关页面，试试章节名/概念名/术语。</div>');
});

/* ---------- Mermaid 懒加载（联网渲染，离线显示源码） ---------- */
function renderMermaid(){
  if(!document.querySelector('.mermaid')) return;
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js';
  s.onload=()=>{ try{
    mermaid.initialize({startOnLoad:false, theme: matchMedia('(prefers-color-scheme: dark)').matches?'dark':'default'});
    document.querySelectorAll('.mermaid').forEach(el=>{
      const code=el.textContent;
      mermaid.render('mm'+Math.random().toString(36).slice(2), code)
        .then(({svg})=>{ el.innerHTML=svg; })
        .catch(()=>{ el.textContent=code; });
    });
  }catch(e){} };
  document.head.appendChild(s);
}

/* ---------- 深色模式 ---------- */
const themeBtn=$('#theme-btn');
themeBtn.onclick=()=>{
  const d = document.body.dataset.theme==='dark';
  document.body.dataset.theme = d? '' : 'dark';
  themeBtn.textContent = d? '🌙 深色' : '☀️ 浅色';
};

/* ---------- 启动 ---------- */
renderNav();
window.addEventListener('hashchange', ()=>showPage(routeIdFromHash()));
(function(){
  const sb=document.querySelector('.sidebar'); if(!sb) return;
  const btn=document.createElement('button'); btn.id='nav-toggle'; btn.textContent='目录（点开选择章节）';
  btn.onclick=()=>sb.classList.toggle('open');
  sb.insertBefore(btn, sb.querySelector('#nav'));
  window.addEventListener('hashchange',()=>{ if(window.innerWidth<=760) sb.classList.remove('open'); });
})();
showPage(routeIdFromHash());
</script>
